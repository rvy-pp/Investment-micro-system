      nothing actionable: ${mail.quiet.map(esc).join(' · ')}</div>` : ''}`;
}

/* ===================== daily overview =====================
   The first screen. Layout per the PM 2026-08-30, copied from the vault
   dashboard's Daily Overview: title + meta-line, overnight callout on top,
   tiles, run health, stale feeds, what moved, broker mail at the bottom.
   THE BOOK LIVES IN ITS OWN TAB NOW, and there are deliberately NO warning
   banner boxes here — staleness and placeholder facts ride as quiet text
   (meta-line, hints) or in the Book tab, per the PM's explicit instruction.
   Everything is still read from what the run WROTE, never recomputed. */
async function loadOverview(){
  const d = await (await fetch('/api/overview')).json();
  if (d.error) throw new Error(d.error);

  /* Side signals are fetched separately and NEVER allowed to break the tab —
     catch -> a state the section knows how to say out loud. */
  const cw = await fetch('/api/cement_watch').then(r => r.json())
      .catch(e => ({state:'error', regions:[], alerts:[], note:String(e)}));
  window.__CEMENT_WATCH__ = cw;
  const morn = await fetch('/api/morning').then(r => r.json())
      .catch(e => ({error:String(e)}));

  const run = d.run || {};
  const feeds = d.feeds || {};
  const fe = d.frontend || {};
  /* NO TILES, NO RUN PANEL, NO STALE-FEEDS SECTION — PM instructions,
     2026-08-31: "just warn me if something isn't executed." So this tab is
     EXCEPTION-ONLY on plumbing: a healthy run renders nothing at all about
     itself, and anything unhealthy becomes one amber line under the title —
     failed steps by name, stale feeds by name and age, route problems, a
     yesterday's-run or yesterday's-brief date. The full step-by-step record
     still exists (data/refresh/status.json and the refresh transcript); this
     page just stops re-printing it when it is green. */
  const metaBits = [
    esc(d.as_of || ''),
    `last refresh ${esc(run.day || 'never')}${run.finished
      ? ' ' + esc(run.finished.replace('T', ' ').slice(11, 19)) : ''}`,
    `scores as of ${esc(d.as_of_scores || '—')}`,
  ];

  const badSteps = (run.steps || []).filter(x =>
    x.status !== 'ok' && x.status !== 'skipped' && x.status !== 'background');
  const staleList = (feeds.stale || []).slice(0, 4).map(x =>
    `${x.series} (${x.age})`).join(', ')
    + ((feeds.stale || []).length > 4
       ? ` +${feeds.stale.length - 4} more` : '');
  const warnItems = [
    run.warning,      // covers both "yesterday's run" and "no status.json ever"
    badSteps.length ? `step${badSteps.length > 1 ? 's' : ''} FAILED: `
      + badSteps.map(x => `${x.step}${x.detail ? ' — ' + x.detail : ''}`).join('; ')
      : null,
    feeds.n_stale ? `${feeds.n_stale} feed(s) stale: ${staleList}` : null,
    ...(fe.problems || []),
    ...(morn && morn.warnings || []),
  ].filter(Boolean);
  const warnLine = warnItems.length
    ? `<div class="hint" style="color:var(--warn);margin:0 0 12px">⚠ ${
        warnItems.map(esc).join('<br>⚠ ')}</div>`
    : '';

  /* CEMENT WATCH — a live multi-region move is a real signal and keeps its
     callout; `calibrating` stays one quiet line (an absent banner would read
     as "no move", the one thing it does not mean); errors are one hint. */
  const cwRow = r => `${esc(r.region)} ${r.matched_pct == null ? '—'
      : (r.matched_pct >= 0 ? '+' : '') + r.matched_pct.toFixed(2) + '%'}` +
      `<span class="hint"> (${r.n_matched == null ? 'first capture'
        : r.n_matched + ' matched'})</span>`;
  const cwHtml =
    cw.state === 'live' && cw.alerts.length
      ? `<div class="callout accent-amber"><div class="callout-head">
           <span class="ico">🚨</span><span class="t">Cement watch</span></div>
         ${cw.alerts.map(a => `<b>CEMENT ${esc(a.direction)} —
           ${esc(a.regions.join(', '))}</b><br>${esc(a.text)}<br>
           <span class="hint">${cw.regions.map(cwRow).join(' · ')}</span>`)
           .join('<hr style="border:0;border-top:1px solid var(--rule);margin:8px 0">')}</div>`
    : cw.state === 'calibrating'
      ? `<div class="hint" style="margin-bottom:10px">Cement watch (IndiaMART
         asks, ${esc(cw.day || '—')}): <b>calibrating</b> — ${cw.n_days}
         capture${cw.n_days === 1 ? '' : 's'}, ${cw.days_to_calibrate} more
         before alerts arm. ${cw.regions.map(cwRow).join(' · ')}</div>`
    : cw.state === 'error'
      ? `<div class="hint" style="margin-bottom:10px;color:var(--warn)">Cement
         watch unavailable: ${esc(cw.note || '')}</div>`
    : '';

  const moverRows = (d.movers || []).map(m =>
    `<tr><td class="k">${esc(m.id)}</td>
      <td class="n">${fmtNum(m.last)}</td>
      ${m.chg_pct == null
        ? '<td class="n flat">flat 30d+</td>'
        : `<td class="n ${m.chg_pct > 0 ? 'pos' : m.chg_pct < 0 ? 'neg' : 'neu'}">${
             (m.chg_pct >= 0 ? '+' : '') + m.chg_pct.toFixed(2)}%</td>`}
      <td class="k">${esc(m.date || '—')}</td>
      <td class="k flat">${esc(m.source || '—')}</td>
      <td class="k flat">${m.moved_on ? 'carried since ' + esc(m.moved_on) : 'moved today'}</td>
    </tr>`).join('');

  $('#s-overview').innerHTML =
    `<div class="pgt">Daily Overview</div>
     <div class="meta-line">${metaBits.join(' · ')}</div>`
    + warnLine
    + overnightHtml(morn)
    + cwHtml
    + mailHtml(morn)
    /* What-moved BELOW the mail, per the PM 2026-08-31: read the morning's
       words first, then the tape that should corroborate them. */
    + `<div class="sechead">What moved · modelled inputs only</div>
       <div class="panel"><p class="note" style="margin-top:0">Only series a spec
         <code>price_link</code>s — the parked columns drive nothing, so they are
         not here. Change is against the last close that actually <b>differed</b>.</p>
       <div class="scroll"><table><thead><tr><th>series</th><th class="n">last</th>
         <th class="n">last real move</th><th>as of</th><th>source</th><th>state</th>
       </tr></thead><tbody>${moverRows}</tbody></table></div></div>`;
}

/* ===================== the book =====================
   Split out of the Overview 2026-08-30 (PM: the Overview is the morning
   read; the book gets reworked separately). Same persisted data —
   /api/overview's book block — rendered under its own tab. Placeholder
   facts ride HERE, beside the numbers they qualify, as amber-left callouts
   rather than page-wide banners. */
async function loadBook(){
  const d = await (await fetch('/api/overview')).json();
  if (d.error) throw new Error(d.error);

  const bookRows = (d.book || []).map(b => {
    const cls = b.verdict === 'FULL' ? 'c-up'
      : b.verdict === 'no trade' ? 'c-flat' : 'c-warn';
    const pil = ['economics','valuation','mood','guidance'].map(k => {
      const ph = (b.placeholders || {})[k];
      if (b[k] == null) return `<td class="n"><span class="hint"
        title="withheld — the composite renormalises over the pillars that exist">—</span></td>`;
      if (ph) return `<td class="n" style="color:var(--warn)"
        title="PLACEHOLDER, not measured. ${esc(ph.reason || '')} Granted ${
          esc(ph.granted || '')} by ${esc(ph.granted_by || '')}; ends on ${
          esc(ph.review_trigger || '')}.">${b[k].toFixed(2)}<sup>P</sup></td>`;
      return `<td class="n">${b[k].toFixed(2)}</td>`;
    }).join('');
    return `<tr><td><b>${esc(b.entity)}</b></td>
      <td class="n score">${b.composite == null ? '—' : b.composite.toFixed(2)}</td>
      ${pil}
      <td class="n">${b.size == null ? '—' : (b.size >= 0 ? '+' : '') + b.size.toFixed(2)}</td>
      <td><span class="chip ${cls}">${esc(b.verdict || 'n/a')}</span></td></tr>`;
  }).join('');

  const nFull = (d.book || []).filter(b => b.verdict === 'FULL').length;
  const tiles = `<div class="tiles">
    <div class="tile ${nFull ? 'good' : ''}">
      <div class="k">at full size</div>
      <div class="v">${nFull}
        <span style="font-size:13px;color:var(--faint)">/ ${(d.book || []).length}</span></div>
      <div class="s">SIZE ≥ 1.00</div>
    </div>
    <div class="tile"><div class="k">scored names</div>
      <div class="v">${(d.book || []).length}</div>
      <div class="s">as of ${esc(d.as_of_scores || '—')}</div></div>
    <div class="tile ${(d.placeholders || []).length ? 'warn' : ''}">
      <div class="k">placeholders</div>
      <div class="v">${(d.placeholders || []).length}</div>
      <div class="s">desk decisions, not measurements</div></div>
  </div>`;

  const phCallouts = (d.placeholders || []).map(x =>
    `<div class="callout accent-amber">
       <div class="callout-head"><span class="t">${esc(x.entity)} ·
         ${esc(x.pillar)} = ${x.value}</span>
         <span class="pill warn">placeholder${x.overdue ? ' · OVERDUE' : ''}</span></div>
       <div class="hint">${esc(x.reason || '')} Granted ${esc(x.granted || '')}
         by ${esc(x.granted_by || '')}; ends on <b>${esc(x.review_trigger || '')}</b>.
         It changes the composite and <b>not</b> SIZE — a withheld pillar and a
         3.00 both map to a 1.0 multiplier.</div></div>`).join('');

  $('#s-book').innerHTML =
    `<div class="pgt">The Book</div>
     <div class="meta-line">Persisted <code>pillar_scores</code> ·
       ${esc(d.as_of_scores || '—')} · a dash is a <b>withheld</b> pillar, not a
       3.0 — the composite renormalises over the pillars that exist · SIZE 1.00
       is a full position; below 0.28 is under the desk materiality floor</div>`
    + tiles
    + `<div class="panel"><div class="scroll"><table><thead><tr>
         <th>name</th><th class="n">comp</th>
         <th class="n">econ</th><th class="n">val</th><th class="n">mood</th>
         <th class="n">guid</th><th class="n">SIZE</th><th>verdict</th>
       </tr></thead><tbody>${bookRows}</tbody></table></div></div>`
    + phCallouts;
}

/* ===================== flows =====================
   Every row is probed against the store on each request rather than restated
   from docs/FLOWS.md, which was verified by hand once on 2026-08-19. A hard-coded
   blocker table would go stale silently the first time a blocker was cleared —
   the failure mode the doc itself warns about. */
/* The nine regime states: colour + one-line gloss. The gloss states the SIGN
   PATTERN, not advice — F1 never sets direction. Gold's sign is what separates
   degross (liquidated for cash) from risk_off (bid, flight to safety). */
/* sg = the sign pattern in plain words, for inline use beside a state name.
   Full prose stays in g; base/lift live in hover only (PM 2026-09-04). */
const RGM = {
  quiet:             {c:'var(--faint)',  ab:'·',  sg:'nothing big moved', g:'nothing big moved across assets'},
  risk_on:           {c:'var(--up)',     ab:'R+', sg:'stocks↑ bonds↓ gold↓', g:'equities bid, bonds and gold sold — the market is paying for risk'},
  reflation:         {c:'var(--up)',     ab:'RF', sg:'stocks↑ bonds↓ gold↑', g:'equities and gold up, bonds down — inflation trade'},
  goldilocks:        {c:'var(--up)',     ab:'G',  sg:'stocks↑ bonds↑ gold↓', g:'stocks up on falling yields'},
  liquidity_rally:   {c:'var(--accent)', ab:'L+', sg:'all three ↑',         g:'everything up at once — liquidity flood'},
  risk_off:          {c:'var(--warn)',   ab:'R-', sg:'stocks↓ bonds↑ gold↑', g:'stocks down, bonds and gold bid — classic flight to safety'},
  degross:           {c:'var(--down)',   ab:'DG', sg:'stocks↓ bonds↑ gold↓', g:'stocks down, bonds bid, gold SOLD — gross coming off both ways'},
  stagflation_scare: {c:'var(--warn)',   ab:'SF', sg:'stocks↓ bonds↓ gold↑', g:'stocks and bonds down together, gold bid'},
  liquidation:       {c:'var(--down)',   ab:'LQ', sg:'all three ↓',          g:'everything sold — margin-call tape'},
};

/* WEEKLY leads, by the PM's ruling (2026-09-03): "daily is of no use, show a
   weekly analysis in the tab." The daily layer still computes and persists —
   the spell (the coach's fundamentals-vs-flows gate) is drawn from it — but
   the state, odds, India evidence and strip here are all week-on-week. */
function w1Panel(w, f){
  if (!w) return `<div class="callout accent-amber"><div class="callout-head">
    <span class="ico">⚠</span><span class="t">F1 has no data</span></div>
    run <code>flow_series.py --load</code></div>`;
  if (w.error) return `<div class="callout accent-amber"><div class="callout-head">
    <span class="ico">⚠</span><span class="t">F1 weekly failed</span></div>${esc(w.error)}</div>`;

  const m = RGM[w.state] || {c:'var(--soft)', g:''};
  const z = (v, l) => `<b style="color:${v > 0 ? 'var(--up)' : v < 0 ? 'var(--down)' : 'var(--faint)'}">${l} ${v >= 0 ? '+' : ''}${v.toFixed(2)}σ</b>`;
  const stale = w.stale ? `<div class="callout accent-amber" style="margin-bottom:10px">
    <div class="callout-head"><span class="ico">⚠</span><span class="t">STALE — last
    classified week ended ${esc(w.week_end)}, ${w.stale_days} days ago</span></div>
    An old regime and an unchanged one are indistinguishable without this banner.
    Run the refresh before reading anything below.</div>` : '';

  /* The ROLLING week: each session read as its own 5-session weekly window —
     the daily quantification of the weekly read. Consecutive chips share 4 of
     5 sessions, so the strip shows a reading EVOLVING, not fresh samples. */
  const gradeMark = g => g === 'extreme' ? '‼' : g === 'strong' ? '!' : g === 'moderate' ? '·' : '';
  const roll = w.rolling && w.rolling.length ? w.rolling : null;
  const rollCur = roll ? roll[roll.length - 1] : null;
  const rollChips = roll ? roll.map(r => {
    const mm = RGM[r.state] || {c:'var(--soft)', ab:'?'};
    return `<span class="d" title="${esc(r.date)}: ${esc(r.state)} [${esc(r.grade)}, max |z| ${r.intensity.toFixed(2)}] — eq ${r.z_eq >= 0 ? '+' : ''}${r.z_eq} · bond ${r.z_bond >= 0 ? '+' : ''}${r.z_bond} · gold ${r.z_gold >= 0 ? '+' : ''}${r.z_gold}"
      style="color:${mm.c};border-color:${mm.c};${r.grade === 'extreme' ? 'border-width:2px;' : ''}">
      <span>${mm.ab}${gradeMark(r.grade)}</span><span style="color:var(--faint)">${esc(r.date.slice(8))}</span></span>`;
  }).join('') : '';
  const rollM = rollCur ? (RGM[rollCur.state] || {c:'var(--soft)'}) : null;
  const rolling = rollCur ? `<div style="margin:10px 0 0">
      <span class="pill" style="border-color:${rollM.c};color:${rollM.c}">rolling week · ${esc(rollCur.state)} · ${esc(rollCur.grade)}</span>
      <span style="color:var(--soft);font-size:12.5px"> last 5 sessions thru ${esc(rollCur.date)} —
      eq ${rollCur.z_eq >= 0 ? '+' : ''}${rollCur.z_eq.toFixed(2)} · bond ${rollCur.z_bond >= 0 ? '+' : ''}${rollCur.z_bond.toFixed(2)} · gold ${rollCur.z_gold >= 0 ? '+' : ''}${rollCur.z_gold.toFixed(2)} · max |z| ${rollCur.intensity.toFixed(2)}</span>
      <div class="f1-strip" style="margin-top:6px">${rollChips}</div>
      <p class="note" style="margin-top:4px">Each chip = that day's OWN last 5 US
        sessions on the weekly σ scale, updated daily — no waiting for Friday.
        Adjacent chips share 4 sessions, so read it as one reading evolving.
        ! = strong, ‼ = extreme.</p></div>` : '';

  /* The intensity ladder — THIS STATE's own cells (PM, 2026-09-04: "why would
     I need the full up-family if we are just looking at goldilocks" — and the
     data agreed: moderate goldilocks weeks run -0.03% vs the family's +0.27%).
     A cell under 10 weeks shows the pooled family figure instead, explicitly
     labelled as the fallback it is. Hit rate and sample size live in hover. */
  const lad = w.ladder || {};
  const slad = w.state_ladder || {};
  const UPFAM = ['risk_on', 'reflation', 'goldilocks', 'liquidity_rally'];
  const fam = UPFAM.includes(w.loud_state) ? 'up' : 'down';
  const ladCell = g => {
    const cur = g === w.grade;
    const wrap = inner => `<span style="${cur ? 'outline:1px solid var(--rule);border-radius:4px;padding:1px 6px;' : ''}">${g}: ${inner}${cur ? ' ← this week' : ''}</span>`;
    const c = slad[g];
    if (c && c.mean != null)
      return wrap(`<b style="color:${c.mean > 0 ? 'var(--up)' : 'var(--down)'}"
        title="closed up ${c.hit.toFixed(0)}% of the time, over ${c.n} ${esc(w.state)} weeks">${c.mean > 0 ? '+' : ''}${c.mean.toFixed(2)}%</b>`);
    const p = (lad[fam] || {})[g];
    if (p && p.mean != null)
      return wrap(`<span style="color:var(--faint)"
        title="only ${c ? c.n : 0} ${esc(w.state)} weeks at this grade in ten years — this is the ALL-${fam === 'up' ? 'equity-up' : 'equity-down'}-states figure (${p.hit.toFixed(0)}%, n=${p.n}), not a ${esc(w.state)} number">${p.mean > 0 ? '+' : ''}${p.mean.toFixed(2)}%*</span>`);
    return wrap(`<span style="color:var(--faint)">no data</span>`);
  };
  const ladder = (slad.moderate || slad.strong || slad.extreme) ? `<p class="note" style="margin-top:8px">
      <b style="color:var(--soft)">After a ${esc(w.state)} week, the next Indian
      week has averaged</b> &nbsp;
      ${ladCell('moderate')} &nbsp;·&nbsp; ${ladCell('strong')} &nbsp;·&nbsp; ${ladCell('extreme')}
      &nbsp;— hover for hit rate and sample. A greyed value with * means too few
      ${esc(w.state)} weeks at that loudness ever happened; it shows the pooled
      ${fam === 'up' ? 'equity-up' : 'equity-down'} figure instead.</p>` : '';

  /* The spell stays daily-windowed — it IS a ~2-week measure and it is the
     coach's operative gate. */
  const spell = f && f.spell_quiet === 1
    ? `<span class="pill ok">quiet spell · ${f.spell_run} session${f.spell_run === 1 ? '' : 's'}</span>
       no persistent equity flow — <b>fundamentals carry; the pillars have the edge</b>`
    : f && f.spell_quiet === 0
    ? `<span class="pill bad">loud flow · ${f.spell_run} session${f.spell_run === 1 ? '' : 's'}</span>
       persistent flow via <b>${esc(f.flow_driver || '?')}</b> (intensity
       ${f.flow_intensity == null ? '—' : f.flow_intensity.toFixed(2)}) —
       <b>flows are running the tape; expect them to override fundamentals</b>`
    : `<span class="pill warn">spell unknown</span>`;

  const rot = w.rot_z != null && Math.abs(w.rot_z) >= 1
    ? ` · rotation <b>${w.rot_z < 0 ? 'out of hardware, into software' : 'out of software, into hardware'}</b> (${w.rot_z >= 0 ? '+' : ''}${w.rot_z.toFixed(2)}σ)`
    : '';

  const pers = w.persistence ? w.persistence[w.state] : null;
  const persLine = pers != null && pers >= 1.5
    ? `<p style="margin:8px 0 0;color:var(--warn);font-size:12.5px">⚠ ${esc(w.state)}
       weeks cluster: another one follows at <b>${pers.toFixed(1)}×</b> the base rate.
       Stress arrives in runs.</p>` : '';

  /* Top 5 of 9 next-states; the cap must not read as a full distribution
     (PM 2026-09-04 noticed the rows summing to ~80%) — the remainder line
     names what it hides. Lift = pct/base: 1.0x means the completed week
     taught you nothing about that state following. */
  const shown = (w.next || []).slice(0, 5);
  const restPct = 100 - shown.reduce((a, x) => a + x.pct, 0);
  const restN = (w.next || []).length - shown.length;
  const odds = shown.map(x => {
    const mm = RGM[x.state] || {c:'var(--soft)'};
    const lift = x.base ? x.pct / x.base : null;
    return `<div class="row"><span class="lbl" style="color:${mm.c}">${esc(x.state)}</span>
      <span class="track"><span class="base" style="left:${Math.min(x.base * 2.2, 100)}%"></span>
        <span class="bar" style="width:${Math.min(x.pct * 2.2, 100)}%;border-right-color:${mm.c}"></span></span>
      <span class="num">${x.pct.toFixed(1)}% <span style="color:var(--faint)"
        title="normally ${x.base.toFixed(1)}% of all weeks${lift ? ' — after a ' + esc(w.state) + ' week it is ' + lift.toFixed(2) + 'x as likely as usual' : ''}">(${mm.sg})</span></span></div>`;
  }).join('') + (restN > 0 && restPct > 0.05 ? `<div class="row">
      <span class="lbl" style="color:var(--faint)">${restN} other states</span>
      <span class="track"><span class="bar" style="width:${Math.min(restPct * 2.2, 100)}%;background:var(--sunken);border-right-color:var(--faint)"></span></span>
      <span class="num" style="color:var(--faint)">${restPct.toFixed(1)}% combined</span></div>` : '');

  /* India next-week evidence for THIS state, live from flow_series. A cell
     with too few pairs is withheld by the API — render the withholding. */
  const LBL = {nifty: 'Nifty 50', nifty_metal: 'Nifty Metal', nifty_it: 'Nifty IT',
               nifty_auto: 'Nifty Auto'};
  const india = Object.entries(w.india || {}).map(([sid, blk]) => {
    const s = blk.stats && blk.stats[w.state];
    const staleIdx = blk.last_date < w.week_end
      ? ` <span style="color:var(--warn)">(series thru ${esc(blk.last_date)})</span>` : '';
    if (!s) return `<tr><td>${esc(LBL[sid] || sid)}</td>
      <td colspan="3" class="flat">withheld — too few prior ${esc(w.state)} weeks</td><td>${staleIdx}</td></tr>`;
    const cls = Math.abs(s.t) >= 2 ? (s.mean > 0 ? 'pos' : 'neg') : '';
    return `<tr><td>${esc(LBL[sid] || sid)}</td>
      <td class="n ${cls}">${s.mean > 0 ? '+' : ''}${s.mean.toFixed(2)}%</td>
      <td class="n">${s.hit.toFixed(0)}% hit</td>
      <td class="n ${Math.abs(s.t) >= 2 ? cls : 'flat'}">t ${s.t > 0 ? '+' : ''}${s.t}</td>
      <td class="n flat">n=${s.n}${staleIdx}</td></tr>`;
  }).join('');

  const strip = (w.strip || []).map(s => {
    const mm = RGM[s.state] || {c:'var(--soft)', ab:'?'};
    return `<span class="d" title="${esc(s.wk)}: ${esc(s.state)}"
      style="color:${mm.c};border-color:${mm.c}"><span>${mm.ab}</span><span
      style="color:var(--faint)">${esc(s.wk.slice(5))}</span></span>`;
  }).join('');

  /* The coverage sector tape rendered here 2026-09-03 .. 2026-09-04 and was
     removed at the PM's instruction ("what use is the sector tape? Remove
     it"). The nine index series keep accruing in flow_series — restoring the
     view is a UI change, not a data recovery. */

  return `${stale}
  <div class="callout" style="border-left-color:${m.c}">
    <div class="callout-head"><span class="t">F1 · Market regime — week on week</span>
      <span class="right">week ${esc(w.week)} · ended ${esc(w.week_end)}</span></div>
    <div class="f1-state" style="color:${m.c}">${esc(w.state)}
      ${w.grade ? `<span class="pill" style="border-color:${m.c};color:${m.c};font-size:12px;vertical-align:middle;margin-left:8px">${esc(w.grade)} · max |z| ${w.intensity.toFixed(2)}</span>` : ''}</div>
    <p style="margin:2px 0 8px">${m.g}${rot}</p>
    <div class="f1-z">${z(w.z_eq, 'S&P')} · ${z(w.z_bond, 'bond px')} · ${z(w.z_gold, 'gold')}${w.rot_z != null ? ' · ' + z(w.rot_z, 'SOX−IGV') : ''} <span style="color:var(--faint)">(weekly moves vs trailing 52-week σ)</span></div>
    ${rolling}
    ${persLine}
    <p style="margin:10px 0 4px">${spell}</p>
    <h2 style="margin-top:14px">Next week, from ${w.n_observations} prior ${esc(w.state)} weeks</h2>
    <div class="f1-odds">${odds}</div>
    ${ladder}
    <h2 style="margin-top:14px">India, the week after a ${esc(w.state)} week</h2>
    <div class="scroll"><table><tbody>${india}</tbody></table></div>
    <p class="note">Following ISO week's close-to-close return, computed live from
      the store over ${w.n_weeks} classified weeks since ${esc(w.first)} — empirical
      counts, not a model. Cells failing |t| ≥ 2 are context, not signal.
      F1 never sets direction and never enters scoring.</p>
    <div class="f1-strip">${strip}</div>
    <p class="note">Last 52 completed weeks, newest right. Method
      <code>specs/flows.yaml</code> (${esc(w.spec_version)}); evidence:
      <code>python packages/score/regime.py --weekly</code> and the Regime Atlas.</p>
  </div>`;
}

async function loadFlows(){
  const d = await (await fetch('/api/flows')).json();
  if (d.error) throw new Error(d.error);
  const stCls = s => s === 'ready' ? 'st-ready' : s === 'thin' ? 'st-thin'
    : s === 'blocked' ? 'st-blocked' : 'st-open';

  const inputRows = (d.inputs || []).map(i =>
    `<tr><td class="k">${esc(i.input)}</td>
      <td class="k flat">${esc(i.source)}</td>
      <td><span class="st ${stCls(i.state)}">${esc(i.state)}</span></td>
      <td>${esc(i.detail)}</td></tr>`).join('');

  const monRows = (d.monitors || []).map(m =>
    `<tr><td><b>${esc(m.id)}</b> ${esc(m.monitor)}</td>
      <td>${esc(m.question)}</td>
      <td class="k flat">${esc(m.scope)}</td>
      <td class="k">${esc(m.lands_in)}</td>
      <td><span class="st ${stCls(m.state === 'blocked' ? 'blocked' : 'open')}">${esc(m.state)}</span></td>
      <td>${esc(m.detail)}</td></tr>`).join('');

  $('#s-flows').innerHTML = `
    <h3>Flows — who is buying, not what is worth buying</h3>
    ${w1Panel(d.w1, d.f1)}
    <div class="await">
      <p><b>${esc(d.note)}</b></p>
      <p>F1 is live above; the rest is scoped, not built. It is not a fifth
        pillar: it computes the five inputs
        <code>specs/sectors/aluminium_primary.yaml</code> already names under
        <code>layer3:</code>, plus a market-wide risk read that has no home in the
        schema at all. <code>sector_regime</code> has a column for each and holds
        <b>${d.sector_regime_rows} rows</b> — those <code>source:</code> handles
        are names, not implementations. See <code>${esc(d.doc)}</code>.</p>
      <p>L1 says the economics moved, L2 says whether it is priced,
        <b>Flows says whether anyone is there to pay for it.</b></p>
    </div>
    <h2>The five L3 inputs · ${d.n_ready}/${d.n_inputs} ready</h2>
    <p class="note">Probed against <code>data/ims.db</code> on every request, not
      copied from the doc.</p>
    <div class="scroll"><table><thead><tr><th>input</th><th>spec source</th>
      <th>state</th><th>what it needs</th></tr></thead>
      <tbody>${inputRows}</tbody></table></div>
    <h2>The four monitors</h2>
    <div class="scroll"><table><thead><tr><th>monitor</th><th>question</th>
      <th>scope</th><th>lands in</th><th>state</th><th>note</th></tr></thead>
      <tbody>${monRows}</tbody></table></div>
    <p class="note hint">F2's two negative states are not degrees of one another.
      <code>out_of_flavour</code> means actively sold — there is interest, it is
      negative, shorts work. <code>ignored</code> means nobody is looking and
      nothing expresses in either direction however good the economics. Whatever
      computes these must preserve that distinction.</p>`;
}

async function loadSector(){
  const d = await (await fetch('/api/sector?id=' + encodeURIComponent(SECTOR) +
    (EST_DATE ? '&est_date=' + encodeURIComponent(EST_DATE) : ''))).json();
  if (d.error) throw new Error(d.error);
  const rows = d.commodities.map(c => {
    const stale = c.date && c.date < (TODAY || c.date);
    const chg = c.chg_pct == null
      ? '<td class="n flat">flat 30d+</td>'
      : `<td class="n" style="color:${c.chg_pct > 0 ? 'var(--up)' :
           c.chg_pct < 0 ? 'var(--down)' : 'var(--faint)'}">${
           (c.chg_pct >= 0 ? '+' : '') + c.chg_pct.toFixed(2)}%</td>`;
    return `<tr>
      <td class="k">${esc(c.id)}</td>
      <td title="${esc(c.name)}">${esc(shortLabel(c.name))}</td>
      <td class="n">${fmtNum(c.last)}</td>
      ${chg}
      <td class="k${stale ? ' flat' : ''}">${esc(c.date || '—')}</td>
      <td class="k flat">${esc(c.source || '—')}</td>
      <td class="k flat">${c.moved_on ? 'carried since ' + esc(c.moved_on) : 'moved today'}</td>
    </tr>`;
  }).join('');

  /* ------- the regional price chart, where the sector declares one -------
     Absolute Rs/bag on one axis, NOT %-indexed like the pair chart. The pair
     chart indexes because SAIL at 130 and APL at 1,900 cannot share a scale;
     these five regions live within ~60 Rs of each other and the LEVEL GAP is
     itself the information — West trading 20 Rs over South is a statement
     about regional tightness that an indexed chart would erase. */
  let chartHtml = '';
  if (d.price_chart && d.price_chart.series.some(s => s.pts.length > 1)){
    const pc = d.price_chart;
    /* Legend labels from series ids, sector-agnostically: strip the shared
       prefix the sector's own ids carry (cement_price_east_inr -> east,
       nmdc_lumps_inr -> lumps) rather than hardcoding one sector's prefix —
       mining's chart rendered "nmdc_lumps" raw until this was generalised. */
    const region = id => {
      const r = id.replace(/^cement_price_/, '').replace(/^nmdc_/, '')
                  .replace(/_inr$/, '').replace(/_/g, ' ');
      return r === 'india' ? 'all-India' : r;
    };
    const drawn = pc.series.filter(s => s.pts.length > 1)
      .map((s, i) => ({label: region(s.id), slot: i + 1, pts: s.pts}));
    const all = [...new Set(drawn.flatMap(s => s.pts.map(p => p.d)))].sort();
    const xDom = [Date.parse(all[0]), Date.parse(all[all.length - 1])];
    const xTicks = all.length <= 2 ? all
      : [all[0], all[Math.floor(all.length / 2)], all[all.length - 1]];
    let lo = Infinity, hi = -Infinity;
    for (const s of drawn) for (const p of s.pts){
      if (p.v < lo) lo = p.v;
      if (p.v > hi) hi = p.v;
    }
    const step = niceCeil((hi - lo || 1) / 4);
    const yLo = Math.floor(lo / step) * step, yHi = Math.ceil(hi / step) * step;
    const ticks = [];
    for (let v = yLo; v <= yHi + 1e-9; v += step) ticks.push(v);
    const availW = Math.max(560,
      (document.getElementById('s-sector').clientWidth || 900) - 8);
    const svg = lineChart({
      id: 'sectorpx', w: availW, h: 300, series: drawn,
      yLo: yLo, yHi: yHi, ticks: ticks,
      fmtY: v => String(Math.round(v)), fmtV: v => v.toFixed(1),
      xDom: xDom, xTicks: xTicks, allDates: all,
      marks: pc.marks || [],
      axisLabel: esc(d.label) + ' price · ' + esc(pc.unit)
    });
    const legend = '<div class="lgd">' + drawn.map(s =>
      '<span><i style="border-top-color:' + inkOf(s.slot) + '"></i>' +
      esc(s.label) + '</span>').join('') + '</div>';
    const markNote = (pc.marks || []).map(m =>
      `<p class="note hint">Rule at ${esc(m.d)}: ${esc(m.label || '')}</p>`).join('');
    /* Title and caption come from the API (engine.SECTORS chart dict) —
       they were hardcoded here until 2026-08-30, when mining's chart rendered
       under cement's "by region" heading and Kotak-vs-Nomura caption. */
    const capNote = pc.caption
      ? `<p class="note">${esc(pc.caption)}</p>` : '';
    chartHtml = `<h2>${esc(pc.title || (d.label + ' prices'))}</h2>
      ${legend}${svg}${markNote}${capNote}`;
  }

  /* ------- the IndiaMART watch, where the sector carries one -------
     Same payload the Overview banner reads; this is the per-region detail.
     The banner answers "did something move today" — this table is for the
     morning after it says yes. Calibrating is rendered as a state, not as
     absence: an empty panel would read as "no move", which is the one thing
     an uncalibrated watch cannot claim. */
  let watchHtml = '';
  if (d.watch && d.watch.state !== 'no_data' && d.watch.state !== 'error'){
    const w = d.watch;
    const rows2 = (w.regions || []).map(r => `<tr>
      <td><b>${esc(r.region)}</b></td>
      <td class="n">${r.median_bag == null ? '—' : Math.round(r.median_bag)}</td>
      <td class="n">${r.n_listings}</td>
      ${r.matched_pct == null
        ? '<td class="n flat">first capture</td>'
        : `<td class="n" style="color:${r.matched_pct > 0 ? 'var(--up)' :
             r.matched_pct < 0 ? 'var(--down)' : 'var(--faint)'}">${
             (r.matched_pct >= 0 ? '+' : '') + r.matched_pct.toFixed(2)}%</td>`}
      <td class="n">${r.n_matched == null ? '—' : r.n_matched}</td>
      <td class="k flat">${esc(r.prior_date || '—')}</td>
    </tr>`).join('');
    const alertHtml = (w.alerts || []).length
      ? `<div class="banner">${w.alerts.map(a => esc(a.text)).join('<br>')}</div>`
      : '';
    watchHtml = `<h2>Dealer asks · IndiaMART · ${esc(w.day || '—')}
        <span class="chip ${w.state === 'live' ? 'c-up' : 'c-warn'}"
          style="margin-left:8px">${esc(w.state)}${
          w.state === 'calibrating' ? ' · ' + w.days_to_calibrate + ' capture(s) to go' : ''}</span></h2>
      ${alertHtml}
      <p class="note">Promoted-rail ask prices. The d/d figure is the median
        move across listings present in BOTH captures — panel churn cancels out
        of it. Watch only: nothing here reaches a score, and the Kotak pack
        above stays the reference.</p>
      <div class="scroll"><table><thead><tr><th>region</th>
        <th class="n">median ask (Rs/bag)</th><th class="n">listings</th>
        <th class="n">d/d matched</th><th class="n">n matched</th>
        <th>vs capture</th></tr></thead><tbody>${rows2}</tbody></table></div>`;
  } else if (d.watch && d.watch.state === 'error'){
    watchHtml = `<p class="note hint" style="color:var(--warn)">
      Cement watch unavailable: ${esc(d.watch.note || '')}</p>`;
  }

  /* ------- the consensus panel, where the sector declares one (EMS) -------
     Forward P/E, growth, PEG and estimate-revision momentum per name — the
     tab's lead content for a sector whose P3 IS the forward multiple. Live
     from the latest capture, so it can run a day ahead of the persisted
     score (the strict as-of rule); the Overview/Pair tabs stay the tape.
     PEG and momentum are shown TOGETHER on purpose: today Dixon is the
     group's richest PEG while being the only name whose estimates are
     RISING — either half alone would read as a verdict. */
  let estHtml = '';
  EST_REDRAW = null;   // a sector without a panel must not keep the last one's
  if (d.estimates && (d.estimates.rows || []).length){
    const E = d.estimates;
    const pct = (v, dec=1) => v == null ? '—'
      : `<span style="color:${v > 0 ? 'var(--up)' : v < 0 ? 'var(--down)'
          : 'var(--faint)'}">${(v >= 0 ? '+' : '') + (v * 100).toFixed(dec)}%</span>`;
    const stateCell = r => esc(r.state || (r.scored ? 'scored' : 'not in F&O'));
    const rows3 = E.rows.map(r => {
      if (r.withheld) return `<tr>
        <td class="k">${esc(r.id)}</td><td>${esc(shortLabel(r.name))}</td>
        <td class="k flat" colspan="${E.pe_2y_asof ? 10 : 9}">no reading: ${esc(r.withheld)}</td>
        <td class="k flat">${stateCell(r)}</td></tr>`;
      // Below the scorer's 5% growth floor the PEG is shown FAINT with a
      // dagger — computable but unstable (at 4% growth a 1pp revision swings
      // it ~0.7), never coloured against the median and never scored.
      const lowG = r.growth != null && r.growth < 0.05;
      const pegCell = r.peg == null ? '—'
        : lowG ? `<span style="color:var(--faint)">${r.peg.toFixed(2)}†</span>`
        : E.peg_median == null ? r.peg.toFixed(2)
        : `<b style="color:${r.peg < E.peg_median ? 'var(--up)'
            : r.peg > E.peg_median ? 'var(--down)' : 'inherit'}">${
            r.peg.toFixed(2)}</b>`;
      return `<tr>
        <td class="k">${esc(r.id)}</td>
        <td>${esc(shortLabel(r.name))}</td>
        <td class="n">${fmtNum(r.close)}</td>
        <td class="n">${r.eps_fy1.toFixed(1)} / ${r.eps_fy2.toFixed(1)}</td>
        <td class="n">${r.n_analysts}</td>
        <td class="n"><b>${r.fwd_pe.toFixed(1)}x</b></td>
        <td class="n">${r.eps_fy2 > 0 ? (r.close / r.eps_fy2).toFixed(1) + 'x' : '—'}</td>
        ${E.pe_2y_asof ? `<td class="n">${
          r.pe_2y == null ? '—' : r.pe_2y.toFixed(1) + 'x'}</td>` : ''}
        <td class="n">${r.ttm_pe == null ? '—' : r.ttm_pe.toFixed(1) + 'x'}</td>
        <td class="n">${pct(r.growth, 0)}</td>
        <td class="n">${pegCell}</td>
        <td class="n">${pct(r.rev_90d)}</td>
        <td class="k flat">${stateCell(r)}</td>
      </tr>`;
    }).join('');

    /* ---- the scatter: multiple vs expected growth, iso-PEG guides ----
       The graph the PM asked IT for (2026-09-01) — rendered for ANY sector
       whose panel has >=3 computable rows, so EMS gets it too. Colour follows
       the served display group (est_groups; series slots 1..3 in order);
       a sector with no groups draws in slot 1. Identity is never colour
       alone: every point is direct-labelled, and the table below is the
       same data.
       Two modes since 2026-09-02 (PM: "add a toggle for fy29 ... flipping the
       switch flips the graph"): '1y' plots the Yahoo-computed 12m-forward
       multiple; '2y' plots Bloomberg's PE Ratio [2 Yr Fwd] — the BEst blended
       24-month multiple, which embeds the FY29 consensus that no fetchable
       source carries. The 2y feed is a hand-captured terminal screenshot
       (adapters/bbg_pe2y.py), so its button wears its capture date. */
    const c1y = E.rows.filter(r => !r.withheld && r.fwd_pe != null);
    // The real fiscal pair, not "FY1/FY2": every computable row carries its
    // own fy1/fy2 (today FY27/FY28 across the board). If a mixed-year cross-
    // section ever appears (a non-March closer), the generic label returns
    // rather than one name's pair being asserted for all.
    const fy1s = new Set(c1y.map(r => r.fy1)), fy2s = new Set(c1y.map(r => r.fy2));
    const FY1 = fy1s.size === 1 ? [...fy1s][0] : 'FY1';
    const FY2 = fy2s.size === 1 ? [...fy2s][0] : 'FY2';
    const buildEstScatter = mode => {
      ESTV = null;   // stays null when this returns '' (fewer than 3 points)
      const two = mode === '2y';
      const spts = E.rows.filter(r => two
        ? (r.pe_2y != null && r.growth != null)
        : (!r.withheld && r.fwd_pe != null));
      if (spts.length < 3) return '';
      const yv = r => two ? r.pe_2y : r.fwd_pe;
      const W = 900, H = 380, ml = 48, mr = 26, mt = 14, mb = 42;
      const iw = W - ml - mr, ih = H - mt - mb;
      const xmax = Math.max(0.15, Math.max(...spts.map(p => p.growth)) * 1.18);
      const ys = spts.map(yv);
      const ymin = Math.max(0, Math.floor(Math.min(...ys) * 0.85 / 5) * 5);
      const ymax = Math.ceil(Math.max(...ys) * 1.12 / 5) * 5;
      const sx = g => ml + Math.max(0, g) / xmax * iw;
      const syy = p => mt + (ymax - p) / (ymax - ymin) * ih;
      const groups = E.groups || [];
      const colOf = r => {
        const i = groups.indexOf(r.group);
        return `var(--series-${i >= 0 ? (i % 8) + 1 : 1})`;
      };
      let s = '';
      const ystep = (ymax - ymin) > 25 ? 10 : 5;
      for (let p = ymin; p <= ymax; p += ystep){
        s += `<line x1="${ml}" x2="${W - mr}" y1="${syy(p)}" y2="${syy(p)}"
                stroke="var(--hair)" stroke-width="1"/>
              <text x="${ml - 8}" y="${syy(p) + 4}" text-anchor="end"
                font-size="11" fill="var(--faint)">${p}x</text>`;
      }
      const xstep = xmax > 0.3 ? 0.1 : 0.05;
      for (let g = 0; g <= xmax + 1e-9; g += xstep){
        s += `<text x="${sx(g)}" y="${H - mb + 18}" text-anchor="middle"
                font-size="11" fill="var(--faint)">${Math.round(g * 100)}%</text>`;
      }
      // iso-ratio guides: straight lines PE = k * g*100, clipped to the plot.
      // Labelled ~PEG on the 1y view: the table's PEG numerator is the FY2
      // multiple (desk convention, 2026-09-03) while this axis is the 12m
      // blend, so a point's exact PEG runs up to ~10% below the guide it
      // sits on. In 2y mode "PEG" would be a plain misnomer, so the guides
      // read as multiple-per-growth ratios there.
      [[1, two ? '1×g' : '~PEG 1'], [1.5, two ? '1.5×g' : '~PEG 1.5'],
       [2, two ? '2×g' : '~PEG 2'], [3, two ? '3×g' : '~PEG 3']].forEach(([peg, lab]) => {
        const gA = Math.max(0.004, ymin / (peg * 100));
        const gB = Math.min(xmax, ymax / (peg * 100));
        if (gB <= gA) return;
        const exitTop = gB < xmax;   // guide leaves through the top edge
        // Brighter than the y-grid on purpose (PM 2026-09-02: "make the PEG
        // lines a bit more visible") — but still dashed and under the marks,
        // so they read as guides, never as data.
        s += `<line x1="${sx(gA)}" y1="${syy(peg * gA * 100)}"
                x2="${sx(gB)}" y2="${syy(peg * gB * 100)}"
                stroke="var(--faint)" stroke-width="1.3"
                stroke-dasharray="6 4"/>
              <text x="${sx(gB) + (exitTop ? 4 : -4)}"
                y="${syy(peg * gB * 100) - 5}" font-size="11"
                font-weight="600" fill="var(--soft)"
                text-anchor="${exitTop ? 'start' : 'end'}">${lab}</text>`;
      });
      // points, then labels with a greedy vertical de-overlap (the large-cap
      // cluster sits within a multiple point of itself)
      const labs = spts.map(r => ({r, x: sx(r.growth), y: syy(yv(r))}))
        .sort((a, b) => a.y - b.y || a.x - b.x);
      labs.forEach((L, i) => {
        L.ly = L.y + 4;
        for (let j = 0; j < i; j++){
          const P = labs[j];
          if (Math.abs(L.x - P.x) < 90 && Math.abs(L.ly - P.ly) < 12)
            L.ly = P.ly + 12;
        }
      });
      ESTV = {W, H, ml, mr, mt, mb, xmax, ymin, ymax, pts: []};
      labs.forEach(L => {
        const r = L.r;
        // No <title>: the crosshair layer (wireEstScatter) is the readout —
        // a native title on top of it would double the tooltip.
        s += `<circle cx="${L.x}" cy="${L.y}" r="6" fill="${colOf(r)}"
                stroke="var(--surface)" stroke-width="2"/>`;
        const anchor = L.x > W - mr - 96 ? 'end' : 'start';
        s += `<text x="${anchor === 'end' ? L.x - 10 : L.x + 10}" y="${L.ly}"
                font-size="11" font-weight="600" fill="var(--ink)"
                text-anchor="${anchor}">${esc(shortLabel(r.name))}</text>`;
        ESTV.pts.push({x: L.x, y: L.y, d: r});
      });
      ESTV.pts.sort((a, b) => a.x - b.x);   // arrow keys walk left -> right
      const legend3 = groups.length
        ? `<p class="note" style="margin:2px 0 6px">${groups.map((g, i) =>
            `<span style="color:var(--series-${(i % 8) + 1})">●</span> ${esc(g)}`)
            .join(' &nbsp;·&nbsp; ')} &nbsp;— display grouping only; nothing
            scores against it.</p>`
        : '';
      /* Crosshair layer, painted last so it rides above everything. Two
         hairlines + axis readout chips follow the pointer; within reach of a
         point they SNAP to it, so the numbers shown are the name's exact
         values rather than the pixel under the cursor. Wired by
         wireEstScatter() after insertion, same lifecycle as wireChart. */
      const xh = `
        <line class="xhair es-vx" x1="0" x2="0" y1="${mt}" y2="${H - mb}"
          style="display:none"/>
        <line class="xhair es-hx" x1="${ml}" x2="${W - mr}" y1="0" y2="0"
          style="display:none"/>
        <circle class="es-ring" r="9.5" fill="none" stroke="var(--accent)"
          stroke-width="1.5" style="display:none" pointer-events="none"/>
        <g class="es-rx" style="display:none" pointer-events="none">
          <rect x="-26" y="${H - mb + 5}" width="52" height="17" rx="3"
            fill="var(--surface)" stroke="var(--hair)"/>
          <text y="${H - mb + 18}" text-anchor="middle" font-size="11"
            font-weight="600" fill="var(--accent)"></text></g>
        <g class="es-ry" style="display:none" pointer-events="none">
          <rect x="${ml - 48}" y="-9" width="42" height="17" rx="3"
            fill="var(--surface)" stroke="var(--hair)"/>
          <text x="${ml - 10}" y="4" text-anchor="end" font-size="11"
            font-weight="600" fill="var(--accent)"></text></g>`;
      // Names the 1y view carries that the BBG capture lacks — listed, not
      // silently absent (LTTS and OFSS sat outside the screenshot frame).
      const miss = two
        ? E.rows.filter(r => !r.withheld && r.fwd_pe != null && r.pe_2y == null)
            .map(r => shortLabel(r.name))
        : [];
      const missNote = miss.length
        ? `<p class="note hint">not in the BBG capture: ${esc(miss.join(', '))}
             — shown on the 1-yr view only.</p>`
        : '';
      return `${legend3}
        <div class="scroll"><div class="chartwrap" id="cw-est">
        <svg viewBox="0 0 ${W} ${H}" width="100%"
          style="min-width:640px" role="img" tabindex="0"
          aria-label="forward P/E against consensus growth — hover or use arrow keys for exact values; the table below carries the same data">
          ${s}${xh}
          <text x="${ml + iw / 2}" y="${H - 4}" text-anchor="middle"
            font-size="11" fill="var(--soft)">consensus EPS growth, ${FY1} → ${FY2}</text>
          <text x="12" y="${mt + ih / 2}" font-size="11" fill="var(--soft)"
            transform="rotate(-90 12 ${mt + ih / 2})"
            text-anchor="middle">${two
              ? `2-yr fwd P/E · BBG ${esc(E.pe_2y_asof || '')}`
              : '12m forward P/E'}</text>
        </svg><div class="viztip" role="status"></div></div></div>${missNote}`;
    };
    EST_REDRAW = buildEstScatter;
    const scatterHtml = `<div id="est-scatter-box">${buildEstScatter('1y')}</div>`;
    const n2y = E.rows.filter(r => r.pe_2y != null && r.growth != null).length;
    const modeBtns = (E.pe_2y_asof && n2y >= 3) ? `
      <div class="est-mode" role="group" aria-label="forward horizon"
        style="display:flex;gap:8px;margin:0 0 8px">
        <button class="ghost" data-m="1y" aria-pressed="true">1-yr fwd · Yahoo, daily</button>
        <button class="ghost" data-m="2y" aria-pressed="false">2-yr fwd · BBG ${esc(E.pe_2y_asof)}, marked to close</button>
      </div>` : '';
    /* The EPS-drift warning. The BBG multiple re-marks on price daily, but
       its EPS is pinned at the capture — so when the YAHOO consensus has
       moved >=1% since the capture date, the pinned BBG EPS has probably
       moved too, and the re-marked multiple is quietly wrong for that name.
       This is the "EPS might have changed" warning the PM asked for
       (2026-09-02); the fix it calls for is a fresh screenshot. */
    const drifted = E.rows.filter(r =>
      r.pe_2y_drift != null && Math.abs(r.pe_2y_drift) >= 0.01);
    const warn2y = drifted.length ? `
      <p class="note" style="color:var(--warn)">⚠ consensus EPS has moved
        since the BBG capture (${esc(E.pe_2y_asof)}): ${drifted.map(r =>
          `${esc(shortLabel(r.name))} ${(r.pe_2y_drift >= 0 ? '+' : '')}${
          (r.pe_2y_drift * 100).toFixed(1)}%`).join(', ')} — their 2-yr
        multiples are re-marked on today's close but still carry the
        capture-day estimates. A fresh screenshot resets this.</p>` : '';
    /* The column glossary lives in a one-line <details> BELOW the graph
       (PM, 2026-09-02) — the chart leads, the fine print folds away. */
    const glossary = `
      <details class="await" style="margin:4px 0 10px">
        <summary style="cursor:pointer;color:var(--soft);font-size:var(--t-sm)">
          How to read the columns — fwd P/E, P/E ${FY2}E${
          E.pe_2y_asof ? ', 2y BBG' : ''}, PEG†, rev 90d</summary>
        <p class="note" style="margin-top:8px">Yahoo consensus (cross-checked
        against broker notes in the digests). <b>fwd P/E</b> divides the close
        by the 12-month-forward EPS blend of ${FY1}/${FY2}; <b>P/E ${FY2}E</b>
        is the multiple on the furthest consensus year Yahoo carries — the
        number broker notes quote${
        E.pe_2y_asof ? `; <b>P/E 2y (BBG)</b> is Bloomberg's blended 24-month
        forward multiple, which embeds FY-after consensus no free feed has —
        hand-captured <b>${esc(E.pe_2y_asof)}</b> (adapters/bbg_pe2y.py) and
        re-marked on each day's close via the implied 24m EPS; a ⚠ line
        appears when the consensus moves after the capture` : ''};
        <b>PEG</b> divides the <b>P/E ${FY2}E</b> by ${FY2}-over-${FY1}
        growth (desk convention, PM 2026-09-03: numerator and denominator
        describe the same year — you pay the ${FY2} multiple for the growth
        that delivers ${FY2}); the chart's guide lines sit on the blended
        axis, hence the ~.
        †&nbsp;Sub-5%-growth PEGs are faint for NOISE (at 4% growth a 1pp
        revision swings the ratio ~0.7), but the cross-cap reading stands —
        PM 2026-09-02: on a growth basis a ~3 PEG large cap pays you nothing
        against a ~1.5 mid, and that IS what this chart measures; dividends
        and buybacks, the reason to own the ~3s, are a different analysis
        that sits outside it —
        green is cheaper than the scored group's median (${
        E.peg_median == null ? '—' : E.peg_median.toFixed(2)}), which is what
        P3 scores (ln-ratio, ${E.anchor_ratio}x reads 2.0). <b>rev 90d</b> is
        the street moving its own numbers — context, never scored: a cheap PEG
        on falling estimates is cheap because the E is falling. <b>P/E ttm</b>
        is the normal trailing multiple every screener quotes — reference
        only, and read it warily here: a one-off can put it BELOW the forward
        (Dixon), a trough TTM far above it (Amber).</p>
      </details>`;
    /* The history picker (PM 2026-09-03: "let me view with dates in past").
       Nothing is snapshotted — the dated captures ARE the history, so a past
       date is a point-in-time recomputation: that day's capture against that
       day's close, BBG re-mark and drift included. Floor = first capture. */
    // ◀ ▶ step through the dates that actually have a capture (plus today) —
    // stepping onto an uncaptured calendar day would just withhold everything.
    const steps = (E.est_dates || []).slice();
    if (E.today && !steps.includes(E.today)) steps.push(E.today);
    const prevD = [...steps].reverse().find(d => d < E.as_of_view) || '';
    const nextD = steps.find(d => d > E.as_of_view) || '';
    const histCtl = (E.est_dates || []).length ? `
      <div class="est-hist" style="display:flex;gap:8px;align-items:center;margin:0 0 8px">
        <span style="color:var(--soft);font-size:var(--t-sm)">as of</span>
        <button class="ghost" id="est-prev" data-d="${esc(prevD)}"
          ${prevD ? '' : 'disabled'} title="previous capture"
          aria-label="previous capture date">◀</button>
        <input type="date" id="est-date" value="${esc(E.as_of_view)}"
          min="${esc(E.est_dates[0])}" max="${esc(E.today || E.as_of_view)}"
          style="background:var(--surface);color:var(--ink);
                 border:1px solid var(--rule);border-radius:6px;
                 padding:2px 8px;font-family:var(--sans);
                 font-size:var(--t-sm);color-scheme:dark">
        <button class="ghost" id="est-next" data-d="${esc(nextD)}"
          ${nextD ? '' : 'disabled'} title="next capture"
          aria-label="next capture date">▶</button>
        ${E.as_of_is_today ? '' :
          '<button class="ghost" id="est-today">back to today</button>'}
      </div>
      ${E.as_of_is_today ? '' : `<p class="note" style="color:var(--accent)">
        replaying <b>${esc(E.as_of_view)}</b> — the consensus capture and
        closes as they stood that day, recomputed from the dated store, not a
        saved copy. History starts ${esc(E.est_dates[0])} (first capture).</p>`}
      ` : '';
    estHtml = `<h2>Consensus forward P/E · capture ${
        esc((E.rows.find(r => r.capture) || {}).capture || '—')}</h2>
      ${histCtl}
      ${modeBtns}
      ${warn2y}
      ${scatterHtml}
      ${glossary}
      <div class="scroll"><table><thead><tr>
        <th>id</th><th>name</th><th class="n">close</th>
        <th class="n">EPS ${FY1}E/${FY2}E</th><th class="n">analysts</th>
        <th class="n">fwd P/E</th><th class="n">P/E ${FY2}E</th>
        ${E.pe_2y_asof ? '<th class="n">P/E 2y·BBG</th>' : ''}
        <th class="n">P/E ttm</th>
        <th class="n">growth</th>
        <th class="n">PEG</th><th class="n">rev 90d</th><th>state</th>
      </tr></thead><tbody>${rows3}</tbody></table></div>`;
  }

  const unc = d.unclaimed && d.unclaimed.length
    ? `<h2>Captured, claimed by no sector</h2>
       <p class="note">Loaded from the pack so the history exists. Nothing reads
         them.</p>
       <div class="scroll"><table><thead><tr><th>series</th><th class="n">last</th>
         <th>date</th></tr></thead><tbody>${d.unclaimed.map(u =>
         `<tr><td class="k">${esc(u.id)}</td><td class="n">${fmtNum(u.last)}</td>
          <td class="k">${esc(u.date)}</td></tr>`).join('')}</tbody></table></div>`
    : '';

  /* THE PLACEHOLDER DEMOTES ITSELF ONCE THERE IS DATA TO SHOW. This box was
     written when an unbuilt sector's tab had nothing else on it, and it earned
     the lead position then. With a chart and a watch above the fold it read as
     "this tab is empty" — the PM's words: "cement shows no specs" — while the
     data sat below a wall of build instructions. The instructions still matter
     (they are the recipe for making the sector live) so they fold into a
     <details> at the BOTTOM, and the not-scored fact itself moves into a
     one-line note where it cannot be mistaken for the tab's content. */
  // A LIVE sector reaches this view through the Prices & Watch sub-tab, and
  // the not-scored disclaimer would then be false — its pillars live on the
  // other three tabs. Both notes key on d.live.
  const buildNote = d.live ? '' : `
    <p class="note hint">${esc(d.label)} is <b>not scored</b> — prices land
      daily, but no spec links them, so no pillar exists and nothing is
      withheld either.</p>`;
  const buildHow = d.live ? '' : `
    <details class="await" style="margin-top:var(--s5)">
      <summary style="cursor:pointer;font-weight:600">How this tab becomes
        Pair / Bridge / Positioning</summary>
      <p style="margin-top:10px">The series are captured deliberately before
        the sector is built — the pack arrives as an email attachment and the
        connector route can only ever return the OLDEST rows, so a column not
        captured today is history that cannot be recovered later.</p>
      <ol>
        <li>Write <code>specs/entities/${esc(d.id)}.yaml</code> — names, peer
          group, <code>base_ebitda</code>, cost items with
          <code>market_pct</code></li>
        <li><code>price_link</code> each cost item to a series below, and move it
          out of <code>metals_pack.PARKED</code> and out of
          <code>freshness.PARKED_FEEDS</code> so it starts being watched</li>
        <li>Add the peer group to <code>engine.SECTORS</code> — this tab becomes
          Pair / Bridge / Positioning with no further front-end work</li>
      </ol>
    </details>`;

  $('#s-sector').innerHTML = `
    ${buildNote}
    ${estHtml}
    ${chartHtml}
    ${watchHtml}
    <h2>${esc(d.label)} inputs · ${d.n_priced}/${d.n_total} priced</h2>
    <p class="note">Change is measured against the last close that actually
      <b>differed</b>, not the previous row — the pack pre-creates the current
      day's row and carries the prior session forward until tomorrow's file
      backfills it, so a row-over-row change reads 0.00% on almost everything.</p>
    <div class="scroll"><table><thead><tr>
      <th>series</th><th>what it is</th><th class="n">last</th>
      <th class="n">last real move</th><th>as of</th><th>source</th><th>state</th>
    </tr></thead><tbody>${rows}</tbody></table></div>
    ${unc}
    ${buildHow}`;
  // After insertion — the hover layer needs the SVG in the DOM. (`unc` above
  // was also built-but-never-rendered until the chart landed here.)
  if (chartHtml) wireChart('sectorpx');
  if (ESTV) wireEstScatter();
  // The history picker: a changed date refetches the whole sector view with
  // est_date, so table, scatter, BBG re-mark and drift all replay together.
  const dp = document.getElementById('est-date');
  if (dp) dp.addEventListener('change', () => {
    EST_DATE = dp.value || null;
    loadSector().catch(e => showErr(String(e)));
  });
  const bt = document.getElementById('est-today');
  if (bt) bt.addEventListener('click', () => {
    EST_DATE = null;
    loadSector().catch(e => showErr(String(e)));
  });
  // ◀ ▶ steppers — each carries its target date; disabled at either end.
  for (const id of ['est-prev', 'est-next']){
    const b = document.getElementById(id);
    if (b) b.addEventListener('click', () => {
      if (!b.dataset.d) return;
      EST_DATE = b.dataset.d;
      loadSector().catch(e => showErr(String(e)));
    });
  }
  // The 1y/2y horizon toggle: re-draw the scatter box in place, then re-wire
  // the crosshair (the old SVG and its listeners left with the old DOM).
  document.querySelectorAll('#s-sector .est-mode button').forEach(b =>
    b.addEventListener('click', () => {
      if (!EST_REDRAW) return;
      document.querySelectorAll('#s-sector .est-mode button').forEach(x =>
        x.setAttribute('aria-pressed', String(x === b)));
      const box = document.getElementById('est-scatter-box');
      if (box){
        box.innerHTML = EST_REDRAW(b.dataset.m);
        if (ESTV) wireEstScatter();
      }
    }));
}

let TODAY = null;

const loaders = {pair:loadPair, scores:loadScores, pos:loadPos,
                sector:loadSector, overview:loadOverview, book:loadBook,
                flows:loadFlows};

/* Which views render SECTOR-SPECIFIC content. The other three are global —
   Positioning is the whole F&O table, Overview and Flows are run-level — so
   their DOM stays valid across a sector switch and must not be refetched. */
const SECTOR_SCOPED = {pair:1, scores:1, sector:1};

/* view -> the sector whose content is currently IN THAT SECTION'S DOM, or '*'
   for a global view. NOT "has this view loaded": there is one #s-<view> node
   shared by every sector, so a per-view flag reported Steel's bridge as
   already loaded when Non-Ferrous asked for it, and left Steel on screen. */
const rendered = {};

/* Run a view's loader and record what its DOM now holds. Clears the record on
   failure — the old flag was set BEFORE the await, so a view that threw once
   was marked loaded forever and stayed blank until a reload. */
function render(name){
  rendered[name] = SECTOR_SCOPED[name] ? SECTOR : '*';
  loaders[name]().catch(e => { delete rendered[name]; showErr(e.message); });
}
function tab(name){
  document.querySelectorAll('.tab').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.t === name)));
  document.querySelectorAll('section').forEach(s =>
    s.classList.toggle('on', s.id === 's-' + name));
  // The window selector drives the LIVE bridge only. Leaving it visible on the
  // Pair tab would imply it moves the persisted tape, which it cannot.
  // The window selector, FX and the override count all describe the LIVE
  // bridge. Showing them over the persisted tape would imply they move it.
  // Only the three sector sub-views are remembered. Overview and Flows are
  // top-level tabs, so recording them here would send you to a hidden section
  // the next time you picked a live sector.
  if (name === 'pair' || name === 'scores' || name === 'pos'
      || name === 'sector') LAST_VIEW = name;
  const live = (name === 'scores');
  $('#winwrap').hidden = !live;
  $('#fxwrap').hidden = !live;
  // Re-render when this section is showing another sector's content.
  if (rendered[name] !== (SECTOR_SCOPED[name] ? SECTOR : '*')) render(name);
}
document.querySelectorAll('.tab').forEach(b =>
  b.addEventListener('click', () => tab(b.dataset.t)));
$('#win').addEventListener('change', () => loadScores().catch(e => showErr(e.message)));
$('#reload').addEventListener('click', () => {
  for (const k in rendered) delete rendered[k];
  for (const k in TAPE) delete TAPE[k];      // else Refresh cannot see a new run
  // The visible view is the sector placeholder whenever the sector has no spec;
  // reading the sub-nav then reloads a view that is not on screen.
  const e = SECTORS.find(x => x.id === SECTOR) || {};
  const cur = e.kind === 'overview' ? 'overview'
    : e.kind === 'book' ? 'book'
    : e.kind === 'flows' ? 'flows'
    : e.live ? document.querySelector('.tab[aria-selected=true]').dataset.t
    : 'sector';
  render(cur);
});
$('#winwrap').hidden = true;
$('#fxwrap').hidden = true;
loadSectorNav()
  .then(() => { sector(SECTOR); })
  .catch(e => {
    // Never leave the page on "sectors…". If the nav cannot load, fall back to
    // the view that has always worked rather than showing a dead shell.
    showErr('sector nav: ' + e.message);
    /* Fallback nav when /api/nav fails. It must carry peer_groups now that
       loadScores() reads them, or the Bridge view renders its empty state on a
       sector that actually works. KEEP IN STEP WITH engine.SECTORS — this
       literal had silently fallen two sectors behind (no cement, no mining)
       by 2026-08-30, which would have made an /api/nav outage also look like
       half the coverage vanishing. */
    SECTORS = [{id:'non_ferrous', kind:'sector', label:'Non-Ferrous', live:true,
                peer_groups:['aluminium_primary','zinc']},
               {id:'steel', kind:'sector', label:'Steel', live:true,
                peer_groups:['steel_integrated','steel_converter']},
               {id:'cement', kind:'sector', label:'Cement', live:true,
                peer_groups:['cement']},
               {id:'mining', kind:'sector', label:'Mining', live:true,
                peer_groups:['mining_bulk','mining_copper']}];
    SECTOR = 'non_ferrous';
    $('#snav').innerHTML = '<button class="stab" aria-selected="true">Non-Ferrous</button>';
    $('#vnav').hidden = false;
    tab('pair');
  });
</script>
</body>
</html>
