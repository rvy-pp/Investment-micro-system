/* One chart, one y-axis. Sized in REAL PIXELS rather than a fixed viewBox
   stretched with preserveAspectRatio of none — that stretch scaled x, not y,
   so every axis label was drawn ~38% wide on a full-width monitor. */
function lineChart(cfg){
  const {id, w, h, series, yLo, yHi, ticks, fmtY, fmtV, xDom, xTicks, marks, axisLabel} = cfg;
  /* MR was 116 to hold the end labels. With those gone it only has to keep the
     last end-dot and the newest x tick off the edge, so the plot reclaims
     ~100px — on a 929px chart that is 12% more width for the same data, which
     is most of what made a flat 1-5 band hard to read in the first place. */
  const ML = 54, MR = 16, MT = 16, MB = 30;
  const [x0, x1] = xDom;
  const X = ms => ML + (x1 === x0 ? 0 : (ms - x0) / (x1 - x0) * (w - ML - MR));
  const Y = v => MT + (1 - (v - yLo) / ((yHi - yLo) || 1)) * (h - MT - MB);
  const T = d => Date.parse(d);

  let grid = '', yax = '';
  for (const v of ticks){
    const y = Y(v).toFixed(1);
    // Solid hairlines. A dashed rule reads as "this line is itself data".
    const base = (v === 0 || (yLo === 1 && v === 3));
    grid += '<line class="' + (base ? 'zero' : 'grid') + '" x1="' + ML +
            '" x2="' + (w - MR) + '" y1="' + y + '" y2="' + y + '"/>';
    yax += '<text class="ax" x="' + (ML - 8) + '" y="' + y +
           '" text-anchor="end" dominant-baseline="middle">' + esc(fmtY(v)) + '</text>';
  }

  let mk = '';
  for (const m of (marks || [])){
    const x = X(T(m.d)).toFixed(1);
    mk += '<line class="zero" x1="' + x + '" x2="' + x + '" y1="' + MT +
          '" y2="' + (h - MB) + '"/>';
  }

  const wide = (x1 - x0) > 400 * 864e5;
  let xax = '';
  for (const d of xTicks){
    const tx = X(T(d));
    /* ANCHOR THE EDGE TICKS INWARD. Every tick was centred, which was safe
       while MR held 116px of label gutter; with MR at 16 a centred "20 Sep" on
       the newest tick overhangs the svg and gets clipped to "20 Se". Nothing
       would raise — a truncated axis label just reads as a shorter month. */
    const anc = tx > w - MR - 22 ? 'end' : (tx < ML + 22 ? 'start' : 'middle');
    xax += '<text class="ax" x="' + tx.toFixed(1) + '" y="' + (h - 9) +
           '" text-anchor="' + anc + '">' + esc(dtick(d, wide)) + '</text>';
  }

  let lines = '';
  const ends = [];
  for (const s of series){
    if (s.pts.length < 2) continue;
    const pl = s.pts.map(p => X(T(p.d)).toFixed(1) + ',' + Y(p.v).toFixed(1)).join(' ');
    /* `dash` marks a series as PROJECTED rather than observed. It also skips
       the end dot: the dot means "the data stops here", and putting one at the
       end of a forecast would assert a measurement where there is an
       estimate. The dash carries the whole claim. */
    lines += '<polyline points="' + pl + '" fill="none" style="stroke:' + inkOf(s.slot) +
             '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"' +
             (s.dash ? ' stroke-dasharray="5 4" opacity=".8"' : '') + '/>';
    if (s.dash) continue;
    const last = s.pts[s.pts.length - 1];
    ends.push({s: s, yTrue: Y(last.v), y: Y(last.v), x: X(T(last.d))});
  }

  /* THE END LABELS ARE GONE (PM, 2026-09-23: "it makes the visualization
     confusing. I can just hover and see").

     What was here: the last value of each line carried its name in the right
     margin, de-collided down a 13px ladder with a leader line back to the true
     value. It was built because five names inside a 1-5 band overlap
     routinely — but the cure was worse than the disease. On a tight band every
     label is displaced, so the chart ends in a column of names connected by
     diagonal leaders to dots they do not sit beside, and the eye has to trace
     each one. Identity was already available twice over: the LEGEND above each
     chart pairs every name with its colour, and the HOVER readout lists every
     series at the crosshair date with its key, value and label. Three answers
     to one question, and the worst of them owned 116px of chart width.

     The end DOT stays. It marks where each line stops, which is a fact about
     the data rather than a label, and it cannot be mis-attributed. */

  /* Divergence markers. A TRIANGLE POINTING THE WAY THE SCORE WENT: up means
     score rose while price fell, down means score fell while price rose. The
     marker existing at all is what says the two disagreed, so one shape rule
     covers both cases and needs no second colour — which matters, because
     colour here already means "which name" and cannot also mean "which
     direction". Filled in the series colour with a surface-coloured ring so
     it stays legible where two lines cross. */
  let dmk = '';
  for (const sr of series){
    for (const g of (sr.divs || [])){
      const x = X(T(g.d)), y = Y(g.v), r = 5;
      const pts = g.dir > 0
        ? [[x, y - r], [x - r * 0.9, y + r * 0.7], [x + r * 0.9, y + r * 0.7]]
        : [[x, y + r], [x - r * 0.9, y - r * 0.7], [x + r * 0.9, y - r * 0.7]];
      dmk += '<polygon points="' + pts.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ') +
             '" style="fill:' + inkOf(sr.slot) + '" class="vdiv"/>';
    }
  }

  // The end dot only. No text, no leader — see the note above.
  let lab = '';
  for (const e of ends)
    lab += '<circle cx="' + e.x.toFixed(1) + '" cy="' + e.yTrue.toFixed(1) +
           '" r="3" style="fill:' + inkOf(e.s.slot) +
           '" stroke-width="1.5" class="vdot"/>';

  PAIRV[id] = {
    ML: ML, MR: MR, w: w, h: h, MT: MT, MB: MB, x0: x0, x1: x1, X: X,
    fmt: fmtV || fmtY,
    all: cfg.allDates,
    series: series.filter(s => s.pts.length).map(s => ({
      label: s.label, slot: s.slot,
      byDate: new Map(s.pts.map(p => [p.d, p.v])),
      divByDate: new Map((s.divs || []).map(g => [g.d, g]))
    }))
  };

  return '<div class="chartwrap" id="cw-' + id + '">' +
    '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h +
      '" role="img" tabindex="0" aria-label="' + esc(axisLabel) + '">' +
    grid + mk +
    '<line class="xhair" x1="0" x2="0" y1="' + MT + '" y2="' + (h - MB) + '" style="display:none"/>' +
    lines + dmk + lab + yax + xax +
    '<text class="axl" x="' + ML + '" y="10">' + esc(axisLabel) + '</text>' +
    '</svg><div class="viztip" role="status"></div></div>';
}

/* The consensus scatter's hover layer (PM, 2026-09-02: "a crosshair of sorts
   so I can see exact valuation numbers"). Same idiom as wireChart below, but
   two-dimensional: hairlines on BOTH axes with readout chips showing the
   growth/multiple under the cursor, and within 30 svg-units of a point the
   crosshair SNAPS to it — the chips then read the name's exact values and the
   viztip carries the full row. The scatter is viewBox-scaled (the pair charts
   are real-pixel), so client coords are mapped through the bounding rect. */
let ESTV = null;       // geometry + rows of the currently drawn scatter
let EST_REDRAW = null; // buildEstScatter closure for the 1y/2y toggle
let EST_DATE = null;   // replay date for the consensus panel (null = today)
function wireEstScatter(){
  const wrap = document.getElementById('cw-est');
  if (!wrap || !ESTV) return;
  const m = ESTV;
  const svg = wrap.querySelector('svg');
  const vx = svg.querySelector('.es-vx'), hx = svg.querySelector('.es-hx');
  const ring = svg.querySelector('.es-ring');
  const grx = svg.querySelector('.es-rx'), gry = svg.querySelector('.es-ry');
  const tip = wrap.querySelector('.viztip');
  const iw = m.W - m.ml - m.mr, ih = m.H - m.mt - m.mb;
  let sel = -1;

  const hide = () => {
    [vx, hx, ring, grx, gry].forEach(e => { e.style.display = 'none'; });
    tip.classList.remove('on'); sel = -1;
  };

  const readout = (x, y) => {
    vx.setAttribute('x1', x); vx.setAttribute('x2', x); vx.style.display = '';
    hx.setAttribute('y1', y); hx.setAttribute('y2', y); hx.style.display = '';
    grx.setAttribute('transform', `translate(${x},0)`); grx.style.display = '';
    gry.setAttribute('transform', `translate(0,${y})`); gry.style.display = '';
    grx.querySelector('text').textContent =
      ((x - m.ml) / iw * m.xmax * 100).toFixed(1) + '%';
    gry.querySelector('text').textContent =
      (m.ymax - (y - m.mt) / ih * (m.ymax - m.ymin)).toFixed(1) + 'x';
  };

  const showTip = (p, rect) => {
    ring.setAttribute('cx', p.x); ring.setAttribute('cy', p.y);
    ring.style.display = '';
    // textContent throughout — ids/names arrive from the API (untrusted).
    tip.textContent = '';
    const hd = document.createElement('div'); hd.className = 'd';
    hd.textContent = p.d.id + (p.d.group ? ' · ' + p.d.group : '');
    tip.appendChild(hd);
    const sgn = (v, dec) => (v >= 0 ? '+' : '') + (v * 100).toFixed(dec) + '%';
    [[p.d.fwd_pe.toFixed(1) + 'x', 'fwd P/E'],
     [p.d.eps_fy2 > 0 ? (p.d.close / p.d.eps_fy2).toFixed(1) + 'x' : '—',
      'P/E ' + (p.d.fy2 || 'FY2') + 'E'],
     ...(p.d.pe_2y != null
        ? [[p.d.pe_2y.toFixed(1) + 'x', '2y fwd (BBG)']] : []),
     ...(p.d.eps_2y_implied != null
        ? [[p.d.eps_2y_implied.toFixed(1), 'EPS 24m implied']] : []),
     [p.d.ttm_pe == null ? '—' : p.d.ttm_pe.toFixed(1) + 'x', 'P/E ttm'],
     [fmtNum(p.d.close), 'close'],
     [p.d.eps_fy1.toFixed(1) + ' / ' + p.d.eps_fy2.toFixed(1),
      'EPS ' + (p.d.fy1 || 'FY1') + '/' + (p.d.fy2 || 'FY2')],
     [sgn(p.d.growth, 1), 'growth'],
     [p.d.peg == null ? '—' : p.d.peg.toFixed(2), 'PEG'],
     [p.d.rev_90d == null ? '—' : sgn(p.d.rev_90d, 1), 'rev 90d'],
     [String(p.d.n_analysts), 'analysts']].forEach(([v, l]) => {
      const r = document.createElement('div'); r.className = 'r';
      const b = document.createElement('b'); b.textContent = v;
      const em = document.createElement('em'); em.textContent = l;
      r.appendChild(b); r.appendChild(em); tip.appendChild(r);
    });
    tip.classList.add('on');
    // Tip position in CSS pixels (the svg is viewBox-scaled).
    const kx = rect.width / m.W, ky = rect.height / m.H;
    const tw = tip.offsetWidth || 170, th = tip.offsetHeight || 150;
    let left = p.x * kx + 16;
    if (left + tw > rect.width) left = p.x * kx - tw - 16;
    let top = Math.max(4, Math.min(p.y * ky - th / 2, rect.height - th - 4));
    tip.style.left = Math.max(4, left) + 'px';
    tip.style.top = top + 'px';
  };

  const move = ev => {
    const rect = svg.getBoundingClientRect();
    if (!rect.width) return;
    const x = (ev.clientX - rect.left) * (m.W / rect.width);
    const y = (ev.clientY - rect.top) * (m.H / rect.height);
    if (x < m.ml - 8 || x > m.W - m.mr + 8 ||
        y < m.mt - 8 || y > m.H - m.mb + 8) return hide();
    let best = -1, bd = Infinity;
    m.pts.forEach((p, i) => {
      const d = Math.hypot(p.x - x, p.y - y);
      if (d < bd){ bd = d; best = i; }
    });
    if (best >= 0 && bd <= 30){
      sel = best; const p = m.pts[best];
      readout(p.x, p.y); showTip(p, rect);
    } else {
      sel = -1; ring.style.display = 'none'; tip.classList.remove('on');
      readout(Math.max(m.ml, Math.min(x, m.W - m.mr)),
              Math.max(m.mt, Math.min(y, m.H - m.mb)));
    }
  };

  svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerleave', hide);
  svg.addEventListener('blur', hide);
  // Keyboard reaches the same readout: focus lands on the leftmost name,
  // arrows walk the cross-section. The table below is the full fallback.
  const select = i => {
    sel = (i + m.pts.length) % m.pts.length;
    const p = m.pts[sel];
    readout(p.x, p.y); showTip(p, svg.getBoundingClientRect());
  };
  svg.addEventListener('focus', () => { if (sel < 0 && m.pts.length) select(0); });
  svg.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') return hide();
    if (ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft') return;
    ev.preventDefault();
    select(sel < 0 ? 0 : sel + (ev.key === 'ArrowRight' ? 1 : -1));
  });
}

/* The hover layer. Required rather than optional: an SVG chart in a browser is
   interactive, and the crosshair is how a reader aims at a DATE instead of at a
   2px line. One tooltip lists every series at that x, so the pointer never has
   to land on a particular line to get a number. */
function wireChart(id){
  const wrap = document.getElementById('cw-' + id);
  const m = PAIRV[id];
  if (!wrap || !m) return;
  const svg = wrap.querySelector('svg');
  const xh = wrap.querySelector('.xhair');
  const tip = wrap.querySelector('.viztip');
  let idx = -1;

  const hide = () => { xh.style.display = 'none'; tip.classList.remove('on'); idx = -1; };

  const draw = i => {
    if (i < 0 || i >= m.all.length) return hide();
    idx = i;
    const d = m.all[i];
    const x = m.X(Date.parse(d));
    xh.setAttribute('x1', x); xh.setAttribute('x2', x);
    xh.style.display = '';

    // textContent throughout: entity ids arrive from the API and are untrusted.
    tip.textContent = '';
    const hd = document.createElement('div');
    hd.className = 'd';
    hd.textContent = d;
    tip.appendChild(hd);
    let any = false;
    for (const s of m.series){
      if (!s.byDate.has(d)) continue;
      any = true;
      const row = document.createElement('div'); row.className = 'r';
      const key = document.createElement('i');
      key.style.borderTopColor = inkOf(s.slot);
      const val = document.createElement('b');
      val.textContent = m.fmt(s.byDate.get(d));      // value leads
      const nm = document.createElement('em');
      nm.textContent = s.label;                       // label follows
      row.appendChild(key); row.appendChild(val); row.appendChild(nm);
      const g = s.divByDate && s.divByDate.get(d);
      if (g){
        // Spell out both legs. A marker that only says "divergence here" sends
        // you hunting across the other chart for the half it withheld.
        const dv = document.createElement('span');
        dv.className = 'dv';
        dv.textContent = (g.ds > 0 ? '▲' : '▼') + ' score ' +
          (g.ds > 0 ? '+' : '') + g.ds.toFixed(2) + ' vs price ' +
          (g.ret > 0 ? '+' : '') + g.ret.toFixed(1) + '%';
        row.appendChild(dv);
      }
      tip.appendChild(row);
    }
    if (!any) return hide();

    tip.classList.add('on');
    // Flip before the right edge rather than letting the panel clip it.
    const tw = tip.offsetWidth || 170;
    const left = (x + 14 + tw > m.w) ? x - tw - 14 : x + 14;
    tip.style.left = Math.max(4, left) + 'px';
    tip.style.top = m.MT + 'px';
  };

  const nearest = clientX => {
    const r = svg.getBoundingClientRect();
    if (!r.width) return -1;
    const px = (clientX - r.left) * (m.w / r.width);
    const frac = (px - m.ML) / (m.w - m.ML - m.MR);
    if (frac < -0.03 || frac > 1.03) return -1;
    const ms = m.x0 + Math.min(1, Math.max(0, frac)) * (m.x1 - m.x0);
    let best = -1, bd = Infinity;
    for (let i = 0; i < m.all.length; i++){
      const dd = Math.abs(Date.parse(m.all[i]) - ms);
      if (dd < bd){ bd = dd; best = i; }
    }
    return best;
  };

  svg.addEventListener('pointermove', ev => draw(nearest(ev.clientX)));
  svg.addEventListener('pointerleave', hide);
  svg.addEventListener('blur', hide);
  // Keyboard reaches the same readout. The table below is the full fallback.
  svg.addEventListener('focus', () => draw(idx < 0 ? m.all.length - 1 : idx));
  svg.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowLeft'){ draw(Math.max(0, (idx < 0 ? m.all.length - 1 : idx) - 1)); ev.preventDefault(); }
    else if (ev.key === 'ArrowRight'){ draw(Math.min(m.all.length - 1, (idx < 0 ? 0 : idx) + 1)); ev.preventDefault(); }
    else if (ev.key === 'Escape') hide();
  });
}

function stackControls(tp){
  const pills = ['composite','economics','valuation','mood','guidance'].map(x => {
    const c = tp.coverage[x];
    return `<option value="${x}"${x === P.pillar ? ' selected' : ''}>${x}` +
           ` (${c.dates}d)</option>`;
  }).join('');
  const spans = Object.keys(SPANS).map(x =>
    `<option value="${x}"${x === P.span ? ' selected' : ''}>${x}</option>`).join('');
  const divs = [['0','off'],['10','10 sessions'],['20','20 sessions'],['40','40 sessions']]
    .map(([v, t]) => `<option value="${v}"${+v === P.div ? ' selected' : ''}>${t}</option>`)
    .join('');
  return `<div class="ctl">
    <label>pillar<select id="pp">${pills}</select></label>
    <label>span<select id="pspan">${spans}</select></label>
    <label>divergence<select id="pdiv">${divs}</select></label>
  </div>`;
}

async function loadPair(){
  const tp = await getTape(P.pillar);
  $('#asof').textContent = 'store ' + tp.as_of_max;
  showRefresh(tp);

  /* PER-TONNE MODE IS A PROPERTY OF THE CHART, NOT OF A SERIES, and deciding
     it per entity was a live bug for about ten minutes: apl_apollo's economics
     is a SPREAD Z-SCORE (detail.basis 'spread_z', no tonnage anywhere), so it
     has 0 of 174 per-tonne points, fell through to its 1-5 score, and drew a
     flat line on the rupee axis whose hover read "+2/t". A score rendered as a
     rupee figure is exactly the plausible-wrong-number shape — so the mode is
     decided once here, and a name with no Rs/t is DROPPED from the chart and
     named underneath instead of being silently converted. */
  const perTonne = P.pillar === 'economics' && Object.values(tp.series || {})
    .some(s => (s.points || []).some(q => q.ebitda_per_t != null));

  const cut = spanCut(tp);
  const rows = tp.order.map(eid => {
    const ser = tp.series[eid] || {};
    const pts = (ser.points || []).filter(q => !cut || q.d >= cut);
    const breaks = new Set((tp.corporate_actions[eid] || {}).confirmed
      ? tp.corporate_actions[eid].confirmed.map(c => c.date) : []);
    const acts = ((tp.corporate_actions[eid] || {}).confirmed || [])
      .filter(c => pts.length && c.date >= pts[0].d && c.date <= pts[pts.length - 1].d);
    // On economics the top chart is Rs/t; every other pillar keeps the score.
    // No per-entity fallback — see the perTonne note above.
    const scs = scoreSeries(pts);
    const sc = perTonne ? perTonneSeries(pts) : scs;
    const px = pctSeries(pts, breaks);
    // Aligned on date, because score and close can go missing independently.
    const pmap = new Map(px.map(p => [p.d, p.v]));
    /* DIVERGENCES ARE ALWAYS COMPUTED ON THE SCORE, whatever this chart plots.
       DIV_S is 0.25 ON THE 1-5 SCALE; run it against Rs/t and every single
       session clears a threshold meant to be rare, burying the chart in
       triangles. The marker is then RE-ANCHORED to the plotted series' value
       at that date so it still sits on the line you can see. */
    const al = scs.filter(q => pmap.has(q.d))
                  .map(q => ({d: q.d, s: q.v, p: pmap.get(q.d)}));
    const vmap = new Map(sc.map(q => [q.d, q.v]));
    const divs = (P.div > 0 ? divergences(al, P.div) : [])
      .filter(g => vmap.has(g.d))
      .map(g => Object.assign({}, g, {v: vmap.get(g.d)}));
    const okS = pts.filter(q => q.score != null);
    const first = okS.length ? okS[0] : null, last = okS.length ? okS[okS.length - 1] : null;
    return {
      eid: eid, ser: ser, pts: pts, breaks: breaks, acts: acts,
      slot: slotOf(tp, eid), sc: sc, px: px, divs: divs,
      last: last,
      dS: first && last ? last.score - first.score : null,
      dP: px.length ? px[px.length - 1].v : null,
      n: sc.length
    };
  });

  const drawn = rows.filter(r => r.sc.length > 1 || r.px.length > 1);
  if (!drawn.length){
    /* A ONE-DATE SECTOR IS NOT AN EMPTY SECTOR. A line chart needs two
       points, so a freshly built sector's first days rendered as nothing but
       a "widen the span" hint — the PM's report was "the EMS tab is empty"
       on the very day EMS went live with a full scored cross-section
       sitting behind the chart. Until a second scored date exists there is
       no time dimension to draw, but there IS a cross-section to show, so
       show it: the persisted scores from the newest date, plus a pointer to
       the sub-tab that carries the sector's working content. */
    const latest = rows
      .map(r => {
        const lp = r.pts.length ? r.pts[r.pts.length - 1] : null;
        return lp ? {eid: r.eid, name: r.ser.name, p: lp} : null;
      })
      .filter(Boolean);
    if (latest.length){
      const dmax = latest.map(x => x.p.d).sort().pop();
      const trs = latest.sort((a, b) =>
          (b.p.score == null ? -1 : b.p.score) -
          (a.p.score == null ? -1 : a.p.score)).map(x => `<tr>
        <td class="k">${esc(x.eid)}</td>
        <td>${esc(shortLabel(x.name))}</td>
        <td class="n">${x.p.score == null ? '—' : '<b>' + x.p.score.toFixed(2) + '</b>'}</td>
        <td class="n">${x.p.close == null ? '—' : fmtNum(x.p.close)}</td>
        <td class="k flat">${x.p.withheld
          ? 'withheld: ' + esc(x.p.withheld) : esc(x.p.d)}</td>
      </tr>`).join('');
      $('#s-pair').innerHTML = stackControls(tp) +
        `<h2>${esc(P.pillar)} · latest cross-section · ${esc(dmax)}</h2>
         <p class="note">Not enough history to <b>chart</b> — no name here has
           two scored dates yet; the lines start when the second one lands.
           These are the persisted ${esc(P.pillar)} scores from the newest
           date. This sector's working view is the <b>Prices &amp; Watch</b>
           sub-tab.</p>
         <div class="scroll"><table><thead><tr><th>id</th><th>name</th>
           <th class="n">score</th><th class="n">close</th><th>as of</th>
         </tr></thead><tbody>${trs}</tbody></table></div>`;
      wirePair();
      return;
    }
    $('#s-pair').innerHTML = stackControls(tp) +
      '<p class="note">No name in this sector has two or more points in the ' +
      esc(P.span) + ' span. Widen the span.</p>';
    wirePair();
    return;
  }

  // One shared x domain, so the two charts read as a single timeline.
  const dset = new Set();
  for (const r of drawn){
    for (const p of r.sc) dset.add(p.d);
    for (const p of r.px) dset.add(p.d);
  }
  const all = Array.from(dset).sort();
  const xDom = [Date.parse(all[0]), Date.parse(all[all.length - 1])];
  const xTicks = all.length <= 2 ? all
    : [all[0], all[Math.floor(all.length / 2)], all[all.length - 1]];

  // Price ticks: nice steps that always include 0, over the actual range.
  let lo = 0, hi = 0;
  for (const r of drawn) for (const p of r.px){
    if (p.v < lo) lo = p.v;
    if (p.v > hi) hi = p.v;
  }
  const stepv = niceCeil((Math.max(hi, 0) - Math.min(lo, 0) || 1) / 4);
  const tLo = Math.floor(Math.min(lo, 0) / stepv) * stepv;
  const tHi = Math.ceil(Math.max(hi, 0) / stepv) * stepv;
  const pTicks = [];
  for (let v = tLo; v <= tHi + 1e-9; v += stepv) pTicks.push(+v.toFixed(6));

  const H = 300;
  const mkSeries = (key, withDivs) => drawn.map(r => ({
    label: r.eid, slot: r.slot, pts: r[key],
    divs: withDivs ? r.divs.filter(g => r[key].length > 1) : null
  }));
  const marks = [];
  for (const r of drawn) for (const c of r.acts) marks.push({d: c.date});

  /* The top chart's axis: a FIXED 1-5 for a score, a fitted rupee scale for
     Rs/t. The 1-5 band must stay fixed — a score chart that rescaled to its
     own data would make a quiet week look like a violent one. Rs/t has no
     natural bounds, so it fits, and zero is always on the axis because the
     sign is the whole point (margin widening vs narrowing). */
  let sLo = 1, sHi = 5, sTicks = [1, 2, 3, 4, 5],
      sFmtY = v => String(v), sFmtV = v => v.toFixed(2),
      sLabel = esc(tp.pillar) + ' score 1-5';
  if (perTonne){
    let lo = 0, hi = 0;
    for (const r of drawn) for (const q of r.sc){ if (q.v < lo) lo = q.v; if (q.v > hi) hi = q.v; }
    const step = niceCeil((hi - lo || 1) / 5);
    sLo = Math.floor(lo / step) * step; sHi = Math.ceil(hi / step) * step;
    sTicks = [];
    for (let v = sLo; v <= sHi + 1e-9; v += step) sTicks.push(v);
    sFmtY = v => (v > 0 ? '+' : '') + Math.round(v).toLocaleString('en-IN');
    sFmtV = v => (v >= 0 ? '+' : '') + Math.round(v).toLocaleString('en-IN') + '/t';
    sLabel = 'economics · ₹/tonne of EBITDA change (raw, not scored)';
  }
  const drawScore = availW => lineChart({
    id: 'score', w: availW, h: H, series: mkSeries('sc', true),
    yLo: sLo, yHi: sHi, ticks: sTicks, fmtY: sFmtY, fmtV: sFmtV,
    xDom: xDom, xTicks: xTicks, allDates: all,
    axisLabel: sLabel
  });
  const drawPrice = availW => lineChart({
    id: 'price', w: availW, h: H, series: mkSeries('px', false),
    yLo: tLo, yHi: tHi, ticks: pTicks,
    fmtY: v => (v > 0 ? '+' : '') + v.toFixed(Math.abs(stepv) < 1 ? 1 : 0) + '%',
    fmtV: v => (v >= 0 ? '+' : '') + v.toFixed(1) + '%',
    xDom: xDom, xTicks: xTicks, allDates: all, marks: marks,
    axisLabel: 'price · % change in span'
  });

  /* Name what the Rs/t axis cannot carry, rather than leaving a silent gap in
     the legend. apl_apollo is the standing case: a converter scored on the
     HRC-tube SPREAD, which has no tonnage basis and therefore no Rs/t. */
  const noPerT = perTonne
    ? rows.filter(r => r.sc.length < 2 && r.px.length > 1).map(r => r.eid) : [];
  const nDiv = drawn.reduce((a, r) => a + r.divs.length, 0);
  const legend = '<div class="lgd">' + drawn.map(r =>
    '<span><i style="border-top-color:' + inkOf(r.slot) + '"></i>' + esc(r.eid) +
    '</span>').join('')
    + (P.div > 0 ? '<span class="dvk">\u25b2 score up, price down' +
       '</span><span class="dvk">\u25bc score down, price up</span>' : '')
    + '</div>';

  const tbody = rows.map(r => {
    const late = r.ser.first && tp.coverage[tp.pillar] && tp.coverage[tp.pillar].first
      && r.ser.first > tp.coverage[tp.pillar].first
      ? '<span class="hint"> · from ' + esc(r.ser.first) + '</span>' : '';
    const dpc = r.dP == null ? 'var(--faint)'
      : r.dP > 0 ? 'var(--up)' : r.dP < 0 ? 'var(--down)' : 'var(--faint)';
    return '<tr>' +
      '<td class="k"><i class="swatch" style="border-top-color:' + inkOf(r.slot) + '"></i>' +
        esc(r.eid) + late + '</td>' +
      '<td class="k">' + esc(r.ser.peer_group || '—') + '</td>' +
      '<td class="n"><span class="score">' +
        (r.last && r.last.score != null ? r.last.score.toFixed(2) : '—') + '</span></td>' +
      '<td class="n">' + (r.dS == null ? '—' : (r.dS >= 0 ? '+' : '') + r.dS.toFixed(2)) + '</td>' +
      '<td class="n" style="color:' + dpc + '">' +
        (r.dP == null ? '—' : (r.dP >= 0 ? '+' : '') + r.dP.toFixed(1) + '%') + '</td>' +
      '<td class="n">' + (P.div > 0 ? (r.divs.length || '—') : '—') + '</td>' +
      '<td class="n hint">' + r.n + '</td></tr>';
  }).join('');

  /* A NOTE, NOT A WARNING BANNER, and the reason is that the chart is already
     right. The % line is CHAINED AROUND the mechanical step, so Vedanta's line
     never shows the -64.9% of its 1:1 demerger — it shows the performance with
     that day excluded. This discloses an adjustment that makes the line
     correct; it is not guarding against a misread number, which is what a
     warning is for. It reads as the vertical rule's caption, and the rule stays
     on the chart. */
  const actNote = marks.length
    ? '<p class="note hint">Corporate action in span: ' +
      drawn.filter(r => r.acts.length).map(r => esc(r.eid) + ' ' +
        r.acts.map(c => esc(c.date) + ' (' + c.pct.toFixed(1) + '%, ' + esc(c.why) + ')').join(', ')
      ).join('; ') +
      '. The quoted price steps mechanically there, so no return is carried across '
      + 'that day — the % line is chained around it and the vertical rule marks it. '
      + 'Score is not adjusted; those are the stored values.</p>'
    : '';

  /* THE EXPLANATORY PROSE SITS AT THE BOTTOM, under the table, rather than
     above the charts. It is read once and then never again, and standing
     between the heading and the first data it pushed the numbers down the page
     on every visit.

     THE CORPORATE-ACTION LINE IS DOWN THERE TOO. It was a warn-coloured banner
     at the top on the argument that it changed how the price line must be read.
     That argument was wrong: the line is chained around the step, so it is
     already correct and the text discloses an adjustment rather than warning
     about a number. Vedanta's -64.9% demerger was producing a loud yellow box
     over a chart that had nothing wrong with it. */
  $('#s-pair').innerHTML = stackControls(tp)
    + '<h2>' + esc(tp.pillar) + ' · ' + drawn.length + ' names</h2>'
    + legend
    + '<div class="chart" id="ch-score" style="min-height:' + (H + 24) + 'px"></div>'
    /* THE INDIAMART ASK CHART, cement only, BETWEEN the two (PM, 2026-09-20:
       "below the score graph, above the stock price"). It is a placeholder
       here and filled after the width pass like the other two, and it renders
       nothing at all on every other sector — a dealer-ask panel exists for one
       sector and an empty box on the others would read as a broken query. */
    + (SECTOR === 'cement'
        ? '<div class="chart" id="ch-cement" style="min-height:' + (H + 24) + 'px"></div>'
        : '')
    + '<div class="chart" id="ch-price" style="min-height:' + (H + 24) + 'px"></div>'
    + '<h2>By name</h2>'
    + '<div class="scroll"><table><thead><tr><th>Entity</th><th>Peer group</th>'
    + '<th class="n">Score</th><th class="n">Δ score</th><th class="n">Δ price</th>'
    + '<th class="n">Div</th><th class="n">Pts</th></tr></thead><tbody>' + tbody
    + '</tbody></table></div>'
    + '<h2>Notes</h2>'
    + actNote
    + (noPerT.length
        ? '<p class="note"><b>' + noPerT.map(esc).join(', ') + '</b> '
          + (noPerT.length === 1 ? 'is' : 'are') + ' not on the ₹/t chart: '
          + 'scored on a price SPREAD rather than a margin bridge, so there is no '
          + 'tonnage to divide by. Still on the price chart and in the table below.</p>'
        : '')
    + '<p class="note">Two charts, one measure each. '
    + (perTonne
        ? '<b>Economics</b> is plotted as the RAW <b>₹ per tonne</b> change in '
          + 'EBITDA, not as the 1-5 score (PM, 2026-09-23). The score is unchanged '
          + 'and still drives the table below, the composite and the backtest — '
          + 'it is just a poor <i>picture</i> here, because it anchors 5% of EBITDA '
          + 'at 4.0 and these names spend the strong weeks pinned against the top of '
          + 'the curve, where a 3x spread in the underlying shows as a few tenths. '
          + 'Tonnage basis is the current spec’s, applied across the whole '
          + 'line so one denominator covers every point.'
        : '<b>Score</b> on the fixed 1-5 axis')
    + '; <b>price</b> as % change from the start of the span, which is what '
    + 'lets names on very different price levels share an axis. A name keeps its '
    + 'colour in both. Newest date ' + esc(tp.as_of_max) + '.</p>'
    + (P.div > 0
      ? '<p class="note"><b>' + nDiv + ' divergence' + (nDiv === 1 ? '' : 's') +
        '</b> marked on the ' + (perTonne ? '₹/t' : 'score') + ' line'
        + (perTonne ? ' (still computed on the SCORE — the ±0.25 threshold '
                    + 'is on the 1-5 scale)' : '')
        + ': over ' + P.div + ' sessions the score moved '
        + '\u2265' + DIV_S.toFixed(2) + ' and the price \u2265' + DIV_P.toFixed(0) +
        '% in the <i>opposite</i> direction. One marker per episode, not per '
        + 'session. Hover a marker for both legs.</p>'
      : '')
    + '<p class="note hint">Persisted <code>pillar_scores</code> — not recomputed, '
    + 'and not affected by overrides. The Bridge tab recomputes live and will differ '
    + 'whenever an override is active or <code>run_scores.py</code> has not been re-run.</p>';

  /* TWO-PASS RENDER. The panels go in first, then their real content-box width
     is measured, then the charts are drawn into them.

     Measuring before the panels existed meant estimating the padding inset,
     which was off — and the paths meant to correct it afterwards (rAF and
     ResizeObserver) are both tied to the rendering lifecycle, so in a
     BACKGROUNDED OR HIDDEN TAB neither callback ever runs. Verified: a fresh
     ResizeObserver on this section reported zero callbacks, not even the
     guaranteed initial one. The chart then stayed wider than its box and
     max-width silently rescaled it, shrinking every label with it.

     The placeholders carry the finished height so the page's scrollbar state —
     worth ~15px of width — is already settled when the measurement is taken. */
  const availW = pairWidth();
  document.getElementById('ch-score').innerHTML = drawScore(availW);
  document.getElementById('ch-price').innerHTML = drawPrice(availW);
  if (document.getElementById('ch-cement')) await drawCementAsks(availW, H);
  wirePair();
}

/* The IndiaMART dealer-ask level, one line per region, drawn with the same
   lineChart() as the score and price charts above and below it so the three
   read as one stack.

   THE LINE IS A MEAN, NOT A MEDIAN (PM, 2026-09-20: "why can't you just put
   the average of all bags in a region"). Measured over the first 20 captures
   the mean is both more informative and smoother — south's median is pinned at
   exactly 300 on every single day while its mean moves 308.1-312.8, and
   north's median jumps to 350 where its mean stays inside 336.0-345.5. The
   panel carries only ~100 distinct price points, so a median lands on a round
   number and sits there.

   IT IS NOT A PRICE SERIES AND THE CAPTION SAYS SO on every render: marketplace
   ASKS off promoted listings, never in `prices`, never read by a pillar. The
   Kotak pack is the priced reference and is ~15 days behind, which is the only
   reason this panel exists. */
async function drawCementAsks(availW, H){
  const host = document.getElementById('ch-cement');
  if (!host) return;
  let d;
  try { d = await (await fetch('/api/cement_watch')).json(); }
  catch (e) { host.innerHTML = '<div class="hint">ask panel unavailable</div>'; return; }
  const s = d && d.series;
  if (!s || !s.dates || s.dates.length < 2){
    // A capture panel too short to draw is a real state, not an error: it says
    // so rather than leaving an empty box that reads as a failed fetch.
    host.innerHTML = '<div class="hint">IndiaMART ask panel: '
      + ((s && s.dates ? s.dates.length : 0)) + ' capture(s) — needs 2 to draw</div>';
    return;
  }
  const names = Object.keys(s.regions);
  const series = names.map((r, i) => ({
    label: r, slot: (i % 8) + 1,
    pts: s.dates.map((dt, k) => ({d: dt, v: s.regions[r].mean[k]}))
                .filter(p => p.v != null)
  })).filter(x => x.pts.length > 1);
  if (!series.length){ host.innerHTML = '<div class="hint">no ask levels stored</div>'; return; }

  const vals = series.flatMap(x => x.pts.map(p => p.v));
  const lo = Math.min(...vals), hi = Math.max(...vals);
  // Pad to whole rupees so the ticks are readable numbers, and never a zero
  // span — five flat lines would otherwise divide by zero in lineChart's Y().
  const pad = Math.max((hi - lo) * 0.12, 2);
  const yLo = Math.floor((lo - pad) / 5) * 5, yHi = Math.ceil((hi + pad) / 5) * 5;
  const ticks = [];
  const step = Math.max(Math.round((yHi - yLo) / 5 / 5) * 5, 5);
  for (let v = yLo; v <= yHi + 0.001; v += step) ticks.push(v);

  const xs = s.dates.map(x => Date.parse(x));
  const xDom = [Math.min(...xs), Math.max(...xs)];
  const every = Math.max(1, Math.ceil(s.dates.length / 6));
  const xTicks = s.dates.filter((_, i) => i % every === 0);

  host.innerHTML = '<div class="lgd">' + series.map(x =>
      '<span><i style="border-top-color:' + inkOf(x.slot) + '"></i>' + esc(x.label)
      + '</span>').join('') + '</div>'
    + lineChart({id: 'cementasks', w: availW, h: H, series: series,
        yLo: yLo, yHi: yHi, ticks: ticks, fmtY: v => Math.round(v) + '',
        fmtV: v => '₹' + v.toFixed(1), xDom: xDom, xTicks: xTicks,
        allDates: s.dates,
        /* THE SPAN IS IN THE AXIS LABEL, not only in the note below. This
           chart is sandwiched between two that share a much longer x-domain
           (the score and price charts run the selected span, often months),
           and three stacked charts read as one shared time axis unless told
           otherwise. Capture began 2026-08-28 and nothing before it exists or
           can be backfilled, so the axes genuinely cannot be made to match. */
        axisLabel: 'IndiaMART dealer asks · Rs/bag (mean) · own span '
          + esc(dtick(s.dates[0], false)) + '–'
          + esc(dtick(s.dates[s.dates.length - 1], false))
          + ', shorter than the charts above and below'})
    + '<p class="note">Marketplace <b>asks</b> off IndiaMART’s promoted '
    + 'listings, ~' + (s.regions[names[0]].n.slice(-1)[0] || '?') + '-'
    + Math.max(...names.map(r => s.regions[r].n.slice(-1)[0] || 0))
    + ' listings a region — not transactions, and <b>never in '
    + '<code>prices</code></b>: no pillar reads this. The Kotak pack is the '
    + 'priced reference and runs ~15 days behind, which is the only reason this '
    + 'panel exists. Mean of the per-listing prices, so a listing syndicated '
    + 'across cities counts once. Starts ' + esc(s.dates[0]) + ' — there is '
    + 'no history before capture began and none can be backfilled.</p>';
}

/* ---------------------------------------------------------------------------
   VAHAN MAKER SHARE — the Auto tab, three segments, F&O names as lines.

   ONE VIEW: share of each completed month, 13 months back, with the current
   month drawn as a dotted forecast.

   THE MONTHLY/DAILY TOGGLE IS GONE (PM, 2026-09-24: "there is this ugly blue
   button for toggling at the top, get rid of it"). The daily view it offered
   was share of the running MONTH-TO-DATE, one point per capture — and that is
   a CUMULATIVE average, not a daily rate. Its denominator only grows, so by
   the back half of a month it cannot move much whatever happens: it reads flat
   by construction rather than because share is stable. The monthly chart
   carries the same information better, because its dotted endpoint IS the
   month-to-date re-read every morning — it moves daily without pretending a
   cumulative average is a daily print.

   `/api/auto_share` still returns the `daily` block. It is stored data and
   costs nothing to serve; only the rendering of it went.

   OTHERS IS DRAWN IN GREY AND LAST. It is a residual, not a company, and
   giving it a series colour would put it in the same visual class as the five
   names the PM actually trades. On CV it is the LARGEST line — Tata Motors' CV
   arm left F&O at the 2025-10 demerger — which is the rule applied faithfully
   rather than a missing series, and the per-segment note says so under the
   chart it applies to.
--------------------------------------------------------------------------- */
let AUTOSHARE = null;

const MONTH_IX = {January:0, February:1, March:2, April:3, May:4, June:5,
  July:6, August:7, September:8, October:9, November:10, December:11};
function monthToISO(p){
  const [y, m] = p.split('-');
  return y + '-' + String(MONTH_IX[m] + 1).padStart(2, '0') + '-01';
}

/* THE LIVE MONTH TABLE — month-to-date volume, share, and the YoY move in
   SHARE POINTS, beside each chart.

   YOY IS pp OF SHARE, NOT % OF VOLUME, and that is the whole point of the
   column: a maker can grow volume 20% and still be losing its market, which
   is what a share book cares about. Green is share GAINED.

   THE COMPARATOR IS THE PRIOR-YEAR SAME MONTH, taken from the series' own
   first period — `monthly.periods` holds 13 entries ending at the current
   month, so periods[0] IS September-to-September. It is looked up BY NAME
   rather than by index anyway, because MONTHS_KEPT is a constant somebody will
   change and an index would then compare the wrong two months while still
   printing a plausible number.

   A BASIS MISMATCH IS ACCEPTED AND STATED: this month is month-to-DATE while
   last year's is a completed month. Share is a ratio inside one segment, so it
   barely drifts across a month — measured at ±0.3pp on two-wheelers, worst
   case +0.93pp on Tata PV — but on a column denominated in tenths of a point
   that is not nothing, and the header carries the note. The alternative,
   comparing against last year's same-day month-to-date, is only available for
   the two segments whose shape was harvested, and a column that means
   different things on different charts is worse than one that means one
   slightly imperfect thing everywhere. */
function liveTable(seg, labels){
  const m = seg.monthly, fc = seg.forecast || {};
  if (!m || !m.periods || !m.periods.length) return '';
  const cur = m.periods[m.periods.length - 1];
  const [y, mon] = cur.split('-');
  const prev = (parseInt(y, 10) - 1) + '-' + mon;
  const pi = m.periods.indexOf(prev);
  const ci = m.periods.length - 1;
  const short = mon.slice(0, 3).toUpperCase();
  let rows = '';
  for (const lab of labels){
    const ser = m.series[lab] || [];
    const nowS = ser[ci], prvS = pi >= 0 ? ser[pi] : null;
    const vol = ((fc.by_label || {})[lab] || {}).mtd;
    if (nowS == null && vol == null) continue;
    let yoy = '<td class="n hint">—</td>';
    if (nowS != null && prvS != null){
      const d = nowS - prvS;
      // Exactly 0.00 is neither a gain nor a loss and gets no arrow: a green
      // triangle on a flat share would be a claim the number does not make.
      const col = d > 0.005 ? 'var(--up)' : (d < -0.005 ? 'var(--down)' : 'var(--faint)');
      const arr = d > 0.005 ? '\u25B2 ' : (d < -0.005 ? '\u25BC ' : '');
      yoy = '<td class="n" style="color:' + col + '">' + arr
          + (d >= 0 ? '+' : '') + d.toFixed(2) + 'pp</td>';
    }
    rows += '<tr><td>' + esc(lab) + '</td>'
      + '<td class="n">' + (vol == null ? '—' : vol.toLocaleString('en-IN')) + '</td>'
      + '<td class="n">' + (nowS == null ? '—' : nowS.toFixed(1) + '%') + '</td>'
      + yoy + '</tr>';
  }
  if (!rows) return '';
  return '<div style="flex:1 1 240px;min-width:230px">'
    + '<table style="width:100%"><thead><tr>'
    + '<th>OEM</th><th class="n">LIVE VOL (' + esc(short) + ')</th>'
    + '<th class="n">LIVE SHARE</th>'
    + '<th class="n" title="Change in share against ' + esc(prev)
    + ', in percentage points. This month is month-to-date; last year is a '
    + 'completed month.">YOY (PP)</th>'
    + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
}

/* ---------------------------------------------------------------------------
   CHANNEL INVENTORY — SIAM wholesale minus Vahan retail, monthly, PV and 2W.

   BARS, because each value is a FLOW into or out of dealer stock, not a level:
   green = dispatches ran ahead of registrations (stock BUILT), red = retail
   ran ahead (stock DRAWN). There is deliberately no running total — retail
   counts makers SIAM does not (Ola Electric ~8-16k/month), so each month reads
   slightly low, and a cumulative line would drift ~150k a year into destocking
   that never happened. One bar is 1-2% biased; a sum of thirty would not be.
--------------------------------------------------------------------------- */
function flowBars(months, W, H){
  const ML = 52, MR = 10, MT = 10, MB = 26;
  const pw = W - ML - MR, ph = H - MT - MB;
  const vals = months.map(m => m.net);
  const hi = Math.max(0, ...vals), lo = Math.min(0, ...vals);
  const span = (hi - lo) || 1;
  const Y = v => MT + ph * (hi - v) / span;
  const bw = pw / months.length;
  const k = v => (Math.abs(v) >= 1e6 ? (v / 1e6).toFixed(1) + 'm'
                 : Math.round(v / 1e3) + 'k');
  // Ticks on round numbers either side of zero, so zero is always a gridline.
  const step = Math.pow(10, Math.floor(Math.log10(span / 3)));
  const unit = [1, 2, 5, 10].map(m => m * step).find(u => span / u <= 5) || step * 10;
  let grid = '';
  for (let v = Math.ceil(lo / unit) * unit; v <= hi + 1e-9; v += unit){
    const y = Y(v).toFixed(1);
    grid += '<line x1="' + ML + '" x2="' + (W - MR) + '" y1="' + y + '" y2="' + y
      + '" style="stroke:var(--rule);stroke-width:' + (v === 0 ? 1.2 : .5) + '"/>'
      + '<text class="ax" x="' + (ML - 6) + '" y="' + (+y + 3) + '" text-anchor="end">'
      + (v > 0 ? '+' : '') + k(v) + '</text>';
  }
  let bars = '', xl = '';
  months.forEach((m, i) => {
    const x = ML + i * bw + bw * 0.14, w = bw * 0.72;
    const y0 = Y(Math.max(m.net, 0)), y1 = Y(Math.min(m.net, 0));
    const col = m.net >= 0 ? 'var(--up)' : 'var(--down)';
    bars += '<rect x="' + x.toFixed(1) + '" y="' + y0.toFixed(1) + '" width="'
      + w.toFixed(1) + '" height="' + Math.max(y1 - y0, 1).toFixed(1)
      + '" style="fill:' + col + '"><title>' + esc(m.period) + '\n'
      + 'wholesale ' + m.wholesale.toLocaleString('en-IN') + '\n'
      + 'retail ' + m.retail.toLocaleString('en-IN') + '\n'
      + (m.net >= 0 ? '+' : '') + m.net.toLocaleString('en-IN') + ' into stock'
      + '</title></rect>';
    // A label every third month, always including the last.
    if (i % 3 === 0 || i === months.length - 1){
      const [yy, mm] = m.period.split('-');
      xl += '<text class="ax" x="' + (ML + (i + .5) * bw).toFixed(1) + '" y="' + (H - 8)
        + '" text-anchor="middle">' + esc(mm.slice(0, 3) + " '" + yy.slice(2)) + '</text>';
    }
  });
  return '<svg width="' + W + '" height="' + H + '" role="img">' + grid + bars + xl + '</svg>';
}

function flowTable(months){
  const rows = months.slice(-12).reverse().map(m => {
    const col = m.net >= 0 ? 'var(--up)' : 'var(--down)';
    return '<tr><td>' + esc(m.period) + '</td>'
      + '<td class="n">' + m.wholesale.toLocaleString('en-IN') + '</td>'
      + '<td class="n">' + m.retail.toLocaleString('en-IN') + '</td>'
      + '<td class="n" style="color:' + col + '">' + (m.net >= 0 ? '▲ +' : '▼ ')
      + m.net.toLocaleString('en-IN') + '</td></tr>';
  }).join('');
  return '<table style="width:100%"><thead><tr><th>MONTH</th>'
    + '<th class="n" title="SIAM domestic sales: dispatches to dealers">WHOLESALE</th>'
    + '<th class="n" title="Vahan registrations, all-India">RETAIL</th>'
    + '<th class="n" title="Wholesale minus retail. Retail includes makers SIAM does not '
    + 'cover (Ola Electric; BMW/Mercedes/JLR/Volvo), so this reads slightly low.">INTO STOCK</th>'
    + '</tr></thead><tbody>' + rows + '</tbody></table>';
}

async function drawInventory(_retry){

  if (!host) return;
  let d;
  try { d = await (await fetch('/api/auto_inventory')).json(); }
  catch (e) { host.innerHTML = '<div class="hint">inventory unavailable</div>'; return; }
  if (d.state !== 'live'){
    host.innerHTML = '<div class="hint">' + esc(d.note || d.state) + '</div>'; return;
  }
  const HOSTW = (host.clientWidth || 900) - 8;
  const SIDE = HOSTW >= 820;

  let html = '';
  for (const s of d.segments){
    if (!s.months.length) continue;
    html += '<h3 style="margin-top:var(--s5)" title="Monthly. SIAM publishes wholesale '
      + '~15 days after month end, so the newest bar is last month. Latest: '
      + esc(d.latest) + '.">' + esc(s.label) + '</h3>'
      + '<div style="display:flex;gap:var(--s4);align-items:flex-start;flex-wrap:wrap">'
      + '<div style="flex:0 0 ' + W + 'px;max-width:' + W + 'px;min-width:0">'
      + flowBars(s.months, W, H) + '</div>'
      + '<div style="flex:1 1 240px;min-width:230px">' + flowTable(s.months) + '</div>'
      + '</div>';
  }
  host.innerHTML = html;
  // Same one-shot reconciliation as the share panel: if the first measure was
  // taken before layout settled, redraw once at the real width.

    const real = (host.clientWidth || 0) - 8;
    if (real > 200 && Math.abs(real - HOSTW) > 24) return drawInventory(true);
  }
}

async function drawAutoShare(_retry){
  const host = document.getElementById('autoshare-box');
  if (!host) return;
  let d;
  try { d = await (await fetch('/api/auto_share')).json(); }
  catch (e) { host.innerHTML = '<div class="hint">maker share unavailable</div>'; return; }
  AUTOSHARE = d;
  if (d.state !== 'live'){
    host.innerHTML = '<p class="note hint">' + esc(d.note || 'no Vahan capture yet')
      + '</p>';
    return;
  }
  /* The chart gives up its right-hand third to the live table (PM,
     2026-09-24: "Shrink the graphs a bit from the right and place this table
     next to the graph"). Floor at 380px so the plot never collapses to a
     sliver on a narrow window — below that the two stack instead. */
  /* MEASURE THE SECTION, NOT THE BOX. #autoshare-box reported clientWidth 0
     while its children had real rects, so a fallback of 900 was silently
     driving the layout. The section is always laid out by this point. */
  const sect = document.getElementById('s-sector');
  const HOSTW = (host.clientWidth || (sect && sect.clientWidth) || 900) - 8;
  const SIDE = HOSTW >= 820;
  const W = Math.max(SIDE ? Math.floor(HOSTW * 0.60) : HOSTW, 360), H = 200;
  let html = '';

  /* THE FORECAST IS A DOTTED CONTINUATION OF EACH LINE, not a table
     (PM, 2026-09-24: "just add a dotted line to show forecast, no need for a
     whole table").

     IT ONLY SAYS ANYTHING BECAUSE THE SKEW IS PER MAKER. A segment-wide factor
     cancels out of a share — (mtd/f)/(total/f) = mtd/total — so a forecast
     built on one would reproduce today's share exactly and the dotted line
     would be flat BY CONSTRUCTION, which reads as "share will not move" rather
     than "this chart cannot tell you". The makers do differ: Tata Motors PV
     runs 0.830 against Maruti's 0.912 at the same cut, and that gap is the
     whole forecast. */
  for (const s of d.segments){
    const src = s.monthly;
    const fc0 = s.forecast || {};
    const xs = src.periods.map(monthToISO);
    /* MHCV carries no residual line (PM: "no others in MHCV graph"). The
       shares are still computed against the full segment, so these lines
       deliberately sum to ~89% rather than 100 — dropping the line must not
       silently rebase the rest onto a smaller universe, which would inflate
       every remaining share. */
    const labels = s.fno.map(f => f.label)
                        .concat(s.no_others ? [] : [s.others_label]);
    const series = labels.map((lab, i) => ({
      label: lab,
      // Others takes slot 0 (grey) deliberately — it is a residual, not a name.
      slot: lab === s.others_label ? 0 : (i % 8) + 1,
      pts: xs.map((x, k) => ({d: x, v: (src.series[lab] || [])[k]}))
             .filter(p => p.v != null)
    })).filter(x => x.pts.length > 0);

    /* MONTHLY: the newest point is a PARTIAL month standing beside full ones,
       which flatters or flatters-not depending only on the date. The forecast
       replaces it — solid through the last completed month, dotted to the
       projection. DAILY: the solid line runs to the last capture and the dash
       carries it to month end. Either way the dash spans exactly the interval
       that has not happened yet. */
    const fc = s.forecast || {};
    const fSeries = [];
    if (fc.state === 'live' && fc.by_label){
      for (const x of series){
        const v = (fc.by_label[x.label] || {}).share_pct;
        if (v == null || !x.pts.length) continue;
        const anchor = x.pts[x.pts.length - 2];         // last COMPLETED month
        if (!anchor) continue;
        const endX = x.pts[x.pts.length - 1].d;           // the month being forecast
        fSeries.push({label: x.label + ' (forecast)', slot: x.slot, dash: true,
                      pts: [{d: anchor.d, v: anchor.v}, {d: endX, v: v}]});
      }
      // The partial month is now DRAWN by the dash, so the solid line must stop
      // at the last completed month or the two overlap and the chart shows the
      // same month twice at two different values.
      for (const x of series) if (x.pts.length > 1) x.pts = x.pts.slice(0, -1);
    }
    const drawable = series.filter(x => x.pts.length > 1).concat(fSeries);
    /* THE CAVEATS MOVE ONTO THE HEADING AS title=, THEY DO NOT DISAPPEAR
       (PM, 2026-09-24: "I know how to use the graphs. Get rid of all of this
       text in gray, only the graphs should remain"). Nothing grey renders, but
       the two facts a reader cannot get from the picture stay one hover away:
       what is inside Others — on CV that is TATA MOTORS, the largest maker in
       the segment, which is why its residual line leads — and that these are
       retail REGISTRATIONS rather than the wholesale dispatches a company
       reports. Deleting them outright would leave the CV chart looking simply
       wrong to anyone who had not been told. */
    /* Built with statements, not a nested ternary. The first draft read
         '... fitted on ' + months + dropped.length ? ' (excludes …)' : ''
       and `+` binds tighter than `?:`, so the condition was the whole
       concatenated STRING — always truthy — and the ternary collapsed to just
       the excludes clause, silently discarding the working-day and fitted-on
       text. It rendered a plausible shorter tooltip and raised nothing. */
    let fcTxt = '';
    if (fc0.state === 'live'){
      if (fc0.skew_basis === 'none'){
        fcTxt = 'Forecast: no month harvested at day ' + fc0.asof_day
              + ', so no back-loading is applied.';
      } else {
        fcTxt = 'Forecast: working-day ' + fc0.wd_fraction
              + ' x per-maker skew, fitted on '
              + (fc0.skew_months || []).join(', ');
        const dr = fc0.skew_dropped || [];
        if (dr.length) fcTxt += ' (excludes ' + dr.join('; ') + ')';
        fcTxt += '.';
      }
    }
    const cav = [s.note, fcTxt,
                 'Retail registrations, not wholesale dispatches.'
                ].filter(Boolean).join(' ');
    html += '<h3 style="margin-top:var(--s5)" title="' + esc(cav) + '">'
      + esc(s.label) + '</h3>';
    if (!drawable.length){
      html += '<p class="note hint">not enough points to draw yet</p>';
    } else {
      const vals = drawable.flatMap(x => x.pts.map(p => p.v));
      const allX = drawable.flatMap(x => x.pts.map(p => p.d));
      const lo = Math.min(...vals), hi = Math.max(...vals);
      const pad = Math.max((hi - lo) * 0.12, 1);
      const yLo = Math.max(0, Math.floor((lo - pad) / 5) * 5);
      const yHi = Math.min(100, Math.ceil((hi + pad) / 5) * 5);
      const ticks = [];
      const step = Math.max(Math.round((yHi - yLo) / 5 / 5) * 5, 5);
      for (let v = yLo; v <= yHi + 0.001; v += step) ticks.push(v);
      const ts = [...new Set(allX)].map(x => Date.parse(x));
      const every = Math.max(1, Math.ceil(xs.length / 6));
      /* SOLID SERIES ONLY (PM, 2026-09-24: "remove (forecast). I can see
         colors"). The dashed forecast shares its maker's colour, so listing it
         printed every name twice for no added information. The label itself
         keeps the "(forecast)" suffix — it is what the HOVER reads out, and
         there the distinction is the whole point, since a dashed and a solid
         point can sit on the same date. */
      html += '<div style="display:flex;gap:var(--s4);align-items:flex-start;'
        + 'flex-wrap:wrap">'
        /* PINNED TO W. flex:0 0 auto sizes the pane to its WIDEST child, and
           that is the legend, not the plot — 649px against a 567px chart,
           which pushed the table past the wrap point and under the graph. */
        + '<div style="flex:0 0 ' + W + 'px;max-width:' + W + 'px;min-width:0">'
        + '<div class="lgd">' + drawable.filter(x => !x.dash).map(x =>
          '<span><i style="border-top-color:' + inkOf(x.slot) + '"></i>'
          + esc(x.label) + '</span>').join('') + '</div>'
        + lineChart({id: 'aut' + s.id, w: W, h: H, series: drawable,
            yLo: yLo, yHi: yHi, ticks: ticks,
            fmtY: v => v + '%', fmtV: v => v.toFixed(2) + '%',
            xDom: [Math.min(...ts), Math.max(...ts)],
            /* The dash ends at month end, so month end must be a TICK.
               Without it the projection trails off to the right of the last
               labelled date and the reader cannot see where it lands — the
               axis would silently disagree with the line. */
            xTicks: [...new Set(xs.filter((_, i) => i % every === 0)
                       .concat(fSeries.length ? [fSeries[0].pts[1].d] : []))],
            allDates: [...new Set(allX)],
            axisLabel: 'share of each completed month · ' + esc(src.current)
              + ' is the dotted forecast'})
        + '</div>' + liveTable(s, labels) + '</div>';
    }
  }

  host.innerHTML = html;

  /* ONE RECONCILIATION PASS, the same problem loadPair() already solves.
     The first draw can land while #s-sector is still hidden, where
     clientWidth is 0 — measured here: the whole document reported width 0 and
     W fell back to 892, rendering a 535px chart beside an 826px table on a
     1377px panel. Re-measure after paint and redraw ONCE if the real width
     differs materially. `_retry` guards it: a redraw that measured wrong again
     would otherwise loop forever. */
  if (!_retry){
    const real = (host.clientWidth || 0) - 8;
    if (real > 200 && Math.abs(real - HOSTW) > 24) return drawAutoShare(true);
  }

  for (const s of d.segments){
    if (document.getElementById('cw-aut' + s.id)) wireChart('aut' + s.id);
  }
}

let PAIR_RO = null, PAIR_W = 0, PAIR_BUSY = false, PAIR_FIX = 0;

function pairWidth(){
  // Authoritative: the content box of the panel the svg actually sits in.
  const c = document.querySelector('#s-pair .chart');
  if (c){
    const cs = getComputedStyle(c);
    const inner = c.clientWidth - parseFloat(cs.paddingLeft || 0)
                                - parseFloat(cs.paddingRight || 0);
    if (inner > 200) return Math.max(Math.floor(inner), 520);
  }
  // First render only — no panel exists yet, so estimate and let the
  // post-paint reconciliation correct it.
  return Math.max(($('#s-pair').clientWidth || 900) - 34, 520);
}
const rerenderPair = () => {
  PAIR_BUSY = true;
  return loadPair().catch(e => showErr(e.message)).then(() => { PAIR_BUSY = false; });
};

function wirePair(){
  const go = () => loadPair().catch(e => showErr(e.message));
  const pp = $('#pp');
  if (pp) pp.onchange = () => { P.pillar = pp.value; go(); };
  const sp = $('#pspan');
  if (sp) sp.onchange = () => { P.span = sp.value; go(); };
  const dv = $('#pdiv');
  if (dv) dv.onchange = () => { P.div = +dv.value; go(); };
  wireChart('score');
  wireChart('price');
  // Guarded rather than unconditional: wireChart on an id that was not drawn
  // would bind a hover layer to nothing on every non-cement sector.
  if (document.getElementById('cw-cementasks')) wireChart('cementasks');

  /* Belt and braces, NOT the mechanism — loadPair now measures the panel
     directly (see the two-pass note there). This only catches a width that
     moves after paint, e.g. a late webfont reflow. It is also the one path
     that cannot be relied on: rAF does not fire in a hidden tab. PAIR_FIX
     caps it at two passes so a width oscillating between two scrollbar
     states cannot loop. */
  requestAnimationFrame(() => {
    const svg = document.querySelector('#cw-score svg');
    if (!svg || PAIR_BUSY) return;
    if (Math.abs(pairWidth() - (+svg.getAttribute('width'))) < 6){ PAIR_FIX = 0; return; }
    if (PAIR_FIX >= 2) return;
    PAIR_FIX++;
    PAIR_W = $('#s-pair').clientWidth;
    rerenderPair();
  });

  /* Charts are sized in pixels, so a width change needs a re-render. This also
     covers the case where the section was laid out at zero width — the first
     observation then draws at the real width. Guarded on a 16px delta and a
     re-entrancy flag: the render itself must not be able to retrigger it. */
  if (!PAIR_RO && typeof ResizeObserver !== 'undefined'){
    PAIR_RO = new ResizeObserver(es => {
      const w = es[0].contentRect.width;
      /* 6px, not 16: the common case is the section losing ~15px when content
         grows a scrollbar, and a threshold above that left the chart rendered
         wider than its container, where max-width silently rescaled it. */
      if (PAIR_BUSY || Math.abs(w - PAIR_W) < 6) return;
      PAIR_W = w;
      if (!$('#s-pair').classList.contains('on')) return;
      PAIR_FIX = 0;          // a real resize earns a fresh reconciliation pass
      rerenderPair();
    });
    PAIR_RO.observe($('#s-pair'));
  }
}
let SECTORS = [];
let SECTOR = 'overview';
let LAST_VIEW = 'pair';

/* The pack column notes carry the provenance argument as well as the name --
   "the steel group's ONLY coking coal source. FRED PCOKEUSDM is a dead 404..."
   -- which belongs in a tooltip, not in a table cell. Keep the part before the
   first em-dash and hand the rest to title=. */
function shortLabel(t){
  if (!t) return '';
  const head = String(t).split('—')[0].trim();
  return head.length > 3 ? head : String(t).slice(0, 60);
}

function fmtNum(v){
  if (v == null) return '—';
  const a = Math.abs(v);
  return v.toLocaleString(undefined,
    {minimumFractionDigits: a >= 1000 ? 0 : 2, maximumFractionDigits: a >= 1000 ? 0 : 2});
}

async function loadSectorNav(){
  SECTORS = await (await fetch('/api/nav')).json();
  $('#snav').innerHTML = SECTORS.map(s =>
    // "prices only", not "no spec": the chip describes what the TAB HOLDS, not
    // what the sector lacks. "No spec" read as "this tab is empty" once cement
    // gained a chart and a watch — the tab shows prices; it just scores nothing.
    `<button class="stab" role="tab" data-s="${esc(s.id)}"
       aria-selected="${s.id === SECTOR}">${esc(s.label)}${
       s.kind === 'sector' && !s.live ? '<span class="n">prices only</span>' :
       s.kind === 'flows' && !s.live ? '<span class="n">scoped</span>' : ''}</button>`).join('');
  document.querySelectorAll('.stab').forEach(b =>
    b.addEventListener('click', () => sector(b.dataset.s)));
}

/* Three kinds of top-level tab, and only `sector` has sub-views. Overview and
   Flows are their own single views, so the Pair/Bridge/Positioning bar is
   hidden for them — leaving it up would imply it did something. */
function sector(id){
  SECTOR = id;
  document.querySelectorAll('.stab').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.s === id)));
  const e = SECTORS.find(s => s.id === id) || {};
  showErr('');
  if (e.kind === 'overview'){ $('#vnav').hidden = true; tab('overview'); return; }
  if (e.kind === 'book'){ $('#vnav').hidden = true; tab('book'); return; }
  if (e.kind === 'flows'){ $('#vnav').hidden = true; tab('flows'); return; }
  // Results (PM 2026-09-22, "in the end"): its own sector/company picker, so
  // the sector sub-view bar is hidden like the other run-level tabs.
  if (e.kind === 'results'){ $('#vnav').hidden = true; tab('results'); return; }
  // The Prices & Watch sub-view exists only where the sector declares content
  // for it (nav carries has_chart/has_watch). If the remembered view was
  // 'sector' and this sector has no such tab, fall back to the pair view
  // rather than showing a hidden section.
  const extra = !!(e.has_chart || e.has_watch || e.has_estimates);
  // Company historical analysis is a sub-view of the SECTOR (PM 2026-09-16),
  // shown only where the sector has a dossier. A sector that scores nothing
  // (IT) used to hide the whole bar and render its panel directly; once it
  // carries a dossier the bar has to show, with the scoring tabs hidden and
  // the panel reachable as Prices & Watch.
  const hasCo = !!e.has_company;
  $('#vnav').hidden = !e.live && !hasCo;
  document.querySelectorAll('#vnav .tab[data-t="pair"], #vnav .tab[data-t="scores"], '
    + '#vnav .tab[data-t="pos"]').forEach(b => { b.hidden = !e.live; });
  const vt = document.getElementById('vtab-sector');
  if (vt) vt.hidden = e.live ? !extra : !hasCo;
  const vc = document.getElementById('vtab-company');
  if (vc) vc.hidden = !hasCo;
  const vi = document.getElementById('vtab-inventory');
  if (vi) vi.hidden = (SECTOR !== 'auto');
  let want = LAST_VIEW;
  if (want === 'sector' && !extra) want = 'pair';
  if (want === 'company' && !hasCo) want = 'pair';
  if (want === 'inventory' && SECTOR !== 'auto') want = 'pair';
  if (e.live){ tab(want); }
  else {
    tab(LAST_VIEW === 'company' && hasCo ? 'company'
        : (LAST_VIEW === 'inventory' && SECTOR === 'auto') ? 'inventory' : 'sector');
  }
}

/* The morning brief halves. Everything here is READ from the two dated files
   under data/morning/ via /api/morning — the page never fetches a market or
   a mailbox itself:
     markets_*.json   python (morning_markets.py), runs unattended
     brief_*.json     the morning-brief skill — agent-only, because the M365
                      MCP is callable by the agent and never by a process
   Layout is the PM's 2026-08-30 instruction, copied from the vault
   dashboard: OVERNIGHT AT THE TOP (an accent callout), BROKER MAIL AT THE
   BOTTOM, and staleness as a quiet meta-line — never a yellow box. A missing
   or yesterday's half still renders AS TEXT, not as silence: yesterday's
   bullets reading as this morning's is the refresh-light failure. */
function pctSpan(v){
  return v == null ? '<span class="neu">—</span>'
    : `<span class="${v > 0 ? 'pos' : v < 0 ? 'neg' : 'neu'}">${
        (v >= 0 ? '+' : '') + v.toFixed(2)}%</span>`;
}

function overnightHtml(m){
  if (!m || m.error) return `<div class="callout">
    <div class="callout-head"><span class="ico">🌍</span>
      <span class="t">Overnight · global</span></div>
    <div class="hint">unavailable: ${esc(m && m.error || 'no response')}</div></div>`;

  const mk = m.markets || {};
  const q = mk.quotes || {};
  const g = (m.brief || {}).global || {};

  const groupLine = rows => (rows || []).map(x =>
    `${esc(x.label)} <span class="mono">${fmtNum(x.close)}</span> ${pctSpan(x.chg_pct)}`)
    .join(' &nbsp;·&nbsp; ');

  const reasonFor = (name, key) => {
    const b = (g.bellwethers || []).find(x =>
      (x.name || '').toLowerCase().startsWith(name.toLowerCase()));
    if (b && b.reason) return esc(b.reason);
    const h = ((mk.news || {})[key] || [])[0];
    return h ? `${esc(h.title)} <span class="hint">[${esc(h.publisher)}]</span>`
             : '<span class="hint">no on-entity headline — no signal, not "no move"</span>';
  };

  const usDate = (q.us || [])[0] ? (q.us || [])[0].date : null;
  const gn = mk.gift_nifty || {};
  const gnLi = 'last' in gn
    ? `<li><b>GIFT Nifty</b> <span class="mono">${fmtNum(gn.last)}</span> ${pctSpan(gn.chg_pct)}${
        gn.gap_pts != null ? ` — <b class="${gn.gap_pts >= 0 ? 'pos' : 'neg'}">${
        gn.gap_pts >= 0 ? '+' : ''}${gn.gap_pts} pts</b> (${
        (gn.gap_pct >= 0 ? '+' : '') + gn.gap_pct}%) vs Nifty close <span class="mono">${
        fmtNum((gn.nifty_close || {}).close)}</span>` : ''}
        <span class="src">${esc(gn.stamp || '')} IST · ${esc(gn.expiry || '')} · ${
        gn.volume || 0} lots</span></li>`
    : `<li><b>GIFT Nifty</b> <span class="hint">unavailable: ${esc(gn.error || 'no file')}</span></li>`;

  const acn = (q.it || []).find(x => x.symbol === 'ACN');
  const ctsh = (q.it || []).find(x => x.symbol === 'CTSH');
  const bw = (x, name, key) => x
    ? `<li><b>${esc(name)}</b> <span class="mono">${fmtNum(x.close)}</span> ${
        pctSpan(x.chg_pct)} — ${reasonFor(name, key)}</li>`
    : `<li><b>${esc(name)}</b> <span class="hint">no quote</span></li>`;

  const aiLis = (g.ai_semis || []).map(x => `<li>${esc(x.text || x)}${
      x.source ? `<span class="src">${esc(x.source)}</span>` : ''}</li>`).join('');

  if (!mk.date) return `<div class="callout">
    <div class="callout-head"><span class="ico">🌍</span>
      <span class="t">Overnight · global</span></div>
    <div class="hint">no markets file — <code>python packages/adapters/morning_markets.py</code></div></div>`;

  return `<div class="callout">
    <div class="callout-head"><span class="ico">🌍</span>
      <span class="t">Overnight · global</span>
      <span class="right">US close ${esc(usDate || '—')} · fetched ${
        esc((mk.fetched_at || '').replace('T', ' ').slice(0, 16))}</span></div>
    <ul class="plist">
      <li><b>US</b> &nbsp;${groupLine(q.us)}</li>
      <li><b>Semis</b> &nbsp;${groupLine(q.semis)}</li>
      ${gnLi}
      ${bw(acn, 'Accenture', 'ACN')}
      ${bw(ctsh, 'Cognizant', 'CTSH')}
      ${aiLis}
    </ul>
    ${(mk.errors || []).length
      ? `<div class="hint">${mk.errors.map(esc).join('<br>')}</div>` : ''}
  </div>`;
}

function mailHtml(m){
  const mail = ((m || {}).brief || {}).mail || null;
  if (!mail) return `<div class="sechead">Broker mail · last 24h</div>
    <div class="panel"><div class="hint">no brief yet — run the
    <b>morning-brief</b> skill (agent-only: the mailbox is behind the M365
    MCP)</div></div>`;

  /* A bullet whose mail already appeared in an earlier brief carries
     `seen_on` (stamped server-side by engine._mark_repeated_bullets — the
     24h sweep windows overlap day to day, so repeats are structural, not an
     agent mistake). It renders greyed with a tag: marked, never dropped
     (PM, 2026-09-08). Fresh bullets count in the header; stale ride below. */
  /* The bullet is the whole collapsed line and it is UNCHANGED by the
     expansion (PM, 2026-09-18) — one sentence, source, seen-tag. `detail`
     only adds a drawer beneath it; a brief whose bullets grew because a
     drawer exists has lost the reason the drawer was added. */
  const bullet = b => {
    const stale = !!b.seen_on;
    const line = `${esc(b.text)}
      <span class="src">${esc(b.source || '')}${
        b.received ? ' · ' + esc(b.received) : ''}</span>${
      stale ? `<span class="seentag" title="this mail was already bulleted in
        the ${esc(b.seen_on)} brief — repeated because the 24h sweep windows
        overlap">↺ seen ${esc(b.seen_on)}</span>` : ''}`;
    const d = b.detail || null;
    const pts = d && Array.isArray(d.points)
      ? d.points.filter(x => x != null && String(x).trim() !== '') : [];
    // No summary AND no points is not a drawer. Older briefs (pre-2026-09-18)
    // carry no `detail` at all and land here too, which is why the flat
    // branch is the fallback rather than an error.
    if (!d || (!d.summary && !pts.length))
      return `<li${stale ? ' class="seenmail"' : ''}>${line}</li>`;
    return `<li class="mailx${stale ? ' seenmail' : ''}"><details>
      <summary>${esc(b.text)}<span class="mailcar">▸</span>
        <span class="src">${esc(b.source || '')}${
          b.received ? ' · ' + esc(b.received) : ''}</span>${
        stale ? `<span class="seentag" title="this mail was already bulleted in
          the ${esc(b.seen_on)} brief — repeated because the 24h sweep windows
          overlap">↺ seen ${esc(b.seen_on)}</span>` : ''}</summary>
      <div class="maildet">${
        d.summary ? `<p>${esc(d.summary)}</p>` : ''}${
        pts.length ? `<ul>${pts.map(x =>
          `<li>${esc(String(x))}</li>`).join('')}</ul>` : ''}${
        /* Provenance, not decoration: a drawer built off the ~250-char
           preview is a different claim from one built off the note. The
           skill writes read:"snippet" when read_resource did not return
           the body, and the page says so rather than letting the two
           look alike. */
        d.read === 'snippet' ? `<div class="snip">from the mail preview
          snippet — full body not read</div>` : ''}</div></details></li>`;
  };
  const secBlocks = (mail.sectors || []).map(s => {
    const bs = s.bullets || [];
    const nStale = bs.filter(b => b.seen_on).length;
    return `
    <div class="panel">
      <div class="callout-head"><span class="t">${esc(s.sector)}</span>
        <span class="right">${bs.length - nStale} actionable${
          nStale ? ` <span class="neu">+ ${nStale} seen before</span>` : ''}</span></div>
      <ul class="plist">${
        [...bs.filter(b => !b.seen_on), ...bs.filter(b => b.seen_on)]
          .map(bullet).join('')
        || '<li class="hint">nothing actionable</li>'}</ul>
    </div>`;
  }).join('');

  return `<div class="sechead">Broker mail · ${esc(mail.window || 'last 24h')}
      <span class="neu" style="font-weight:400;font-size:12px">(${
        mail.n_scanned != null ? mail.n_scanned + ' mails scanned' : '—'})</span></div>
    ${secBlocks || '<div class="panel"><div class="hint">no sector bullets</div></div>'}
    ${(mail.quiet || []).length ? `<div class="hint" style="margin-top:4px">Quiet —
      nothing actionable: ${mail.quiet.map(esc).join(' · ')}</div>` : ''}`;
}

/* ===================== daily overview =====================
   The first screen. Layout per the PM 2026-08-30, copied from the vault
   dashboard's Daily Overview: title + meta-line, overnight callout on top,
   tiles, run health, stale feeds, what moved, broker mail at the bottom.
   THE BOOK LIVES IN ITS OWN TAB NOW, and there are deliberately NO warning
   banner boxes here — staleness and placeholder facts ride as quiet text
   (meta-line, hints) or in the Book tab, per the PM's explicit instruction.
   Everything is still read from what the run WROTE, never recomputed. */
async function loadOverview(){
  const d = await (await fetch('/api/overview')).json();
  if (d.error) throw new Error(d.error);

  /* Side signals are fetched separately and NEVER allowed to break the tab —
     catch -> a state the section knows how to say out loud. */
  const cw = await fetch('/api/cement_watch').then(r => r.json())
      .catch(e => ({state:'error', regions:[], alerts:[], note:String(e)}));
  window.__CEMENT_WATCH__ = cw;
  const morn = await fetch('/api/morning').then(r => r.json())
      .catch(e => ({error:String(e)}));

  const run = d.run || {};
  const feeds = d.feeds || {};
  const fe = d.frontend || {};
  /* NO TILES, NO RUN PANEL, NO STALE-FEEDS SECTION — PM instructions,
     2026-08-31: "just warn me if something isn't executed." So this tab is
     EXCEPTION-ONLY on plumbing: a healthy run renders nothing at all about
     itself, and anything unhealthy becomes one amber line under the title —
     failed steps by name, stale feeds by name and age, route problems, a
     yesterday's-run or yesterday's-brief date. The full step-by-step record
     still exists (data/refresh/status.json and the refresh transcript); this
     page just stops re-printing it when it is green. */
  const metaBits = [
    esc(d.as_of || ''),
    `last refresh ${esc(run.day || 'never')}${run.finished
      ? ' ' + esc(run.finished.replace('T', ' ').slice(11, 19)) : ''}`,
    `scores as of ${esc(d.as_of_scores || '—')}`,
  ];

  const badSteps = (run.steps || []).filter(x =>
    x.status !== 'ok' && x.status !== 'skipped' && x.status !== 'background');
  const staleList = (feeds.stale || []).slice(0, 4).map(x =>
    `${x.series} (${x.age})`).join(', ')
    + ((feeds.stale || []).length > 4
       ? ` +${feeds.stale.length - 4} more` : '');
  const warnItems = [
    run.warning,      // covers both "yesterday's run" and "no status.json ever"
    badSteps.length ? `step${badSteps.length > 1 ? 's' : ''} FAILED: `
      + badSteps.map(x => `${x.step}${x.detail ? ' — ' + x.detail : ''}`).join('; ')
      : null,
    feeds.n_stale ? `${feeds.n_stale} feed(s) stale: ${staleList}` : null,
    ...(fe.problems || []),
    ...(morn && morn.warnings || []),
  ].filter(Boolean);
  const warnLine = warnItems.length
    ? `<div class="hint" style="color:var(--warn);margin:0 0 12px">⚠ ${
        warnItems.map(esc).join('<br>⚠ ')}</div>`
    : '';

  /* CEMENT WATCH — a live multi-region move is a real signal and keeps its
     callout; `calibrating` stays one quiet line (an absent banner would read
     as "no move", the one thing it does not mean); errors are one hint. */
  const cwRow = r => `${esc(r.region)} ${r.matched_pct == null ? '—'
      : (r.matched_pct >= 0 ? '+' : '') + r.matched_pct.toFixed(2) + '%'}` +
      `<span class="hint"> (${r.n_matched == null ? 'first capture'
        : r.n_matched + ' matched'})</span>`;
  const cwHtml =
    cw.state === 'live' && cw.alerts.length
      ? `<div class="callout accent-amber"><div class="callout-head">
           <span class="ico">🚨</span><span class="t">Cement watch</span></div>
         ${cw.alerts.map(a => `<b>CEMENT ${esc(a.direction)} —
           ${esc(a.regions.join(', '))}</b><br>${esc(a.text)}<br>
           <span class="hint">${cw.regions.map(cwRow).join(' · ')}</span>`)
           .join('<hr style="border:0;border-top:1px solid var(--rule);margin:8px 0">')}</div>`
    : cw.state === 'calibrating'
      ? `<div class="hint" style="margin-bottom:10px">Cement watch (IndiaMART
         asks, ${esc(cw.day || '—')}): <b>calibrating</b> — ${cw.n_days}
         capture${cw.n_days === 1 ? '' : 's'}, ${cw.days_to_calibrate} more
         before alerts arm. ${cw.regions.map(cwRow).join(' · ')}</div>`
    : cw.state === 'error'
      ? `<div class="hint" style="margin-bottom:10px;color:var(--warn)">Cement
         watch unavailable: ${esc(cw.note || '')}</div>`
    : '';

  /* Each row expands into a 2y price chart on click — the OI-row grammar
     (PM, 2026-09-08). Unpriced rows have nothing to chart and stay inert. */
  const moverRows = (d.movers || []).map(m =>
    `<tr${m.last == null ? '' : ` class="mvrow" data-id="${esc(m.id)}"
        aria-expanded="false" title="price vs time chart"`}>
      <td class="k">${esc(m.id)}${m.last == null ? ''
        : ' <span class="oicaret" aria-hidden="true">▸</span>'}</td>
      <td class="n">${fmtNum(m.last)}</td>
      ${m.chg_pct == null
        ? '<td class="n flat">flat 30d+</td>'
        : `<td class="n ${m.chg_pct > 0 ? 'pos' : m.chg_pct < 0 ? 'neg' : 'neu'}">${
             (m.chg_pct >= 0 ? '+' : '') + m.chg_pct.toFixed(2)}%</td>`}
      <td class="k">${esc(m.date || '—')}</td>
      <td class="k flat">${esc(m.source || '—')}</td>
      <td class="k flat">${m.moved_on ? 'carried since ' + esc(m.moved_on) : 'moved today'}</td>
    </tr>`).join('');

  $('#s-overview').innerHTML =
    `<div class="pgt">Daily Overview</div>
     <div class="meta-line">${metaBits.join(' · ')}</div>`
    + warnLine
    + overnightHtml(morn)
    + cwHtml
    + mailHtml(morn)
    /* What-moved BELOW the mail, per the PM 2026-08-31: read the morning's
       words first, then the tape that should corroborate them. */
    + `<div class="sechead">What moved · modelled inputs only</div>
       <div class="panel"><p class="note" style="margin-top:0">Only series a spec
         <code>price_link</code>s — the parked columns drive nothing, so they are
         not here. Change is against the last close that actually <b>differed</b>.</p>
       <p class="note">Click a series for its price-vs-time chart (last two
         years), same as the OI rows.</p>
       <div class="scroll"><table><thead><tr><th>series</th><th class="n">last</th>
         <th class="n">last real move</th><th>as of</th><th>source</th><th>state</th>
       </tr></thead><tbody>${moverRows}</tbody></table></div></div>`;

  // Property assignment, not addEventListener — loadOverview re-renders this
  // section wholesale on every visit (same reasoning as the Positioning tab).
  $('#s-overview').onclick = ev => {
    const tr = ev.target.closest('tr.mvrow');
    if (tr) toggleMvRow(tr);
  };
}

/* INPUT PRICE CHART — the what-moved rows expand inline into a single-series
   price line, the Positioning tab's click-to-expand grammar reused verbatim
   (PM, 2026-09-08). One axis: unlike the OI chart there is no second quantity
   to overlay. The axis does not start at zero — a commodity's daily range is
   a few percent of its level, and a zero base flattens every move the table
   exists to show. The caption names the SOURCE MIX, because a shock whose
   endpoints have different sources (pack -> westmetall etc.) is worth
   checking before trusting — the lme_aluminium lesson. */
const MVH = {};   // entity_id -> /api/input_history payload, fetched once

async function toggleMvRow(tr){
  const eid = tr.dataset.id;
  const open = tr.nextElementSibling;
  if (open && open.classList.contains('oich')){
    open.remove();
