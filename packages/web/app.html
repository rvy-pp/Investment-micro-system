/* ================= F2: the OI bubble tape =================
   Data from /api/oi_bubbles (memoised server-side), fetched once per page
   life. Fixed circle packing at each sector's yearly max radius, so a bubble
   inflates/deflates IN PLACE — repacking per day would read as movement. */
/* No autoplay by the PM's instruction (2026-09-04) — prev/next steppers and
   the slider, the same date-toggle grammar as the IT tab's consensus replay. */
let BUB = null, bubT = 0, bubMode = 'abs';
const BW = 1000, BH = 470, BRMAX = 108;

async function initBubbles(){
  if (!document.querySelector('#bubcv')) return;
  if (!BUB){
    try { BUB = await (await fetch('/api/oi_bubbles')).json(); }
    catch (e) { BUB = {error: String(e)}; }
    if (BUB.error){
      $('#f2panel').innerHTML = `<p class="note">F2 has no data: ${esc(BUB.error)}</p>`;
      BUB = null; return;
    }
    const N = BUB.dates.length;
    for (const s of BUB.sectors){
      const a = s.flw.map(Math.abs).sort((x, y) => x - y);
      s.fsig = a[Math.floor(a.length * 0.68)] || 1;
      s.maxl = Math.max(...s.lvl);
    }
    BUB.LVLMAX = Math.max(...BUB.sectors.map(s => s.maxl));
    BUB.TOTMAX = Math.max(...BUB.total);
    // expiry-roll days: total daily flow deeply negative on a robust scale
    const tf = BUB.dates.map((_, i) =>
      BUB.sectors.reduce((a, s) => a + s.flw[i], 0));
    const srt = [...tf].sort((a, b) => a - b);
    const med = srt[Math.floor(srt.length / 2)];
    const mad = [...tf.map(v => Math.abs(v - med))].sort((a, b) => a - b)
                [Math.floor(tf.length / 2)] || 1;
    BUB.totflw = tf;
    BUB.isExpiry = tf.map(v => (v - med) / (1.4826 * mad) < -4);
    // pack once, biggest first, spiral placement collision-checked at max radii
    const placed = [];
    for (const s of BUB.sectors){
      const R = Math.max(7, Math.sqrt(s.maxl / BUB.LVLMAX) * BRMAX);
      if (!placed.length){ s.x = BW * 0.40; s.y = BH * 0.52; s.R = R; placed.push(s); continue; }
      let best = null;
      for (let a = 0; a < Math.PI * 28 && !best; a += 0.22){
        const rad = 36 + a * 9.5;
        const x = BW * 0.40 + Math.cos(a) * rad * 1.30, y = BH * 0.52 + Math.sin(a) * rad * 0.74;
        if (x - R < 6 || x + R > BW - 6 || y - R < 6 || y + R > BH - 6) continue;
        if (placed.every(p => Math.hypot(x - p.x, y - p.y) > R + p.R + 5)) best = {x, y};
      }
      if (!best) best = {x: BW - 140, y: 50 + placed.length * 16};
      s.x = best.x; s.y = best.y; s.R = R; placed.push(s);
    }
    bubT = N - 1;
  }
  // the tab's DOM is rebuilt on every visit — listeners must re-attach even
  // when the data is already cached (the fetch above runs once per page life)
  $('#bubseek').max = BUB.dates.length - 1;
  wireBubbles();
  drawBubbles();
}

function bubLerp(arr, t){
  const N = arr.length, i = Math.floor(t), f = t - i;
  return i >= N - 1 ? arr[N - 1] : arr[i] * (1 - f) + arr[i + 1] * f;
}
function bubR(s, t){
  const scale = bubMode === 'share' ? BUB.TOTMAX / bubLerp(BUB.total, t) : 1;
  return Math.max(3, Math.sqrt(bubLerp(s.lvl, t) * scale / BUB.LVLMAX) * BRMAX);
}
const bubFmt = v => Math.round(v).toLocaleString('en-IN');

function drawBubbles(){
  const cv = $('#bubcv'); if (!cv || !BUB) return;
  const ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, k = w / BW;
  cv.width = w * dpr; cv.height = BH * k * dpr;
  ctx.setTransform(dpr * k, 0, 0, dpr * k, 0, 0);
  ctx.clearRect(0, 0, BW, BH);
  const di = Math.round(bubT);
  for (const s of BUB.sectors){
    const r = bubR(s, bubT);
    const z = s.flw[di] / s.fsig, a = Math.min(Math.abs(z) / 2.5, 1);
    ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 7);
    ctx.fillStyle = Math.abs(z) < 0.35 ? 'rgba(48,54,61,.55)'
      : z > 0 ? `rgba(63,185,80,${(0.13 + a * 0.5).toFixed(3)})`
              : `rgba(248,81,73,${(0.13 + a * 0.5).toFixed(3)})`;
    ctx.fill();
    ctx.strokeStyle = 'rgba(230,237,243,.26)'; ctx.lineWidth = 1; ctx.stroke();
    if (r > 16){
      ctx.fillStyle = '#e6edf3'; ctx.textAlign = 'center';
      ctx.font = `600 ${Math.max(10, Math.min(14, r / 4.4))}px system-ui,sans-serif`;
      ctx.fillText(s.short, s.x, s.y - 1);
      ctx.fillStyle = '#8b949e';
      ctx.font = `${Math.max(9, Math.min(11, r / 5))}px ui-monospace,monospace`;
      ctx.fillText((100 * bubLerp(s.lvl, bubT) / bubLerp(BUB.total, bubT)).toFixed(1) + '%',
                   s.x, s.y + Math.max(11, r / 4));
    }
  }
  $('#bubdt').textContent = BUB.dates[di];
  $('#bubtot').textContent = bubFmt(bubLerp(BUB.total, bubT));
  const chg = di > 0 ? BUB.total[di] - BUB.total[di - 1] : 0;
  const el = $('#bubchg');
  el.textContent = ` ${chg >= 0 ? '+' : ''}${bubFmt(chg)} d/d`;
  el.style.color = chg >= 0 ? 'var(--up)' : 'var(--down)';
  $('#bubseek').value = di;
  drawBubStrip(di);
  renderMovers();
}

/* ---- where the flow moved: sector nets over the window + stock movers ---- */
let bubWin = 5, bubStockTimer = null, bubStockKey = '';
function renderMovers(){
  if (!BUB || !$('#bubflows')) return;
  const di = Math.round(bubT);
  const i0 = Math.max(0, di - bubWin + 1);
  $('#bubexp').style.display =
    (bubWin === 1 && BUB.isExpiry[di]) ? '' : 'none';

  const rows = BUB.sectors.map(s => {
    let net = 0;
    for (let i = i0; i <= di; i++) net += s.flw[i];
    const b = s.lvl[i0];
    return {short: s.short, name: s.name, net,
            pct: b ? 100 * net / b : null};
  }).sort((a, b) => b.net - a.net);
  const mx = Math.max(...rows.map(r => Math.abs(r.net)), 1);
  const row = r => `<div class="mrow" title="${esc(r.name)}">
    <span class="ml">${esc(r.short)}</span>
    <span class="mtrack"><span class="mbar ${r.net >= 0 ? 'g' : 'r'}"
      style="width:${(Math.abs(r.net) / mx * 100).toFixed(1)}%"></span></span>
    <span class="mv">${r.net >= 0 ? '+' : ''}${Math.round(r.net).toLocaleString('en-IN')}
      <span class="d2">(${r.pct == null ? '—' : (r.pct >= 0 ? '+' : '') + r.pct.toFixed(1) + '% of own OI'})</span></span></div>`;
  const ins = rows.filter(r => r.net > 0);
  const outs = rows.filter(r => r.net < 0).reverse();
  $('#bubflows').innerHTML =
    `<div><div class="mhead">positioning entered</div>${ins.map(row).join('') || '<p class="note">none</p>'}</div>
     <div><div class="mhead">positioning left</div>${outs.map(row).join('') || '<p class="note">none</p>'}</div>`;
  const tin = ins.reduce((a, r) => a + r.net, 0);
  const tout = outs.reduce((a, r) => a + r.net, 0);
  $('#bubsum').innerHTML = `${BUB.dates[i0]} → ${BUB.dates[di]}: `
    + `<b style="color:var(--up)">+${Math.round(tin).toLocaleString('en-IN')} cr</b> entered`
    + (ins.length ? ` (led by ${ins.slice(0, 3).map(r => esc(r.short)).join(', ')})` : '')
    + ` · <b style="color:var(--down)">${Math.round(tout).toLocaleString('en-IN')} cr</b> left`
    + (outs.length ? ` (${outs.slice(0, 3).map(r => esc(r.short)).join(', ')})` : '')
    + ` · net ${tin + tout >= 0 ? '+' : ''}${Math.round(tin + tout).toLocaleString('en-IN')} cr`
    + ` — ${tin + tout >= 0 ? 'the pie grew' : 'the pie shrank'}`;

  // stock-level movers, debounced — a fetch per stepper tap would spam
  const key = BUB.dates[di] + ':' + bubWin;
  if (key === bubStockKey) return;
  clearTimeout(bubStockTimer);
  bubStockTimer = setTimeout(async () => {
    bubStockKey = key;
    try {
      const m = await (await fetch(`/api/oi_movers?date=${BUB.dates[di]}&win=${bubWin}`)).json();
      const li = x => `<span><b>${esc(x.symbol)}</b> ${x.flow_cr >= 0 ? '+' : ''}${x.flow_cr.toLocaleString('en-IN')}cr
        <span class="d2" style="color:var(--faint)">(${esc(x.sector)}${x.pct_of_oi != null ? ', ' + (x.pct_of_oi >= 0 ? '+' : '') + x.pct_of_oi + '%' : ''})</span></span>`;
      $('#bubstocks').innerHTML =
        `<div class="mstock"><span class="mhead">stocks carrying the inflow</span><br>${(m.in || []).map(li).join('<br>')}</div>
         <div class="mstock"><span class="mhead">stocks carrying the outflow</span><br>${(m.out || []).map(li).join('<br>')}</div>`;
    } catch (e) { $('#bubstocks').innerHTML = ''; }
  }, 250);
}

function drawBubStrip(di){
  const st = $('#bubstrip'); if (!st) return;
  const c = st.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = st.clientWidth, h = 56, N = BUB.dates.length;
  st.width = w * dpr; st.height = h * dpr;
  c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, h);
  const lo = Math.min(...BUB.total) * 0.985, hi = BUB.TOTMAX * 1.01;
  const x = i => 6 + i / (N - 1) * (w - 12);
  const y = v => 5 + (1 - (v - lo) / (hi - lo)) * (h - 14);
  c.beginPath(); c.moveTo(x(0), h - 5);
  for (let i = 0; i < N; i++) c.lineTo(x(i), y(BUB.total[i]));
  c.lineTo(x(N - 1), h - 5); c.closePath();
  c.fillStyle = 'rgba(88,166,255,.13)'; c.fill();
  c.beginPath();
  for (let i = 0; i < N; i++) i ? c.lineTo(x(i), y(BUB.total[i])) : c.moveTo(x(i), y(BUB.total[i]));
  c.strokeStyle = '#58a6ff'; c.lineWidth = 1.3; c.stroke();
  c.beginPath(); c.moveTo(x(di) + 0.5, 3); c.lineTo(x(di) + 0.5, h - 3);
  c.strokeStyle = '#e6edf3'; c.stroke();
}

function wireBubbles(){
  const N = BUB.dates.length;
  const step = k => { bubT = Math.max(0, Math.min(N - 1, Math.round(bubT) + k)); drawBubbles(); };
  $('#bubprev').addEventListener('click', () => step(-1));
  $('#bubnext').addEventListener('click', () => step(1));
  for (const [id, m] of [['bubabs', 'abs'], ['bubshare', 'share']])
    $('#' + id).addEventListener('click', () => {
      bubMode = m;
      $('#bubabs').setAttribute('aria-pressed', String(m === 'abs'));
      $('#bubshare').setAttribute('aria-pressed', String(m === 'share'));
      drawBubbles();
    });
  document.querySelectorAll('.bwin').forEach(b =>
    b.addEventListener('click', () => {
      bubWin = +b.dataset.w;
      document.querySelectorAll('.bwin').forEach(x =>
        x.setAttribute('aria-pressed', String(x === b)));
      renderMovers();
    }));
  $('#bubseek').addEventListener('input', e => { bubT = +e.target.value; drawBubbles(); });
  $('#bubstrip').addEventListener('click', e => {
    const r = e.target.getBoundingClientRect();
    bubT = Math.max(0, Math.min(N - 1,
      Math.round((e.clientX - r.left - 6) / (r.width - 12) * (N - 1))));
    drawBubbles();
  });
  const tip = $('#bubtip'), cv = $('#bubcv');
  cv.addEventListener('mousemove', e => {
    const r = cv.getBoundingClientRect(), sc = BW / r.width;
    const mx = (e.clientX - r.left) * sc, my = (e.clientY - r.top) * sc;
    const di = Math.round(bubT);
    let hit = null;
    for (const s of BUB.sectors)
      if (Math.hypot(mx - s.x, my - s.y) <= bubR(s, bubT)){ hit = s; break; }
    if (!hit){ tip.style.display = 'none'; return; }
    const lv = hit.lvl[di], fl = hit.flw[di];
    tip.innerHTML = `<b>${esc(hit.name)}</b>
      <div class="m">OI ${bubFmt(lv)} cr · ${(100 * lv / BUB.total[di]).toFixed(2)}% of book</div>
      <div class="m">day flow <span style="color:${fl >= 0 ? 'var(--up)' : 'var(--down)'}">${fl >= 0 ? '+' : ''}${bubFmt(fl)} cr</span> (${(fl / hit.fsig).toFixed(1)}× its normal day)</div>`;
    tip.style.display = 'block';
    tip.style.left = Math.min(e.clientX - r.left + 14, r.width - 205) + 'px';
    tip.style.top = Math.min(e.clientY - r.top + 12, r.height - 66) + 'px';
  });
  cv.addEventListener('mouseleave', () => tip.style.display = 'none');
  if (!window.__bubResize){
    window.__bubResize = true;
    window.addEventListener('resize', () => { if ($('#bubcv') && BUB) drawBubbles(); });
  }
}

async function loadSector(){
  const d = await (await fetch('/api/sector?id=' + encodeURIComponent(SECTOR) +
    (EST_DATE ? '&est_date=' + encodeURIComponent(EST_DATE) : ''))).json();
  if (d.error) throw new Error(d.error);
  const rows = d.commodities.map(c => {
    const stale = c.date && c.date < (TODAY || c.date);
    const chg = c.chg_pct == null
      ? '<td class="n flat">flat 30d+</td>'
      : `<td class="n" style="color:${c.chg_pct > 0 ? 'var(--up)' :
           c.chg_pct < 0 ? 'var(--down)' : 'var(--faint)'}">${
           (c.chg_pct >= 0 ? '+' : '') + c.chg_pct.toFixed(2)}%</td>`;
    return `<tr>
      <td class="k">${esc(c.id)}</td>
      <td title="${esc(c.name)}">${esc(shortLabel(c.name))}</td>
      <td class="n">${fmtNum(c.last)}</td>
      ${chg}
      <td class="k${stale ? ' flat' : ''}">${esc(c.date || '—')}</td>
      <td class="k flat">${esc(c.source || '—')}</td>
      <td class="k flat">${c.moved_on ? 'carried since ' + esc(c.moved_on) : 'moved today'}</td>
    </tr>`;
  }).join('');

  /* ------- the regional price chart, where the sector declares one -------
     Absolute Rs/bag on one axis, NOT %-indexed like the pair chart. The pair
     chart indexes because SAIL at 130 and APL at 1,900 cannot share a scale;
     these five regions live within ~60 Rs of each other and the LEVEL GAP is
     itself the information — West trading 20 Rs over South is a statement
     about regional tightness that an indexed chart would erase. */
  let chartHtml = '';
  if (d.price_chart && d.price_chart.series.some(s => s.pts.length > 1)){
    const pc = d.price_chart;
    /* Legend labels from series ids, sector-agnostically: strip the shared
       prefix the sector's own ids carry (cement_price_east_inr -> east,
       nmdc_lumps_inr -> lumps) rather than hardcoding one sector's prefix —
       mining's chart rendered "nmdc_lumps" raw until this was generalised. */
    const region = id => {
      const r = id.replace(/^cement_price_/, '').replace(/^nmdc_/, '')
                  .replace(/_inr$/, '').replace(/_/g, ' ');
      return r === 'india' ? 'all-India' : r;
    };
    const drawn = pc.series.filter(s => s.pts.length > 1)
      .map((s, i) => ({label: region(s.id), slot: i + 1, pts: s.pts}));
    const all = [...new Set(drawn.flatMap(s => s.pts.map(p => p.d)))].sort();
    const xDom = [Date.parse(all[0]), Date.parse(all[all.length - 1])];
    const xTicks = all.length <= 2 ? all
      : [all[0], all[Math.floor(all.length / 2)], all[all.length - 1]];
    let lo = Infinity, hi = -Infinity;
    for (const s of drawn) for (const p of s.pts){
      if (p.v < lo) lo = p.v;
      if (p.v > hi) hi = p.v;
    }
    const step = niceCeil((hi - lo || 1) / 4);
    const yLo = Math.floor(lo / step) * step, yHi = Math.ceil(hi / step) * step;
    const ticks = [];
    for (let v = yLo; v <= yHi + 1e-9; v += step) ticks.push(v);
    const availW = Math.max(560,
      (document.getElementById('s-sector').clientWidth || 900) - 8);
    const svg = lineChart({
      id: 'sectorpx', w: availW, h: 300, series: drawn,
      yLo: yLo, yHi: yHi, ticks: ticks,
      fmtY: v => String(Math.round(v)), fmtV: v => v.toFixed(1),
      xDom: xDom, xTicks: xTicks, allDates: all,
      marks: pc.marks || [],
      axisLabel: esc(d.label) + ' price · ' + esc(pc.unit)
    });
    const legend = '<div class="lgd">' + drawn.map(s =>
      '<span><i style="border-top-color:' + inkOf(s.slot) + '"></i>' +
      esc(s.label) + '</span>').join('') + '</div>';
    const markNote = (pc.marks || []).map(m =>
      `<p class="note hint">Rule at ${esc(m.d)}: ${esc(m.label || '')}</p>`).join('');
    /* Title and caption come from the API (engine.SECTORS chart dict) —
       they were hardcoded here until 2026-08-30, when mining's chart rendered
       under cement's "by region" heading and Kotak-vs-Nomura caption. */
    const capNote = pc.caption
      ? `<p class="note">${esc(pc.caption)}</p>` : '';
    chartHtml = `<h2>${esc(pc.title || (d.label + ' prices'))}</h2>
      ${legend}${svg}${markNote}${capNote}`;
  }

  /* ------- the IndiaMART watch, where the sector carries one -------
     Same payload the Overview banner reads; this is the per-region detail.
     The banner answers "did something move today" — this table is for the
     morning after it says yes. Calibrating is rendered as a state, not as
     absence: an empty panel would read as "no move", which is the one thing
     an uncalibrated watch cannot claim. */
  /* VAHAN MAKER SHARE — auto only (PM, 2026-09-23: "in the auto tab, I need a
     graph for market share change on a daily basis. Different for PV, 2
     wheelers and CV. Only include fno names in the graph lines, keep rest as
     others"). Three stacked charts, one per segment, drawn with the same
     lineChart() as everything else.

     It renders on `auto` ALONE. An empty box on the other sectors would read
     as a broken query — the cement-ask rule.

     The placeholders are filled after the width pass, like the price chart, so
     the scrollbar state is settled before the measurement is taken. */
  let autoHtml = '';
  if (SECTOR === 'auto'){
    autoHtml = '<h2>Maker share · Vahan registrations</h2>'
      + '<div id="autoshare-box"><div class="hint">loading…</div></div>';
  }

  let watchHtml = '';
  if (d.watch && d.watch.state !== 'no_data' && d.watch.state !== 'error'){
    const w = d.watch;
    const rows2 = (w.regions || []).map(r => `<tr>
      <td><b>${esc(r.region)}</b></td>
      <td class="n">${r.median_bag == null ? '—' : Math.round(r.median_bag)}</td>
      <td class="n">${r.n_listings}</td>
      ${r.matched_pct == null
        ? '<td class="n flat">first capture</td>'
        : `<td class="n" style="color:${r.matched_pct > 0 ? 'var(--up)' :
             r.matched_pct < 0 ? 'var(--down)' : 'var(--faint)'}">${
             (r.matched_pct >= 0 ? '+' : '') + r.matched_pct.toFixed(2)}%</td>`}
      <td class="n">${r.n_matched == null ? '—' : r.n_matched}</td>
      <td class="k flat">${esc(r.prior_date || '—')}</td>
    </tr>`).join('');
    const alertHtml = (w.alerts || []).length
      ? `<div class="banner">${w.alerts.map(a => esc(a.text)).join('<br>')}</div>`
      : '';
    watchHtml = `<h2>Dealer asks · IndiaMART · ${esc(w.day || '—')}
        <span class="chip ${w.state === 'live' ? 'c-up' : 'c-warn'}"
          style="margin-left:8px">${esc(w.state)}${
          w.state === 'calibrating' ? ' · ' + w.days_to_calibrate + ' capture(s) to go' : ''}</span></h2>
      ${alertHtml}
      <p class="note">Promoted-rail ask prices. The d/d figure is the median
        move across listings present in BOTH captures — panel churn cancels out
        of it. Watch only: nothing here reaches a score, and the Kotak pack
        above stays the reference.</p>
      <div class="scroll"><table><thead><tr><th>region</th>
        <th class="n">median ask (Rs/bag)</th><th class="n">listings</th>
        <th class="n">d/d matched</th><th class="n">n matched</th>
        <th>vs capture</th></tr></thead><tbody>${rows2}</tbody></table></div>`;
  } else if (d.watch && d.watch.state === 'error'){
    watchHtml = `<p class="note hint" style="color:var(--warn)">
      Cement watch unavailable: ${esc(d.watch.note || '')}</p>`;
  }

  /* ------- the consensus panel, where the sector declares one (EMS) -------
     Forward P/E, growth, PEG and estimate-revision momentum per name — the
     tab's lead content for a sector whose P3 IS the forward multiple. Live
     from the latest capture, so it can run a day ahead of the persisted
     score (the strict as-of rule); the Overview/Pair tabs stay the tape.
     PEG and momentum are shown TOGETHER on purpose: today Dixon is the
     group's richest PEG while being the only name whose estimates are
     RISING — either half alone would read as a verdict. */
  let estHtml = '';
  EST_REDRAW = null;   // a sector without a panel must not keep the last one's
  if (d.estimates && (d.estimates.rows || []).length){
    const E = d.estimates;
    const pct = (v, dec=1) => v == null ? '—'
      : `<span style="color:${v > 0 ? 'var(--up)' : v < 0 ? 'var(--down)'
          : 'var(--faint)'}">${(v >= 0 ? '+' : '') + (v * 100).toFixed(dec)}%</span>`;
    const stateCell = r => esc(r.state || (r.scored ? 'scored' : 'not in F&O'));
    const rows3 = E.rows.map(r => {
      if (r.withheld) return `<tr>
        <td class="k">${esc(r.id)}</td><td>${esc(shortLabel(r.name))}</td>
        <td class="k flat" colspan="${E.pe_2y_asof ? 10 : 9}">no reading: ${esc(r.withheld)}</td>
        <td class="k flat">${stateCell(r)}</td></tr>`;
      // Below the scorer's 5% growth floor the PEG is shown FAINT with a
      // dagger — computable but unstable (at 4% growth a 1pp revision swings
      // it ~0.7), never coloured against the median and never scored.
      const lowG = r.growth != null && r.growth < 0.05;
      const pegCell = r.peg == null ? '—'
        : lowG ? `<span style="color:var(--faint)">${r.peg.toFixed(2)}†</span>`
        : E.peg_median == null ? r.peg.toFixed(2)
        : `<b style="color:${r.peg < E.peg_median ? 'var(--up)'
            : r.peg > E.peg_median ? 'var(--down)' : 'inherit'}">${
            r.peg.toFixed(2)}</b>`;
      return `<tr>
        <td class="k">${esc(r.id)}</td>
        <td>${esc(shortLabel(r.name))}</td>
        <td class="n">${fmtNum(r.close)}</td>
        <td class="n">${r.eps_fy1.toFixed(1)} / ${r.eps_fy2.toFixed(1)}</td>
        <td class="n">${r.n_analysts}</td>
        <td class="n"><b>${r.fwd_pe.toFixed(1)}x</b></td>
        <td class="n">${r.eps_fy2 > 0 ? (r.close / r.eps_fy2).toFixed(1) + 'x' : '—'}</td>
        ${E.pe_2y_asof ? `<td class="n">${
          r.pe_2y == null ? '—' : r.pe_2y.toFixed(1) + 'x'}</td>` : ''}
        <td class="n">${r.ttm_pe == null ? '—' : r.ttm_pe.toFixed(1) + 'x'}</td>
        <td class="n">${pct(r.growth, 0)}</td>
        <td class="n">${pegCell}</td>
        <td class="n">${pct(r.rev_90d)}</td>
        <td class="k flat">${stateCell(r)}</td>
      </tr>`;
    }).join('');

    /* ---- the scatter: multiple vs expected growth, iso-PEG guides ----
       The graph the PM asked IT for (2026-09-01) — rendered for ANY sector
       whose panel has >=3 computable rows, so EMS gets it too. Colour follows
       the served display group (est_groups; series slots 1..3 in order);
       a sector with no groups draws in slot 1. Identity is never colour
       alone: every point is direct-labelled, and the table below is the
       same data.
       Two modes since 2026-09-02 (PM: "add a toggle for fy29 ... flipping the
       switch flips the graph"): '1y' plots the Yahoo-computed 12m-forward
       multiple; '2y' plots Bloomberg's PE Ratio [2 Yr Fwd] — the BEst blended
       24-month multiple, which embeds the FY29 consensus that no fetchable
       source carries. The 2y feed is a hand-captured terminal screenshot
       (adapters/bbg_pe2y.py), so its button wears its capture date. */
    const c1y = E.rows.filter(r => !r.withheld && r.fwd_pe != null);
    // The real fiscal pair, not "FY1/FY2": every computable row carries its
    // own fy1/fy2 (today FY27/FY28 across the board). If a mixed-year cross-
    // section ever appears (a non-March closer), the generic label returns
    // rather than one name's pair being asserted for all.
    const fy1s = new Set(c1y.map(r => r.fy1)), fy2s = new Set(c1y.map(r => r.fy2));
    const FY1 = fy1s.size === 1 ? [...fy1s][0] : 'FY1';
    const FY2 = fy2s.size === 1 ? [...fy2s][0] : 'FY2';
    const buildEstScatter = mode => {
      ESTV = null;   // stays null when this returns '' (fewer than 3 points)
      const two = mode === '2y';
      const spts = E.rows.filter(r => two
        ? (r.pe_2y != null && r.growth != null)
        : (!r.withheld && r.fwd_pe != null));
      if (spts.length < 3) return '';
      const yv = r => two ? r.pe_2y : r.fwd_pe;
      const W = 900, H = 380, ml = 48, mr = 26, mt = 14, mb = 42;
      const iw = W - ml - mr, ih = H - mt - mb;
      const xmax = Math.max(0.15, Math.max(...spts.map(p => p.growth)) * 1.18);
      const ys = spts.map(yv);
      const ymin = Math.max(0, Math.floor(Math.min(...ys) * 0.85 / 5) * 5);
      const ymax = Math.ceil(Math.max(...ys) * 1.12 / 5) * 5;
      const sx = g => ml + Math.max(0, g) / xmax * iw;
      const syy = p => mt + (ymax - p) / (ymax - ymin) * ih;
      const groups = E.groups || [];
      const colOf = r => {
        const i = groups.indexOf(r.group);
        return `var(--series-${i >= 0 ? (i % 8) + 1 : 1})`;
      };
      let s = '';
      const ystep = (ymax - ymin) > 25 ? 10 : 5;
      for (let p = ymin; p <= ymax; p += ystep){
        s += `<line x1="${ml}" x2="${W - mr}" y1="${syy(p)}" y2="${syy(p)}"
                stroke="var(--hair)" stroke-width="1"/>
              <text x="${ml - 8}" y="${syy(p) + 4}" text-anchor="end"
                font-size="11" fill="var(--faint)">${p}x</text>`;
      }
      const xstep = xmax > 0.3 ? 0.1 : 0.05;
      for (let g = 0; g <= xmax + 1e-9; g += xstep){
        s += `<text x="${sx(g)}" y="${H - mb + 18}" text-anchor="middle"
                font-size="11" fill="var(--faint)">${Math.round(g * 100)}%</text>`;
      }
      // iso-ratio guides: straight lines PE = k * g*100, clipped to the plot.
      // Labelled ~PEG on the 1y view: the table's PEG numerator is the FY2
      // multiple (desk convention, 2026-09-03) while this axis is the 12m
      // blend, so a point's exact PEG runs up to ~10% below the guide it
      // sits on. In 2y mode "PEG" would be a plain misnomer, so the guides
      // read as multiple-per-growth ratios there.
      [[1, two ? '1×g' : '~PEG 1'], [1.5, two ? '1.5×g' : '~PEG 1.5'],
       [2, two ? '2×g' : '~PEG 2'], [3, two ? '3×g' : '~PEG 3']].forEach(([peg, lab]) => {
        const gA = Math.max(0.004, ymin / (peg * 100));
        const gB = Math.min(xmax, ymax / (peg * 100));
        if (gB <= gA) return;
        const exitTop = gB < xmax;   // guide leaves through the top edge
        // Brighter than the y-grid on purpose (PM 2026-09-02: "make the PEG
        // lines a bit more visible") — but still dashed and under the marks,
        // so they read as guides, never as data.
        s += `<line x1="${sx(gA)}" y1="${syy(peg * gA * 100)}"
                x2="${sx(gB)}" y2="${syy(peg * gB * 100)}"
                stroke="var(--faint)" stroke-width="1.3"
                stroke-dasharray="6 4"/>
              <text x="${sx(gB) + (exitTop ? 4 : -4)}"
                y="${syy(peg * gB * 100) - 5}" font-size="11"
                font-weight="600" fill="var(--soft)"
                text-anchor="${exitTop ? 'start' : 'end'}">${lab}</text>`;
      });
      // points, then labels with a greedy vertical de-overlap (the large-cap
      // cluster sits within a multiple point of itself)
      const labs = spts.map(r => ({r, x: sx(r.growth), y: syy(yv(r))}))
        .sort((a, b) => a.y - b.y || a.x - b.x);
      labs.forEach((L, i) => {
        L.ly = L.y + 4;
        for (let j = 0; j < i; j++){
          const P = labs[j];
          if (Math.abs(L.x - P.x) < 90 && Math.abs(L.ly - P.ly) < 12)
            L.ly = P.ly + 12;
        }
      });
      ESTV = {W, H, ml, mr, mt, mb, xmax, ymin, ymax, pts: []};
      labs.forEach(L => {
        const r = L.r;
        // No <title>: the crosshair layer (wireEstScatter) is the readout —
        // a native title on top of it would double the tooltip.
        s += `<circle cx="${L.x}" cy="${L.y}" r="6" fill="${colOf(r)}"
                stroke="var(--surface)" stroke-width="2"/>`;
        const anchor = L.x > W - mr - 96 ? 'end' : 'start';
        s += `<text x="${anchor === 'end' ? L.x - 10 : L.x + 10}" y="${L.ly}"
                font-size="11" font-weight="600" fill="var(--ink)"
                text-anchor="${anchor}">${esc(shortLabel(r.name))}</text>`;
        ESTV.pts.push({x: L.x, y: L.y, d: r});
      });
      ESTV.pts.sort((a, b) => a.x - b.x);   // arrow keys walk left -> right
      const legend3 = groups.length
        ? `<p class="note" style="margin:2px 0 6px">${groups.map((g, i) =>
            `<span style="color:var(--series-${(i % 8) + 1})">●</span> ${esc(g)}`)
            .join(' &nbsp;·&nbsp; ')} &nbsp;— display grouping only; nothing
            scores against it.</p>`
        : '';
      /* Crosshair layer, painted last so it rides above everything. Two
         hairlines + axis readout chips follow the pointer; within reach of a
         point they SNAP to it, so the numbers shown are the name's exact
         values rather than the pixel under the cursor. Wired by
         wireEstScatter() after insertion, same lifecycle as wireChart. */
      const xh = `
        <line class="xhair es-vx" x1="0" x2="0" y1="${mt}" y2="${H - mb}"
          style="display:none"/>
        <line class="xhair es-hx" x1="${ml}" x2="${W - mr}" y1="0" y2="0"
          style="display:none"/>
        <circle class="es-ring" r="9.5" fill="none" stroke="var(--accent)"
          stroke-width="1.5" style="display:none" pointer-events="none"/>
        <g class="es-rx" style="display:none" pointer-events="none">
          <rect x="-26" y="${H - mb + 5}" width="52" height="17" rx="3"
            fill="var(--surface)" stroke="var(--hair)"/>
          <text y="${H - mb + 18}" text-anchor="middle" font-size="11"
            font-weight="600" fill="var(--accent)"></text></g>
        <g class="es-ry" style="display:none" pointer-events="none">
          <rect x="${ml - 48}" y="-9" width="42" height="17" rx="3"
            fill="var(--surface)" stroke="var(--hair)"/>
          <text x="${ml - 10}" y="4" text-anchor="end" font-size="11"
            font-weight="600" fill="var(--accent)"></text></g>`;
      // Names the 1y view carries that the BBG capture lacks — listed, not
      // silently absent (LTTS and OFSS sat outside the screenshot frame).
      const miss = two
        ? E.rows.filter(r => !r.withheld && r.fwd_pe != null && r.pe_2y == null)
            .map(r => shortLabel(r.name))
        : [];
      const missNote = miss.length
        ? `<p class="note hint">not in the BBG capture: ${esc(miss.join(', '))}
             — shown on the 1-yr view only.</p>`
        : '';
      return `${legend3}
        <div class="scroll"><div class="chartwrap" id="cw-est">
        <svg viewBox="0 0 ${W} ${H}" width="100%"
          style="min-width:640px" role="img" tabindex="0"
          aria-label="forward P/E against consensus growth — hover or use arrow keys for exact values; the table below carries the same data">
          ${s}${xh}
          <text x="${ml + iw / 2}" y="${H - 4}" text-anchor="middle"
            font-size="11" fill="var(--soft)">consensus EPS growth, ${FY1} → ${FY2}</text>
          <text x="12" y="${mt + ih / 2}" font-size="11" fill="var(--soft)"
            transform="rotate(-90 12 ${mt + ih / 2})"
            text-anchor="middle">${two
              ? `2-yr fwd P/E · BBG ${esc(E.pe_2y_asof || '')}`
              : '12m forward P/E'}</text>
        </svg><div class="viztip" role="status"></div></div></div>${missNote}`;
    };
    EST_REDRAW = buildEstScatter;
    const scatterHtml = `<div id="est-scatter-box">${buildEstScatter('1y')}</div>`;
    const n2y = E.rows.filter(r => r.pe_2y != null && r.growth != null).length;
    const modeBtns = (E.pe_2y_asof && n2y >= 3) ? `
      <div class="est-mode" role="group" aria-label="forward horizon"
        style="display:flex;gap:8px;margin:0 0 8px">
        <button class="ghost" data-m="1y" aria-pressed="true">1-yr fwd · Yahoo, daily</button>
        <button class="ghost" data-m="2y" aria-pressed="false">2-yr fwd · BBG ${esc(E.pe_2y_asof)}, marked to close</button>
      </div>` : '';
    /* The EPS-drift warning. The BBG multiple re-marks on price daily, but
       its EPS is pinned at the capture — so when the YAHOO consensus has
       moved >=1% since the capture date, the pinned BBG EPS has probably
       moved too, and the re-marked multiple is quietly wrong for that name.
       This is the "EPS might have changed" warning the PM asked for
       (2026-09-02); the fix it calls for is a fresh screenshot. */
    const drifted = E.rows.filter(r =>
      r.pe_2y_drift != null && Math.abs(r.pe_2y_drift) >= 0.01);
    const warn2y = drifted.length ? `
      <p class="note" style="color:var(--warn)">⚠ consensus EPS has moved
        since the BBG capture (${esc(E.pe_2y_asof)}): ${drifted.map(r =>
          `${esc(shortLabel(r.name))} ${(r.pe_2y_drift >= 0 ? '+' : '')}${
          (r.pe_2y_drift * 100).toFixed(1)}%`).join(', ')} — their 2-yr
        multiples are re-marked on today's close but still carry the
        capture-day estimates. A fresh screenshot resets this.</p>` : '';
    /* The column glossary lives in a one-line <details> BELOW the graph
       (PM, 2026-09-02) — the chart leads, the fine print folds away. */
    const glossary = `
      <details class="await" style="margin:4px 0 10px">
        <summary style="cursor:pointer;color:var(--soft);font-size:var(--t-sm)">
          How to read the columns — fwd P/E, P/E ${FY2}E${
          E.pe_2y_asof ? ', 2y BBG' : ''}, PEG†, rev 90d</summary>
        <p class="note" style="margin-top:8px">Yahoo consensus (cross-checked
        against broker notes in the digests). <b>fwd P/E</b> divides the close
        by the 12-month-forward EPS blend of ${FY1}/${FY2}; <b>P/E ${FY2}E</b>
        is the multiple on the furthest consensus year Yahoo carries — the
        number broker notes quote${
        E.pe_2y_asof ? `; <b>P/E 2y (BBG)</b> is Bloomberg's blended 24-month
        forward multiple, which embeds FY-after consensus no free feed has —
        hand-captured <b>${esc(E.pe_2y_asof)}</b> (adapters/bbg_pe2y.py) and
        re-marked on each day's close via the implied 24m EPS; a ⚠ line
        appears when the consensus moves after the capture` : ''};
        <b>PEG</b> divides the <b>P/E ${FY2}E</b> by ${FY2}-over-${FY1}
        growth (desk convention, PM 2026-09-03: numerator and denominator
        describe the same year — you pay the ${FY2} multiple for the growth
        that delivers ${FY2}); the chart's guide lines sit on the blended
        axis, hence the ~.
        †&nbsp;Sub-5%-growth PEGs are faint for NOISE (at 4% growth a 1pp
        revision swings the ratio ~0.7), but the cross-cap reading stands —
        PM 2026-09-02: on a growth basis a ~3 PEG large cap pays you nothing
        against a ~1.5 mid, and that IS what this chart measures; dividends
        and buybacks, the reason to own the ~3s, are a different analysis
        that sits outside it —
        green is cheaper than the scored group's median (${
        E.peg_median == null ? '—' : E.peg_median.toFixed(2)}). P3 scores a
        50/50 blend of that ratio with each name's fwd P/E vs its <b>own last
        60 days</b> (PM 2026-09-05 — the peer ratio alone cancelled every
        sector-wide move and drew flat lines), so the score also moves when a
        name re-rates against itself. <b>rev 90d</b> is
        the street moving its own numbers — context, never scored: a cheap PEG
        on falling estimates is cheap because the E is falling. <b>P/E ttm</b>
        is the normal trailing multiple every screener quotes — reference
        only, and read it warily here: a one-off can put it BELOW the forward
        (Dixon), a trough TTM far above it (Amber).</p>
      </details>`;
    /* The history picker (PM 2026-09-03: "let me view with dates in past").
       Nothing is snapshotted — the dated captures ARE the history, so a past
       date is a point-in-time recomputation: that day's capture against that
       day's close, BBG re-mark and drift included. Floor = first capture. */
    // ◀ ▶ step through the dates that actually have a capture (plus today) —
    // stepping onto an uncaptured calendar day would just withhold everything.
    const steps = (E.est_dates || []).slice();
    if (E.today && !steps.includes(E.today)) steps.push(E.today);
    const prevD = [...steps].reverse().find(d => d < E.as_of_view) || '';
    const nextD = steps.find(d => d > E.as_of_view) || '';
    const histCtl = (E.est_dates || []).length ? `
      <div class="est-hist" style="display:flex;gap:8px;align-items:center;margin:0 0 8px">
        <span style="color:var(--soft);font-size:var(--t-sm)">as of</span>
        <button class="ghost" id="est-prev" data-d="${esc(prevD)}"
          ${prevD ? '' : 'disabled'} title="previous capture"
          aria-label="previous capture date">◀</button>

    estHtml = `<h2>Consensus forward P/E · capture ${
        esc((E.rows.find(r => r.capture) || {}).capture || '—')}</h2>

      ${modeBtns}

        <th class="n">fwd P/E</th><th class="n">P/E ${FY2}E</th>

        <th class="n">PEG</th><th class="n">rev 90d</th><th>state</th>
      </tr></thead><tbody>${rows3}</tbody></table></div>`;
  }

  const unc = d.unclaimed && d.unclaimed.length
    ? `<h2>Captured, claimed by no sector</h2>
       <p class="note">Loaded from the pack so the history exists. Nothing reads

         <th>date</th></tr></thead><tbody>${d.unclaimed.map(u =>
         `<tr><td class="k">${esc(u.id)}</td><td class="n">${fmtNum(u.last)}</td>
          <td class="k">${esc(u.date)}</td></tr>`).join('')}</tbody></table></div>`
    : '';

  /* THE PLACEHOLDER DEMOTES ITSELF ONCE THERE IS DATA TO SHOW. This box was
     written when an unbuilt sector's tab had nothing else on it, and it earned
     the lead position then. With a chart and a watch above the fold it read as
     "this tab is empty" — the PM's words: "cement shows no specs" — while the
     data sat below a wall of build instructions. The instructions still matter
     (they are the recipe for making the sector live) so they fold into a
     <details> at the BOTTOM, and the not-scored fact itself moves into a
     one-line note where it cannot be mistaken for the tab's content. */
  // A LIVE sector reaches this view through the Prices & Watch sub-tab, and
  // the not-scored disclaimer would then be false — its pillars live on the
  // other three tabs. Both notes key on d.live.
  /* Not on Auto (PM, 2026-09-25: "remove this text"). IT still carries it. */
  const buildNote = (d.live || d.id === 'auto') ? '' : `
    <p class="note hint">${esc(d.label)} is <b>not scored</b> — prices land
      daily, but no spec links them, so no pillar exists and nothing is
      withheld either.</p>`;
  const buildHow = d.live ? '' : `
    <details class="await" style="margin-top:var(--s5)">
      <summary style="cursor:pointer;font-weight:600">How this tab becomes
        Pair / Bridge / Positioning</summary>
      <p style="margin-top:10px">The series are captured deliberately before
        the sector is built — the pack arrives as an email attachment and the
        connector route can only ever return the OLDEST rows, so a column not
        captured today is history that cannot be recovered later.</p>
      <ol>
        <li>Write <code>specs/entities/${esc(d.id)}.yaml</code> — names, peer
          group, <code>base_ebitda</code>, cost items with
          <code>market_pct</code></li>
        <li><code>price_link</code> each cost item to a series below, and move it
          out of <code>metals_pack.PARKED</code> and out of
          <code>freshness.PARKED_FEEDS</code> so it starts being watched</li>
        <li>Add the peer group to <code>engine.SECTORS</code> — this tab becomes
          Pair / Bridge / Positioning with no further front-end work</li>
      </ol>
    </details>`;

  $('#s-sector').innerHTML = `
    ${buildNote}
    ${estHtml}
    ${autoHtml}
    ${chartHtml}
    ${watchHtml}
    <h2>${esc(d.label)} inputs · ${d.n_priced}/${d.n_total} priced</h2>
    <p class="note">Change is measured against the last close that actually
      <b>differed</b>, not the previous row — the pack pre-creates the current
      day's row and carries the prior session forward until tomorrow's file
      backfills it, so a row-over-row change reads 0.00% on almost everything.</p>
    <div class="scroll"><table><thead><tr>
      <th>series</th><th>what it is</th><th class="n">last</th>
      <th class="n">last real move</th><th>as of</th><th>source</th><th>state</th>
    </tr></thead><tbody>${rows}</tbody></table></div>
    ${unc}
    ${buildHow}`;
  // After insertion — the hover layer needs the SVG in the DOM. (`unc` above
  // was also built-but-never-rendered until the chart landed here.)
  if (chartHtml) wireChart('sectorpx');
  if (autoHtml) await drawAutoShare();
  if (ESTV) wireEstScatter();
  // The history picker: a changed date refetches the whole sector view with
  // est_date, so table, scatter, BBG re-mark and drift all replay together.
  const dp = document.getElementById('est-date');
  if (dp) dp.addEventListener('change', () => {
    EST_DATE = dp.value || null;
    loadSector().catch(e => showErr(String(e)));
  });
  const bt = document.getElementById('est-today');
  if (bt) bt.addEventListener('click', () => {
    EST_DATE = null;
    loadSector().catch(e => showErr(String(e)));
  });
  // ◀ ▶ steppers — each carries its target date; disabled at either end.
  for (const id of ['est-prev', 'est-next']){
    const b = document.getElementById(id);
    if (b) b.addEventListener('click', () => {
      if (!b.dataset.d) return;
      EST_DATE = b.dataset.d;
      loadSector().catch(e => showErr(String(e)));
    });
  }
  // The 1y/2y horizon toggle: re-draw the scatter box in place, then re-wire
  // the crosshair (the old SVG and its listeners left with the old DOM).
  document.querySelectorAll('#s-sector .est-mode button').forEach(b =>
    b.addEventListener('click', () => {
      if (!EST_REDRAW) return;
      document.querySelectorAll('#s-sector .est-mode button').forEach(x =>
        x.setAttribute('aria-pressed', String(x === b)));
      const box = document.getElementById('est-scatter-box');
      if (box){
        box.innerHTML = EST_REDRAW(b.dataset.m);
        if (ESTV) wireEstScatter();
      }
    }));
}

let TODAY = null;


/* ------------------------------------------------------------------ Company
   Per-company coverage, built from earnings-call transcripts ALONE. It feeds
   no pillar and no score — it is the read-in-depth surface, deliberately kept
   off every scoring path (invariant 7 is untouched because nothing here
   reaches pillar_scores). Since 2026-09-16 it is the "Company historical
   analysis" sub-view of EACH SECTOR, never a top-level tab (PM: "sits out
   like a sore spot. Keep it within the sectors only"); the roster the
   picker offers is the current sector's dossiers alone.

   Three rules the layout encodes:
   - THE GUIDANCE LEDGER LEADS. What management promised and whether it landed
     is the one thing a transcript archive can say that a price series cannot.
   - A FLAG IS RENDERED, NEVER SWALLOWED. Where two calls state the same
     figure differently the dossier carries both and the page prints the
     conflict; a quietly-picked number is the silent-arithmetic shape.
   - WHAT IS MISSING IS NAMED. Shareholding, market share and valuation are
     absent because a transcript cannot carry them — shown as a list of holes
     with the document that would fill each, never omitted. */
/* Remembered pick PER SECTOR, so switching Steel -> EMS -> Steel comes back
   to the same name; a slug from another sector is never sent for this one
   (the API would fall back silently to the sector's first, hiding the mix). */
const COMPANY_SLUG_BY_SECTOR = {};

const VERDICT_CHIP = {beat:'c-up', met:'c-up', miss:'c-down', pending:'c-flat'};

function cNum(v, d=0){
  return v == null ? '—'
    : v.toLocaleString('en-IN', {minimumFractionDigits:d, maximumFractionDigits:d});
}
function cPct(v, d=1){
  return v == null ? '—' : (v >= 0 ? '+' : '') + v.toFixed(d) + '%';
}
function flagMark(f){
  return f ? ' <span class="chip c-warn" title="' + esc(f) + '">flagged</span>' : '';
}

/* A sparkline over a numeric series. Hand-rolled SVG, same as everything else
   on this page — no CDN. Returns '' for a series too short to have a shape,
   because a two-point "trend" line asserts more than it knows. */
function cSpark(vals, w=132, h=30){
  const v = vals.filter(x => x != null);
  if (v.length < 3) return '';
  const lo = Math.min(...v), hi = Math.max(...v), rng = (hi - lo) || 1;
  const pts = v.map((y,i) =>
    (i/(v.length-1)*(w-2)+1).toFixed(1) + ',' +
    (h-1-((y-lo)/rng)*(h-2)).toFixed(1)).join(' ');
  const up = v[v.length-1] >= v[0];
  return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '"'
    + ' aria-hidden="true" style="vertical-align:middle"><polyline points="' + pts + '"'
    + ' fill="none" stroke="' + (up ? 'var(--up)' : 'var(--down)') + '"'
    + ' stroke-width="1.5" stroke-linejoin="round"/></svg>';
}


/* ---------------------------------------------------- Company: the narrative
   PM instruction 2026-09-14: *"a backward looking company analysis over the
   history of the company. Any relevant news and earnings or raw material
   change can look to somehow explain the share price movement."*

   So the price is the SPINE and everything else hangs off it. The chart is
   annotated with the eight chapters; each chapter says what happened, what
   the market did, and how confident the attribution is.

   TWO HONESTY RULES, both visible on the page:
   - An unattributed move is LISTED as unattributed. Seven sessions moved 8%+
     with nothing in the transcript archive to explain them, because calls
     happen four times a year and news flow does not. Inventing a reason for
     those would devalue the eleven that are real.
   - A market-wide move is labelled as one. The deepest drawdown here
     (-39.7%) carried zero company information; a dossier that only reads
     company documents would have mistaken it for a signal. */

function chapterChart(d){
  const ps = d.price_series || [];
  const ch = ((d.narrative || {}).chapters) || [];
  if (ps.length < 10) return '';
  const W = 900, H = 240, PL = 52, PR = 12, PT = 14, PB = 26;
  const iw = W - PL - PR, ih = H - PT - PB;
  const t0 = Date.parse(ps[0][0]), t1 = Date.parse(ps[ps.length-1][0]);
  const lo = 0, hi = Math.max(...ps.map(p => p[1])) * 1.04;
  const X = t => PL + (Date.parse(t) - t0) / (t1 - t0) * iw;
  const Y = v => PT + ih - (v - lo) / (hi - lo) * ih;

  // Chapter bands, alternating so the eye can separate them without colour
  // carrying meaning - an up chapter and a down chapter must not be told
  // apart by the band, only by the line inside it.
  const bands = ch.map((c,i) =>
    '<rect x="' + X(c.from).toFixed(1) + '" y="' + PT + '" width="'
    + Math.max(0, X(c.to) - X(c.from)).toFixed(1) + '" height="' + ih
    + '" fill="' + (i % 2 ? 'var(--sunken)' : 'transparent') + '" opacity=".55"/>'
    + '<text x="' + (X(c.from) + 3).toFixed(1) + '" y="' + (PT + 11)
    + '" font-size="9" fill="var(--faint)" font-family="var(--mono)">' + c.n + '</text>').join('');

  const path = ps.map((p,i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' '
    + Y(p[1]).toFixed(1)).join(' ');

  // Earnings markers: a tick per call, coloured by the one-day reaction, and
  // sized by it - a +-20% day must not look like a +-1% day.
  const marks = ((d.narrative || {}).earnings_reactions || []).map(r => {
    const x = X(r.date), big = Math.abs(r.d1) >= 8;
    const col = r.d1 > 0 ? 'var(--up)' : 'var(--down)';
    return '<line x1="' + x.toFixed(1) + '" y1="' + (PT + ih) + '" x2="' + x.toFixed(1)
      + '" y2="' + (PT + ih - (big ? 16 : 7)) + '" stroke="' + col
      + '" stroke-width="' + (big ? 2.2 : 1) + '" opacity="' + (big ? .95 : .5) + '">'
      + '<title>' + esc(r.q + ' ' + r.date + '  1d ' + (r.d1 >= 0 ? '+' : '')
      + r.d1.toFixed(1) + '%\n' + r.note) + '</title></line>';
  }).join('');

  // Ticks are DERIVED from the series, not a fixed ladder. The first company
  // here traded in the hundreds, so 0/500/1000/1500/2000 read fine; a name
  // trading near 180 got a single tick at zero and an axis that said nothing.
  const tickStep = [1,2,5,10,20,25,50,100,200,250,500,1000,2000,5000]
    .find(s => hi / s <= 6) || 10000;
  const ticks = Array.from({length: Math.floor(hi / tickStep) + 1},
    (_, i) => i * tickStep).map(v =>
    '<line x1="' + PL + '" y1="' + Y(v).toFixed(1) + '" x2="' + (W - PR)
    + '" y2="' + Y(v).toFixed(1) + '" stroke="var(--hair)" stroke-width="1"/>'
    + '<text x="' + (PL - 6) + '" y="' + (Y(v) + 3).toFixed(1)
    + '" text-anchor="end" font-size="10" fill="var(--faint)"'
    + ' font-family="var(--mono)">' + v + '</text>').join('');

  // Year gridlines likewise come from the window actually plotted.
  const y0 = new Date(t0).getUTCFullYear(), y1 = new Date(t1).getUTCFullYear();
  const yrs = Array.from({length: Math.max(0, y1 - y0 + 1)},
    (_, i) => (y0 + i) + '-01-01').filter(
    y => Date.parse(y) > t0 && Date.parse(y) < t1).map(y =>
    '<text x="' + X(y).toFixed(1) + '" y="' + (H - 8)
    + '" text-anchor="middle" font-size="10" fill="var(--faint)"'
    + ' font-family="var(--mono)">' + y.slice(0,4) + '</text>');

  return '<div class="panel"><svg viewBox="0 0 ' + W + ' ' + H
    + '" style="width:100%;height:auto" role="img"'
    + ' aria-label="' + esc(d.company || 'Share') + ' price, annotated by chapter">'
    + bands + ticks
    + '<path d="' + path + '" fill="none" stroke="var(--accent)" stroke-width="1.6"'
    + ' stroke-linejoin="round"/>' + marks + yrs.join('')
    + '</svg><div class="hint">Weekly closes, INR. Numbered bands are the '
    + 'chapters below. Ticks on the axis are earnings calls, coloured by the '
    + 'one-day reaction and thickened where it exceeded 8% — hover for the '
    + 'quarter. ' + esc(((d.narrative || {}).chart_note)
        || 'The price is unadjusted and there has been no corporate action '
         + 'in this window.') + '</div></div>';
}

function companyNarrative(d){
  const n = d.narrative;
  if (!n) return '';
  const h = n.headline || {};

  const ev = (n.the_central_evidence || {});
  const evRows = (ev.rows || []).map(r =>
    '<tr><td class="k">' + esc(r.year) + '</td>'
    + '<td class="n">' + (r.revenue_growth_pct == null ? '—'
        : cPct(r.revenue_growth_pct)) + '</td>'
    + '<td class="n" style="color:' + (r.share_return_pct >= 0 ? 'var(--up)' : 'var(--down)')
    + '">' + cPct(r.share_return_pct) + '</td>'
    + '<td>' + esc(r.read) + '</td></tr>').join('');

  const rm = n.raw_materials_verdict || {};
  const rmRows = (rm.correlations_21d || []).map(r =>
    '<tr><td class="k">' + esc(r.series) + '</td><td class="n">'
    + r.corr.toFixed(3) + '</td></tr>').join('');

  const ATTR = {high:'c-up', partial:'c-warn'};
  const chapters = (n.chapters || []).map(c => {
    const cls = ATTR[c.attribution] || 'c-flat';
    return '<div class="panel" style="margin-bottom:12px">'
      + '<div class="callout-head"><span class="ico">' + c.n + '</span>'
      + '<span class="t">' + esc(c.title) + '</span>'
      + '<span class="right" style="color:'
      + (c.move_pct >= 0 ? 'var(--up)' : 'var(--down)') + '">'

      + '<div class="hint">' + esc(c.from) + ' → ' + esc(c.to) + ' · '
      + cNum(c.px_from) + ' → ' + cNum(c.px_to) + ' · ' + c.sessions + ' sessions · '
      + 'attribution <span class="chip ' + cls + '">' + esc(c.attribution) + '</span></div>'
      + '<ul class="plist">'
      + '<li><b>What happened.</b> ' + esc(c.what_happened) + '</li>'
      + '<li><b>What the market did.</b> ' + esc(c.what_the_market_did) + '</li>'
      + '<li><b>The lesson.</b> ' + esc(c.lesson) + '</li></ul></div>';
  }).join('');

  const reacts = (n.earnings_reactions || []).map(r =>

        + (r[k] >= 0 ? 'var(--up)' : 'var(--down)') + '">' + cPct(r[k]) + '</td>').join('')
    + '<td>' + esc(r.note) + '</td></tr>').join('');

  const unex = (n.big_moves_unexplained || []).map(r =>
    '<tr><td class="k">' + esc(r.date) + '</td>'
    + '<td class="n" style="color:' + (r.move_pct >= 0 ? 'var(--up)' : 'var(--down)')
    + '">' + cPct(r.move_pct) + '</td><td>' + esc(r.note) + '</td></tr>').join('');

  const lessons = (n.standing_lessons || []).map(x =>
    '<li>' + esc(x) + '</li>').join('');

  return '<div class="sechead">The price, and what explains it</div>'
    + '<div class="meta-line">' + esc(h.span_label || 'Listed') + ' '
    + esc(h.listed) + ' at INR ' + cNum(h.first_close,1)
    + ' · last INR ' + cNum(h.last_close,1) + ' (' + esc(h.last_date) + ') · '
    + '<b style="color:var(--up)">' + cPct(h.total_return_pct,1) + '</b> over '
    + h.sessions + ' sessions · high INR ' + cNum(h.all_time_high,1)
    + ' on ' + esc(h.all_time_high_date) + '</div>'
    + '<div class="callout accent-green"><div class="callout-head">'
    + '<span class="ico">&#9670;</span><span class="t">The thesis in one paragraph</span></div>'
    + '<div style="font-size:var(--t-body)">' + esc(n.thesis) + '</div></div>'
    + chapterChart(d)

    + '<div class="sechead">' + esc(ev.heading
        || 'Delivery versus the share price — they barely relate') + '</div>'
    + '<div class="meta-line">' + esc(ev.claim || '') + '</div>'
    + '<div class="panel"><div class="scroll"><table><thead><tr><th>year</th>'
    + '<th class="n">' + esc(ev.metric_label || 'revenue growth') + '</th>'
    + '<th class="n">share return</th>'
    + '<th>read</th></tr></thead><tbody>' + evRows + '</tbody></table></div></div>'

    + '<div class="sechead">The history, chapter by chapter</div>'
    + '<div class="meta-line">' + esc(n.chapters_note
        || ((n.chapters || []).length + ' windows, each bounded by a real turning '
            + 'point in the price rather than by the calendar.')) + '</div>'
    + chapters

    + '<div class="sechead">Every earnings reaction</div>'
    + '<div class="meta-line">' + esc(n.reactions_note
        || 'Move from the close BEFORE the call.') + '</div>'
    + '<div class="panel"><div class="scroll"><table><thead><tr><th>quarter</th>'
    + '<th>call date</th><th class="n">1d</th><th class="n">5d</th>'
    + '<th class="n">20d</th><th>what it was</th></tr></thead><tbody>'
    + reacts + '</tbody></table></div></div>'

    + '<div class="sechead">' + esc(rm.heading
        || 'Raw materials: tested, and they do not explain it') + '</div>'
    + '<div class="callout"><div class="callout-head"><span class="ico">&#8709;</span>'
    + '<span class="t">' + esc(rm.finding || '') + '</span></div>'
    + '<div style="font-size:var(--t-body)">' + esc(rm.regime_test || '') + '</div>'
    + '<ul class="plist"><li><b>Why.</b> ' + esc(rm.mechanism || '') + '</li>'
    + '<li><b>The two mild negatives.</b> ' + esc(rm.the_two_negatives || '') + '</li>'
    + '<li><b>Watch instead.</b> ' + esc(rm.what_to_watch_instead || '') + '</li></ul></div>'
    + '<div class="panel"><div class="scroll"><table><thead><tr>'

    + '</tr></thead><tbody>' + rmRows + '</tbody></table></div></div>'

    + '<div class="sechead">Moves this archive cannot explain</div>'
    + '<div class="meta-line">' + esc(n.big_moves_note || '') + '</div>'
    + '<div class="panel"><div class="scroll"><table><thead><tr><th>date</th>'
    + '<th class="n">move</th><th>note</th></tr></thead><tbody>' + unex
    + '</tbody></table></div></div>'

    + '<div class="sechead">What this name teaches</div>'

function companyGuidance(g, calls){
  if (!g || !g.length) return '';
  const order = {miss:0, pending:1, beat:2, met:3};
  const rows = g.slice().sort((a,b) => (order[a.verdict]??9) - (order[b.verdict]??9))
    .map(x => {
      const rev = (x.revisions || []).map(r =>
        '<div class="hint" style="margin-left:2px">&#8627; ' + esc(r.on) + ': ' + esc(r.to)
        + (r.why ? ' — ' + esc(r.why) : '') + '</div>').join('');
      return '<tr>'
        + '<td class="k">' + esc(x.id) + '</td>'
        + '<td>' + esc(x.metric)
        + '<div class="hint">guided ' + esc(x.guided_on) + ' · resolves ' + esc(x.resolves) + '</div></td>'
        + '<td>' + esc(x.guided) + rev + '</td>'
        + '<td>' + (x.actual == null ? '<span class="hint">not yet</span>' : esc(x.actual)) + '</td>'
        + '<td><span class="chip ' + (VERDICT_CHIP[x.verdict] || 'c-flat') + '">'
        + esc(x.verdict) + '</span></td></tr>'
        + (x.note ? '<tr><td></td><td colspan="4" class="hint" style="padding-top:0">'
            + esc(x.note) + '</td></tr>' : '');
    }).join('');
  const n = v => g.filter(x => x.verdict === v).length;
  return '<div class="sechead">Guidance ledger — what was promised, and what landed</div>'
    + '<div class="meta-line">' + g.length + ' commitments harvested from '
    + (calls || 14) + ' calls · <span class="chip c-down">' + n('miss') + ' miss</span> '
    + '<span class="chip c-up">' + n('beat') + ' beat</span> '
    + '<span class="chip c-up">' + n('met') + ' met</span> '
    + '<span class="chip c-flat">' + n('pending') + ' pending</span>'
    + ' — misses first. A commitment that was revised is graded against the '
    + 'ORIGINAL, never against the reset.</div>'
    + '<div class="panel"><div class="scroll"><table><thead><tr><th>id</th>'
    + '<th>metric</th><th>guided</th><th>actual</th><th>verdict</th></tr></thead>'
    + '<tbody>' + rows + '</tbody></table></div></div>';
}

function companyPnl(d){
  const q = d.qoq_pnl || [];
  const rows = q.map(r =>
    '<tr><td class="k">' + esc(r.period) + flagMark(r.flag) + '</td>'
    + '<td class="n">' + cNum(r.revenue) + '</td>'
    + '<td class="n">' + cNum(r.gross_margin_pct,1) + '</td>'
    + '<td class="n">' + cNum(r.ebitda,1) + '</td>'
    + '<td class="n">' + cNum(r.ebitda_margin_pct,1) + '</td>'
    + '<td class="n" style="color:' + (r.pat>=0?'var(--up)':'var(--down)') + '">'
    + cNum(r.pat,1) + '</td>'
    + '<td class="n">' + cNum(r.pat_margin_pct,1) + '</td></tr>'
    + '<tr><td></td><td colspan="6" class="hint" style="padding-top:0">'
    + esc(r.call_highlights || '') + '</td></tr>').join('');
  const fy = (d.fy_pnl || []).map(r =>
    '<tr><td class="k">' + esc(r.period) + flagMark(r.flag) + '</td>'
    + '<td class="n">' + cNum(r.revenue) + '</td>'
    + '<td class="n">' + (r.yoy_pct==null?'—':cPct(r.yoy_pct)) + '</td>'
    + '<td class="n">' + cNum(r.gross_margin_pct,1) + '</td>'
    + '<td class="n">' + cNum(r.ebitda_margin_pct,1) + '</td>'
    + '<td class="n">' + cNum(r.pat,0) + '</td>'
    + '<td class="n">' + cNum(r.pat_margin_pct,1) + '</td></tr>').join('');
  // The margin column is named by the dossier. Indian IT reports EBIT /
  // operating margin, not EBITDA; the columns keep their `ebitda*` keys for
  // the store's sake, but a heading that says EBITDA over an EBIT number is
  // the silent-mislabel shape (IT dossiers, 2026-09-16). Default keeps the
  // Avalon/steel behaviour unchanged.
  const ml = d.pnl_margin_label || 'EBITDA';
  return '<div class="sechead">P&amp;L, call to call</div>'
    // Unit comes from the dossier where given: Avalon reports in INR cr,
    // Coforge in USD m. A hardcoded label would have relabelled $278m as cr.
    + '<div class="meta-line">' + esc(d.pnl_unit || 'INR cr')
    + ', consolidated as stated on each call. '
    + cSpark(q.map(r=>r.revenue)) + ' revenue · '
    + cSpark(q.map(r=>r.ebitda_margin_pct)) + ' ' + esc(ml) + ' margin</div>'
    + '<div class="panel"><div class="scroll"><table><thead><tr><th>quarter</th>'
    + '<th class="n">revenue</th><th class="n">GM %</th><th class="n">' + esc(ml) + '</th>'
    + '<th class="n">' + esc(ml) + ' %</th><th class="n">PAT</th><th class="n">PAT %</th>'
    + '</tr></thead><tbody>' + rows + '</tbody></table></div></div>'
    + '<div class="sechead">Full years</div>'
    + '<div class="panel"><div class="scroll"><table><thead><tr><th>year</th>'
    + '<th class="n">revenue</th><th class="n">YoY</th><th class="n">GM %</th>'
    + '<th class="n">' + esc(ml) + ' %</th><th class="n">PAT</th><th class="n">PAT %</th>'
    + '</tr></thead><tbody>' + fy + '</tbody></table></div></div>';
}

function companySeries(d){
  const ob = d.order_book || [];
  const obRows = ob.map(r => '<tr><td class="k">' + esc(r.date) + '</td>'
    + '<td class="n">' + cNum(r.firm) + '</td>'
    + '<td class="n">' + (r.long_term==null?'—':cNum(r.long_term)) + '</td></tr>').join('');
  const wc = d.working_capital || [];
  const wcRows = wc.map(r => '<tr><td class="k">' + esc(r.date) + flagMark(r.flag) + '</td>'
    + '<td class="n">' + cNum(r.nwc) + '</td><td class="n">' + cNum(r.inventory) + '</td>'
    + '<td class="n">' + cNum(r.receivables) + '</td>'
    + '<td class="n">' + cNum(r.payables) + '</td></tr>').join('');
  const ms = d.manufacturing_split || [];
  const msRows = ms.map(r => '<tr><td class="k">' + esc(r.period) + '</td>'
    + '<td class="n">' + cNum(r.india_pct,0) + '</td>'
    + '<td class="n">' + cNum(r.us_pct,0) + '</td>'
    + '<td class="n">' + (r.india_ebitda_pct==null?'—':cNum(r.india_ebitda_pct,1)) + '</td>'
    + '<td class="n" style="color:var(--down)">'
    + (r.us_loss_cr==null?'—':cNum(r.us_loss_cr,1)) + '</td></tr>').join('');
  // Each block renders only when the company HAS that series. Order books and
  // an India/US manufacturing split are real for a contract manufacturer and
  // meaningless for an integrated steelmaker; an empty table with a confident
  // heading over it is worse than no section at all.
  return (ob.length ? '<div class="sechead">Order book</div>'
    + '<div class="meta-line">INR cr. ' + cSpark(ob.map(r=>r.firm)) + ' '

    + '<div class="panel"><div class="scroll"><table><thead><tr><th>as of</th>'
    + '<th class="n">firm (12–14m)</th><th class="n">long-term (15–36m)</th>'
    + '</tr></thead><tbody>' + obRows + '</tbody></table></div></div>' : '')
    + (wc.length ? '<div class="sechead">Working capital, days</div>'
    + '<div class="meta-line">' + cSpark(wc.map(r=>r.nwc)) + ' '
    + esc(d.working_capital_note
        || '148 → 112 days over the series. The one operational promise management '
         + 'has beaten every year since FY25.') + '</div>'
    + '<div class="panel"><div class="scroll"><table><thead><tr><th>as of</th>'
    + '<th class="n">NWC</th><th class="n">inventory</th><th class="n">receivables</th>'
    + '<th class="n">payables</th></tr></thead><tbody>' + wcRows
    + '</tbody></table></div></div>' : '')
    + (ms.length ? '<div class="sechead">Where it is manufactured</div>'
    + '<div class="callout accent-amber"><div class="callout-head"><span class="ico">&#9888;</span>'

    + '<div style="font-size:var(--t-body)">' + esc(d.manufacturing_split_note || '')
    + '</div></div>'
    + '<div class="panel"><div class="scroll"><table><thead><tr><th>period</th>'
    + '<th class="n">India mfg %</th><th class="n">US mfg %</th>'

/* Where the EBITDA actually comes from, by geography. Added for the second
   company in this repo: for a group whose earnings recovery was mostly an
   overseas loss going away, no other table says what happened. Local currency
   as reported per leg — deliberately NOT converted, because the conversion
   would invent precision the calls never gave. */
function companyGeography(d){
  const g = d.geography_pnl || [];
  if (!g.length) return '';
  const legs = d.geography_legs || [];
  const rows = g.map(r =>
    '<tr><td class="k">' + esc(r.period) + '</td>'
    + legs.map(l => {
        const v = r[l.key];
        return '<td class="n" style="color:' + (v == null ? 'var(--faint)'
          : v >= 0 ? 'var(--up)' : 'var(--down)') + '">'
          + (v == null ? '—' : cNum(v, l.dp == null ? 0 : l.dp)) + '</td>';
      }).join('')
    + '<td>' + esc(r.note || '') + '</td></tr>').join('');
  return '<div class="sechead">' + esc(d.geography_heading
      || 'EBITDA by geography') + '</div>'
    + '<div class="meta-line">' + esc(d.geography_note || '') + '</div>'
    + '<div class="panel"><div class="scroll"><table><thead><tr><th>period</th>'
    + legs.map(l => '<th class="n">' + esc(l.label) + '</th>').join('')
    + '<th>what moved it</th></tr></thead><tbody>' + rows
    + '</tbody></table></div></div>';
}

function companyTimelines(d){
  const risk = (d.risks_trends || []).map(r => {
    const cls = {rising:'c-up', resolved:'c-flat', fading:'c-flat', stable:'c-flat'}[r.trajectory]
      || (r.kind === 'risk' ? 'c-down' : 'c-flat');
    const ev = (r.evidence || []).map(e =>
      '<li>' + esc(e.period) + ' — &ldquo;' + esc(e.quote) + '&rdquo;</li>').join('');
    return '<div style="margin:0 0 14px"><div><b>' + esc(r.item) + '</b> '
      + '<span class="chip ' + (r.kind==='risk'?'c-down':'c-up') + '">' + esc(r.kind) + '</span> '
      + '<span class="chip ' + cls + '">' + esc(r.trajectory) + '</span> '
      + '<span class="hint">' + esc(r.first_seen) + ' → ' + esc(r.last_seen) + '</span></div>'
      + '<ul class="plist">' + ev + '</ul></div>';
  }).join('');

  const st = (d.strategy_timeline || []).map(r => {
    const cls = {realised:'c-up', commissioned:'c-up', announced:'c-warn',
                 abandoned:'c-down'}[r.realisation] || 'c-flat';
    return '<tr><td class="k">' + esc(r.date) + '</td><td>' + esc(r.title)
      + '<div class="hint">' + esc(r.detail||'') + '</div>'
      + (r.note ? '<div class="hint" style="color:var(--warn)">' + esc(r.note) + '</div>' : '')
      + '</td><td class="k">' + esc(r.type) + '</td>'
      + '<td><span class="chip ' + cls + '">' + esc(r.realisation) + '</span></td></tr>';
  }).join('');

  const ev = (d.industry_events || []).map(r => {
    const cls = {positive:'c-up', negative:'c-down', mixed:'c-warn'}[r.impact] || 'c-flat';
    return '<tr><td class="k">' + esc(r.date) + '</td><td>' + esc(r.title)
      + '<div class="hint">' + esc(r.detail||'') + '</div></td>'
      + '<td><span class="chip ' + cls + '">' + esc(r.impact) + '</span></td></tr>';
  }).join('');

  return '<div class="sechead">Risks &amp; trends — what kept being flagged</div>'
    + '<div class="meta-line">Trajectory is justified by the evidence trail below it — '
    + 'count and tone of mentions across the '
    + (((d.narrative || {}).earnings_reactions || []).length || 14)
    + ' calls, never a judgement typed over the top.</div>'
    + '<div class="panel">' + risk + '</div>'
    + '<div class="sechead">Strategy — what the company chose to do</div>'
    + '<div class="meta-line">Tracked to REALISATION, not announcement. An item stuck '
    + 'at &ldquo;announced&rdquo; is the finding.</div>'
    + '<div class="panel"><div class="scroll"><table><thead><tr><th>date</th>'
    + '<th>event</th><th>type</th><th>status</th></tr></thead><tbody>' + st
    + '</tbody></table></div></div>'
    + '<div class="sechead">Industry events — what happened to it</div>'
    + '<div class="meta-line">Exogenous only. The test: could management have decided '
    + 'otherwise? If yes it sits in the strategy table instead.</div>'
    + '<div class="panel"><div class="scroll"><table><thead><tr><th>date</th>'
    + '<th>event</th><th>impact</th></tr></thead><tbody>' + ev
    + '</tbody></table></div></div>';
}

function companyMixAndGaps(d){

    {key:'industrial', label:'industrial'}, {key:'mobility', label:'mobility'},

    '<tr><td class="k">' + esc(r.period) + '</td>'
    + cols.map(c => '<td class="n">' + (r[c.key]==null?'—':r[c.key]+'%') + '</td>').join('')

  const bbRow = (d.box_build_pct || []).map(r =>
    '<span class="pill">' + esc(r.period) + ' ' + r.value + '%</span>').join(' ');

    '<tr><td class="k">' + esc(r.period) + '</td>'

  return ((d.segment_mix || []).length

    + mix + '</tbody></table></div>'

    + '<th class="n">' + esc(d.capital_efficiency_cols
        ? d.capital_efficiency_cols[0] : 'asset turns') + '</th>'
    + '<th class="n">' + esc(d.capital_efficiency_cols
        ? d.capital_efficiency_cols[1] : 'ROCE') + '</th></tr></thead><tbody>'
    + ce + '</tbody></table></div></div>' : '')
    + '<div class="sechead">Raw materials</div>'
    + '<div class="meta-line">Status <b>' + esc(rm.status || 'unavailable') + '</b> — '
    + esc(rm.reason || '') + '</div>'
    + '<div class="panel"><ul class="plist">' + rmRows + '</ul>'
    + '<div class="hint">' + esc(rm.note || '') + '</div></div>'
    + '<div class="sechead">What a transcript cannot tell you</div>'
    + '<div class="callout"><div class="callout-head"><span class="ico">&#9675;</span>'

function companyDocs(d){
  const base = '/data/companies/' + encodeURIComponent(d.selected) + '/sources/';

    '<tr><td class="k"><a href="' + base + encodeURIComponent(x.file)
