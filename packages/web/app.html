<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investment Micro-System</title>
<style>  /* ===================================================================
     DESIGN SYSTEM

     Three rules hold this together. Breaking one is what made the old
     sheet feel like an admin panel:

     1. DEPTH, NOT OUTLINES. The ground is grey, panels are white and
        float on a soft shadow. Nine components used to share one
        `surface + 1px border + radius:3px` recipe, so the page was a
        uniform field of rectangles with nothing in front of anything.
        Borders now belong to TABLES and DIVIDERS only.

     2. ONE VOICE FOR DATA. Mono is for numbers and identifiers.
        Mono+uppercase+tracked is for section labels and status badges,
        and nothing else — eleven selectors used to shout in that voice
        at once, which is the same as none of them shouting.

     3. SCALES, NOT VALUES. Spacing comes from --s*, type from --t*,
        weight from 400/500/600/700. The old sheet used 17 ad-hoc
        paddings and weights (560, 640, 650, 660) that no system UI font
        has, so they snapped and the hierarchy silently vanished.
     =================================================================== */
  :root{
    color-scheme:light dark;

    /* spacing, 4px base */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;

    /* radii */
    --r-sm:5px; --r:9px; --r-pill:999px;

    /* type — integers only. Fractional px (the old 9.5/11.5/13.5/14.5)
       land on half-pixels and blur on any non-retina desk monitor. */
    --t-micro:10px; --t-label:11px; --t-sm:12px; --t-body:13px;
    --t-md:14px; --t-lg:16px; --t-xl:20px; --t-2xl:26px;
    --measure:72ch;         /* prose cap. Unset, notes ran to 1560px. */

    --ground:#F1F3F6; --surface:#FFFFFF; --alt:#F6F8FA; --sunken:#E9EDF1;
    --ink:#12161B; --soft:#525C69; --faint:#666F7C;
    --rule:#DDE3E9; --hair:#EBEFF3;
    --accent:#1F4E82; --accent-soft:#E7EEF7;
    --up:#12634B; --up-soft:#DFEDE7;
    --warn:#875416; --warn-soft:#F6EAD7;
    --down:#8C2F2A; --down-soft:#F7E2E0;

    --shadow-1:0 1px 2px rgba(16,24,40,.05), 0 1px 1px rgba(16,24,40,.03);
    --shadow-2:0 2px 4px rgba(16,24,40,.05), 0 6px 16px -6px rgba(16,24,40,.12);

    --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      /* The old dark mode put 7 units between ground (#121519) and
         surface (#191D22). Panels were invisible, which is most of why
         the dark page read as a flat wall. This is ~25 units plus a
         real shadow. */
      --ground:#0D1014; --surface:#171B21; --alt:#1D242B; --sunken:#101418;
      --ink:#E5EAEF; --soft:#A2ADBA; --faint:#7F8A97;
      --rule:#2A323B; --hair:#1F262D;
      --accent:#8AB3E0; --accent-soft:#17273A;
      --up:#5FBFA1; --up-soft:#12302A;
      --warn:#DBA65E; --warn-soft:#332810;
      --down:#DF7F77; --down-soft:#37211F;
      --shadow-1:0 1px 2px rgba(0,0,0,.45);
      --shadow-2:0 2px 6px rgba(0,0,0,.45), 0 10px 24px -8px rgba(0,0,0,.55);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
       font-size:var(--t-md);line-height:1.55;-webkit-font-smoothing:antialiased;
       text-rendering:optimizeLegibility}
  .wrap{max-width:1560px;margin:0 auto;padding:0 var(--s5) var(--s7)}

  /* ---------------------------------------------------------------- shell */
  header{display:flex;align-items:baseline;gap:var(--s4);flex-wrap:wrap;
         padding:var(--s5) 0 var(--s3)}
  h1{font-size:var(--t-lg);font-weight:600;letter-spacing:-.01em;margin:0;
     white-space:nowrap}
  .meta{font-family:var(--mono);font-size:var(--t-label);color:var(--faint);
        display:flex;gap:var(--s3);flex-wrap:wrap;margin-left:auto;
        align-items:center;font-variant-numeric:tabular-nums}

  select,button,input{font:inherit;color:inherit}
  select,input[type=number],input[type=text]{background:var(--surface);
        border:1px solid var(--rule);border-radius:var(--r-sm);
        padding:5px var(--s2);box-shadow:var(--shadow-1);
        font-size:var(--t-body)}
  select:hover{border-color:var(--faint)}
  button{background:var(--accent);color:#fff;border:0;border-radius:var(--r-sm);
         padding:6px var(--s3);cursor:pointer;font-size:var(--t-body);
         font-weight:500;box-shadow:var(--shadow-1)}
  button:hover{filter:brightness(1.08)}
  button.ghost{background:var(--surface);color:var(--accent);
               border:1px solid var(--rule)}
  button.ghost:hover{background:var(--accent-soft);border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:default;filter:none}
  button:focus-visible,select:focus-visible,input:focus-visible,
  .tab:focus-visible,.stab:focus-visible{outline:2px solid var(--accent);
       outline-offset:2px}

  /* Both navs STICK. Losing the tab bar while scrolling a long chart column is
     the other half of the readability complaint — you can end up several
     screens into a view with nothing on screen saying which one it is.
     The blur is what lets content pass UNDER it without a hard seam. */
  .navs{position:sticky;top:0;z-index:20;
        background:var(--ground);
        background:color-mix(in srgb, var(--ground) 88%, transparent);
        backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
        margin:0 calc(var(--s5) * -1);padding:2px var(--s5) 0;
        box-shadow:0 10px 12px -12px rgba(0,0,0,.45)}
  @supports not (backdrop-filter:blur(4px)){
    .navs{background:var(--ground)}
  }

  /* Sector tabs — the primary axis, so they get size and a real indicator. */
  nav.snav{display:flex;gap:var(--s1);margin:0;flex-wrap:nowrap;
        overflow-x:auto;overflow-y:hidden;
        box-shadow:inset 0 -1px 0 var(--rule);
        scrollbar-width:none;-ms-overflow-style:none}
  nav.snav::-webkit-scrollbar{display:none}
  .stab{background:none;border:0;border-bottom:2px solid transparent;
        color:var(--soft);padding:var(--s3) var(--s4) 10px;cursor:pointer;
        font-size:var(--t-md);font-weight:500;letter-spacing:-.01em;
        border-radius:0;display:flex;align-items:center;gap:var(--s2);
        flex:0 0 auto;white-space:nowrap;
        transition:color .12s, border-color .12s}
  .stab[aria-selected=true]{color:var(--ink);font-weight:600;
        border-bottom-color:var(--accent)}
  .stab:hover{color:var(--ink)}
  .stab .n{font-family:var(--mono);font-size:var(--t-micro);letter-spacing:.07em;
           text-transform:uppercase;padding:2px 6px;border-radius:var(--r-pill);
           background:var(--sunken);color:var(--faint);font-weight:600}
  .stab[aria-selected=true] .n{background:var(--accent-soft);color:var(--accent)}

  /* View tabs — secondary, so pills rather than a second underline row.
     Two stacked underline bars was ambiguous about which axis was which. */
  nav.vnav{display:flex;gap:2px;margin:0;padding:var(--s2) 0 var(--s2);
           background:transparent;flex-wrap:nowrap;overflow-x:auto;
           scrollbar-width:none;-ms-overflow-style:none}
  nav.vnav::-webkit-scrollbar{display:none}
  .tab{background:none;border:0;color:var(--soft);padding:5px var(--s3);
       cursor:pointer;font-size:var(--t-body);font-weight:500;flex:0 0 auto;
       white-space:nowrap;
       border-radius:var(--r-pill);transition:background .12s, color .12s}
  .tab:hover{background:var(--sunken);color:var(--ink)}
  .tab[aria-selected=true]{color:#fff;background:var(--accent);font-weight:600}
  nav.vnav[hidden]{display:none}

  section{display:none;padding-top:var(--s5)}
  section.on{display:block}

  /* Section label. Deliberately quiet and deliberately mono-uppercase: it is
     a LABEL, not a title, and now that .k/.tile .k/th no longer use this
     voice it reads as structure instead of competing. */
  h2{font-family:var(--mono);font-size:var(--t-label);letter-spacing:.13em;
     text-transform:uppercase;color:var(--faint);font-weight:600;
     margin:var(--s6) 0 var(--s3);padding-bottom:var(--s2);
     border-bottom:1px solid var(--hair)}
  h2:first-child{margin-top:0}
  h3{font-size:var(--t-md);font-weight:600;letter-spacing:-.01em}

  /* ---------------------------------------------------------------- panels */
  .scroll{overflow-x:auto;border-radius:var(--r);background:var(--surface);
          box-shadow:var(--shadow-1);margin-bottom:var(--s2)}
  table{border-collapse:collapse;width:100%;font-size:var(--t-body)}
  /* Column heads in SANS. Uppercase mono here was one of the eleven shouting
     voices, and it competed with h2 directly above it. */
  th{font-family:var(--sans);font-size:var(--t-label);letter-spacing:.04em;
     text-transform:uppercase;color:var(--faint);text-align:left;
     padding:10px var(--s3);border-bottom:1px solid var(--rule);
     white-space:nowrap;font-weight:600;position:sticky;top:0;
     background:var(--surface)}
  td{padding:9px var(--s3);border-bottom:1px solid var(--hair);
     vertical-align:middle}
  tr:last-child td{border-bottom:0}
  td.n,th.n{text-align:right;font-family:var(--mono);
            font-variant-numeric:tabular-nums}
  td.k{font-family:var(--mono);font-size:var(--t-sm);white-space:nowrap;
       color:var(--soft)}
  td.flat{color:var(--faint)}
  tbody tr{transition:background .1s}
  tbody tr:hover{background:var(--alt)}

  /* ------------------------------------------------------- badges + values */
  .chip,.st{display:inline-block;font-family:var(--mono);font-size:var(--t-micro);
        letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;
        border-radius:var(--r-pill);font-weight:600;white-space:nowrap}
  .c-up,.st-ready{background:var(--up-soft);color:var(--up)}
  .c-warn,.st-thin{background:var(--warn-soft);color:var(--warn)}
  .c-down,.st-blocked{background:var(--down-soft);color:var(--down)}
  .c-flat{background:var(--sunken);color:var(--faint)}
  .st-open{background:var(--accent-soft);color:var(--accent)}

  .score{font-family:var(--mono);font-weight:600;font-size:var(--t-md);
         font-variant-numeric:tabular-nums}
  .bar{height:6px;border-radius:var(--r-pill);background:var(--sunken);
       position:relative;min-width:70px;overflow:hidden}
  .bar i{position:absolute;top:0;bottom:0;left:50%;background:var(--accent)}

  /* --------------------------------------------------------- KPI tiles
     .tiles/.stats and .tile/.stat were near-duplicate components. Same
     thing, so: one look, both selectors kept. */
  .tiles,.stats{display:grid;gap:var(--s3);margin-bottom:var(--s5);
        grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .tile,.stat{background:var(--surface);border-radius:var(--r);
        padding:var(--s3) var(--s4);box-shadow:var(--shadow-1);
        position:relative;overflow:hidden}
  /* The status edge is an inset bar, not a border-left: a coloured border
     changed the box's geometry, so a good tile and a neutral one did not
     line up their text. */
  .tile::before,.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;
        width:3px;background:transparent}
  .tile.good::before{background:var(--up)}
  .tile.warn::before{background:var(--warn)}
  .tile.bad::before{background:var(--down)}
  .tile .k,.stat .k{font-family:var(--sans);font-size:var(--t-label);
        letter-spacing:.03em;text-transform:uppercase;color:var(--faint);
        font-weight:600}
  .tile .v,.stat .v{font-family:var(--mono);font-size:var(--t-xl);font-weight:600;
        line-height:1.25;font-variant-numeric:tabular-nums;
        letter-spacing:-.02em;margin-top:2px}
  .tile .s,.stat .s{font-size:var(--t-sm);color:var(--faint);line-height:1.45;
        margin-top:2px}

  /* ---------------------------------------------------------- text + notes */
  .note{font-size:var(--t-body);color:var(--soft);margin:0 0 var(--s4);
        max-width:var(--measure)}
  .hint{font-family:var(--mono);font-size:var(--t-label);color:var(--faint)}
  .err{background:var(--down-soft);color:var(--down);padding:var(--s3) var(--s4);
       border-radius:var(--r);margin:var(--s4) 0;font-family:var(--mono);
       font-size:var(--t-sm);box-shadow:var(--shadow-1)}
  .loading{color:var(--faint);padding:var(--s6) 0;font-family:var(--mono);
           font-size:var(--t-sm)}
  .banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);
          padding:10px var(--s4);margin:0 0 var(--s4);font-size:var(--t-body);
          box-shadow:inset 3px 0 0 var(--warn);max-width:var(--measure)}
  .banner b{font-family:var(--mono);font-weight:600}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* ----------------------------------------------------------- pair view */
  .ctl{display:flex;gap:var(--s4);flex-wrap:wrap;align-items:flex-end;
       background:var(--surface);border-radius:var(--r);
       padding:var(--s3) var(--s4);margin-bottom:var(--s4);
       box-shadow:var(--shadow-1)}
  .ctl label{display:flex;flex-direction:column;gap:var(--s1);
       font-family:var(--sans);font-size:var(--t-label);letter-spacing:.03em;
       text-transform:uppercase;color:var(--faint);font-weight:600}
  .ctl select{min-width:150px}
  .ctl .sidebar-l{border-left:3px solid var(--up);padding-left:var(--s2)}
  .ctl .sidebar-s{border-left:3px solid var(--down);padding-left:var(--s2)}

  .drivers{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s4)}
  .drv{background:var(--surface);border-radius:var(--r-sm);
       padding:var(--s2) var(--s3);font-family:var(--mono);
       font-size:var(--t-label);min-width:150px;box-shadow:var(--shadow-1)}
  .drv b{display:block;font-size:var(--t-md);font-weight:600;
         font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .drv span{font-family:var(--sans);color:var(--faint);font-size:var(--t-micro);
       letter-spacing:.04em;text-transform:uppercase;font-weight:600}

  .chart{background:var(--surface);border-radius:var(--r);
         padding:var(--s4) var(--s4) var(--s2);margin-bottom:var(--s1);
         box-shadow:var(--shadow-1)}
  /* max-height keeps the pair chart from occupying an entire viewport on a wide
     monitor, which is what made the page feel unscrollable even where nothing
     was trapping the wheel. */
  .chart svg{display:block;width:100%;height:auto;max-height:62vh}
  .cd svg{max-height:none}
  .ax{fill:var(--faint);font-family:var(--mono);font-size:var(--t-label)}
  .axl{fill:var(--faint);font-family:var(--sans);font-size:var(--t-micro);
       letter-spacing:.06em;text-transform:uppercase;font-weight:600}
  .grid{stroke:var(--hair);stroke-width:1}
  .zero{stroke:var(--rule);stroke-width:1;stroke-dasharray:3 3}

  .legend{display:flex;gap:var(--s4);flex-wrap:wrap;margin:var(--s3) 0 0;
          font-size:var(--t-sm);color:var(--soft);align-items:center}
  .legend i{display:inline-block;width:20px;height:0;border-top-width:2.5px;
            margin-right:6px;vertical-align:middle}

  /* ------------------------------------------------------------- cards
     The card grid sits in a SUNKEN well, so a group of cards reads as one
     object. Previously the well and the cards were both bordered boxes. */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
         gap:var(--s3);padding:var(--s3);border-radius:var(--r);
         background:var(--sunken)}
  .cd{background:var(--surface);border-radius:var(--r-sm);
      padding:var(--s3) var(--s3) var(--s2);box-shadow:var(--shadow-1)}
  .cd h3{margin:0 0 2px;font-size:var(--t-md);font-weight:600;display:flex;
         align-items:baseline;gap:var(--s2)}
  .cd h3 .g,.nhead h3 .g{font-family:var(--mono);font-size:var(--t-micro);
            letter-spacing:.06em;text-transform:uppercase;color:var(--faint);
            font-weight:600}
  .cd .row{display:flex;gap:var(--s4);font-family:var(--mono);
           font-size:var(--t-label);color:var(--faint);margin-bottom:5px;
           font-variant-numeric:tabular-nums}
  .cd .row b{color:var(--ink);font-size:var(--t-body);font-weight:600}
  .cd{transition:box-shadow .12s}
  .cd:hover{box-shadow:var(--shadow-2)}
  .cd.pick-l{box-shadow:var(--shadow-1), inset 3px 0 0 var(--up)}
  .cd.pick-l:hover{box-shadow:var(--shadow-2), inset 3px 0 0 var(--up)}
  .cd.pick-s:hover{box-shadow:var(--shadow-2), inset 3px 0 0 var(--down)}
  .cd.pick-s{box-shadow:var(--shadow-1), inset 3px 0 0 var(--down)}

  /* ------------------------------------------ stacked score+price rows */
  .nrow{background:var(--surface);border-radius:var(--r);
        padding:var(--s3) var(--s4) var(--s2);margin-bottom:var(--s4);
        box-shadow:var(--shadow-1)}
  .nhead{display:flex;align-items:baseline;gap:var(--s4);flex-wrap:wrap;
         margin-bottom:var(--s2)}
  .nhead h3{margin:0;font-size:var(--t-lg);font-weight:600;display:flex;
            align-items:baseline;gap:var(--s2)}
  .nstat{display:flex;gap:var(--s4);flex-wrap:wrap;margin-left:auto;
         font-family:var(--mono);font-size:var(--t-label);color:var(--faint);
         font-variant-numeric:tabular-nums}
  .nstat b{color:var(--ink);font-size:var(--t-body);font-weight:600}

  /* ------------------------------------------------------ run step chips */
  .steps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--s2)}
  .stp{font-family:var(--mono);font-size:var(--t-label);padding:3px var(--s2);
       border-radius:var(--r-pill);background:var(--sunken);color:var(--soft);
       white-space:nowrap}
  .stp.ok{background:var(--up-soft);color:var(--up)}
  .stp.skip{background:var(--warn-soft);color:var(--warn)}
  .stp.bad{background:var(--down-soft);color:var(--down)}

  /* --------------------------------- a sector with prices but no spec */
  .await{background:var(--surface);border-radius:var(--r);
         padding:var(--s5);margin-bottom:var(--s5);
         box-shadow:var(--shadow-1), inset 3px 0 0 var(--accent)}
  .await h3{margin:0 0 var(--s2);font-size:var(--t-lg);font-weight:600}
  .await p{margin:0 0 10px;max-width:var(--measure);color:var(--soft);
           font-size:var(--t-body)}
  .await ol{margin:var(--s3) 0 0;padding-left:22px;color:var(--soft);
            font-size:var(--t-body);max-width:var(--measure)}
  .await ol li{margin-bottom:var(--s1)}
  .await code,code{font-family:var(--mono);font-size:var(--t-sm);
              background:var(--sunken);padding:1px 5px;border-radius:3px}

  /* ------------------------------------------------------------- narrow
     The portable snapshot is opened on a phone, so this is a real target
     rather than a courtesy. 24px gutters cost 13% of a 375px screen. */
  @media (max-width:640px){
    .wrap{padding-left:var(--s4);padding-right:var(--s4)}
    .navs{margin-left:calc(var(--s4) * -1);margin-right:calc(var(--s4) * -1);
          padding-left:var(--s4);padding-right:var(--s4)}
    header{padding-top:var(--s4);gap:var(--s2)}
    .meta{margin-left:0;width:100%;gap:var(--s2)}
    h1{font-size:var(--t-md)}
    section{padding-top:var(--s4)}
    .tiles,.stats{gap:var(--s2);grid-template-columns:1fr}
    .cards{grid-template-columns:1fr;padding:var(--s2)}
    .nrow,.await{padding-left:var(--s3);padding-right:var(--s3)}
    .await{padding-top:var(--s4);padding-bottom:var(--s4)}
    h2{margin-top:var(--s5)}
    /* A table narrower than its own content still needs the page not to
       move; the .scroll wrapper owns that, so give it a visible edge. */
    .scroll{border-radius:var(--r-sm)}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Investment Micro-System</h1>
    <div class="meta">
      <span id="winwrap">window
        <select id="win">
          <option value="5">5d</option>
          <option value="10">10d</option>
          <option value="30" selected>30d</option>
          <option value="60">60d</option>
        </select>
      </span>
      <span id="refresh"></span>
      <span id="asof">—</span>
      <span id="fxwrap"><span id="fx">—</span> <span id="ovr">—</span></span>
      <button class="ghost" id="reload">Refresh</button>
    </div>
  </header>

  <div class="navs">
    <nav class="snav" id="snav" role="tablist" aria-label="sector">
      <span class="loading" style="padding:10px 4px">sectors…</span>
    </nav>
    <nav class="vnav" id="vnav" role="tablist" aria-label="view">
      <button class="tab" role="tab" aria-selected="true" data-t="pair">Scores &amp; Price</button>
      <button class="tab" role="tab" aria-selected="false" data-t="scores">Bridge</button>
      <button class="tab" role="tab" aria-selected="false" data-t="pos">Positioning</button>
    </nav>
  </div>

  <div id="err"></div>

  <section id="s-pair" class="on"><div class="loading">loading…</div></section>
  <section id="s-scores"><div class="loading">loading…</div></section>
  <section id="s-pos"><div class="loading">loading…</div></section>
  <section id="s-sector"><div class="loading">loading…</div></section>
  <section id="s-overview"><div class="loading">loading…</div></section>
  <section id="s-flows"><div class="loading">loading…</div></section>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = v => v == null ? '—' : (v*100).toFixed(2) + '%';
const num = (v, d=0) => v == null ? '—' :
  v.toLocaleString('en-IN', {minimumFractionDigits:d, maximumFractionDigits:d});

function showErr(m){ $('#err').innerHTML = m ? `<div class="err">${esc(m)}</div>` : ''; }

// score 1–5 with 3 neutral: bar grows from the centre, coloured by side
function bar(s){
  if (s == null) return '<div class="bar"></div>';
  const d = (s - 3) / 2, w = Math.abs(d) * 50;
  const col = d > 0 ? 'var(--up)' : 'var(--down)';
  const left = d > 0 ? 50 : 50 - w;
  return `<div class="bar"><i style="left:${left}%;width:${w}%;background:${col}"></i></div>`;
}
function verdictChip(v){
  if (!v) return '';
  if (v.startsWith('no bridge')) return `<span class="chip c-warn">${esc(v)}</span>`;
  if (v === 'immaterial') return '<span class="chip c-flat">immaterial</span>';
  if (v === 'positive') return '<span class="chip c-up">positive</span>';
  if (v === 'negative') return '<span class="chip c-down">negative</span>';
  return `<span class="chip c-flat">${esc(v)}</span>`;
}

function renderGroup(g){
  const drv = g.drivers.map(d => `
    <div class="drv">
      <span>${esc(d.series)}${d.origin==='cited'?' · cited':''}</span>
      <b style="color:${d.pct>=0?'var(--up)':'var(--down)'}">${d.pct>=0?'+':''}${d.pct.toFixed(2)}%</b>
      ${num(d.from,2)} → ${num(d.to,2)}
      ${d.stale_days>7?`<span style="color:var(--warn)">stale ${d.stale_days}d</span>`:''}
    </div>`).join('');

  const rows = g.rows.map(r => `
    <tr>
      <td class="k">${esc(r.entity)}</td>
      <td class="n">${num(r.d_revenue_cr)}</td>
      <td class="n">${num(r.d_cost_cr)}</td>
      <td class="n" style="color:${r.d_ebitda_cr>=0?'var(--up)':'var(--down)'}">${num(r.d_ebitda_cr)}</td>
      <td class="n">${r.d_ebitda_per_t==null?'—':num(r.d_ebitda_per_t)}</td>
      <td class="n">${pct(r.pct_of_ebitda)}</td>
      <td class="n"><span class="score">${r.score==null?'—':r.score.toFixed(2)}</span></td>
      <td style="width:90px">${bar(r.score)}</td>
      <td>${verdictChip(r.verdict)}</td>
    </tr>`).join('');

  const pairs = g.pairs.map(p => `
    <tr>
      <td class="k">long <b>${esc(p.long)}</b> / short <b>${esc(p.short)}</b></td>
      <td class="n"><span class="score">${p.pair_score.toFixed(2)}</span></td>
      <td style="width:90px">${bar(p.pair_score)}</td>
      <td class="n">${pct(p.pct_spread)}</td>
      <td class="n hint">${p.naive_diff.toFixed(2)}</td>
    </tr>`).join('');

  return `
    <h2>${esc(g.peer_group)}</h2>
    <div class="drivers">${drv || '<span class="hint">no series moved in this window</span>'}</div>
    <div class="scroll"><table>
      <thead><tr><th>Entity</th><th class="n">Δrev cr</th><th class="n">Δcost cr</th>
        <th class="n">ΔEBITDA cr</th><th class="n">₹/t</th><th class="n">%EBITDA</th>
        <th class="n">Score</th><th></th><th>Verdict</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="scroll"><table>
      <thead><tr><th>Pair</th><th class="n">Pair score</th><th></th>
        <th class="n">%EBITDA spread</th><th class="n">naive diff</th></tr></thead>
      <tbody>${pairs || '<tr><td colspan="5" class="hint">no scoreable pair</td></tr>'}</tbody>
    </table></div>
    <p class="note">Pair score is the <b>spread run through the same curve</b>, not the
      difference of two scores — the last column shows what the naive difference would
      have read, which understates badly in the tails.</p>`;
}

async function loadScores(){
  const w = $('#win').value;
  const r = await fetch(`/api/scores?window=${w}`);
  const d = await r.json();
  if (d.error) return showErr(d.error);
  /* PEER GROUPS OF THE SELECTED SECTOR, not a hardcoded pair.
     This read `d.aluminium_primary` and `d.zinc` as literals, so the Bridge view
     showed non-ferrous whatever tab you were on — the Steel tab rendered its
     commodity list correctly and then a bridge for Hindalco. /api/scores has
     returned every group since steel went live; only this function had not been
     told. The nav already carries peer_groups per sector, so it is the source. */
  const e = SECTORS.find(x => x.id === SECTOR) || {};
  const groups = (e.peer_groups || []).map(k => d[k]).filter(Boolean);
  if (!groups.length){
    $('#s-scores').innerHTML = `<p class="note">No peer group in this sector
      returned a bridge. If the sector is live in <code>engine.SECTORS</code>,
      check that <code>/api/scores</code> lists its groups.</p>`;
    return;
  }
  /* Header facts come from the FIRST group rather than being averaged: as_of and
     USDINR are run-level and identical across groups, and overrides_applied is
     per-group — summing it would double-count an override that touches two. */
  const g = groups[0];
  $('#asof').textContent = 'as of ' + g.as_of;
  $('#fx').textContent = 'USDINR ' + g.usdinr.toFixed(2);
  $('#ovr').textContent = g.overrides_applied + ' override' +
    (g.overrides_applied === 1 ? '' : 's');
  $('#s-scores').innerHTML = groups.map(renderGroup).join('');
}

function spark(vals){
  if (!vals || vals.length < 2) return '';
  const w = 110, h = 22, lo = Math.min(...vals), hi = Math.max(...vals);
  const rng = (hi - lo) || 1;
  const pts = vals.map((v,i) =>
    `${(i/(vals.length-1)*w).toFixed(1)},${(h - (v-lo)/rng*h).toFixed(1)}`).join(' ');
  const last = vals[vals.length-1], up = last >= vals[0];
  const col = up ? 'var(--up)' : 'var(--down)';
  return `<svg width="${w}" height="${h}" aria-hidden="true">
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.4"/>
    <circle cx="${w}" cy="${(h-(last-lo)/rng*h).toFixed(1)}" r="2" fill="${col}"/></svg>`;
}
const buChip = b => !b ? '<span class="chip c-flat">—</span>' :
  b === 'long_buildup'   ? '<span class="chip c-up">long buildup</span>' :
  b === 'short_covering' ? '<span class="chip c-up">short covering</span>' :
  b === 'short_buildup'  ? '<span class="chip c-down">short buildup</span>' :
  b === 'long_unwinding' ? '<span class="chip c-down">long unwinding</span>' :
  `<span class="chip c-flat">${esc(b)}</span>`;

    <div class="scroll"><table><thead><tr>

      <th>Buildup 3m</th><th>Buildup 15d</th><th class="n">%ile</th>

/* ====================================================================
   PAIR VIEW — the persisted tape, not the live bridge
   ==================================================================== */

// Mirror of packages/score/scoring.py. It lives in JS so switching the pair
// re-scores instantly with no server round trip. k / p / form / sign all come
// FROM the server (tape.curves), so specs/scoring.yaml remains the single
// source of calibration — only the arithmetic is duplicated here, never the
// constants. If the curve form ever changes, this must be updated with it.
const NEUTRAL = 3.0, HALF = 2.0;
const TAPE = {};
const P = {pillar: 'composite', span: 'all'};   // legs removed with the pair view
const SPANS = {'1m':30, '3m':91, '6m':182, '1y':365, '3y':1095, 'all':null};

async function getTape(pillar){
  /* SEND THE SELECTED SECTOR'S PEER GROUPS. Without this the tape returns
     every scored name and the Pair tab draws the same chart on every sector —
     the same sector-blindness that loadScores() had, in the neighbouring
     view. */
  const se = SECTORS.find(x => x.id === SECTOR) || {};
  const gq = (se.peer_groups || []).join(',');
  /* AND CACHE ON THE GROUPS, not on the pillar alone. The request above was
     made sector-aware; this key was not, so the FIRST sector's tape was
     handed to every later one under the same pillar and only a page reload
     cleared it. Keyed on gq rather than on SECTOR because the response
     depends on the groups: two sectors sharing a group set may legitimately
     share the entry, and a sector with none gets its own. */
  const ck = gq + '|' + pillar;
  if (!TAPE[ck]){
    const d = await (await fetch('/api/tape?pillar=' + encodeURIComponent(pillar) +
      (gq ? '&groups=' + encodeURIComponent(gq) : ''))).json();
    if (d.error) throw new Error(d.error);
    TAPE[ck] = d;
  }
  return TAPE[ck];
}

function spanCut(tp){
  const days = SPANS[P.span];
  if (!days || !tp.as_of_max) return null;
  const d = new Date(Date.parse(tp.as_of_max) - days * 864e5);
  return d.toISOString().slice(0, 10);
}

function niceCeil(v){
  if (!(v > 0)) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 1.5, 2, 2.5, 3, 4, 5, 7.5, 10]) if (v <= m * e) return m * e;
  return 10 * e;
}
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
// Over a multi-year span the day of month is noise and the year is the thing
// you need; inside a few months it is the other way round.
const dtick = (d, wide) => wide
  ? MON[+d.slice(5, 7) - 1] + " '" + d.slice(2, 4)
  : d.slice(8, 10) + ' ' + MON[+d.slice(5, 7) - 1];

function pathOf(pts, X, Y){
  let out = '', pen = false;
  for (const p of pts){
    if (p.v == null){ pen = false; continue; }
    out += (pen ? 'L' : 'M') + X(p.d).toFixed(1) + ' ' + Y(p.v).toFixed(1) + ' ';
    pen = true;
  }
  return out.trim();
}

function tradingDaysSince(iso){
  let n = 0;
  const d = new Date(iso + 'T00:00:00'), now = new Date();
  now.setHours(0, 0, 0, 0);
  while (d < now){ d.setDate(d.getDate() + 1);
    const w = d.getDay(); if (w !== 0 && w !== 6) n++; }
  return n;
}
function showRefresh(tp){
  const r = tp.refresh || {}, el = $('#refresh');
  const age = tp.as_of_max ? tradingDaysSince(tp.as_of_max) : null;
  let cls = 'c-up', txt, tip;
  if (r.state === 'never'){
    cls = 'c-warn'; txt = 'never refreshed';
    tip = r.why + ' — run: python packages/refresh.py';
  } else if (r.state === 'failed'){
    cls = 'c-down'; txt = 'refresh FAILED ' + (r.day || '');
    tip = 'failed steps: ' + (r.failed_steps || []).join(', ');
  } else if (age !== null && age >= 2){
    cls = 'c-warn'; txt = 'scores ' + age + ' trading days old';
    tip = 'last refresh ' + (r.day || '?') + ', store as of ' + tp.as_of_max;
  } else if (r.feeds_ok === false){
    // THE CASE THE LIGHT USED TO MISS. Every step succeeded and the scores
    // carry today's date, but they were computed on inputs that stopped
    // printing days ago. "The run worked" and "the inputs are current" are
    // different claims; only the first was ever being made.
    const s = r.stale_feeds || [];
    cls = 'c-warn';
    txt = s.length + ' feed' + (s.length === 1 ? '' : 's') + ' stale';
    tip = s.map(f => `${f.series} (${f.feed}) ${f.age}, limit ${f.limit}`).join(' · ');
  } else {
    txt = 'refreshed ' + (r.day || '?');
    tip = 'store as of ' + tp.as_of_max + '; not covered by an unattended run: '
        + (r.manual || []).map(m => m.name).join(', ');
  }
  const extra = (r.stale_feeds || []).length && r.feeds_ok === false
    ? '' : ((r.stale_feeds || []).length
        ? ' · stale: ' + r.stale_feeds.map(f => f.series).join(', ') : '');
  el.innerHTML = `<span class="chip ${cls}" title="${esc(tip + extra)}">${esc(txt)}</span>`;
}

// ===================== scores and price, one name per row =====================
// REPLACED THE PAIR VIEW on 2026-08-24 at the PM's request. What is gone: the
// long/short selectors, the relative-performance chart, the pair-score stats and
// the two pair warnings (cross-peer-group, and the HZL/VEDL "no economics signal
// by construction" note). Those warnings existed because a PAIR can mislead;
// reading one name's own score against its own price cannot mislead in the same
// way, so they have no subject any more.
//
// WHAT IS KEPT AND WHY. The corporate-action break is kept: VEDL's -64.9% on
// 2026-04-30 is a real unadjusted demerger, so the quoted price steps
// mechanically and the line must not be drawn across it. The score line is NOT
// broken there — those are the values that were actually stored.
//
// Two independent y-axes per row, each scaled to its own range. The shapes are
// comparable, the levels are not, and the axis labels say so.
function nameChart(pts, breaks, cur){
  const W = 1000, H = 190, ML = 46, MR = 54, MT = 14, MB = 26;
  const ok = pts.filter(p => p.score != null && p.close != null);
  if (ok.length < 2) return '<div class="hint">not enough points to draw</div>';
  const t = d => Date.parse(d);
  const x0 = t(ok[0].d), x1 = t(ok[ok.length - 1].d);
  const X = d => ML + (x1 === x0 ? 0 : (t(d) - x0) / (x1 - x0) * (W - ML - MR));
  const sc = ok.map(p => p.score), pr = ok.map(p => p.close);
  // The score axis is pinned to the 1-5 scale, not to the data range. A name
  // that sat between 2.9 and 3.0 all year would otherwise fill the panel with
  // noise and read as violent movement.
  const sLo = 1, sHi = 5;
  const pLo = Math.min(...pr), pHi = Math.max(...pr);
  const YS = v => MT + (1 - (v - sLo) / (sHi - sLo)) * (H - MT - MB);
  const YP = v => MT + (1 - (v - pLo) / ((pHi - pLo) || 1)) * (H - MT - MB);

  let grid = '', sax = '';
  for (const v of [1, 2, 3, 4, 5]){
    const y = YS(v).toFixed(1);
    grid += `<line class="${v === 3 ? 'zero' : 'grid'}" x1="${ML}" x2="${W - MR}" y1="${y}" y2="${y}"/>`;
    sax += `<text class="ax" x="${ML - 7}" y="${y}" text-anchor="end" dominant-baseline="middle">${v}</text>`;
  }
  let pax = '';
  for (const v of [pLo, (pLo + pHi) / 2, pHi]){
    pax += `<text class="ax" x="${W - MR + 7}" y="${YP(v).toFixed(1)}" dominant-baseline="middle">${
      v >= 1000 ? Math.round(v).toLocaleString() : v.toFixed(1)}</text>`;
  }
  const wide = (x1 - x0) > 400 * 864e5;
  let tax = '';
  for (const d of [ok[0].d, ok[Math.floor(ok.length / 2)].d, ok[ok.length - 1].d]){
    tax += `<text class="ax" x="${X(d).toFixed(1)}" y="${H - 8}" text-anchor="middle">${
      esc(dtick(d, wide))}</text>`;
  }

  // Price segmented at a confirmed corporate action; score drawn continuous.
  let pp = '', pen = false, brk = '';
  for (const q of ok){
    if (breaks.has(q.d)){
      pen = false;
      brk += `<line class="zero" x1="${X(q.d).toFixed(1)}" x2="${X(q.d).toFixed(1)}" y1="${MT}" y2="${H - MB}"/>`;
    }
    pp += (pen ? 'L' : 'M') + X(q.d).toFixed(1) + ' ' + YP(q.close).toFixed(1) + ' ';
    pen = true;
  }
  const ss = ok.map(q => `${X(q.d).toFixed(1)},${YS(q.score).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"
      style="width:100%;height:${H}px">
    ${grid}${brk}
    <path d="${pp.trim()}" fill="none" stroke="var(--faint)" stroke-width="1.6"/>
    <polyline points="${ss}" fill="none" stroke="var(--accent)" stroke-width="2.2"/>
    ${sax}${pax}${tax}
    <text class="axl" x="${ML}" y="9">score 1-5</text>
    <text class="axl" x="${W - MR}" y="9" text-anchor="end">price</text>
  </svg>`;
}

function stackControls(tp){
  const pills = ['composite','economics','valuation','mood','guidance'].map(x => {
    const c = tp.coverage[x];
    return `<option value="${x}"${x === P.pillar ? ' selected' : ''}>${x}` +
           ` (${c.dates}d)</option>`;
  }).join('');
  const spans = Object.keys(SPANS).map(x =>
    `<option value="${x}"${x === P.span ? ' selected' : ''}>${x}</option>`).join('');
  return `<div class="ctl">
    <label>pillar<select id="pp">${pills}</select></label>
    <label>span<select id="pspan">${spans}</select></label>
  </div>`;
}

async function loadPair(){
  const tp = await getTape(P.pillar);
  $('#asof').textContent = 'store ' + tp.as_of_max;
  showRefresh(tp);

  const cut = spanCut(tp);
  const rows = tp.order.map(eid => {
    const ser = tp.series[eid] || {};
    const pts = (ser.points || []).filter(q => !cut || q.d >= cut);
    const breaks = new Set((tp.corporate_actions[eid]?.confirmed || [])
      .map(c => c.date));
    const acts = (tp.corporate_actions[eid]?.confirmed || [])
      .filter(c => pts.length && c.date >= pts[0].d && c.date <= pts[pts.length - 1].d);
    const ok = pts.filter(q => q.score != null && q.close != null);
    const first = ok.length ? ok[0] : null, last = ok.length ? ok[ok.length - 1] : null;
    const dS = first && last ? last.score - first.score : null;
    const dP = first && last && first.close ? (last.close / first.close - 1) * 100 : null;
    return {eid, ser, pts, breaks, acts, first, last, dS, dP, n: ok.length};
  });

  const body = rows.map(r => {
    const g = r.ser.peer_group || '—';
    const late = r.ser.first && tp.coverage[tp.pillar].first
      && r.ser.first > tp.coverage[tp.pillar].first
      ? ` · starts ${esc(r.ser.first)}` : '';
    const actNote = r.acts.length
      ? `<div class="banner" style="margin:8px 0 0"><b>Price line broken</b> at ${
          r.acts.map(c => `${esc(c.date)} — ${c.pct.toFixed(1)}%, ${esc(c.why)}`).join('; ')
        }. The quoted price steps mechanically, so it is a different company
        across that line and the two sides are not comparable. The score line is
        not broken — those are the stored values.</div>`
      : '';
    return `<div class="nrow">
      <div class="nhead">
        <h3>${esc(r.eid)} <span class="g">${esc(g)}</span></h3>
        <div class="nstat">
          <span><b>${r.last && r.last.score != null ? r.last.score.toFixed(2) : '—'}</b> ${esc(tp.pillar)}</span>
          <span>${r.dS == null ? '' : (r.dS >= 0 ? '+' : '') + r.dS.toFixed(2) + ' in span'}</span>
          <span style="color:${r.dP > 0 ? 'var(--up)' : r.dP < 0 ? 'var(--down)' : 'var(--faint)'}">${
            r.dP == null ? '—' : (r.dP >= 0 ? '+' : '') + r.dP.toFixed(1) + '% px'}</span>
          <span class="hint">${r.n} pts${late}</span>
        </div>
      </div>
      ${nameChart(r.pts, r.breaks, tp.curves[tp.pillar])}
      ${actNote}
    </div>`;
  }).join('');

  $('#s-pair').innerHTML = stackControls(tp)
    + `<h2>${esc(tp.pillar)} score and price · ${rows.length} names</h2>
       <p class="note">Score in <b style="color:var(--accent)">blue</b> on a fixed
         1-5 axis, price in grey on its own range. The shapes are comparable, the
         levels are not. One name per row, newest date ${esc(tp.as_of_max)}.</p>`
    + body
    + `<p class="note hint">Persisted <code>pillar_scores</code> — not
       recomputed, and not affected by overrides. The Bridge tab recomputes live
       and will differ whenever an override is active or
       <code>run_scores.py</code> has not been re-run.</p>`;
  wirePair();
}

function wirePair(){
  const go = () => loadPair().catch(e => showErr(e.message));
  const pp = $('#pp');
  if (pp) pp.onchange = () => { P.pillar = pp.value; go(); };
  const sp = $('#pspan');
  if (sp) sp.onchange = () => { P.span = sp.value; go(); };
}

let SECTORS = [];
let SECTOR = 'overview';
let LAST_VIEW = 'pair';

/* The pack column notes carry the provenance argument as well as the name --
   "the steel group's ONLY coking coal source. FRED PCOKEUSDM is a dead 404..."
   -- which belongs in a tooltip, not in a table cell. Keep the part before the
   first em-dash and hand the rest to title=. */
function shortLabel(t){
  if (!t) return '';
  const head = String(t).split('—')[0].trim();
  return head.length > 3 ? head : String(t).slice(0, 60);
}

function fmtNum(v){
  if (v == null) return '—';
  const a = Math.abs(v);
  return v.toLocaleString(undefined,
    {minimumFractionDigits: a >= 1000 ? 0 : 2, maximumFractionDigits: a >= 1000 ? 0 : 2});
}

async function loadSectorNav(){
  SECTORS = await (await fetch('/api/nav')).json();
  $('#snav').innerHTML = SECTORS.map(s =>
    `<button class="stab" role="tab" data-s="${esc(s.id)}"
       aria-selected="${s.id === SECTOR}">${esc(s.label)}${
       s.kind === 'sector' && !s.live ? '<span class="n">no spec</span>' :
       s.kind === 'flows' ? '<span class="n">scoped</span>' : ''}</button>`).join('');
  document.querySelectorAll('.stab').forEach(b =>
    b.addEventListener('click', () => sector(b.dataset.s)));
}

/* Three kinds of top-level tab, and only `sector` has sub-views. Overview and
   Flows are their own single views, so the Pair/Bridge/Positioning bar is
   hidden for them — leaving it up would imply it did something. */
function sector(id){
  SECTOR = id;
  document.querySelectorAll('.stab').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.s === id)));
  const e = SECTORS.find(s => s.id === id) || {};
  showErr('');
  if (e.kind === 'overview'){ $('#vnav').hidden = true; tab('overview'); return; }
  if (e.kind === 'flows'){ $('#vnav').hidden = true; tab('flows'); return; }
  $('#vnav').hidden = !e.live;
  if (e.live){ tab(LAST_VIEW); }
  else { tab('sector'); }   // per-sector; tab() refetches on a sector change
}

/* ===================== daily overview =====================
   The first screen, and the one place that answers "did today work" before
   showing a number. Everything here is read from what the run WROTE — status
   and frontend json, pillar_scores, the oi table — never recomputed, so it
   cannot tell a different story from the Pair tab. */
async function loadOverview(){
  const d = await (await fetch('/api/overview')).json();
  if (d.error) throw new Error(d.error);

  const run = d.run || {};
  const runBad = run.ok === false || !!run.warning || !run.day;
  const feeds = d.feeds || {};
  const fe = d.frontend || {};

  const stepChips = (run.steps || []).map(x => {
    const cls = x.status === 'ok' ? 'ok' : x.status === 'skipped' ? 'skip' : 'bad';
    return `<span class="stp ${cls}" title="${esc(x.detail || x.status)}">${
      esc(x.step)}</span>`;
  }).join('');

  const tiles = `<div class="tiles">
    <div class="tile ${runBad ? 'warn' : 'good'}">
      <div class="k">last refresh</div>
      <div class="v">${esc(run.day || '—')}</div>
      <div class="s">${run.warning ? esc(run.warning)
        : esc((run.finished || '').replace('T', ' ').slice(0, 19) || 'no finish time')}</div>
    </div>
    <div class="tile ${feeds.n_stale ? 'warn' : 'good'}">
      <div class="k">feeds stale</div>
      <div class="v">${feeds.n_stale == null ? '—' : feeds.n_stale}
        <span style="font-size:13px;color:var(--faint)">/ ${feeds.n_series || 0}</span></div>
      <div class="s">${feeds.parked || 0} parked (captured, not modelled)</div>
    </div>
    <div class="tile ${fe.n_failed ? 'bad' : 'good'}">
      <div class="k">page routes</div>
      <div class="v">${(fe.n_routes || 0) - (fe.n_failed || 0)}
        <span style="font-size:13px;color:var(--faint)">/ ${fe.n_routes || 0}</span></div>
      <div class="s">${(fe.warnings || []).length} warning(s)</div>
    </div>
    <div class="tile ${(d.book || []).some(b => b.verdict === 'FULL') ? 'good' : ''}">
      <div class="k">at full size</div>
      <div class="v">${(d.book || []).filter(b => b.verdict === 'FULL').length}
        <span style="font-size:13px;color:var(--faint)">/ ${(d.book || []).length}</span></div>
      <div class="s">scores as of ${esc(d.as_of_scores || '—')}</div>
    </div>
  </div>`;

  const staleRows = (feeds.stale || []).map(x =>
    `<tr><td class="k">${esc(x.series)}</td><td>${esc(x.feed)}</td>
      <td class="k">${esc(x.last)}</td><td>${esc(x.age)}</td></tr>`).join('');

  const bookRows = (d.book || []).map(b => {
    const cls = b.verdict === 'FULL' ? 'c-up'
      : b.verdict === 'no trade' ? 'c-flat' : 'c-warn';
    const pil = ['economics','valuation','mood','guidance'].map(k => {
      const ph = (b.placeholders || {})[k];
      if (b[k] == null) return `<td class="n"><span class="hint"
        title="withheld — the composite renormalises over the pillars that exist">—</span></td>`;
      if (ph) return `<td class="n" style="color:var(--warn)"
        title="PLACEHOLDER, not measured. ${esc(ph.reason || '')} Granted ${
          esc(ph.granted || '')} by ${esc(ph.granted_by || '')}; ends on ${
          esc(ph.review_trigger || '')}.">${b[k].toFixed(2)}<sup>P</sup></span></td>`;
      return `<td class="n">${b[k].toFixed(2)}</td>`;
    }).join('');
    return `<tr><td><b>${esc(b.entity)}</b></td>
      <td class="n score">${b.composite == null ? '—' : b.composite.toFixed(2)}</td>
      ${pil}
      <td class="n">${b.size == null ? '—' : (b.size >= 0 ? '+' : '') + b.size.toFixed(2)}</td>
      <td><span class="chip ${cls}">${esc(b.verdict || 'n/a')}</span></td></tr>`;
  }).join('');

  const moverRows = (d.movers || []).map(m =>
    `<tr><td class="k">${esc(m.id)}</td>
      <td class="n">${fmtNum(m.last)}</td>
      ${m.chg_pct == null
        ? '<td class="n flat">flat 30d+</td>'
        : `<td class="n" style="color:${m.chg_pct > 0 ? 'var(--up)' :
             m.chg_pct < 0 ? 'var(--down)' : 'var(--faint)'}">${
             (m.chg_pct >= 0 ? '+' : '') + m.chg_pct.toFixed(2)}%</td>`}
      <td class="k">${esc(m.date || '—')}</td>
      <td class="k flat">${esc(m.source || '—')}</td>
      <td class="k flat">${m.moved_on ? 'carried since ' + esc(m.moved_on) : 'moved today'}</td>
    </tr>`).join('');

  const posRows = (d.positioning || []).map(o =>
    `<tr><td><b>${esc(o.entity_id)}</b></td><td class="k">${esc(o.date)}</td>
      <td>${esc(o.buildup || '—')}</td><td>${esc(o.buildup_15d || '—')}</td>
      <td class="n">${o.oi_percentile == null ? '—' : o.oi_percentile.toFixed(0)}</td>
      <td class="n">${o.oi_percentile_15d == null ? '—' : o.oi_percentile_15d.toFixed(0)}</td>
      <td class="n">${o.z_score_3m == null ? '—' : (o.z_score_3m >= 0 ? '+' : '') + o.z_score_3m.toFixed(2)}</td>
    </tr>`).join('');

  const probs = [...(fe.problems || []), ...(fe.warnings || [])];

  const phBanner = (d.placeholders || []).length
    ? `<div class="banner">${d.placeholders.map(x =>
        `<b>${esc(x.entity)} ${esc(x.pillar)} = ${x.value}</b> is a
         <b>PLACEHOLDER, not a measurement</b>${x.overdue ? ' — <b>OVERDUE</b>' : ''}.
         ${esc(x.reason || '')} Granted ${esc(x.granted || '')} by
         ${esc(x.granted_by || '')}; ends on <b>${esc(x.review_trigger || '')}</b>.
         It changes the composite and <b>not</b> SIZE — a withheld pillar and a
         3.00 both map to a 1.0 multiplier.`).join('<hr style="border:0;border-top:1px solid var(--rule);margin:8px 0">')}</div>`
    : '';

  $('#s-overview').innerHTML = tiles + phBanner
    + `<h2>Run · ${esc(run.day || '—')}</h2>
       <div class="steps">${stepChips || '<span class="hint">no step record</span>'}</div>
       ${probs.length ? `<div class="banner">${probs.map(esc).join('<br>')}</div>` : ''}
       ${(run.manual || []).length ? `<p class="note hint">Not covered by an
         unattended run: ${run.manual.map(m => esc(Array.isArray(m) ? m[0] : m)).join(' · ')}</p>` : ''}`
    + (staleRows ? `<h2>Stale feeds</h2>
       <p class="note">A stale price is not a flat price. Scores below were
         computed on these.</p>
       <div class="scroll"><table><thead><tr><th>series</th><th>feed</th>
         <th>last</th><th>age</th></tr></thead><tbody>${staleRows}</tbody></table></div>`
       : `<h2>Stale feeds</h2><p class="note">None — every modelled feed is
          inside its threshold.</p>`)
    + `<h2>The book · ${esc(d.as_of_scores || '')}</h2>
       <p class="note">Persisted <code>pillar_scores</code>. A dash is a
         <b>withheld</b> pillar, not a 3.0 — the composite renormalises over the
         pillars that exist. A <sup>P</sup> in amber is a <b>placeholder</b>: a
         desk decision from <code>specs/placeholders.yaml</code>, not a measured
         number. SIZE 1.00 is a full position; below 0.28 is under the desk
         materiality floor.</p>
       <div class="scroll"><table><thead><tr><th>name</th><th class="n">comp</th>
         <th class="n">econ</th><th class="n">val</th><th class="n">mood</th>
         <th class="n">guid</th><th class="n">SIZE</th><th>verdict</th>
       </tr></thead><tbody>${bookRows}</tbody></table></div>`
    + `<h2>What moved · modelled inputs only</h2>
       <p class="note">Only series a spec <code>price_link</code>s — the 27 parked
         steel columns are captured but drive nothing, so they are not here.
         Change is against the last close that actually <b>differed</b>.</p>
       <div class="scroll"><table><thead><tr><th>series</th><th class="n">last</th>
         <th class="n">last real move</th><th>as of</th><th>source</th><th>state</th>
       </tr></thead><tbody>${moverRows}</tbody></table></div>`
    + `<h2>Positioning · futures OI</h2>
       <p class="note">15d and 3m buildup routinely disagree, and that
         disagreement is the signal — a name can be short-covering over 15 days
         inside a three-month short build. OI is <b>T-1 by design</b>: NSE
         publishes the day's F&amp;O bhavcopy after the close.</p>
       <div class="scroll"><table><thead><tr><th>name</th><th>as of</th>
         <th>buildup 3m</th><th>buildup 15d</th><th class="n">pctile 3m</th>
         <th class="n">pctile 15d</th><th class="n">z 3m</th>
       </tr></thead><tbody>${posRows || '<tr><td colspan="7" class="hint">no OI rows</td></tr>'}</tbody></table></div>`;
}

/* ===================== flows =====================
   Every row is probed against the store on each request rather than restated
   from docs/FLOWS.md, which was verified by hand once on 2026-08-19. A hard-coded
   blocker table would go stale silently the first time a blocker was cleared —
   the failure mode the doc itself warns about. */
async function loadFlows(){
  const d = await (await fetch('/api/flows')).json();
  if (d.error) throw new Error(d.error);
  const stCls = s => s === 'ready' ? 'st-ready' : s === 'thin' ? 'st-thin'
    : s === 'blocked' ? 'st-blocked' : 'st-open';

  const inputRows = (d.inputs || []).map(i =>
    `<tr><td class="k">${esc(i.input)}</td>
      <td class="k flat">${esc(i.source)}</td>
      <td><span class="st ${stCls(i.state)}">${esc(i.state)}</span></td>
      <td>${esc(i.detail)}</td></tr>`).join('');

  const monRows = (d.monitors || []).map(m =>
    `<tr><td><b>${esc(m.id)}</b> ${esc(m.monitor)}</td>
      <td>${esc(m.question)}</td>
      <td class="k flat">${esc(m.scope)}</td>
      <td class="k">${esc(m.lands_in)}</td>
      <td><span class="st ${stCls(m.state === 'blocked' ? 'blocked' : 'open')}">${esc(m.state)}</span></td>
      <td>${esc(m.detail)}</td></tr>`).join('');

  $('#s-flows').innerHTML = `
    <div class="await">
      <h3>Flows — who is buying, not what is worth buying</h3>
      <p><b>${esc(d.note)}</b></p>
      <p>Scoped, not built. It is not a fifth pillar: it computes the five inputs
        <code>specs/sectors/aluminium_primary.yaml</code> already names under
        <code>layer3:</code>, plus a market-wide risk read that has no home in the
        schema at all. <code>sector_regime</code> has a column for each and holds
        <b>${d.sector_regime_rows} rows</b> — those <code>source:</code> handles
        are names, not implementations. See <code>${esc(d.doc)}</code>.</p>
      <p>L1 says the economics moved, L2 says whether it is priced,
        <b>Flows says whether anyone is there to pay for it.</b></p>
    </div>
    <h2>The five L3 inputs · ${d.n_ready}/${d.n_inputs} ready</h2>
    <p class="note">Probed against <code>data/ims.db</code> on every request, not
      copied from the doc.</p>
    <div class="scroll"><table><thead><tr><th>input</th><th>spec source</th>
      <th>state</th><th>what it needs</th></tr></thead>
      <tbody>${inputRows}</tbody></table></div>
    <h2>The four monitors</h2>
    <div class="scroll"><table><thead><tr><th>monitor</th><th>question</th>
      <th>scope</th><th>lands in</th><th>state</th><th>note</th></tr></thead>
      <tbody>${monRows}</tbody></table></div>
    <p class="note hint">F2's two negative states are not degrees of one another.
      <code>out_of_flavour</code> means actively sold — there is interest, it is
      negative, shorts work. <code>ignored</code> means nobody is looking and
      nothing expresses in either direction however good the economics. Whatever
      computes these must preserve that distinction.</p>`;
}

async function loadSector(){
  const d = await (await fetch('/api/sector?id=' + encodeURIComponent(SECTOR))).json();
  if (d.error) throw new Error(d.error);
  const rows = d.commodities.map(c => {
    const stale = c.date && c.date < (TODAY || c.date);
    const chg = c.chg_pct == null
      ? '<td class="n flat">flat 30d+</td>'
      : `<td class="n" style="color:${c.chg_pct > 0 ? 'var(--up)' :
           c.chg_pct < 0 ? 'var(--down)' : 'var(--faint)'}">${
           (c.chg_pct >= 0 ? '+' : '') + c.chg_pct.toFixed(2)}%</td>`;
    return `<tr>
      <td class="k">${esc(c.id)}</td>
      <td title="${esc(c.name)}">${esc(shortLabel(c.name))}</td>
      <td class="n">${fmtNum(c.last)}</td>
      ${chg}
      <td class="k${stale ? ' flat' : ''}">${esc(c.date || '—')}</td>
      <td class="k flat">${esc(c.source || '—')}</td>
      <td class="k flat">${c.moved_on ? 'carried since ' + esc(c.moved_on) : 'moved today'}</td>
    </tr>`;
  }).join('');

  const unc = d.unclaimed && d.unclaimed.length
    ? `<h2>Captured, claimed by no sector</h2>
       <p class="note">Loaded from the pack so the history exists. Nothing reads
         them.</p>
       <div class="scroll"><table><thead><tr><th>series</th><th class="n">last</th>
         <th>date</th></tr></thead><tbody>${d.unclaimed.map(u =>
         `<tr><td class="k">${esc(u.id)}</td><td class="n">${fmtNum(u.last)}</td>
          <td class="k">${esc(u.date)}</td></tr>`).join('')}</tbody></table></div>`
    : '';

  $('#s-sector').innerHTML = `
    <div class="await">
      <h3>${esc(d.label)} — prices are landing, the spec is not written</h3>
      <p>There is no peer group, no <code>base_ebitda</code> and no cost
        intensities for ${esc(d.label.toLowerCase())}, so nothing here is scored
        and nothing is withheld either — the pillars simply do not exist yet.
        What does exist is the input data: <b>${d.n_priced} of ${d.n_total}</b>
        series below are priced and refreshing daily.</p>
      <p>They are captured deliberately rather than when the sector is built.
        The pack arrives as an email attachment and the connector route can only
        ever return the OLDEST rows, so a column not captured today is history
        that cannot be recovered later.</p>
      <ol>
        <li>Write <code>specs/entities/${esc(d.id)}.yaml</code> — names, peer
          group, <code>base_ebitda</code>, cost items with
          <code>market_pct</code></li>
        <li><code>price_link</code> each cost item to a series below, and move it
          out of <code>metals_pack.PARKED</code> and out of
          <code>freshness.PARKED_FEEDS</code> so it starts being watched</li>
        <li>Add the peer group to <code>engine.SECTORS</code> — this tab becomes
          Pair / Bridge / Positioning with no further front-end work</li>
      </ol>
    </div>
    <h2>${esc(d.label)} inputs · ${d.n_priced}/${d.n_total} priced</h2>
    <p class="note">Change is measured against the last close that actually
      <b>differed</b>, not the previous row — the pack pre-creates the current
      day's row and carries the prior session forward until tomorrow's file
      backfills it, so a row-over-row change reads 0.00% on almost everything.</p>
    <div class="scroll"><table><thead><tr>
      <th>series</th><th>what it is</th><th class="n">last</th>
      <th class="n">last real move</th><th>as of</th><th>source</th><th>state</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
}

let TODAY = null;

const loaders = {pair:loadPair, scores:loadScores, pos:loadPos,
                sector:loadSector, overview:loadOverview, flows:loadFlows};

/* Which views render SECTOR-SPECIFIC content. The other three are global —
   Positioning is the whole F&O table, Overview and Flows are run-level — so
   their DOM stays valid across a sector switch and must not be refetched. */
const SECTOR_SCOPED = {pair:1, scores:1, sector:1};

/* view -> the sector whose content is currently IN THAT SECTION'S DOM, or '*'
   for a global view. NOT "has this view loaded": there is one #s-<view> node
   shared by every sector, so a per-view flag reported Steel's bridge as
   already loaded when Non-Ferrous asked for it, and left Steel on screen. */
const rendered = {};

/* Run a view's loader and record what its DOM now holds. Clears the record on
   failure — the old flag was set BEFORE the await, so a view that threw once
   was marked loaded forever and stayed blank until a reload. */
function render(name){
  rendered[name] = SECTOR_SCOPED[name] ? SECTOR : '*';
  loaders[name]().catch(e => { delete rendered[name]; showErr(e.message); });
}
function tab(name){
  document.querySelectorAll('.tab').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.t === name)));
  document.querySelectorAll('section').forEach(s =>
    s.classList.toggle('on', s.id === 's-' + name));
  // The window selector drives the LIVE bridge only. Leaving it visible on the
  // Pair tab would imply it moves the persisted tape, which it cannot.
  // The window selector, FX and the override count all describe the LIVE
  // bridge. Showing them over the persisted tape would imply they move it.
  // Only the three sector sub-views are remembered. Overview and Flows are
  // top-level tabs, so recording them here would send you to a hidden section
  // the next time you picked a live sector.
  if (name === 'pair' || name === 'scores' || name === 'pos') LAST_VIEW = name;
  const live = (name === 'scores');
  $('#winwrap').hidden = !live;
  $('#fxwrap').hidden = !live;
  // Re-render when this section is showing another sector's content.
  if (rendered[name] !== (SECTOR_SCOPED[name] ? SECTOR : '*')) render(name);
}
document.querySelectorAll('.tab').forEach(b =>
  b.addEventListener('click', () => tab(b.dataset.t)));
$('#win').addEventListener('change', () => loadScores().catch(e => showErr(e.message)));
$('#reload').addEventListener('click', () => {
  for (const k in rendered) delete rendered[k];
  for (const k in TAPE) delete TAPE[k];      // else Refresh cannot see a new run
  // The visible view is the sector placeholder whenever the sector has no spec;
  // reading the sub-nav then reloads a view that is not on screen.
  const e = SECTORS.find(x => x.id === SECTOR) || {};
  const cur = e.kind === 'overview' ? 'overview'
    : e.kind === 'flows' ? 'flows'
    : e.live ? document.querySelector('.tab[aria-selected=true]').dataset.t
    : 'sector';
  render(cur);
});
$('#winwrap').hidden = true;
$('#fxwrap').hidden = true;
loadSectorNav()
  .then(() => { sector(SECTOR); })
  .catch(e => {
    // Never leave the page on "sectors…". If the nav cannot load, fall back to
    // the view that has always worked rather than showing a dead shell.
    showErr('sector nav: ' + e.message);
    /* Fallback nav when /api/nav fails. It must carry peer_groups now that
       loadScores() reads them, or the Bridge view renders its empty state on a
       sector that actually works. */
    SECTORS = [{id:'non_ferrous', kind:'sector', label:'Non-Ferrous', live:true,
                peer_groups:['aluminium_primary','zinc']},
               {id:'steel', kind:'sector', label:'Steel', live:true,
                peer_groups:['steel_integrated','steel_converter']}];
    SECTOR = 'non_ferrous';
    $('#snav').innerHTML = '<button class="stab" aria-selected="true">Non-Ferrous</button>';
    $('#vnav').hidden = false;
    tab('pair');
  });
</script>
</body>
</html>
