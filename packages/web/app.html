<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investment Micro-System</title>
<style>  /* ===================================================================
     DESIGN SYSTEM

     Three rules hold this together. Breaking one is what made the old
     sheet feel like an admin panel:

     1. DEPTH, NOT OUTLINES. The ground is grey, panels are white and
        float on a soft shadow. Nine components used to share one
        `surface + 1px border + radius:3px` recipe, so the page was a
        uniform field of rectangles with nothing in front of anything.
        Borders now belong to TABLES and DIVIDERS only.

     2. ONE VOICE FOR DATA. Mono is for numbers and identifiers.
        Mono+uppercase+tracked is for section labels and status badges,
        and nothing else — eleven selectors used to shout in that voice
        at once, which is the same as none of them shouting.

     3. SCALES, NOT VALUES. Spacing comes from --s*, type from --t*,
        weight from 400/500/600/700. The old sheet used 17 ad-hoc
        paddings and weights (560, 640, 650, 660) that no system UI font
        has, so they snapped and the hierarchy silently vanished.
     =================================================================== */
  :root{
    color-scheme:dark;

    /* spacing, 4px base */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;

    /* radii */
    --r-sm:5px; --r:9px; --r-pill:999px;

    /* type — integers only. Fractional px (the old 9.5/11.5/13.5/14.5)
       land on half-pixels and blur on any non-retina desk monitor. */
    --t-micro:10px; --t-label:11px; --t-sm:12px; --t-body:13px;
    --t-md:14px; --t-lg:16px; --t-xl:20px; --t-2xl:26px;
    --measure:72ch;         /* prose cap. Unset, notes ran to 1560px. */

    /* THE VAULT DASHBOARD'S PALETTE, VERBATIM (PM, 2026-08-30: "that
       front-end was way better" — Obsidian Vault/Dashboard/index.html).
       GitHub-dark: #0d1117 ground, #161b22 panels, #30363d borders, and the
       page is DARK-ONLY like the original — the light branch is gone, not
       hidden. Panels separate by BORDER here, not by shadow, hence the
       borders added on .scroll/.tile/.panel and the near-null shadows. */
    --ground:#0d1117; --surface:#161b22; --alt:#1c2129; --sunken:#1c2129;
    --ink:#e6edf3; --soft:#8b949e; --faint:#6e7681;
    --rule:#30363d; --hair:#21262d;
    --accent:#58a6ff; --accent-soft:rgba(88,166,255,.12);
    --up:#3fb950; --up-soft:rgba(63,185,80,.15);
    --warn:#d29922; --warn-soft:rgba(210,153,34,.15);
    --down:#f85149; --down-soft:rgba(248,81,73,.15);

    --shadow-1:none;
    --shadow-2:0 2px 6px rgba(0,0,0,.45);

    --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  }
  /* No @media dark branch any more: the vault palette above IS the page. */
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
       font-size:var(--t-md);line-height:1.55;-webkit-font-smoothing:antialiased;
       text-rendering:optimizeLegibility}
  .wrap{max-width:1560px;margin:0 auto;padding:0 var(--s5) var(--s7)}

  /* ---------------------------------------------------------------- shell */
  header{display:flex;align-items:baseline;gap:var(--s4);flex-wrap:wrap;
         padding:var(--s5) 0 var(--s3)}
  h1{font-size:var(--t-lg);font-weight:600;letter-spacing:-.01em;margin:0;
     white-space:nowrap}
  .meta{font-family:var(--mono);font-size:var(--t-label);color:var(--faint);
        display:flex;gap:var(--s3);flex-wrap:wrap;margin-left:auto;
        align-items:center;font-variant-numeric:tabular-nums}

  select,button,input{font:inherit;color:inherit}
  select,input[type=number],input[type=text]{background:var(--surface);
        border:1px solid var(--rule);border-radius:var(--r-sm);
        padding:5px var(--s2);box-shadow:var(--shadow-1);
        font-size:var(--t-body)}
  select:hover{border-color:var(--faint)}
  button{background:var(--accent);color:#fff;border:0;border-radius:var(--r-sm);
         padding:6px var(--s3);cursor:pointer;font-size:var(--t-body);
         font-weight:500;box-shadow:var(--shadow-1)}
  button:hover{filter:brightness(1.08)}
  button.ghost{background:var(--surface);color:var(--accent);
               border:1px solid var(--rule)}
  button.ghost:hover{background:var(--accent-soft);border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:default;filter:none}
  button:focus-visible,select:focus-visible,input:focus-visible,
  .tab:focus-visible,.stab:focus-visible{outline:2px solid var(--accent);
       outline-offset:2px}

  /* Both navs STICK. Losing the tab bar while scrolling a long chart column is
     the other half of the readability complaint — you can end up several
     screens into a view with nothing on screen saying which one it is.
     The blur is what lets content pass UNDER it without a hard seam. */
  .navs{position:sticky;top:0;z-index:20;
        background:var(--ground);
        background:color-mix(in srgb, var(--ground) 88%, transparent);
        backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
        margin:0 calc(var(--s5) * -1);padding:2px var(--s5) 0;
        box-shadow:0 10px 12px -12px rgba(0,0,0,.45)}
  @supports not (backdrop-filter:blur(4px)){
    .navs{background:var(--ground)}
  }

  /* Sector tabs — the primary axis, so they get size and a real indicator. */
  nav.snav{display:flex;gap:var(--s1);margin:0;flex-wrap:nowrap;
        overflow-x:auto;overflow-y:hidden;
        box-shadow:inset 0 -1px 0 var(--rule);
        scrollbar-width:none;-ms-overflow-style:none}
  nav.snav::-webkit-scrollbar{display:none}
  .stab{background:none;border:0;border-bottom:2px solid transparent;
        color:var(--soft);padding:var(--s3) var(--s4) 10px;cursor:pointer;
        font-size:var(--t-md);font-weight:500;letter-spacing:-.01em;
        border-radius:0;display:flex;align-items:center;gap:var(--s2);
        flex:0 0 auto;white-space:nowrap;
        transition:color .12s, border-color .12s}
  .stab[aria-selected=true]{color:var(--ink);font-weight:600;
        border-bottom-color:var(--accent)}
  .stab:hover{color:var(--ink)}
  .stab .n{font-family:var(--mono);font-size:var(--t-micro);letter-spacing:.07em;
           text-transform:uppercase;padding:2px 6px;border-radius:var(--r-pill);
           background:var(--sunken);color:var(--faint);font-weight:600}
  .stab[aria-selected=true] .n{background:var(--accent-soft);color:var(--accent)}

  /* View tabs — secondary, so pills rather than a second underline row.
     Two stacked underline bars was ambiguous about which axis was which. */
  nav.vnav{display:flex;gap:2px;margin:0;padding:var(--s2) 0 var(--s2);
           background:transparent;flex-wrap:nowrap;overflow-x:auto;
           scrollbar-width:none;-ms-overflow-style:none}
  nav.vnav::-webkit-scrollbar{display:none}
  .tab{background:none;border:0;color:var(--soft);padding:5px var(--s3);
       cursor:pointer;font-size:var(--t-body);font-weight:500;flex:0 0 auto;
       white-space:nowrap;
       border-radius:var(--r-pill);transition:background .12s, color .12s}
  .tab:hover{background:var(--sunken);color:var(--ink)}
  .tab[aria-selected=true]{color:#fff;background:var(--accent);font-weight:600}
  nav.vnav[hidden]{display:none}

  section{display:none;padding-top:var(--s5)}
  section.on{display:block}

  /* Section label. Deliberately quiet and deliberately mono-uppercase: it is
     a LABEL, not a title, and now that .k/.tile .k/th no longer use this
     voice it reads as structure instead of competing. */
  h2{font-family:var(--mono);font-size:var(--t-label);letter-spacing:.13em;
     text-transform:uppercase;color:var(--faint);font-weight:600;
     margin:var(--s6) 0 var(--s3);padding-bottom:var(--s2);
     border-bottom:1px solid var(--hair)}
  h2:first-child{margin-top:0}
  h3{font-size:var(--t-md);font-weight:600;letter-spacing:-.01em}

  /* ---------------------------------------------------------------- panels */
  .scroll{overflow-x:auto;border-radius:var(--r);background:var(--surface);
          border:1px solid var(--rule);margin-bottom:var(--s2)}
  table{border-collapse:collapse;width:100%;font-size:var(--t-body)}
  /* Column heads in SANS. Uppercase mono here was one of the eleven shouting
     voices, and it competed with h2 directly above it. */
  th{font-family:var(--sans);font-size:var(--t-label);letter-spacing:.04em;
     text-transform:uppercase;color:var(--faint);text-align:left;
     padding:10px var(--s3);border-bottom:1px solid var(--rule);
     white-space:nowrap;font-weight:600;position:sticky;top:0;
     background:var(--surface)}
  td{padding:9px var(--s3);border-bottom:1px solid var(--hair);
     vertical-align:middle}
  tr:last-child td{border-bottom:0}
  td.n,th.n{text-align:right;font-family:var(--mono);
            font-variant-numeric:tabular-nums}
  td.k{font-family:var(--mono);font-size:var(--t-sm);white-space:nowrap;
       color:var(--soft)}
  td.flat{color:var(--faint)}
  tbody tr{transition:background .1s}
  tbody tr:hover{background:var(--alt)}

  /* ------------------------------------------------------- badges + values */
  .chip,.st{display:inline-block;font-family:var(--mono);font-size:var(--t-micro);
        letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;
        border-radius:var(--r-pill);font-weight:600;white-space:nowrap}
  .c-up,.st-ready{background:var(--up-soft);color:var(--up)}
  .c-warn,.st-thin{background:var(--warn-soft);color:var(--warn)}
  .c-down,.st-blocked{background:var(--down-soft);color:var(--down)}
  .c-flat{background:var(--sunken);color:var(--faint)}
  .st-open{background:var(--accent-soft);color:var(--accent)}

  .score{font-family:var(--mono);font-weight:600;font-size:var(--t-md);
         font-variant-numeric:tabular-nums}
  .bar{height:6px;border-radius:var(--r-pill);background:var(--sunken);
       position:relative;min-width:70px;overflow:hidden}
  .bar i{position:absolute;top:0;bottom:0;left:50%;background:var(--accent)}

  /* --------------------------------------------------------- KPI tiles
     .tiles/.stats and .tile/.stat were near-duplicate components. Same
     thing, so: one look, both selectors kept. */
  .tiles,.stats{display:grid;gap:var(--s3);margin-bottom:var(--s5);
        grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .tile,.stat{background:var(--surface);border-radius:var(--r);
        padding:var(--s3) var(--s4);border:1px solid var(--rule);
        position:relative;overflow:hidden}
  /* The status edge is an inset bar, not a border-left: a coloured border
     changed the box's geometry, so a good tile and a neutral one did not
     line up their text. */
  .tile::before,.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;
        width:3px;background:transparent}
  .tile.good::before{background:var(--up)}
  .tile.warn::before{background:var(--warn)}
  .tile.bad::before{background:var(--down)}
  .tile .k,.stat .k{font-family:var(--sans);font-size:var(--t-label);
        letter-spacing:.03em;text-transform:uppercase;color:var(--faint);
        font-weight:600}
  .tile .v,.stat .v{font-family:var(--mono);font-size:var(--t-xl);font-weight:600;
        line-height:1.25;font-variant-numeric:tabular-nums;
        letter-spacing:-.02em;margin-top:2px}
  .tile .s,.stat .s{font-size:var(--t-sm);color:var(--faint);line-height:1.45;
        margin-top:2px}

  /* ---------------------------------------------------------- text + notes */
  .note{font-size:var(--t-body);color:var(--soft);margin:0 0 var(--s4);
        max-width:var(--measure)}
  .hint{font-family:var(--mono);font-size:var(--t-label);color:var(--faint)}
  .err{background:var(--down-soft);color:var(--down);padding:var(--s3) var(--s4);
       border-radius:var(--r);margin:var(--s4) 0;font-family:var(--mono);
       font-size:var(--t-sm);box-shadow:var(--shadow-1)}
  .loading{color:var(--faint);padding:var(--s6) 0;font-family:var(--mono);
           font-size:var(--t-sm)}
  .banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);
          padding:10px var(--s4);margin:0 0 var(--s4);font-size:var(--t-body);
          box-shadow:inset 3px 0 0 var(--warn);max-width:var(--measure)}
  .banner b{font-family:var(--mono);font-weight:600}

  /* --------------------------------------------------- vault-dashboard kit
     The component language of Obsidian Vault/Dashboard/index.html, copied at
     the PM's instruction 2026-08-30: page title + meta-line, bordered panels,
     accent-left callouts, outline pills, ▸ prose bullets, percentile bars.
     Class names and px values match the original where they exist there. */
  .pgt{font-size:20px;font-weight:600;font-family:var(--sans);margin:0 0 4px;
       letter-spacing:0;text-transform:none;color:var(--ink);border:0;
       padding:0}
  .meta-line{color:var(--soft);font-size:var(--t-sm);margin:0 0 var(--s4)}
  .panel{background:var(--surface);border:1px solid var(--rule);
         border-radius:8px;padding:14px 16px;margin-bottom:14px}
  .panel .scroll{border:0;margin:0;background:none;border-radius:0}
  .callout{background:var(--surface);border:1px solid var(--rule);
           border-left:3px solid var(--accent);border-radius:8px;
           padding:12px 16px;margin-bottom:14px}
  .callout.accent-green{border-left-color:var(--up)}
  .callout.accent-amber{border-left-color:var(--warn)}
  .callout-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .callout-head .t{font-size:var(--t-body);font-weight:600}
  .callout-head .ico{font-size:14px}
  .callout-head .right{margin-left:auto;font-family:var(--mono);
           font-size:var(--t-label);color:var(--faint)}
  .pill{display:inline-block;font-size:var(--t-label);padding:1px 8px;
        border-radius:10px;border:1px solid var(--rule);color:var(--soft);
        white-space:nowrap}
  .pill.ok{border-color:var(--up);color:var(--up)}
  .pill.warn{border-color:var(--warn);color:var(--warn)}
  .pill.bad{border-color:var(--down);color:var(--down)}
  .pos{color:var(--up)} .neg{color:var(--down)} .neu{color:var(--soft)}
  /* F1 regime panel */
  .f1-state{font-size:var(--t-xl);font-weight:700;letter-spacing:.3px}
  .f1-z{font-family:var(--mono);font-size:var(--t-sm);color:var(--soft)}
  .f1-z b{font-weight:600}
  .f1-odds{margin:10px 0 2px;max-width:520px}
  .f1-odds .row{display:flex;align-items:center;gap:8px;margin:4px 0}
  .f1-odds .lbl{width:130px;font-size:var(--t-sm);text-align:right;
                color:var(--ink);white-space:nowrap}
  .f1-odds .track{flex:1;height:12px;background:var(--sunken);
                border-radius:3px;position:relative;overflow:hidden}
  .f1-odds .bar{position:absolute;left:0;top:0;bottom:0;
                background:var(--accent-soft);border-right:2px solid var(--accent)}
  .f1-odds .base{position:absolute;top:0;bottom:0;width:0;
                border-left:1px dashed var(--faint)}
  .f1-odds .num{min-width:110px;max-width:210px;font-family:var(--mono);font-size:var(--t-sm);
                color:var(--soft);white-space:nowrap}
  .f1-strip{display:flex;gap:3px;flex-wrap:wrap;margin:8px 0 2px}
  .f1-strip .d{width:30px;height:26px;border-radius:4px;display:flex;
               flex-direction:column;align-items:center;justify-content:center;
               font-family:var(--mono);font-size:9px;line-height:1.15;
               border:1px solid var(--hair);color:var(--soft)}
  .f1-strip .d.spellq{border-bottom:2px solid var(--up)}
  .plist{list-style:none;margin:6px 0;padding-left:2px;font-size:var(--t-body)}
  .plist li{position:relative;padding-left:14px;margin:3px 0 7px;
            line-height:1.55}
  .plist li::before{content:'▸';position:absolute;left:0;top:1px;
            color:var(--accent);font-size:11px}
  .src{display:block;font-family:var(--mono);font-size:var(--t-label);
       color:var(--faint)}
  .sechead{font-size:15px;font-weight:600;margin:26px 0 12px;color:var(--ink);
           padding-top:14px;border-top:1px solid var(--rule)}
  .sechead:first-of-type{border-top:0;padding-top:0;margin-top:14px}
  .dwrap{display:flex;flex-direction:column;align-items:flex-end;gap:2px;
         min-width:76px}
  .dbar{height:3px;border-radius:2px;min-width:2px}
  .dbar.pos{background:var(--up)} .dbar.neg{background:var(--down)}
  .dbar.warn{background:var(--warn)} .dbar.neu{background:var(--soft)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* ----------------------------------------------------------- pair view */
  .ctl{display:flex;gap:var(--s4);flex-wrap:wrap;align-items:flex-end;
       background:var(--surface);border-radius:var(--r);
       padding:var(--s3) var(--s4);margin-bottom:var(--s4);
       box-shadow:var(--shadow-1)}
  .ctl label{display:flex;flex-direction:column;gap:var(--s1);
       font-family:var(--sans);font-size:var(--t-label);letter-spacing:.03em;
       text-transform:uppercase;color:var(--faint);font-weight:600}
  .ctl select{min-width:150px}
  .ctl .sidebar-l{border-left:3px solid var(--up);padding-left:var(--s2)}
  .ctl .sidebar-s{border-left:3px solid var(--down);padding-left:var(--s2)}

  .drivers{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s4)}
  .drv{background:var(--surface);border-radius:var(--r-sm);
       padding:var(--s2) var(--s3);font-family:var(--mono);
       font-size:var(--t-label);min-width:150px;box-shadow:var(--shadow-1)}
  .drv b{display:block;font-size:var(--t-md);font-weight:600;
         font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .drv span{font-family:var(--sans);color:var(--faint);font-size:var(--t-micro);
       letter-spacing:.04em;text-transform:uppercase;font-weight:600}

  .chart{background:var(--surface);border-radius:var(--r);
         padding:var(--s4) var(--s4) var(--s2);margin-bottom:var(--s1);
         box-shadow:var(--shadow-1)}
  /* max-height keeps the pair chart from occupying an entire viewport on a wide
     monitor, which is what made the page feel unscrollable even where nothing
     was trapping the wheel. */
  .chart svg{display:block;width:100%;height:auto;max-height:62vh}
  .cd svg{max-height:none}
  .ax{fill:var(--faint);font-family:var(--mono);font-size:var(--t-label)}
  .axl{fill:var(--faint);font-family:var(--sans);font-size:var(--t-micro);
       letter-spacing:.06em;text-transform:uppercase;font-weight:600}
  .grid{stroke:var(--hair);stroke-width:1}
  .zero{stroke:var(--rule);stroke-width:1;stroke-dasharray:3 3}

  .legend{display:flex;gap:var(--s4);flex-wrap:wrap;margin:var(--s3) 0 0;
          font-size:var(--t-sm);color:var(--soft);align-items:center}
  .legend i{display:inline-block;width:20px;height:0;border-top-width:2.5px;
            margin-right:6px;vertical-align:middle}

  /* ------------------------------------------------------------- cards
     The card grid sits in a SUNKEN well, so a group of cards reads as one
     object. Previously the well and the cards were both bordered boxes. */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
         gap:var(--s3);padding:var(--s3);border-radius:var(--r);
         background:var(--sunken)}
  .cd{background:var(--surface);border-radius:var(--r-sm);
      padding:var(--s3) var(--s3) var(--s2);box-shadow:var(--shadow-1)}
  .cd h3{margin:0 0 2px;font-size:var(--t-md);font-weight:600;display:flex;
         align-items:baseline;gap:var(--s2)}
  .cd h3 .g,.nhead h3 .g{font-family:var(--mono);font-size:var(--t-micro);
            letter-spacing:.06em;text-transform:uppercase;color:var(--faint);
            font-weight:600}
  .cd .row{display:flex;gap:var(--s4);font-family:var(--mono);
           font-size:var(--t-label);color:var(--faint);margin-bottom:5px;
           font-variant-numeric:tabular-nums}
  .cd .row b{color:var(--ink);font-size:var(--t-body);font-weight:600}
  .cd{transition:box-shadow .12s}
  .cd:hover{box-shadow:var(--shadow-2)}
  .cd.pick-l{box-shadow:var(--shadow-1), inset 3px 0 0 var(--up)}
  .cd.pick-l:hover{box-shadow:var(--shadow-2), inset 3px 0 0 var(--up)}
  .cd.pick-s:hover{box-shadow:var(--shadow-2), inset 3px 0 0 var(--down)}
  .cd.pick-s{box-shadow:var(--shadow-1), inset 3px 0 0 var(--down)}

  /* ------------------------------------------ stacked score+price rows */
  .nrow{background:var(--surface);border-radius:var(--r);
        padding:var(--s3) var(--s4) var(--s2);margin-bottom:var(--s4);
        box-shadow:var(--shadow-1)}
  .nhead{display:flex;align-items:baseline;gap:var(--s4);flex-wrap:wrap;
         margin-bottom:var(--s2)}
  .nhead h3{margin:0;font-size:var(--t-lg);font-weight:600;display:flex;
            align-items:baseline;gap:var(--s2)}
  .nstat{display:flex;gap:var(--s4);flex-wrap:wrap;margin-left:auto;
         font-family:var(--mono);font-size:var(--t-label);color:var(--faint);
         font-variant-numeric:tabular-nums}
  .nstat b{color:var(--ink);font-size:var(--t-body);font-weight:600}

  /* ------------------------------------------------------ run step chips */
  .steps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--s2)}
  .stp{font-family:var(--mono);font-size:var(--t-label);padding:3px var(--s2);
       border-radius:var(--r-pill);background:var(--sunken);color:var(--soft);
       white-space:nowrap}
  .stp.ok{background:var(--up-soft);color:var(--up)}
  .stp.skip{background:var(--warn-soft);color:var(--warn)}
  .stp.bad{background:var(--down-soft);color:var(--down)}

  /* --------------------------------- a sector with prices but no spec */
  .await{background:var(--surface);border-radius:var(--r);
         padding:var(--s5);margin-bottom:var(--s5);
         box-shadow:var(--shadow-1), inset 3px 0 0 var(--accent)}
  .await h3{margin:0 0 var(--s2);font-size:var(--t-lg);font-weight:600}
  .await p{margin:0 0 10px;max-width:var(--measure);color:var(--soft);
           font-size:var(--t-body)}
  .await ol{margin:var(--s3) 0 0;padding-left:22px;color:var(--soft);
            font-size:var(--t-body);max-width:var(--measure)}
  .await ol li{margin-bottom:var(--s1)}
  .await code,code{font-family:var(--mono);font-size:var(--t-sm);
              background:var(--sunken);padding:1px 5px;border-radius:3px}

  /* ------------------------------------------------------------- narrow
     The portable snapshot is opened on a phone, so this is a real target
     rather than a courtesy. 24px gutters cost 13% of a 375px screen. */
  @media (max-width:640px){
    .wrap{padding-left:var(--s4);padding-right:var(--s4)}
    .navs{margin-left:calc(var(--s4) * -1);margin-right:calc(var(--s4) * -1);
          padding-left:var(--s4);padding-right:var(--s4)}
    header{padding-top:var(--s4);gap:var(--s2)}
    .meta{margin-left:0;width:100%;gap:var(--s2)}
    h1{font-size:var(--t-md)}
    section{padding-top:var(--s4)}
    .tiles,.stats{gap:var(--s2);grid-template-columns:1fr}
    .cards{grid-template-columns:1fr;padding:var(--s2)}
    .nrow,.await{padding-left:var(--s3);padding-right:var(--s3)}
    .await{padding-top:var(--s4);padding-bottom:var(--s4)}
    h2{margin-top:var(--s5)}
    /* A table narrower than its own content still needs the page not to
       move; the .scroll wrapper owns that, so give it a visible edge. */
    .scroll{border-radius:var(--r-sm)}
  }

  /* ------------------------------------------------------ series palette
     Categorical slots for the sector charts. Both modes are SELECTED, not
     flipped: the dark column is the same eight hues re-stepped for the dark
     surface. Validated against this app's own panel colours (#FFFFFF and
     #171B21) on the adjacent-pair gates — worst adjacent CVD Delta E 9.1
     light / 8.4 dark, normal-vision 19.6 / 19.3.

     THE ORDER IS THE SAFETY MECHANISM. Reordering these silently degrades
     colourblind separation, and a 9th generated hue is never correct — past
     eight names the view must facet or fold to "other" instead. */
  /* Dark-only page now, so only the dark-stepped column survives. The order
     is still the safety mechanism — see the note above. */
  :root{
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500;
    --series-5:#d55181; --series-6:#008300; --series-7:#9085e9; --series-8:#e66767;
  }

  /* Legend. Identity is never colour-alone: the swatch is a line (mirroring the
     mark) and the NAME is ordinary ink beside it. */
  .lgd{display:flex;gap:var(--s4);flex-wrap:wrap;margin:0 0 var(--s3);
       font-size:var(--t-sm);color:var(--soft);align-items:center}
  .lgd span{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono)}
  .lgd i,i.swatch{display:inline-block;width:14px;height:0;
       border-top:2.5px solid var(--faint);border-radius:2px;flex:0 0 14px}
  i.swatch{margin-right:7px;vertical-align:middle}

  /* End-of-line labels: ink, not the series colour. Three light-mode slots sit
     under 3:1 on white, so coloured label text would be unreadable — the dot
     and leader carry identity instead. */
  .vend{fill:var(--ink);font-family:var(--mono);font-size:10px;font-weight:600}
  .vdot{stroke:var(--surface)}
  .xhair{stroke:var(--faint);stroke-width:1;pointer-events:none}

  /* Positioning rows expand into an OI-vs-time chart on click. */
  tr.oirow{cursor:pointer}
  tr.oirow:hover td{background:var(--sunken)}
  tr.oirow .oicaret{color:var(--faint);font-size:10px;margin-left:6px;
       display:inline-block;transition:transform .12s}
  tr.oirow[aria-expanded=true] .oicaret{transform:rotate(90deg);
       color:var(--accent)}
  tr.oich>td{padding:12px 14px 14px;background:var(--sunken)}
  tr.oich .legend{margin-top:2px}

  .chartwrap{position:relative}
  /* Beat `.chart svg{width:100%}` from the base sheet: these charts are laid
     out in real pixels by lineChart(), and letting the container stretch them
     scales the TEXT too (1.55x was observed).

     PAN, DO NOT SHRINK. Below the 520px floor that lineChart() clamps to, a
     capped max-width squeezed the chart to 0.60 and took the 10px axis labels
     down to 6px. The chart now keeps its size and the panel scrolls, which is
     what the data tables on this page already do. */
  .chart .chartwrap{overflow-x:auto;overflow-y:hidden;
       -webkit-overflow-scrolling:touch}
  .chart .chartwrap svg{display:block;width:auto;height:auto;
       max-width:none;max-height:none;outline-offset:3px}
  .viztip{position:absolute;pointer-events:none;z-index:30;opacity:0;
       background:var(--surface);box-shadow:var(--shadow-2);
       border-radius:var(--r-sm);padding:var(--s2) var(--s3);
       min-width:158px;transition:opacity .1s}
  .viztip.on{opacity:1}
  .viztip .d{font-family:var(--mono);font-size:var(--t-micro);color:var(--faint);
       letter-spacing:.06em;margin-bottom:5px}
  .viztip .r{display:flex;align-items:center;gap:7px;line-height:1.7}
  .viztip .r i{display:inline-block;width:12px;height:0;
       border-top:2.5px solid var(--faint);flex:0 0 12px}
  /* Value leads, label follows — the legend's hierarchy inverted, because here
     the reader already knows the series and wants the number. */
  .viztip .r b{font-family:var(--mono);font-variant-numeric:tabular-nums;
       color:var(--ink);font-weight:600;font-size:var(--t-body);
       min-width:56px;text-align:right}
  .viztip .r em{font-style:normal;color:var(--soft);font-family:var(--mono);
       font-size:var(--t-label)}

  /* Divergence markers. Surface-coloured ring so a marker stays readable where
     two lines cross — same reason the endpoint dots carry one. */
  .vdiv{stroke:var(--surface);stroke-width:1.5}
  /* the consensus scatter's 1y/2y horizon toggle */
  .est-mode button[aria-pressed="true"]{color:var(--accent);
       border-color:var(--accent)}
  .lgd .dvk{color:var(--faint);font-family:var(--sans);font-size:var(--t-label)}
  .viztip .r .dv{font-family:var(--mono);font-size:var(--t-micro);
       color:var(--warn);white-space:nowrap;margin-left:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Investment Micro-System</h1>
    <div class="meta">
      <span id="winwrap">window
        <select id="win">
          <option value="5">5d</option>
          <option value="10">10d</option>
          <option value="30" selected>30d</option>
          <option value="60">60d</option>
        </select>
      </span>
      <span id="refresh"></span>
      <span id="asof">—</span>
      <span id="fxwrap"><span id="fx">—</span> <span id="ovr">—</span></span>
      <button class="ghost" id="reload">Refresh</button>
    </div>
  </header>

  <div class="navs">
    <nav class="snav" id="snav" role="tablist" aria-label="sector">
      <span class="loading" style="padding:10px 4px">sectors…</span>
    </nav>
    <nav class="vnav" id="vnav" role="tablist" aria-label="view">
      <button class="tab" role="tab" aria-selected="true" data-t="pair">Scores &amp; Price</button>
      <button class="tab" role="tab" aria-selected="false" data-t="scores">Bridge</button>
      <button class="tab" role="tab" aria-selected="false" data-t="pos">Positioning</button>
      <!-- Only shown for a sector that declares a price chart or a watch
           (cement). For every other live sector the loader hides it — an
           always-on fourth tab that usually renders "nothing here" would
           train people to stop clicking tabs. -->
      <button class="tab" role="tab" aria-selected="false" data-t="sector"
              id="vtab-sector" hidden>Prices &amp; Watch</button>
    </nav>
  </div>

  <div id="err"></div>

  <section id="s-pair" class="on"><div class="loading">loading…</div></section>
  <section id="s-scores"><div class="loading">loading…</div></section>
  <section id="s-pos"><div class="loading">loading…</div></section>
  <section id="s-sector"><div class="loading">loading…</div></section>
  <section id="s-overview"><div class="loading">loading…</div></section>
  <section id="s-book"><div class="loading">loading…</div></section>
  <section id="s-flows"><div class="loading">loading…</div></section>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = v => v == null ? '—' : (v*100).toFixed(2) + '%';
const num = (v, d=0) => v == null ? '—' :
  v.toLocaleString('en-IN', {minimumFractionDigits:d, maximumFractionDigits:d});

function showErr(m){ $('#err').innerHTML = m ? `<div class="err">${esc(m)}</div>` : ''; }

// score 1–5 with 3 neutral: bar grows from the centre, coloured by side
function bar(s){
  if (s == null) return '<div class="bar"></div>';
  const d = (s - 3) / 2, w = Math.abs(d) * 50;
  const col = d > 0 ? 'var(--up)' : 'var(--down)';
  const left = d > 0 ? 50 : 50 - w;
  return `<div class="bar"><i style="left:${left}%;width:${w}%;background:${col}"></i></div>`;
}
function verdictChip(v){
  if (!v) return '';
  if (v.startsWith('no bridge')) return `<span class="chip c-warn">${esc(v)}</span>`;
  if (v === 'immaterial') return '<span class="chip c-flat">immaterial</span>';
  if (v === 'positive') return '<span class="chip c-up">positive</span>';
  if (v === 'negative') return '<span class="chip c-down">negative</span>';
  return `<span class="chip c-flat">${esc(v)}</span>`;
}

function renderGroup(g){
  const drv = g.drivers.map(d => `
    <div class="drv">
      <span>${esc(d.series)}${d.origin==='cited'?' · cited':''}</span>
      <b style="color:${d.pct>=0?'var(--up)':'var(--down)'}">${d.pct>=0?'+':''}${d.pct.toFixed(2)}%</b>
      ${num(d.from,2)} → ${num(d.to,2)}
      ${d.stale_days>7?`<span style="color:var(--warn)">stale ${d.stale_days}d</span>`:''}
    </div>`).join('');

  const rows = g.rows.map(r => `
    <tr>
      <td class="k">${esc(r.entity)}</td>
      <td class="n">${num(r.d_revenue_cr)}</td>
      <td class="n">${num(r.d_cost_cr)}</td>
      <td class="n" style="color:${r.d_ebitda_cr>=0?'var(--up)':'var(--down)'}">${num(r.d_ebitda_cr)}</td>
      <td class="n">${r.d_ebitda_per_t==null?'—':num(r.d_ebitda_per_t)}</td>
      <td class="n">${pct(r.pct_of_ebitda)}</td>
      <td class="n"><span class="score">${r.score==null?'—':r.score.toFixed(2)}</span></td>
      <td style="width:90px">${bar(r.score)}</td>
      <td>${verdictChip(r.verdict)}</td>
    </tr>`).join('');

  const pairs = g.pairs.map(p => `
    <tr>
      <td class="k">long <b>${esc(p.long)}</b> / short <b>${esc(p.short)}</b></td>
      <td class="n"><span class="score">${p.pair_score.toFixed(2)}</span></td>
      <td style="width:90px">${bar(p.pair_score)}</td>
      <td class="n">${pct(p.pct_spread)}</td>
      <td class="n hint">${p.naive_diff.toFixed(2)}</td>
    </tr>`).join('');

  return `
    <h2>${esc(g.peer_group)}</h2>
    <div class="drivers">${drv || '<span class="hint">no series moved in this window</span>'}</div>
    <div class="scroll"><table>
      <thead><tr><th>Entity</th><th class="n">Δrev cr</th><th class="n">Δcost cr</th>
        <th class="n">ΔEBITDA cr</th><th class="n">₹/t</th><th class="n">%EBITDA</th>
        <th class="n">Score</th><th></th><th>Verdict</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="scroll"><table>
      <thead><tr><th>Pair</th><th class="n">Pair score</th><th></th>
        <th class="n">%EBITDA spread</th><th class="n">naive diff</th></tr></thead>
      <tbody>${pairs || '<tr><td colspan="5" class="hint">no scoreable pair</td></tr>'}</tbody>
    </table></div>
    <p class="note">Pair score is the <b>spread run through the same curve</b>, not the
      difference of two scores — the last column shows what the naive difference would
      have read, which understates badly in the tails.</p>`;
}

async function loadScores(){
  const w = $('#win').value;
  const r = await fetch(`/api/scores?window=${w}`);
  const d = await r.json();
  if (d.error) return showErr(d.error);
  /* PEER GROUPS OF THE SELECTED SECTOR, not a hardcoded pair.
     This read `d.aluminium_primary` and `d.zinc` as literals, so the Bridge view
     showed non-ferrous whatever tab you were on — the Steel tab rendered its
     commodity list correctly and then a bridge for Hindalco. /api/scores has
     returned every group since steel went live; only this function had not been
     told. The nav already carries peer_groups per sector, so it is the source. */
  const e = SECTORS.find(x => x.id === SECTOR) || {};
  const groups = (e.peer_groups || []).map(k => d[k]).filter(Boolean);
  if (!groups.length){
    $('#s-scores').innerHTML = `<p class="note">No peer group in this sector
      returned a bridge. If the sector is live in <code>engine.SECTORS</code>,
      check that <code>/api/scores</code> lists its groups.</p>`;
    return;
  }
  /* Header facts come from the FIRST group rather than being averaged: as_of and
     USDINR are run-level and identical across groups, and overrides_applied is
     per-group — summing it would double-count an override that touches two. */
  const g = groups[0];
  $('#asof').textContent = 'as of ' + g.as_of;
  $('#fx').textContent = 'USDINR ' + g.usdinr.toFixed(2);
  $('#ovr').textContent = g.overrides_applied + ' override' +
    (g.overrides_applied === 1 ? '' : 's');
  $('#s-scores').innerHTML = groups.map(renderGroup).join('');
}

function spark(vals){
  if (!vals || vals.length < 2) return '';
  const w = 110, h = 22, lo = Math.min(...vals), hi = Math.max(...vals);
  const rng = (hi - lo) || 1;
  const pts = vals.map((v,i) =>
    `${(i/(vals.length-1)*w).toFixed(1)},${(h - (v-lo)/rng*h).toFixed(1)}`).join(' ');
  const last = vals[vals.length-1], up = last >= vals[0];
  const col = up ? 'var(--up)' : 'var(--down)';
  return `<svg width="${w}" height="${h}" aria-hidden="true">
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.4"/>
    <circle cx="${w}" cy="${(h-(last-lo)/rng*h).toFixed(1)}" r="2" fill="${col}"/></svg>`;
}
const buChip = b => !b ? '<span class="chip c-flat">—</span>' :
  b === 'long_buildup'   ? '<span class="chip c-up">long buildup</span>' :
  b === 'short_covering' ? '<span class="chip c-up">short covering</span>' :
  b === 'short_buildup'  ? '<span class="chip c-down">short buildup</span>' :
  b === 'long_unwinding' ? '<span class="chip c-down">long unwinding</span>' :
  `<span class="chip c-flat">${esc(b)}</span>`;

/* OI POSITIONING — the vault dashboard's viewOI, ported 2026-08-30 on the
   PM's instruction. Same visual grammar: tiles, buildup pills, percentile
   number-over-bar, the z+% magnitude cell, a status pill per row, grouped by
   sector. Differences forced by the data, stated rather than fudged:
   - OI/price deltas here are DAY changes (the oi table stores the day row);
     the vault computed 15d deltas from its dailies. Labelled accordingly.
   - The 60d sparkline column stays — this store has the history for it.
   Positioning remains a timing veto: it never flips a fundamental call. */
function oiPctileBar(p){
  if (p == null) return '<span class="neu">—</span>';
  const cls = p >= 90 ? 'neg' : p >= 75 ? 'warn' : p <= 25 ? 'pos' : 'neu';
  const w = Math.max(2, Math.min(100, p));
  return `<div class="dwrap"><span class="${cls}">${p.toFixed(0)}<span
    style="font-size:9px">th</span></span>
    <div class="dbar ${cls}" style="width:${w}%"></div></div>`;
}
function oiBuPill(t){
  if (!t) return '<span class="neu">—</span>';
  const map = {long_buildup: ['Long Buildup', 'ok'],
               short_buildup: ['Short Buildup', 'bad'],
               short_covering: ['Short Cov.', 'warn'],
               long_unwinding: ['Long Unwind.', 'warn'],
               neutral: ['Neutral', '']};
  const [label, cls] = map[t] || [t, ''];
  return `<span class="pill ${cls}">${esc(label)}</span>`;
}
function oiMagCell(z, pm){
  if (z == null && pm == null) return '<span class="neu" style="font-size:11px">—</span>';
  const zCls = z == null ? 'neu' : z <= -1.0 ? 'pos' : z >= 1.0 ? 'neg' : 'neu';
  const pCls = pm == null ? 'neu' : pm <= -15 ? 'pos' : pm >= 15 ? 'neg' : 'neu';
  const zStr = z != null ? (z > 0 ? '+' : '') + z.toFixed(1) + 'σ' : '—';
  const pStr = pm != null ? (pm > 0 ? '+' : '') + pm.toFixed(1) + '%' : '—';
  return `<span class="${zCls}" style="font-size:12px">${zStr}</span><br>
    <span class="${pCls}" style="font-size:10px">${pStr}</span>`;
}
function oiStatusPill(dateStr){
  // OI is T-1 BY DESIGN (NSE publishes the F&O bhavcopy after the close), so
  // 1-2 days is Live, not late. >5 days is the state that went invisible once.
  if (!dateStr) return '<span class="pill">no data</span>';
  const age = Math.round((Date.now() - new Date(dateStr + 'T00:00:00')) / 86400e3);
  if (age <= 2) return '<span class="pill ok">Live</span>';
  if (age <= 5) return `<span class="pill warn">${esc(dateStr)}</span>`;
  return `<span class="pill bad">Stale · ${esc(dateStr)}</span>`;
}

async function loadPos(){
  const rows = await (await fetch('/api/oi')).json();
  if (rows.error) return showErr(rows.error);

  const age = d => Math.round((Date.now() - new Date(d + 'T00:00:00')) / 86400e3);
  const fresh = rows.filter(r => r.date && age(r.date) <= 5).length;
  const stale = rows.length - fresh;

  const tiles = `<div class="tiles">
    <div class="tile"><div class="k">F&amp;O names</div>
      <div class="v">${rows.length}</div>
      <div class="s">not in F&amp;O are absent, not zero</div></div>
    <div class="tile ${fresh ? 'good' : ''}"><div class="k">fresh OI</div>
      <div class="v">${fresh}</div><div class="s">within 5 days (T-1 by design)</div></div>
    <div class="tile ${stale ? 'bad' : ''}"><div class="k">stale (&gt;5d)</div>
      <div class="v">${stale}</div><div class="s">the state that went invisible once</div></div>
  </div>`;

  // IT (2026-08-31) is OI-only: tracked for positioning, modelled nowhere.
  const ORDER = ['aluminium', 'zinc', 'steel', 'cement', 'mining', 'ems', 'it'];
  const SEC_LABEL = {aluminium:'Aluminium', zinc:'Zinc', steel:'Steel',
                     cement:'Cement', mining:'Mining', ems:'EMS', it:'IT',
                     other:'Other'};
  const bySector = {};
  for (const r of rows) (bySector[r.sector || 'other'] =
      bySector[r.sector || 'other'] || []).push(r);
  const sectors = [...ORDER.filter(s => bySector[s]),
                   ...Object.keys(bySector).filter(s => !ORDER.includes(s)).sort()];

  const secTables = sectors.map(sec => {
    const cos = bySector[sec].sort((a, b) =>
      (a.name || a.entity_id).localeCompare(b.name || b.entity_id));
    const trs = cos.map(r => `<tr class="oirow" data-eid="${esc(r.entity_id)}"
        aria-expanded="false" title="OI vs time chart">
      <td><b>${esc(r.name || r.entity_id)}</b>
        <span class="oicaret" aria-hidden="true">▸</span></td>
      <td class="n">${r.oi == null ? '<span class="neu">—</span>'
          : (r.oi / 100000).toFixed(1) + 'L'}<br><span class="neu"
          style="font-size:10px">lot: ${r.lot_size || '—'}</span></td>
      <td class="n">${r.oi_chg_pct == null ? '<span class="neu">—</span>'
          : `<span class="${r.oi_chg_pct >= 0 ? 'pos' : 'neg'}">${
              (r.oi_chg_pct >= 0 ? '+' : '') + r.oi_chg_pct.toFixed(1)}%</span>`}</td>
      <td class="n">${r.price_chg_pct == null ? '<span class="neu">—</span>'
          : `<span class="${r.price_chg_pct >= 0 ? 'pos' : 'neg'}">${
              (r.price_chg_pct >= 0 ? '+' : '') + r.price_chg_pct.toFixed(1)}%</span>`}</td>
      <td>${oiBuPill(r.buildup_15d)}</td>
      <td class="n">${oiPctileBar(r.oi_percentile_15d)}</td>
      <td>${oiBuPill(r.buildup)}</td>
      <td class="n">${oiPctileBar(r.oi_percentile)}</td>
      <td class="n">${oiMagCell(r.z_score_3m, r.pct_vs_median_3m)}</td>
      <td class="n">${r.price == null ? '—'
          : '₹' + r.price.toLocaleString('en-IN')}</td>
      <td>${spark(r.spark)}</td>
      <td>${oiStatusPill(r.date)}</td>
    </tr>`).join('');
    const label = SEC_LABEL[sec] || (sec.charAt(0).toUpperCase() + sec.slice(1));
    return `<div class="sechead">${esc(label)}
        <span class="neu" style="font-weight:400;font-size:12px">${cos.length}</span></div>
      <div class="panel"><div class="scroll"><table><thead><tr>
        <th>Company</th><th class="n">Futures OI</th><th class="n">OI Δ (day)</th>
        <th class="n">Price Δ (day)</th><th>Buildup (15d)</th><th class="n">15d pctl</th>
        <th>Buildup (3m)</th><th class="n">3m pctl</th><th class="n">Mag (3m)</th>
        <th class="n">Spot</th><th>60d OI</th><th>Status</th>
      </tr></thead><tbody>${trs}</tbody></table></div></div>`;
  }).join('');

  $('#s-pos').innerHTML =
    `<div class="pgt">OI Positioning</div>
     <div class="meta-line">Futures Open Interest · 15-day &amp; 3-month
       percentile bands · buildup type from OI+price direction · the two
       horizons routinely disagree, and that disagreement is the state worth
       seeing — a timing veto, never a fundamental call</div>
     ${tiles}
     <div class="hint" style="margin-bottom:4px">🟢 Long Buildup (OI↑ Price↑) ·
       🔴 Short Buildup (OI↑ Price↓) · 🟡 Short Covering (OI↓ Price↑) ·
       🟡 Long Unwinding (OI↓ Price↓) · click a row for its OI-vs-time chart</div>
     ${secTables || '<div class="panel"><div class="hint">no OI loaded</div></div>'}
     <div class="hint" style="margin-top:16px">Percentile: 90th+ = crowded trade
       risk, 25th− = under-positioned. <b>Mag (3m)</b>: Z-score &amp; % vs median —
       how <em>far</em> OI has moved, not just its rank. Z ≤ −1σ / ≤ −15% = light
       positioning (green). Z ≥ +1σ / ≥ +15% = heavy (red). OI is T-1 by design.
       The refresh pulls it daily; <code>--force</code> re-pulls.</div>`;

  // Property assignment, not addEventListener: loadPos re-renders this section
  // wholesale on every visit, and a listener added per render would stack.
  $('#s-pos').onclick = ev => {
    const tr = ev.target.closest('tr.oirow');
    if (tr) toggleOiRow(tr);
  };
}

/* OI VS TIME — the Sensibull chart grammar, per the PM 2026-09-01: futures OI
   as a shaded area against the futures price line, one name, daily since the
   store began (2026-04). The RELATION is the signal — OI rising into a falling
   price is a short build, and no buildup label says it as plainly as the two
   curves crossing. Expanded inline under the clicked row rather than a modal,
   so two names can be open at once for comparison.

   TWO Y-AXES, DELIBERATELY, where lineChart() refuses them: OI is in lots and
   price in rupees, and the whole point is overlaying the two shapes. The
   alternative — two stacked panes — hides exactly the crossings this chart
   exists to show. Neither axis starts at zero: OI's daily range is a few
   percent of its level, and a zero base flattens every move that matters. */
const OIH = {};   // entity_id -> /api/oi_history payload, fetched once
const OIV = {};   // entity_id -> chart geometry + rows, for the hover layer

async function toggleOiRow(tr){
  const eid = tr.dataset.eid;
  const open = tr.nextElementSibling;
  if (open && open.classList.contains('oich')){
    open.remove();
    tr.setAttribute('aria-expanded', 'false');
    return;
  }
  const ntr = document.createElement('tr');
  ntr.className = 'oich';
  const td = document.createElement('td');
  td.colSpan = tr.children.length;
  ntr.appendChild(td);
  tr.after(ntr);
  tr.setAttribute('aria-expanded', 'true');
  td.innerHTML = '<div class="hint">loading OI history…</div>';
  if (!OIH[eid]){
    try {
      OIH[eid] = await (await fetch(
        '/api/oi_history?id=' + encodeURIComponent(eid))).json();
    } catch (e){
      td.textContent = 'fetch failed: ' + e;
      return;
    }
  }
  const d = OIH[eid];
  if (d.error){ td.textContent = d.error; return; }
  // Real pixels, sized to the panel the row lives in — same reasoning as
  // lineChart(): a stretched viewBox scales the axis text too.
  const panel = tr.closest('.panel');
  const w = Math.max(520, Math.min(1100,
    (panel ? panel.clientWidth : 940) - 32));
  td.innerHTML = oiChart(eid, d, w);
  wireOiChart(eid);
}

const fmtOiLots = v => v == null ? '—'
  : Math.abs(v) >= 1e5 ? (v / 1e5).toFixed(1) + 'L'
  : Math.round(v / 1e3) + 'k';
const fmtOiPrice = v => v == null ? '—'
  : '₹' + Math.round(v).toLocaleString('en-IN');

function oiChart(eid, d, w){
  const rows = d.rows.filter(r => r.oi != null && r.price != null);
  if (rows.length < 2)
    return '<div class="hint">not enough OI history for a chart</div>';
  const h = 260, ML = 60, MR = 72, MT = 20, MB = 30;
  const T = s => Date.parse(s);
  const x0 = T(rows[0].date), x1 = T(rows[rows.length - 1].date);
  const X = ms => ML + (x1 === x0 ? 0 : (ms - x0) / (x1 - x0)) * (w - ML - MR);
  const pad = (lo, hi) => {
    const p = ((hi - lo) || Math.abs(hi) || 1) * 0.06;
    return [lo - p, hi + p];
  };
  const [oLo, oHi] = pad(Math.min(...rows.map(r => r.oi)),
                         Math.max(...rows.map(r => r.oi)));
  const [pLo, pHi] = pad(Math.min(...rows.map(r => r.price)),
                         Math.max(...rows.map(r => r.price)));
  const Yo = v => MT + (1 - (v - oLo) / ((oHi - oLo) || 1)) * (h - MT - MB);
  const Yp = v => MT + (1 - (v - pLo) / ((pHi - pLo) || 1)) * (h - MT - MB);

  // ONE grid, both axes labelled at its lines. Two independent tick sets draw
  // two competing grids and the chart reads as an error.
  let grid = '', yl = '', yr = '';
  for (const f of [0, 1 / 3, 2 / 3, 1]){
    const y = (MT + f * (h - MT - MB)).toFixed(1);
    grid += '<line class="grid" x1="' + ML + '" x2="' + (w - MR) +
            '" y1="' + y + '" y2="' + y + '"/>';
    yl += '<text class="ax" x="' + (ML - 8) + '" y="' + y +
          '" text-anchor="end" dominant-baseline="middle">' +
          fmtOiLots(oHi - f * (oHi - oLo)) + '</text>';
    yr += '<text class="ax" x="' + (w - MR + 8) + '" y="' + y +
          '" dominant-baseline="middle">' +
          fmtOiPrice(pHi - f * (pHi - pLo)) + '</text>';
  }
  let xax = '';
  const seen = new Set();
  for (let i = 0; i < 6; i++){
    const k = Math.round(i * (rows.length - 1) / 5);
    if (seen.has(k)) continue;
    seen.add(k);
    const dd = rows[k].date;
    xax += '<text class="ax" x="' + X(T(dd)).toFixed(1) + '" y="' + (h - 9) +
           '" text-anchor="middle">' + esc(dtick(dd, false)) + '</text>';
  }

  const oiPts = rows.map(r =>
    X(T(r.date)).toFixed(1) + ',' + Yo(r.oi).toFixed(1)).join(' ');
  const prPts = rows.map(r =>
    X(T(r.date)).toFixed(1) + ',' + Yp(r.price).toFixed(1)).join(' ');
  const bot = (h - MB).toFixed(1);
  const area = 'M' + X(x0).toFixed(1) + ' ' + bot + ' L' +
    oiPts.split(' ').join(' L') + ' L' + X(x1).toFixed(1) + ' ' + bot + ' Z';

  OIV[eid] = {w: w, h: h, ML: ML, MR: MR, MT: MT, MB: MB,
              x0: x0, x1: x1, X: X, rows: rows,
              lot: d.lot_size};

  const cid = 'oi-' + eid;
  return '<div class="chartwrap" id="cw-' + cid + '">' +
    '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h +
      '" role="img" tabindex="0" aria-label="Futures OI vs time, ' +
      esc(d.name || eid) + '">' +
    grid +
    '<line class="xhair" x1="0" x2="0" y1="' + MT + '" y2="' + (h - MB) +
      '" style="display:none"/>' +
    '<path d="' + area + '" style="fill:var(--accent-soft)"/>' +
    '<polyline points="' + oiPts + '" fill="none" style="stroke:var(--accent)"' +
      ' stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<polyline points="' + prPts + '" fill="none" style="stroke:var(--warn)"' +
      ' stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
    yl + yr + xax +
    '<text class="axl" x="' + ML + '" y="12">FUTURES OI VS TIME — ' +
      esc(d.name || eid) + '</text>' +
    '</svg><div class="viztip" role="status"></div>' +
    '<div class="legend">' +
      '<span><i style="border-top:2.5px solid var(--accent)"></i> Futures OI' +
        (d.lot_size ? ' · lot ' + esc(String(d.lot_size)) : '') + '</span>' +
      '<span><i style="border-top:2.5px solid var(--warn)"></i> Futures' +
        ' price</span></div></div>';
}

// Day buildup, derived from consecutive rows — same OI+price sign rule the
// table's pills use, so the tooltip and the pills can never disagree.
function oiDayBuildup(prev, cur){
  if (!prev || prev.oi == null || cur.oi == null ||
      prev.price == null || cur.price == null) return null;
  const doi = cur.oi - prev.oi, dp = cur.price - prev.price;
  if (!doi || !dp) return ['neutral', 'var(--faint)'];
  return doi > 0
    ? (dp > 0 ? ['long buildup', 'var(--up)'] : ['short buildup', 'var(--down)'])
    : (dp > 0 ? ['short covering', 'var(--warn)']
              : ['long unwinding', 'var(--warn)']);
}

function wireOiChart(eid){
  const m = OIV[eid];
  const wrap = document.getElementById('cw-oi-' + eid);
  if (!wrap || !m) return;
  const svg = wrap.querySelector('svg');
  const xh = wrap.querySelector('.xhair');
  const tip = wrap.querySelector('.viztip');
  let idx = -1;

  const hide = () => {
    xh.style.display = 'none'; tip.classList.remove('on'); idx = -1;
  };

  const line = (label, val, col) => {
    const row = document.createElement('div'); row.className = 'r';
    const key = document.createElement('i');
    key.style.borderTopColor = col;
    const b = document.createElement('b'); b.textContent = val;
    const em = document.createElement('em'); em.textContent = label;
    row.appendChild(key); row.appendChild(b); row.appendChild(em);
    return row;
  };

  const draw = i => {
    if (i < 0 || i >= m.rows.length) return hide();
    idx = i;
    const r = m.rows[i], prev = m.rows[i - 1];
    const x = m.X(Date.parse(r.date));
    xh.setAttribute('x1', x); xh.setAttribute('x2', x);
    xh.style.display = '';

    tip.textContent = '';
    const hd = document.createElement('div');
    hd.className = 'd'; hd.textContent = r.date;
    tip.appendChild(hd);
    const doi = prev && prev.oi != null && r.oi != null ? r.oi - prev.oi : null;
    tip.appendChild(line('OI' + (doi == null ? '' :
      ' (' + (doi >= 0 ? '+' : '−') + fmtOiLots(Math.abs(doi)) + ')'),
      fmtOiLots(r.oi), 'var(--accent)'));
    const dp = prev && prev.price != null && r.price != null
      ? (r.price / prev.price - 1) * 100 : null;
    tip.appendChild(line('price' + (dp == null ? '' :
      ' (' + (dp >= 0 ? '+' : '') + dp.toFixed(1) + '%)'),
      fmtOiPrice(r.price), 'var(--warn)'));
    const bu = oiDayBuildup(prev, r);
    if (bu){
      const dv = document.createElement('div'); dv.className = 'r';
      const em = document.createElement('em');
      // Inline: .viztip .r em pins color to --soft and outranks a class here.
      em.style.color = bu[1]; em.textContent = bu[0];
      dv.appendChild(em); tip.appendChild(dv);
    }

    tip.classList.add('on');
    const tw = tip.offsetWidth || 170;
    const left = (x + 14 + tw > m.w) ? x - tw - 14 : x + 14;
    tip.style.left = Math.max(4, left) + 'px';
    tip.style.top = m.MT + 'px';
  };

  const nearest = clientX => {
    const rc = svg.getBoundingClientRect();
    if (!rc.width) return -1;
    const px = (clientX - rc.left) * (m.w / rc.width);
    const frac = (px - m.ML) / (m.w - m.ML - m.MR);
    if (frac < -0.03 || frac > 1.03) return -1;
    const ms = m.x0 + Math.min(1, Math.max(0, frac)) * (m.x1 - m.x0);
    let best = -1, bd = Infinity;
    for (let i = 0; i < m.rows.length; i++){
      const dd = Math.abs(Date.parse(m.rows[i].date) - ms);
      if (dd < bd){ bd = dd; best = i; }
    }
    return best;
  };

  svg.addEventListener('pointermove', ev => draw(nearest(ev.clientX)));
  svg.addEventListener('pointerleave', hide);
  svg.addEventListener('blur', hide);
  svg.addEventListener('focus', () => draw(idx < 0 ? m.rows.length - 1 : idx));
  svg.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowLeft'){
      draw(Math.max(0, (idx < 0 ? m.rows.length - 1 : idx) - 1));
      ev.preventDefault();
    } else if (ev.key === 'ArrowRight'){
      draw(Math.min(m.rows.length - 1, (idx < 0 ? 0 : idx) + 1));
      ev.preventDefault();
    } else if (ev.key === 'Escape') hide();
  });
}

/* ====================================================================
   PAIR VIEW — the persisted tape, not the live bridge
   ==================================================================== */

// Mirror of packages/score/scoring.py. It lives in JS so switching the pair
// re-scores instantly with no server round trip. k / p / form / sign all come
// FROM the server (tape.curves), so specs/scoring.yaml remains the single
// source of calibration — only the arithmetic is duplicated here, never the
// constants. If the curve form ever changes, this must be updated with it.
const NEUTRAL = 3.0, HALF = 2.0;
const TAPE = {};
const P = {pillar: 'composite', span: 'all', div: 20};  // legs removed with the pair view
const SPANS = {'1m':30, '3m':91, '6m':182, '1y':365, '3y':1095, 'all':null};

/* DIVERGENCE THRESHOLDS. Both must be cleared, in opposite directions, over
   the selected window. Calibrated against the live tape rather than picked:
   at a 20-session window these give 12 markers across the 5 steel names over
   149 sessions and 16 across non-ferrous — two or three per name over seven
   months. The looser pair below (0.15 / 3%) gives 18 and 20, which starts to
   read as texture; the tighter one (0.40 / 8%) gives 8 and 9.

   They are constants rather than a second control on purpose: the window is
   the knob worth turning day to day, and two selects for one feature crowds
   the filter row. Exposing them is a small change if it turns out to matter. */
const DIV_S = 0.25;    // minimum |change in score|, on the 1-5 scale
const DIV_P = 5.0;     // minimum |change in price|, per cent

/* Score and price moving AGAINST each other over a trailing window — the
   market disagreeing with the fundamental view, which is the whole point of
   plotting the two together.

   `al` is the score and cumulative-% series already aligned on date. The
   window return is taken as the RATIO of the two cumulative points, not their
   difference: the % series is a chained index, so subtracting two of its
   levels is not a return over that leg.

   ONSET ONLY, then a refractory period of one window. Without it every
   session inside a divergent leg qualifies and the line disappears under a
   run of identical markers — the condition persists, but it is one event. */
function divergences(al, win){
  const out = [];
  let blockUntil = -1;
  for (let i = win; i < al.length; i++){
    if (i <= blockUntil) continue;
    const now = al[i], then = al[i - win];
    const ds = now.s - then.s;
    const ret = ((1 + now.p / 100) / (1 + then.p / 100) - 1) * 100;
    if (ds * ret >= 0) continue;                       // same way, or a flat leg
    if (Math.abs(ds) < DIV_S || Math.abs(ret) < DIV_P) continue;
    out.push({d: now.d, v: now.s, ds: ds, ret: ret, dir: ds > 0 ? 1 : -1});
    blockUntil = i + win;
  }
  return out;
}

async function getTape(pillar){
  /* SEND THE SELECTED SECTOR'S PEER GROUPS. Without this the tape returns
     every scored name and the Pair tab draws the same chart on every sector —
     the same sector-blindness that loadScores() had, in the neighbouring
     view. */
  const se = SECTORS.find(x => x.id === SECTOR) || {};
  const gq = (se.peer_groups || []).join(',');
  /* AND CACHE ON THE GROUPS, not on the pillar alone. The request above was
     made sector-aware; this key was not, so the FIRST sector's tape was
     handed to every later one under the same pillar and only a page reload
     cleared it. Keyed on gq rather than on SECTOR because the response
     depends on the groups: two sectors sharing a group set may legitimately
     share the entry, and a sector with none gets its own. */
  const ck = gq + '|' + pillar;
  if (!TAPE[ck]){
    const d = await (await fetch('/api/tape?pillar=' + encodeURIComponent(pillar) +
      (gq ? '&groups=' + encodeURIComponent(gq) : ''))).json();
    if (d.error) throw new Error(d.error);
    TAPE[ck] = d;
  }
  return TAPE[ck];
}

function spanCut(tp){
  const days = SPANS[P.span];
  if (!days || !tp.as_of_max) return null;
  const d = new Date(Date.parse(tp.as_of_max) - days * 864e5);
  return d.toISOString().slice(0, 10);
}

function niceCeil(v){
  if (!(v > 0)) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 1.5, 2, 2.5, 3, 4, 5, 7.5, 10]) if (v <= m * e) return m * e;
  return 10 * e;
}
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
// Over a multi-year span the day of month is noise and the year is the thing
// you need; inside a few months it is the other way round.
const dtick = (d, wide) => wide
  ? MON[+d.slice(5, 7) - 1] + " '" + d.slice(2, 4)
  : d.slice(8, 10) + ' ' + MON[+d.slice(5, 7) - 1];

function pathOf(pts, X, Y){
  let out = '', pen = false;
  for (const p of pts){
    if (p.v == null){ pen = false; continue; }
    out += (pen ? 'L' : 'M') + X(p.d).toFixed(1) + ' ' + Y(p.v).toFixed(1) + ' ';
    pen = true;
  }
  return out.trim();
}

function tradingDaysSince(iso){
  let n = 0;
  const d = new Date(iso + 'T00:00:00'), now = new Date();
  now.setHours(0, 0, 0, 0);
  while (d < now){ d.setDate(d.getDate() + 1);
    const w = d.getDay(); if (w !== 0 && w !== 6) n++; }
  return n;
}
function showRefresh(tp){
  const r = tp.refresh || {}, el = $('#refresh');
  const age = tp.as_of_max ? tradingDaysSince(tp.as_of_max) : null;
  let cls = 'c-up', txt, tip;
  if (r.state === 'never'){
    cls = 'c-warn'; txt = 'never refreshed';
    tip = r.why + ' — run: python packages/refresh.py';
  } else if (r.state === 'failed'){
    cls = 'c-down'; txt = 'refresh FAILED ' + (r.day || '');
    tip = 'failed steps: ' + (r.failed_steps || []).join(', ');
  } else if (age !== null && age >= 2){
    cls = 'c-warn'; txt = 'scores ' + age + ' trading days old';
    tip = 'last refresh ' + (r.day || '?') + ', store as of ' + tp.as_of_max;
  } else if (r.feeds_ok === false){
    // THE CASE THE LIGHT USED TO MISS. Every step succeeded and the scores
    // carry today's date, but they were computed on inputs that stopped
    // printing days ago. "The run worked" and "the inputs are current" are
    // different claims; only the first was ever being made.
    const s = r.stale_feeds || [];
    cls = 'c-warn';
    txt = s.length + ' feed' + (s.length === 1 ? '' : 's') + ' stale';
    tip = s.map(f => `${f.series} (${f.feed}) ${f.age}, limit ${f.limit}`).join(' · ');
  } else {
    txt = 'refreshed ' + (r.day || '?');
    tip = 'store as of ' + tp.as_of_max + '; not covered by an unattended run: '
        + (r.manual || []).map(m => m.name).join(', ');
  }
  const extra = (r.stale_feeds || []).length && r.feeds_ok === false
    ? '' : ((r.stale_feeds || []).length
        ? ' · stale: ' + r.stale_feeds.map(f => f.series).join(', ') : '');
  el.innerHTML = `<span class="chip ${cls}" title="${esc(tip + extra)}">${esc(txt)}</span>`;
}

// ===================== scores and price, one name per row =====================
// REPLACED THE PAIR VIEW on 2026-08-24 at the PM's request. What is gone: the
// long/short selectors, the relative-performance chart, the pair-score stats and
// the two pair warnings (cross-peer-group, and the HZL/VEDL "no economics signal
// by construction" note). Those warnings existed because a PAIR can mislead;
// reading one name's own score against its own price cannot mislead in the same
// way, so they have no subject any more.
//
// WHAT IS KEPT AND WHY. The corporate-action break is kept: VEDL's -64.9% on
/* =====================================================================
   SECTOR CHARTS — two charts, one measure each

   Replaces the old per-name dual-axis chart, which put score on a left
   axis and price on a right one. A dual-axis plot invites a comparison
   that is not in the data: the two scales are unrelated, so a crossing
   means nothing and the reader reads a relationship out of an artefact of
   the scaling. Split by MEASURE instead — score on its fixed 1-5 axis,
   price as % change from the start of the span — and put every name on
   both charts as its own line, which is the comparison actually worth
   making inside a sector.

   Price is indexed to % rather than quoted in rupees because that is what
   makes several names shareable on one axis. Absolute closes cannot be
   overlaid: SAIL near 130 and APL Apollo near 1,900 on one scale flattens
   four of the five lines into the floor.

   COLOUR is keyed on the entity's position in tp.order, which is stable
   across span and pillar changes, so a name keeps its colour when the
   series count changes. The slot ORDER is the colourblind-safety
   mechanism, not decoration — it was validated (adjacent-pair Delta E,
   both modes, against this app's own panel surfaces). Do not reorder it,
   and do not add a 9th generated hue.
   ===================================================================== */
const SERIES_MAX = 8;
const slotOf = (tp, eid) => {
  const i = tp.order.indexOf(eid);
  return (i >= 0 && i < SERIES_MAX) ? i + 1 : 0;
};
// var() needs to ride in `style`, not in a fill/stroke presentation attribute.
const inkOf = slot => slot ? 'var(--series-' + slot + ')' : 'var(--faint)';

/* Cumulative % change, chaining daily returns from the first close in the span.

   ACROSS A CONFIRMED CORPORATE ACTION NO RETURN IS CARRIED. The quoted price
   steps mechanically there, and the API's `pct` is the OBSERVED jump rather
   than a separable adjustment factor — `from`/`to` are simply the two closes —
   so there is nothing to divide out. Dropping that single day's return is the
   only handling that does not invent a number, and the chart draws a rule where
   it happened. Left alone, an unadjusted demerger prints as a real -40% on a
   line whose entire purpose is comparing performance. */
function pctSeries(pts, breaks){
  const ok = pts.filter(p => p.close != null);
  if (ok.length < 2) return [];
  const out = [{d: ok[0].d, v: 0}];
  let cum = 1;
  for (let i = 1; i < ok.length; i++){
    const prev = ok[i - 1].close;
    if (prev && !breaks.has(ok[i].d)) cum *= ok[i].close / prev;
    out.push({d: ok[i].d, v: (cum - 1) * 100});
  }
  return out;
}
const scoreSeries = pts =>
  pts.filter(p => p.score != null).map(p => ({d: p.d, v: p.score}));

const PAIRV = {};        // chart id -> geometry + data, for the hover layer

/* One chart, one y-axis. Sized in REAL PIXELS rather than a fixed viewBox
   stretched with preserveAspectRatio of none — that stretch scaled x, not y,
   so every axis label was drawn ~38% wide on a full-width monitor. */
function lineChart(cfg){
  const {id, w, h, series, yLo, yHi, ticks, fmtY, fmtV, xDom, xTicks, marks, axisLabel} = cfg;
  const ML = 54, MR = 116, MT = 16, MB = 30;
  const [x0, x1] = xDom;
  const X = ms => ML + (x1 === x0 ? 0 : (ms - x0) / (x1 - x0) * (w - ML - MR));
  const Y = v => MT + (1 - (v - yLo) / ((yHi - yLo) || 1)) * (h - MT - MB);
  const T = d => Date.parse(d);

  let grid = '', yax = '';
  for (const v of ticks){
    const y = Y(v).toFixed(1);
    // Solid hairlines. A dashed rule reads as "this line is itself data".
    const base = (v === 0 || (yLo === 1 && v === 3));
    grid += '<line class="' + (base ? 'zero' : 'grid') + '" x1="' + ML +
            '" x2="' + (w - MR) + '" y1="' + y + '" y2="' + y + '"/>';
    yax += '<text class="ax" x="' + (ML - 8) + '" y="' + y +
           '" text-anchor="end" dominant-baseline="middle">' + esc(fmtY(v)) + '</text>';
  }

  let mk = '';
  for (const m of (marks || [])){
    const x = X(T(m.d)).toFixed(1);
    mk += '<line class="zero" x1="' + x + '" x2="' + x + '" y1="' + MT +
          '" y2="' + (h - MB) + '"/>';
  }

  const wide = (x1 - x0) > 400 * 864e5;
  let xax = '';
  for (const d of xTicks)
    xax += '<text class="ax" x="' + X(T(d)).toFixed(1) + '" y="' + (h - 9) +
           '" text-anchor="middle">' + esc(dtick(d, wide)) + '</text>';

  let lines = '';
  const ends = [];
  for (const s of series){
    if (s.pts.length < 2) continue;
    const pl = s.pts.map(p => X(T(p.d)).toFixed(1) + ',' + Y(p.v).toFixed(1)).join(' ');
    lines += '<polyline points="' + pl + '" fill="none" style="stroke:' + inkOf(s.slot) +
             '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    const last = s.pts[s.pts.length - 1];
    ends.push({s: s, yTrue: Y(last.v), y: Y(last.v), x: X(T(last.d))});
  }

  /* De-collide the end labels. Five names inside a 1-5 band overlap routinely,
     and a stack of unreadable labels is its own anti-pattern. The DOT stays on
     the true value and a leader connects it to the moved label, so nothing is
     mis-attributed to the wrong line. */
  ends.sort((a, b) => a.yTrue - b.yTrue);
  const GAP = 13;
  for (let i = 1; i < ends.length; i++)
    if (ends[i].y - ends[i - 1].y < GAP) ends[i].y = ends[i - 1].y + GAP;
  if (ends.length){
    ends[ends.length - 1].y = Math.min(ends[ends.length - 1].y, h - MB);
    for (let i = ends.length - 2; i >= 0; i--)
      ends[i].y = Math.min(ends[i].y, ends[i + 1].y - GAP);
    for (const e of ends) e.y = Math.max(e.y, MT + 5);
  }

  /* Divergence markers. A TRIANGLE POINTING THE WAY THE SCORE WENT: up means
     score rose while price fell, down means score fell while price rose. The
     marker existing at all is what says the two disagreed, so one shape rule
     covers both cases and needs no second colour — which matters, because
     colour here already means "which name" and cannot also mean "which
     direction". Filled in the series colour with a surface-coloured ring so
     it stays legible where two lines cross. */
  let dmk = '';
  for (const sr of series){
    for (const g of (sr.divs || [])){
      const x = X(T(g.d)), y = Y(g.v), r = 5;
      const pts = g.dir > 0
        ? [[x, y - r], [x - r * 0.9, y + r * 0.7], [x + r * 0.9, y + r * 0.7]]
        : [[x, y + r], [x - r * 0.9, y - r * 0.7], [x + r * 0.9, y - r * 0.7]];
      dmk += '<polygon points="' + pts.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ') +
             '" style="fill:' + inkOf(sr.slot) + '" class="vdiv"/>';
    }
  }

  let lab = '';
  for (const e of ends){
    const col = inkOf(e.s.slot);
    lab += '<circle cx="' + e.x.toFixed(1) + '" cy="' + e.yTrue.toFixed(1) +
           '" r="3" style="fill:' + col + '" stroke-width="1.5" class="vdot"/>';
    if (Math.abs(e.y - e.yTrue) > 2)
      lab += '<line x1="' + (w - MR + 3) + '" x2="' + (w - MR + 8) + '" y1="' +
             e.yTrue.toFixed(1) + '" y2="' + e.y.toFixed(1) +
             '" style="stroke:' + col + '" stroke-width="1"/>';
    // Label text wears INK, never the series colour — the dot and leader beside
    // it carry identity. On the light surface three of the eight slots sit under
    // 3:1, so coloured label text would be genuinely unreadable.
    lab += '<text class="vend" x="' + (w - MR + 12) + '" y="' + e.y.toFixed(1) +
           '" dominant-baseline="middle">' + esc(e.s.label) + '</text>';
  }

  PAIRV[id] = {
    ML: ML, MR: MR, w: w, h: h, MT: MT, MB: MB, x0: x0, x1: x1, X: X,
    fmt: fmtV || fmtY,
    all: cfg.allDates,
    series: series.filter(s => s.pts.length).map(s => ({
      label: s.label, slot: s.slot,
      byDate: new Map(s.pts.map(p => [p.d, p.v])),
      divByDate: new Map((s.divs || []).map(g => [g.d, g]))
    }))
  };

  return '<div class="chartwrap" id="cw-' + id + '">' +
    '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h +
      '" role="img" tabindex="0" aria-label="' + esc(axisLabel) + '">' +
    grid + mk +
    '<line class="xhair" x1="0" x2="0" y1="' + MT + '" y2="' + (h - MB) + '" style="display:none"/>' +
    lines + dmk + lab + yax + xax +
    '<text class="axl" x="' + ML + '" y="10">' + esc(axisLabel) + '</text>' +
    '</svg><div class="viztip" role="status"></div></div>';
}

/* The consensus scatter's hover layer (PM, 2026-09-02: "a crosshair of sorts
   so I can see exact valuation numbers"). Same idiom as wireChart below, but
   two-dimensional: hairlines on BOTH axes with readout chips showing the
   growth/multiple under the cursor, and within 30 svg-units of a point the
   crosshair SNAPS to it — the chips then read the name's exact values and the
   viztip carries the full row. The scatter is viewBox-scaled (the pair charts
   are real-pixel), so client coords are mapped through the bounding rect. */
let ESTV = null;       // geometry + rows of the currently drawn scatter
let EST_REDRAW = null; // buildEstScatter closure for the 1y/2y toggle
let EST_DATE = null;   // replay date for the consensus panel (null = today)
function wireEstScatter(){
  const wrap = document.getElementById('cw-est');
  if (!wrap || !ESTV) return;
  const m = ESTV;
  const svg = wrap.querySelector('svg');
  const vx = svg.querySelector('.es-vx'), hx = svg.querySelector('.es-hx');
  const ring = svg.querySelector('.es-ring');
  const grx = svg.querySelector('.es-rx'), gry = svg.querySelector('.es-ry');
  const tip = wrap.querySelector('.viztip');
  const iw = m.W - m.ml - m.mr, ih = m.H - m.mt - m.mb;
  let sel = -1;

  const hide = () => {
    [vx, hx, ring, grx, gry].forEach(e => { e.style.display = 'none'; });
    tip.classList.remove('on'); sel = -1;
  };

  const readout = (x, y) => {
    vx.setAttribute('x1', x); vx.setAttribute('x2', x); vx.style.display = '';
    hx.setAttribute('y1', y); hx.setAttribute('y2', y); hx.style.display = '';
    grx.setAttribute('transform', `translate(${x},0)`); grx.style.display = '';
    gry.setAttribute('transform', `translate(0,${y})`); gry.style.display = '';
    grx.querySelector('text').textContent =
      ((x - m.ml) / iw * m.xmax * 100).toFixed(1) + '%';
    gry.querySelector('text').textContent =
      (m.ymax - (y - m.mt) / ih * (m.ymax - m.ymin)).toFixed(1) + 'x';
  };

  const showTip = (p, rect) => {
    ring.setAttribute('cx', p.x); ring.setAttribute('cy', p.y);
    ring.style.display = '';
    // textContent throughout — ids/names arrive from the API (untrusted).
    tip.textContent = '';
    const hd = document.createElement('div'); hd.className = 'd';
    hd.textContent = p.d.id + (p.d.group ? ' · ' + p.d.group : '');
    tip.appendChild(hd);
    const sgn = (v, dec) => (v >= 0 ? '+' : '') + (v * 100).toFixed(dec) + '%';
    [[p.d.fwd_pe.toFixed(1) + 'x', 'fwd P/E'],
     [p.d.eps_fy2 > 0 ? (p.d.close / p.d.eps_fy2).toFixed(1) + 'x' : '—',
      'P/E ' + (p.d.fy2 || 'FY2') + 'E'],
     ...(p.d.pe_2y != null
        ? [[p.d.pe_2y.toFixed(1) + 'x', '2y fwd (BBG)']] : []),
     ...(p.d.eps_2y_implied != null
        ? [[p.d.eps_2y_implied.toFixed(1), 'EPS 24m implied']] : []),
     [p.d.ttm_pe == null ? '—' : p.d.ttm_pe.toFixed(1) + 'x', 'P/E ttm'],
     [fmtNum(p.d.close), 'close'],
     [p.d.eps_fy1.toFixed(1) + ' / ' + p.d.eps_fy2.toFixed(1),
      'EPS ' + (p.d.fy1 || 'FY1') + '/' + (p.d.fy2 || 'FY2')],
     [sgn(p.d.growth, 1), 'growth'],
     [p.d.peg == null ? '—' : p.d.peg.toFixed(2), 'PEG'],
     [p.d.rev_90d == null ? '—' : sgn(p.d.rev_90d, 1), 'rev 90d'],
     [String(p.d.n_analysts), 'analysts']].forEach(([v, l]) => {
      const r = document.createElement('div'); r.className = 'r';
      const b = document.createElement('b'); b.textContent = v;
      const em = document.createElement('em'); em.textContent = l;
      r.appendChild(b); r.appendChild(em); tip.appendChild(r);
    });
    tip.classList.add('on');
    // Tip position in CSS pixels (the svg is viewBox-scaled).
    const kx = rect.width / m.W, ky = rect.height / m.H;
    const tw = tip.offsetWidth || 170, th = tip.offsetHeight || 150;
    let left = p.x * kx + 16;
    if (left + tw > rect.width) left = p.x * kx - tw - 16;
    let top = Math.max(4, Math.min(p.y * ky - th / 2, rect.height - th - 4));
    tip.style.left = Math.max(4, left) + 'px';
    tip.style.top = top + 'px';
  };

  const move = ev => {
    const rect = svg.getBoundingClientRect();
    if (!rect.width) return;
    const x = (ev.clientX - rect.left) * (m.W / rect.width);
    const y = (ev.clientY - rect.top) * (m.H / rect.height);
    if (x < m.ml - 8 || x > m.W - m.mr + 8 ||
        y < m.mt - 8 || y > m.H - m.mb + 8) return hide();
    let best = -1, bd = Infinity;
    m.pts.forEach((p, i) => {
      const d = Math.hypot(p.x - x, p.y - y);
      if (d < bd){ bd = d; best = i; }
    });
    if (best >= 0 && bd <= 30){
      sel = best; const p = m.pts[best];
      readout(p.x, p.y); showTip(p, rect);
    } else {
      sel = -1; ring.style.display = 'none'; tip.classList.remove('on');
      readout(Math.max(m.ml, Math.min(x, m.W - m.mr)),
              Math.max(m.mt, Math.min(y, m.H - m.mb)));
    }
  };

  svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerleave', hide);
  svg.addEventListener('blur', hide);
  // Keyboard reaches the same readout: focus lands on the leftmost name,
  // arrows walk the cross-section. The table below is the full fallback.
  const select = i => {
    sel = (i + m.pts.length) % m.pts.length;
    const p = m.pts[sel];
    readout(p.x, p.y); showTip(p, svg.getBoundingClientRect());
  };
  svg.addEventListener('focus', () => { if (sel < 0 && m.pts.length) select(0); });
  svg.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') return hide();
    if (ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft') return;
    ev.preventDefault();
    select(sel < 0 ? 0 : sel + (ev.key === 'ArrowRight' ? 1 : -1));
  });
}

/* The hover layer. Required rather than optional: an SVG chart in a browser is
   interactive, and the crosshair is how a reader aims at a DATE instead of at a
   2px line. One tooltip lists every series at that x, so the pointer never has
   to land on a particular line to get a number. */
function wireChart(id){
  const wrap = document.getElementById('cw-' + id);
  const m = PAIRV[id];
  if (!wrap || !m) return;
  const svg = wrap.querySelector('svg');
  const xh = wrap.querySelector('.xhair');
  const tip = wrap.querySelector('.viztip');
  let idx = -1;

  const hide = () => { xh.style.display = 'none'; tip.classList.remove('on'); idx = -1; };

  const draw = i => {
    if (i < 0 || i >= m.all.length) return hide();
    idx = i;
    const d = m.all[i];
    const x = m.X(Date.parse(d));
    xh.setAttribute('x1', x); xh.setAttribute('x2', x);
    xh.style.display = '';

    // textContent throughout: entity ids arrive from the API and are untrusted.
    tip.textContent = '';
    const hd = document.createElement('div');
    hd.className = 'd';
    hd.textContent = d;
    tip.appendChild(hd);
    let any = false;
    for (const s of m.series){
      if (!s.byDate.has(d)) continue;
      any = true;
      const row = document.createElement('div'); row.className = 'r';
      const key = document.createElement('i');
      key.style.borderTopColor = inkOf(s.slot);
      const val = document.createElement('b');
      val.textContent = m.fmt(s.byDate.get(d));      // value leads
      const nm = document.createElement('em');
      nm.textContent = s.label;                       // label follows
      row.appendChild(key); row.appendChild(val); row.appendChild(nm);
      const g = s.divByDate && s.divByDate.get(d);
      if (g){
        // Spell out both legs. A marker that only says "divergence here" sends
        // you hunting across the other chart for the half it withheld.
        const dv = document.createElement('span');
        dv.className = 'dv';
        dv.textContent = (g.ds > 0 ? '▲' : '▼') + ' score ' +
          (g.ds > 0 ? '+' : '') + g.ds.toFixed(2) + ' vs price ' +
          (g.ret > 0 ? '+' : '') + g.ret.toFixed(1) + '%';
        row.appendChild(dv);
      }
      tip.appendChild(row);
    }
    if (!any) return hide();

    tip.classList.add('on');
    // Flip before the right edge rather than letting the panel clip it.
    const tw = tip.offsetWidth || 170;
    const left = (x + 14 + tw > m.w) ? x - tw - 14 : x + 14;
    tip.style.left = Math.max(4, left) + 'px';
    tip.style.top = m.MT + 'px';
  };

  const nearest = clientX => {
    const r = svg.getBoundingClientRect();
    if (!r.width) return -1;
    const px = (clientX - r.left) * (m.w / r.width);
    const frac = (px - m.ML) / (m.w - m.ML - m.MR);
    if (frac < -0.03 || frac > 1.03) return -1;
    const ms = m.x0 + Math.min(1, Math.max(0, frac)) * (m.x1 - m.x0);
    let best = -1, bd = Infinity;
    for (let i = 0; i < m.all.length; i++){
      const dd = Math.abs(Date.parse(m.all[i]) - ms);
      if (dd < bd){ bd = dd; best = i; }
    }
    return best;
  };

  svg.addEventListener('pointermove', ev => draw(nearest(ev.clientX)));
  svg.addEventListener('pointerleave', hide);
  svg.addEventListener('blur', hide);
  // Keyboard reaches the same readout. The table below is the full fallback.
  svg.addEventListener('focus', () => draw(idx < 0 ? m.all.length - 1 : idx));
  svg.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowLeft'){ draw(Math.max(0, (idx < 0 ? m.all.length - 1 : idx) - 1)); ev.preventDefault(); }
    else if (ev.key === 'ArrowRight'){ draw(Math.min(m.all.length - 1, (idx < 0 ? 0 : idx) + 1)); ev.preventDefault(); }
    else if (ev.key === 'Escape') hide();
  });
}

function stackControls(tp){
  const pills = ['composite','economics','valuation','mood','guidance'].map(x => {
    const c = tp.coverage[x];
    return `<option value="${x}"${x === P.pillar ? ' selected' : ''}>${x}` +
           ` (${c.dates}d)</option>`;
  }).join('');
  const spans = Object.keys(SPANS).map(x =>
    `<option value="${x}"${x === P.span ? ' selected' : ''}>${x}</option>`).join('');
  const divs = [['0','off'],['10','10 sessions'],['20','20 sessions'],['40','40 sessions']]
    .map(([v, t]) => `<option value="${v}"${+v === P.div ? ' selected' : ''}>${t}</option>`)
    .join('');
  return `<div class="ctl">
    <label>pillar<select id="pp">${pills}</select></label>
    <label>span<select id="pspan">${spans}</select></label>
