    tr.setAttribute('aria-expanded', 'false');
    return;
  }
  const ntr = document.createElement('tr');
  ntr.className = 'oich';
  const td = document.createElement('td');
  td.colSpan = tr.children.length;
  ntr.appendChild(td);
  tr.after(ntr);
  tr.setAttribute('aria-expanded', 'true');
  td.innerHTML = '<div class="hint">loading price history…</div>';
  if (!MVH[eid]){
    try {
      MVH[eid] = await (await fetch(
        '/api/input_history?id=' + encodeURIComponent(eid))).json();
    } catch (e){
      td.textContent = 'fetch failed: ' + e;
      return;
    }
  }
  const d = MVH[eid];
  if (d.error){ td.textContent = d.error; return; }
  const panel = tr.closest('.panel');
  const w = Math.max(520, Math.min(1100,
    (panel ? panel.clientWidth : 940) - 32));
  td.innerHTML = inputChart(eid, d, w);
}

/* Values span cement's Rs thousands to alumina's dollars; pick the decimals
   from the magnitude rather than hardcoding either convention. */
const fmtMvVal = v => v == null ? '—'
  : Math.abs(v) >= 1000 ? Math.round(v).toLocaleString('en-US')
  : Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(2);

function inputChart(eid, d, w){
  const rows = d.rows.filter(r => r.close != null);
  if (rows.length < 2)
    return '<div class="hint">not enough price history for a chart</div>';
  const h = 240, ML = 64, MR = 20, MT = 18, MB = 30;
  const T = s => Date.parse(s);
  const x0 = T(rows[0].date), x1 = T(rows[rows.length - 1].date);
  const X = ms => ML + (x1 === x0 ? 0 : (ms - x0) / (x1 - x0)) * (w - ML - MR);
  const lo0 = Math.min(...rows.map(r => r.close));
  const hi0 = Math.max(...rows.map(r => r.close));
  const pad = ((hi0 - lo0) || Math.abs(hi0) || 1) * 0.06;
  const lo = lo0 - pad, hi = hi0 + pad;
  const Y = v => MT + (1 - (v - lo) / ((hi - lo) || 1)) * (h - MT - MB);

  let grid = '', yax = '';
  for (const f of [0, 1 / 3, 2 / 3, 1]){
    const y = (MT + f * (h - MT - MB)).toFixed(1);
    grid += '<line class="grid" x1="' + ML + '" x2="' + (w - MR) +
            '" y1="' + y + '" y2="' + y + '"/>';
    yax += '<text class="ax" x="' + (ML - 8) + '" y="' + y +
           '" text-anchor="end" dominant-baseline="middle">' +
           fmtMvVal(hi - f * (hi - lo)) + '</text>';
  }
  let xax = '';
  const seen = new Set();
  for (let i = 0; i < 6; i++){
    const k = Math.round(i * (rows.length - 1) / 5);
    if (seen.has(k)) continue;
    seen.add(k);
    xax += '<text class="ax" x="' + X(T(rows[k].date)).toFixed(1) + '" y="' +
           (h - 9) + '" text-anchor="middle">' +
           esc(dtick(rows[k].date, true)) + '</text>';
  }

  const pts = rows.map(r =>
    X(T(r.date)).toFixed(1) + ',' + Y(r.close).toFixed(1)).join(' ');
  const lastR = rows[rows.length - 1];
  const dotX = X(T(lastR.date)).toFixed(1), dotY = Y(lastR.close).toFixed(1);

  // The source mix, in first-seen order — two sources on one line is a fact
  // the reader should have before trusting a move that spans the seam.
  const srcs = [];
  for (const r of rows) if (!srcs.includes(r.source)) srcs.push(r.source);

  return `<div class="chartwrap">
    <svg width="${w}" height="${h}" role="img"
         aria-label="price history for ${esc(eid)}">
      ${grid}${yax}${xax}
      <polyline points="${pts}" fill="none" style="stroke:var(--accent)"
        stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${dotX}" cy="${dotY}" r="3" style="fill:var(--accent)"/>
    </svg></div>
    <div class="hint">${esc(eid)} · last ${fmtMvVal(lastR.close)}
      (${esc(lastR.date)}) · 2y range ${fmtMvVal(lo0)}–${fmtMvVal(hi0)} ·
      ${rows.length} rows shown of ${d.n_ever} since ${esc(d.first_ever)} ·
      source${srcs.length > 1 ? 's' : ''}: ${esc(srcs.join(' → '))}${
      srcs.length > 1 ? ' — a move spanning a source seam is worth checking'
                      : ''}</div>`;
}

/* ===================== the book =====================
   Reworked 2026-09-05 (PM): the tab now leads with the PM's ACTUAL book —
   daily IMS snapshots ingested by the daily_review skill, displayed ONE LINE
   PER PAIR (the IMS lists positions singly; the unit of thought here is the
   pair tag, e.g. "IT 5", and a tag can carry more than two legs). Futures
   contract tokens (=U6 etc) are stripped to a stable root and P&L is CHAINED
   across rolls by packages/book/book_io.py, so pair inception and
   since-inception P&L survive expiry — the two things the company IMS cannot
   show. The model-scores table stays below as context; placeholder facts
   still ride beside it. */
/* USD figures: en-US grouping, no decimals; a value that rounds to zero
   prints as a quiet 0 rather than a signed one */
const usd = v => v == null ? '—' : Math.round(Math.abs(v)) === 0 ? '0'
  : (v < 0 ? '−' : '+') + Math.abs(Math.round(v)).toLocaleString('en-US');
const usdCls = v => v == null || Math.round(Math.abs(v)) === 0 ? 'flat'
  : v > 0 ? 'up' : 'down';
/* dates on the page are DD-MM-YYYY and ride in the LAST column (PM, 06-09) */
const dmy = d => d ? `${d.slice(8, 10)}-${d.slice(5, 7)}-${d.slice(0, 4)}` : '—';
/* Industry = the pair tag minus its trailing number ('STEEL 2' -> STEEL).
   The tag itself is internal bookkeeping (chat referencing, the reviews
   table) and is NEVER printed on the page — PM instruction 06-09-2026. */
const industryOf = tag => tag === 'UNTAGGED' ? 'UNTAGGED'
  : (tag.replace(/\s*\d+$/, '').trim() || tag);

/* One line per pair: "Coforge_Persistent" then the data (PM, 06-09-2026 —
   "leave individual stocks alone"). Legs survive only in the row tooltip.
   ONE table for the whole book; the sector is a MERGED (rowspan) cell
   beside its pairs, carrying its mini-aggregates, so no vertical space
   goes to group headers (PM, 06-09-2026). */
const pctf = (v, dp = 1) => v == null ? '—'
  : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(dp) + '%';
/* view rows come pre-paired from specs/book.yaml (the PM's own list, names
   verbatim); sectors render in the spec's order, pairs in dictation order */
function bookSections(view, order, nav, bookPnl){
  const groups = new Map();
  view.forEach(p => {
    const k = p.sector || industryOf(p.pair || '');
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(p);
  });
  const sum = (ps, f) => ps.reduce((s, p) => s + (p[f] || 0), 0);
  const inds = (order && order.length)
    ? order.filter(k => groups.has(k)).concat(
        [...groups.keys()].filter(k => !order.includes(k)))
    : [...groups.keys()]
        .sort((a, b) => sum(groups.get(b), 'gross_pct') - sum(groups.get(a), 'gross_pct'));

  const body = inds.map(k => {
    const ps = groups.get(k);
    const secTip = `${k}: gross ${(sum(ps, 'gross_pct') * 100).toFixed(1)}%` +
      ` ($${Math.round(sum(ps, 'gross_usd')).toLocaleString('en-US')})` +
      ` · ytd ${usd(sum(ps, 'pnl_ytd'))} · mtd ${usd(sum(ps, 'pnl_mtd'))}` +
      ` · since start ${usd(sum(ps, 'pnl_total'))}`;
    const secAgg = sum(ps, 'pnl_total');
    return ps.map((p, i) => {
      const total = p.pnl_total_with_carry != null ? p.pnl_total_with_carry : p.pnl_total;
      const legTip = p.legs.map(l =>
        `${l.side === 'L' ? '▲' : '▼'} ${l.name} ×${l.qty}` +
        `${l.share != null && l.share < 1 ? `  (${Math.round(l.share * 100)}% of leg — shared across pairs)` : ''}` +
        `${l.ret_pct != null ? `  px ${pctf(l.ret_pct)}` : ''}` +
        `${(l.entry_open ?? l.entry_cost) != null ? `  @${(Math.round((l.entry_open ?? l.entry_cost) * 100) / 100).toLocaleString('en-US')} ${l.entry_open != null ? 'open' : 'cost'} ${dmy(l.first_seen)}` : ''}` +
        `${l.composite != null ? `  model ${l.composite.toFixed(2)}` : ''}` +
        `  ytd ${usd(l.pnl_ytd)}  mtd ${usd(l.pnl_mtd)}  since ${usd(l.pnl_total)}` +
        `  (${l.ticker_now})`).join('\n') +
        (p.missing && p.missing.length ? `\n⚠ leg not on the book today: ${p.missing.join(', ')}` : '');
      const chips =
        (p.missing && p.missing.length ? ` <span class="pill warn" title="a dictated leg is not on the book today: ${esc(p.missing.join(', '))}">leg off</span>` : '') +
        (p.gap_risk ? ` <span class="pill warn" title="a roll happened across a snapshot gap — the frozen P&L may miss the old contract's last days">gap</span>` : '') +
        (p.ytd_flags && p.ytd_flags.length ? ` <span class="pill warn" title="the YTD ledger hit something that needs a human — it is flagged, never silently corrected:\n${esc(p.ytd_flags.join('\n'))}">ytd?</span>` : '') +
        (p.review ? ` <span class="chip ${p.review.verdict === 'exit' ? 'c-down' :
            p.review.verdict === 'add' ? 'c-up' : 'c-flat'}"
            title="last reviewed ${esc(dmy(p.review.date))}${p.review.thesis_intact == null ? '' :
              p.review.thesis_intact ? ' · thesis intact' : ' · THESIS BROKEN'}">${esc(p.review.verdict)}</span>` : '') +
        (p.carry ? ` <span class="pill" title="includes desk-stated carry ${usd(p.carry.pnl)} from before ${esc(p.carry.since || 'first capture')} (specs/book.yaml)">carry</span>` : '');
      const sec = i === 0 ? `<td class="sec" rowspan="${ps.length}" title="${esc(secTip)}">
          <span class="t">${esc(k)}</span>
          <span class="a">${(sum(ps, 'gross_pct') * 100).toFixed(1)}% gr</span>
          <span class="a ${usdCls(secAgg)}">${usd(secAgg)}</span></td>` : '';
      /* the meter: centre-origin, ±10% full scale, glows beyond ±5% — a big
         move EITHER way is the revisit signal (trim the winner / re-underwrite
         the loser), which is why magnitude, not sign, sets the glow */
      const meter = p.ret_pct == null ? '' : (() => {
        const cap = 10, v = Math.max(-cap, Math.min(cap, p.ret_pct));
        const hot = Math.abs(p.ret_pct) >= 5;
        return `<div class="pmeter${hot ? ' hot' : ''}" title="pair ${pctf(p.ret_pct)} since entry${
          hot ? ' — moved a lot: revisit (trim / add / re-underwrite)' : ''}">
          <div class="pm-fill ${v >= 0 ? 'up' : 'down'}" style="${
            v >= 0 ? 'left:50%' : 'right:50%'};width:${(Math.abs(v) / cap * 50).toFixed(1)}%"></div></div>`;
      })();
      return `<tr title="${esc(legTip)}" class="${i === 0 ? 'secfirst' : ''}">
        ${sec}
        <td class="pair">${esc(p.label || p.pair)}<span class="chips">${chips}</span></td>
        <td class="tot ${usdCls(p.ret_pct)}">${pctf(p.ret_pct)}<span class="sub">${usd(total)}</span>${meter}</td>
        <td>${p.gross_pct == null ? '—' : (p.gross_pct * 100).toFixed(1) + '%'}</td>
        <td class="${usdCls(p.pnl_ytd)}">${usd(p.pnl_ytd)}</td>
        <td class="${usdCls(p.pnl_mtd)}">${usd(p.pnl_mtd)}</td>
        <td><span class="date">${dmy(p.inception)}</span> <span class="age">${p.days}d</span></td>
      </tr>`;
    }).join('');
  }).join('');

  // the bottom line: whole-book totals (pairs only — the N.A. cost bucket
  // rides in the strip, attributed to no pair). Apportioned dollars sum back
  // to the true book figures — shared legs are split, never double-counted.
  const gAll = sum(view, 'gross_pct');
  const navRet = nav ? bookPnl / nav * 100 : null;
  const totalRow = `<tr class="total">
    <td class="sec"><span class="t">total</span></td>
    <td class="pair">${view.length} pairs</td>
    <td class="${usdCls(bookPnl)}" title="chained P&L as % of NAV — pair price-%s do not sum">${
      pctf(navRet, 2)}<span class="sub">${usd(bookPnl)}</span></td>
    <td>${(gAll * 100).toFixed(1)}%</td>
    <td class="${usdCls(sum(view, 'pnl_ytd'))}">${usd(sum(view, 'pnl_ytd'))}</td>
    <td class="${usdCls(sum(view, 'pnl_mtd'))}">${usd(sum(view, 'pnl_mtd'))}</td>
    <td></td></tr>`;

  return `<div class="panel" style="padding:0"><div class="scroll">
    <table class="bk"><thead><tr>
      <th class="l">sector</th><th class="l">pair</th>
      <th title="avg long price move − avg short price move SINCE TRADE ENTRY — has the pair worked out in thesis since it went on? Each leg anchors on the OPEN of its entry day (PM rule 07-09-2026; fallback when no open could be fetched: IMS avg cost, then the entry-day close — the leg hover names which). The anchor holds through resizes and pair-tag changes and resets only on a direction flip or a day out of the book · small figure: chained P&L, USD · the bar: ±10% full scale, glows beyond ±5% — moved a lot either way, revisit the pair">since entry %</th>
      <th>gross</th><th title="CALENDAR year-to-date, USD — a ledger this system maintains itself, NOT the YTD column off the IMS paste. It is seeded once and thereafter only ever advanced by an increment, so a contract roll cannot reset it: normally by the change in the cumulative YTD (which spans sessions that were never snapshotted), and across a roll by the DAY figure, which is not a level and so cannot double count if a fresh ticker turns out to carry the old contract's P&amp;L. Resets on 1 Jan. Replaced the day column, PM 18-09-2026">ytd</th><th>mtd</th>
      <th>opened</th></tr></thead><tbody>${body}${totalRow}</tbody></table></div></div>`;
}

/* The model-scores table, tiles and placeholder callouts came OFF this tab
   06-09-2026 (PM: "all this model view and stuff below is waste") — the
   model still lives on the Overview/sector tabs and per-leg composites ride
   in the pair tooltips. This tab is the book, nothing else. */
async function loadBook(){
  const bk = await (await fetch('/api/book')).json();

  let posHtml;
  if (bk.error){
    posHtml = `<div class="callout accent-amber"><div class="callout-head">
      <span class="ico">⚠</span><span class="t">book view failed</span></div>${esc(bk.error)}</div>`;
  } else if (!bk.as_of){
    posHtml = `<div class="callout"><div class="callout-head">
      <span class="t">no IMS snapshot loaded yet</span></div>
      <div class="hint">Run <code>/daily_review</code> with today's IMS positions
      snapshot — it parses the upload, stores it, and this tab becomes the
      pair-wise book: one line per pair tag, inception date, and P&amp;L chained
      across futures rolls.</div></div>`;
  } else {
    const untagged = bk.pairs.filter(p => p.pair === 'UNTAGGED').length;
    const na = bk.na || {};
    const S = f => bk.pairs.reduce((s, p) => s + (p[f] || 0), 0);
    const grossPct = bk.pairs.reduce((s, p) => s + (p.gross_pct || 0), 0);
    const netPct = bk.pairs.reduce((s, p) => s + (p.net_pct || 0), 0);
    const cell = (k, v, cls) => `<div class="cell"><div class="k">${k}</div>
      <div class="v${cls ? ' bk' : ''}">${cls ? `<span class="${cls}">${v}</span>` : v}</div></div>`;
    posHtml =
      `<div class="bk-strip">`
      + cell('snapshot', `${dmy(bk.as_of)} <span class="u">· ${bk.snapshots} stored</span>`)
      + cell('nav', bk.nav == null ? '—' : '$' + Math.round(bk.nav).toLocaleString('en-US'))
      + cell('gross · net', `${(grossPct * 100).toFixed(1)}%
          <span class="u">$${Math.round(S('gross_usd')).toLocaleString('en-US')}
          · net ${(netPct * 100).toFixed(1)}%</span>`)
      + cell('ytd', usd(S('pnl_ytd')), usdCls(S('pnl_ytd')))
      + cell('mtd', usd(S('pnl_mtd')), usdCls(S('pnl_mtd')))
      + cell('since start', usd(bk.book_pnl_total), usdCls(bk.book_pnl_total))
      + (na.pnl_ytd == null ? '' :
          cell('<span title="closed positions’ realized P&L + currency/rollover/fixed costs — the cost of carry of the operation">n.a. ytd</span>',
               usd(na.pnl_ytd), usdCls(na.pnl_ytd)))
      + `</div>`
      + `<div class="meta-line">contract codes stripped and P&amp;L <b>chained
         across rolls</b> — the totals survive expiry resets · <b>ytd is our
         own ledger</b>, seeded once and advanced by increments, so a roll
         cannot reset it and an unsnapshotted session is not lost · hover a
         pair for its legs</div>`
      /* the day's position events from book_anchor_log — exception-only: a
         snapshot with no changes renders nothing. entered/reopened/flipped
         RESET a leg's %-since-entry anchor; retagged/resized do not (they
         are shown so a tag move is a recorded fact, not an inference — the
         07-09-2026 IT retag went unrecorded and silently re-anchored two
         legs). The first-ever snapshot's 32 baseline 'entered' rows are
         suppressed by the snapshots>1 guard. */
      + (((bk.anchor_log || []).length && bk.snapshots > 1) ?
          `<div class="meta-line">position events ${dmy(bk.as_of)}: ` +
          bk.anchor_log.map(e =>
            `<span title="${esc(e.detail || e.event)}${
              ['entered','reopened','flipped'].includes(e.event)
                ? ' — %-since-entry anchor reset' : ''}"${
              ['flipped','reopened'].includes(e.event)
                ? ' style="color:var(--warn)"' : ''}><b>${esc(e.name)}</b> ${
              esc(e.event)}${e.detail ? ` (${esc(e.detail)})` : ''}</span>`
          ).join(' · ') + `</div>` : '')
      + (untagged ? `<div class="callout accent-amber"><div class="callout-head">
           <span class="ico">⚠</span><span class="t">UNTAGGED positions present</span></div>
           <div class="hint">rows with no pair name on the IMS snapshot are grouped
           under UNTAGGED rather than guessed into a pair.</div></div>` : '')
      + ((bk.unassigned || []).length ? `<div class="callout accent-amber">
           <div class="callout-head"><span class="ico">⚠</span>
           <span class="t">positions on the book but in no dictated pair</span></div>
           <div class="hint">${esc(bk.unassigned.map(t => t.name).join(', '))} —
           add them to <code>specs/book.yaml pairs</code> or they stay out of
           every pair line.</div></div>` : '')
      + bookSections(bk.view || bk.pairs, bk.sectors_order, bk.nav, bk.book_pnl_total)
      /* The index sits BELOW the pair table (PM, 2026-09-11, on the
         charts this one replaced: "keep it below"). The pairs are the
         substance of this tab; the index is the picture that follows
         them, the same ordering the Overview uses when it reads the
         morning's words before the tape. Filled asynchronously by
         loadIndex() once this innerHTML has landed. */
      + `<div id="bix-host" class="panel" style="padding:var(--s4);margin:var(--s4) 0"></div>`
      + (bk.closed.length ? `<div style="margin-top:var(--s4)"></div>
         <div class="panel" style="padding:0"><div class="scroll"><table class="bk"><thead><tr>
           <th class="l">closed</th><th>final P&amp;L</th><th>held</th>
           <th>opened</th><th>closed</th></tr></thead><tbody>
         ${bk.closed.map(c => `<tr class="secfirst">
           <td class="pair">${esc(c.label || c.pair)}</td>
           <td class="tot ${usdCls(c.pnl_total)}">${usd(c.pnl_total)}</td>
           <td class="age">${c.days}d</td>
           <td><span class="date">${esc(dmy(c.inception))}</span></td>
           <td><span class="date">${esc(dmy(c.last_seen))}</span></td></tr>`).join('')}
         </tbody></table></div></div>` : '');
  }

  $('#s-book').innerHTML = `<div class="pgt">The Book</div>` + posHtml;
  if (!bk.error && bk.as_of) loadIndex(BIX_RANGE);
}

/* ============== the book's equal-weighted long and short indices ==========
   PM, 2026-09-17: "Create an equal weighted index for longs, equal for
   shorts... Keep VAML out, use 2007 onwards. Once VAML starts to exist, add
   VAML to the long index. Till 16th sep 2026, we keep the index same. Post
   that, as and when the positions change, we change the index on a daily
   basis."

   ONE BLOCK, AND IT REPLACED TWO. This tab used to carry a portfolio-weighted
   back-cast (loadBaskets) and a snapshot-only live index (loadBookIndex).
   Both are deleted, not hidden: "Let's rebuild the whole thing again. We get
   rid of both graph methods." The reason two existed — one could show years
   but was survivorship-biased, the other was honest but nine sessions long —
   is settled inside the single series instead, by freezing membership at a
   spec date rather than at today.

   THREE CHARTS: long index, short index, then long ÷ short. The third is the
   only one that answers "are the longs beating the shorts", and it is a RATIO
   — a true percent, because it divides by where the short index actually is.
   The pp difference between the two charts above is a different quantity and
   is labelled pp wherever it appears; over the full window they read +17.59%
   and +430.66pp, which is why the distinction is not pedantry.

   EVERY WINDOW IS CANDLES; THE BAR PERIOD IS WHAT CHANGES (PM, 2026-09-17:
   "can you make candles since you have ohlc?"). A DAILY candle over 19 years
   is a fifth of a pixel, so long windows aggregate to weekly or monthly bars
   — daily to 320 sessions, weekly to 1,600, monthly beyond — which puts every
   window between 3.8 and 9.3 px a candle. The aggregation is EXACT (first
   open, max high, min low, last close): every session still contributes, and
   the period high is still the same kind of bound the daily high was, because
   the max of upper bounds is an upper bound. Thinning the series was the
   alternative and was rejected — dropping every fifth bar is a silent lie
   about the path.

   COLOUR IS PRICE DIRECTION, NOT P&L. Green = closed above its open. On the
   SHORT chart that is a drag on the book, and the header says so on every
   render: the PM's convention is raw price moves, so nothing here silently
   re-means green.

   WICKS ARE FAINTER THAN BODIES. The body is exact — all NSE legs open and
   close together, so the mean of the opens IS the index's open. The wicks are
   outer bounds, because the constituents do not print their highs at the same
   moment, and the bound holds for any weights so 1/n changes nothing. Same
   ink weight would assert a precision the high and low do not have. */
let BIX = null;            /* last payload, for the hover and ruler layers */
let BIX_RANGE = '5y';
let BCX_DOM = {};          /* y domains, by chart key */
let BCX_BARS = {};         /* key -> bars[], for the hover/ruler layers */
let BCX_BASE = {};         /* key -> the date the window is rebased on */
let BCX_ESC = false;       /* the Esc handler is attached once, not per render */

/* PM, 2026-09-17: "Lets remove 10 and max, add 6 months, 3 months, 1 month."
   The button order is the API's RANGES order (shortest first) — this map only
   supplies labels, so a range added server-side appears without a frontend
   change, and one removed cannot leave an orphaned button behind. */
const BIX_LABEL = {'1mo': '1M', '3mo': '3M', '6mo': '6M', '1y': '1Y',
                   '2y': '2Y', '3y': '3Y', '5y': '5Y'};

/* ONE geometry, used by the renderer AND the hover/ruler maths. They were
   separate copies for about an hour once and that is precisely how a
   crosshair ends up half a candle off the candle it names. */
const BCX = {W: 1000, H: 236, ML: 52, MR: 14, MT: 20, MB: 24};
const bcxInner = () => ({iw: BCX.W - BCX.ML - BCX.MR,
                         ih: BCX.H - BCX.MT - BCX.MB});
const bcxY = (v, key) => {
  const {ih} = bcxInner(), d = BCX_DOM[key];
  return BCX.MT + (d.hi - v) / (d.hi - d.lo || 1) * ih;
};
const bcxSlot = n => bcxInner().iw / n;

/* ---------------------------------------------------------------- the ruler
   PM, 2026-09-11: "a tool for measuring % change from one point to another
   (like we have in tradingview, the ruler tool)". Drag across any chart.

   THE ONE THING THIS TOOL MUST NOT GET WRONG. The y axis is ALREADY a
   percentage, so the gap between two points is measured in percentage POINTS,
   and that is NOT the index's percent change over the span — the % change
   divides by THE LEVEL WHERE YOU STARTED, not by the rebase date. Read +3.00%
   on the axis and +8.00% later: the axis gap is 5.00pp but the move is
       1.08 / 1.03 - 1  =  +4.85%
   and from +40% to +50% the axis reads 10pp against a +7.14% move. Reporting
   the axis gap as "%" would be wrong by a third there, in the flattering
   direction, with nothing to raise — the silent-arithmetic shape exactly
   (docs/SILENT_BUGS.md). On a 19-year window the two diverge enormously.

   So BOTH are shown and both are labelled: the % change leads (it is what
   TradingView's ruler means, and what the PM asked for) and the pp gap
   follows as the axis reading. They agree only at the rebase date, where the
   level is 1.00.

   IT MEASURES CLOSE TO CLOSE, and the readout says so. Snapping to a
   session's close makes the number reproducible — two drags between the same
   bars give the same answer — where a free-floating level returns whatever
   the mouse was over. The wick extremes are deliberately NOT snappable: they
   are outer bounds, not prices anything traded at, so a high-to-low
   "drawdown" measured off them would overstate by construction. */
const bLevel = v => 1 + v / 100;      /* plotted % -> index level relative */

function rulerStats(bars, i0, i1){
  const a = bars[i0].c, b = bars[i1].c, la = bLevel(a);
  const lo = Math.min(i0, i1), hi = Math.max(i0, i1);
  /* BARS AND SESSIONS ARE NOT THE SAME NUMBER once a window aggregates, and
     the readout printed the bar count as "sessions" — on a monthly chart 90
     bars is ninety MONTHS, about 1,890 sessions, so the span read twenty times
     short. Both are reported now: `n` is what was dragged across, `sessions`
     is what it covers, summed from each bar's own count rather than assumed. */
  let sess = 0;
  for (let i = lo + 1; i <= hi; i++) sess += (bars[i].sessions || 1);
  return {
    pct: la > 0 ? (bLevel(b) / la - 1) * 100 : null,  /* the % change */
    pp: b - a,                                        /* the axis gap, points */
    n: hi - lo,                                       /* BARS spanned */
    sessions: sess,
    from: bars[lo].d, to: bars[hi].d,
    a: a, b: b,
  };
}

/* ONE renderer for all three charts. It replaced a candleChart/lsChart pair
   whose only real differences were wick opacity and an overlaid close path —
   two copies of the same axis, grid and geometry code, which is exactly the
   duplication the note on BCX warns about. */
function seriesChart(S, key, id, title, opts){
  opts = opts || {};
  const bars = (S || {}).bars || [];
  const {W, H, ML, MR, MT, MB} = BCX;
  if (bars.length < 2)
    return `<div class="bcx-empty">not enough sessions in this window</div>`;
  const dom = BCX_DOM[key];
  const slot = bcxSlot(bars.length);
  const bw = Math.max(1.2, Math.min(11, slot * 0.62));
  const px = i => ML + slot * (i + 0.5);

  /* gridlines on round percentages, ~5 of them */
  const rawStep = (dom.hi - dom.lo) / 5;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep || 1)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag)
                 .find(x => x >= rawStep) || mag * 10;
  let grid = '', gv = Math.ceil(dom.lo / step) * step;
  const dp = step < 1 ? 1 : 0;
  for (; gv <= dom.hi + 1e-9; gv += step){
    const y = bcxY(gv, key).toFixed(1);
    grid += `<line class="${Math.abs(gv) < 1e-9 ? 'zero' : 'grid'}" x1="${ML}" x2="${
      W - MR}" y1="${y}" y2="${y}"/>`
          + `<text class="ax" x="${ML - 7}" y="${y}" text-anchor="end"
              dominant-baseline="middle">${(gv > 0 ? '+' : '') + gv.toFixed(dp)}%</text>`;
  }

  let wicks = '', bodies = '';
  bars.forEach((b, i) => {
    const cx = px(i);
    /* A BAR WITH NO OPEN IS DRAWN AS A CLOSE TICK, NOT A CANDLE. It means no
       member had an intraday bar in that period, so the open and the range
       were never measured. A doji there would claim a range of zero, which is
       a measurement — the truth is an absence. In practice only the index's
       very first bar can hit this. */
    if (b.o == null){
      const y = bcxY(b.c, key);
      bodies += `<line x1="${(cx - bw / 2).toFixed(2)}" x2="${
        (cx + bw / 2).toFixed(2)}" y1="${y.toFixed(2)}" y2="${y.toFixed(2)}"
        stroke="var(--soft)" stroke-width="1.6"/>`;
      return;
    }
    const col = b.c >= b.o ? 'var(--up)' : 'var(--down)';
    if (b.h != null && b.l != null)
      wicks += `<line x1="${cx.toFixed(2)}" x2="${cx.toFixed(2)}" y1="${
        bcxY(b.h, key).toFixed(2)}" y2="${bcxY(b.l, key).toFixed(2)}"
        stroke="${col}" stroke-width="1" opacity="${opts.faintWicks ? '.24' : '.5'}"/>`;
    const y0 = bcxY(Math.max(b.o, b.c), key), y1 = bcxY(Math.min(b.o, b.c), key);
    bodies += `<rect x="${(cx - bw / 2).toFixed(2)}" y="${y0.toFixed(2)}" width="${
      bw.toFixed(2)}" height="${Math.max(1, y1 - y0).toFixed(2)}" fill="${col}"/>`;
  });

  /* the close path, overlaid on the RATIO only: its body is tiny inside a
     doubly-loose bound, so the bodies alone do not read as a path and the
     path is the question that chart answers. */
  let path = '';
  if (opts.closeLine){
    const pts = bars.map((b, i) => `${px(i).toFixed(2)},${bcxY(b.c, key).toFixed(2)}`);
    path = `<polyline points="${pts.join(' ')}" fill="none" stroke="var(--ink)"
      stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"
      opacity=".85"/>`;
  }

  /* x labels: ~6, always including the last session */
  let xax = '';
  const every = Math.max(1, Math.round(bars.length / 6));
  bars.forEach((b, i) => {
    if (i % every && i !== bars.length - 1) return;
    /* a weekly or monthly bar spans more than a day, so DD-MM would name one
       session out of five or twenty-one. Those windows get YYYY-MM, which is
       also what a multi-year x axis needs. */
    const lab = (S.period && S.period !== 'daily')
                  ? b.d.slice(0, 7) : dmy(b.d).slice(0, 5);
    xax += `<text class="ax" x="${px(i).toFixed(1)}" y="${H - 8}"
      text-anchor="middle">${esc(lab)}</text>`;
  });

  const lastCol = (S.last || 0) >= 0 ? 'var(--up)' : 'var(--down)';
  return `<div class="chartwrap bcx" id="${id}" data-side="${key}">
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img"
         aria-label="${esc(title || key)}">
      ${grid}
      <line class="bcx-hair" x1="0" x2="0" y1="${MT}" y2="${H - MB}"
            stroke="var(--soft)" stroke-width="1" opacity=".5" style="display:none"/>
      ${wicks}${bodies}${path}${xax}
      <g class="bcx-rule" style="display:none">
        <rect class="rr" x="0" y="0" width="0" height="0"/>
        <line class="rl" x1="0" y1="0" x2="0" y2="0"/>
        <circle class="rd rd0" r="3.2"/><circle class="rd rd1" r="3.2"/>
      </g>
      <text class="axl" x="${ML}" y="11">${esc(title || '')}</text>
      <text class="ax" x="${W - MR}" y="11" text-anchor="end"
            fill="${lastCol}">${(S.last >= 0 ? '+' : '')}${
              (S.last == null ? '—' : S.last.toFixed(2) + '%')}</text>
    </svg><div class="viztip" role="status"></div>
    <div class="bcx-lab" role="status"></div></div>`;
}

/* hover readout + the drag ruler. Both live on the svg element itself rather
   than on window, so they die with the node when the block re-renders —
   window listeners would pile up one set per range click and keep pointing at
   detached charts. The cost is that releasing outside the chart cannot be
   heard, so mouseleave FINALISES the measurement instead of dropping it. */
function wireCandles(){
  document.querySelectorAll('.bcx').forEach(wrap => {
    const side = wrap.dataset.side, bars = BCX_BARS[side] || [];
    if (bars.length < 2) return;
    const svg = wrap.querySelector('svg');
    const hair = svg.querySelector('.bcx-hair');
    const rule = svg.querySelector('.bcx-rule');
    const rr = rule.querySelector('.rr'), rl = rule.querySelector('.rl');
    const rd0 = rule.querySelector('.rd0'), rd1 = rule.querySelector('.rd1');
    const tip = wrap.querySelector('.viztip');
    const lab = wrap.querySelector('.bcx-lab');
    const {W, ML} = BCX;
    const slot = bcxSlot(bars.length);
    let drag = null;

    const idxAt = ev => {
      const rect = svg.getBoundingClientRect();
      const vx = (ev.clientX - rect.left) / rect.width * W;
      return Math.max(0, Math.min(bars.length - 1,
                                  Math.floor((vx - ML) / slot)));
    };
    const cxOf = i => ML + slot * (i + 0.5);
    const clearRule = () => { rule.style.display = 'none';
                              lab.classList.remove('on'); };
    const hideTip = () => { hair.style.display = 'none';
                            tip.classList.remove('on'); };

    const drawRule = (i0, i1) => {
      const st = rulerStats(bars, i0, i1);
      const x0 = cxOf(i0), x1 = cxOf(i1);
      const y0 = bcxY(st.a, side), y1 = bcxY(st.b, side);
      const col = (st.pct ?? 0) >= 0 ? 'var(--up)' : 'var(--down)';
      rr.setAttribute('x', Math.min(x0, x1));
      rr.setAttribute('y', Math.min(y0, y1));
      rr.setAttribute('width', Math.max(1, Math.abs(x1 - x0)));
      rr.setAttribute('height', Math.max(1, Math.abs(y1 - y0)));
      rr.setAttribute('fill', col);
      rl.setAttribute('x1', x0); rl.setAttribute('y1', y0);
      rl.setAttribute('x2', x1); rl.setAttribute('y2', y1);
      rl.setAttribute('stroke', col);
      rd0.setAttribute('cx', x0); rd0.setAttribute('cy', y0);
      rd1.setAttribute('cx', x1); rd1.setAttribute('cy', y1);
      rd0.setAttribute('fill', col); rd1.setAttribute('fill', col);
      rule.style.display = '';

      lab.textContent = '';               /* textContent: dates come from the API */
      const big = document.createElement('div');
      big.className = 'rb'; big.style.color = col;
      big.textContent = st.pct == null ? '—'
        : (st.pct >= 0 ? '+' : '') + st.pct.toFixed(2) + '%';
      lab.appendChild(big);
      const mk = (t, cls) => {
        const e = document.createElement('div');
        if (cls) e.className = cls;
        e.textContent = t; lab.appendChild(e);
      };
      mk((st.pp >= 0 ? '+' : '') + st.pp.toFixed(2) + ' pp on the axis', 'rs');
      const per = (BIX && BIX.period) || 'daily';
      const unit = per === 'monthly' ? 'month' : per === 'weekly' ? 'week'
                                               : 'session';
      mk(st.n + ' ' + unit + (st.n === 1 ? '' : 's')
         + (per === 'daily' ? ''
            : ' (' + st.sessions.toLocaleString() + ' sessions)'), 'rs');
      mk(dmy(st.from) + ' → ' + dmy(st.to), 'rd-dates');
      /* named explicitly: the ruler snaps to CLOSES, so the figure cannot be
         mistaken for a wick-to-wick drawdown. */
      mk('close to close', 'rd-dates');
      lab.classList.add('on');

      const wr = wrap.getBoundingClientRect();
      const lx = ((x0 + x1) / 2 / W) * wr.width;
      const ly = (Math.min(y0, y1) / BCX.H) * wr.height;
      lab.style.left = Math.min(Math.max(lx - 68, 4), wr.width - 150) + 'px';
      lab.style.top = Math.max(4, ly - 82) + 'px';
    };

    const showTip = i => {
      const b = bars[i], cx = cxOf(i);
      hair.setAttribute('x1', cx); hair.setAttribute('x2', cx);
      hair.style.display = '';
      tip.textContent = '';
      const hd = document.createElement('div');
      hd.className = 'd'; hd.textContent = dmy(b.d);
      tip.appendChild(hd);
      const row = (k, v, colr) => {
        const r = document.createElement('div'); r.className = 'r';
        const a = document.createElement('b');
        a.textContent = (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
        if (colr) a.style.color = colr;
        const s = document.createElement('span'); s.textContent = k;
        r.appendChild(a); r.appendChild(s); tip.appendChild(r);
      };
      const col = (b.o == null || b.c >= b.o) ? 'var(--up)' : 'var(--down)';
      if (b.o != null) row('open', b.o);
      row('close', b.c, col);
      /* "loose bound" on the ratio, plain "bound" on the two indices: the
         ratio's wick is a bound built from two bounds and runs about twice an
         index's own, so they must not read as the same claim. */
      const wb = side === 'ratio' ? ' (loose bound)' : ' (bound)';
      if (b.h != null) row('high' + wb, b.h);
      if (b.l != null) row('low' + wb, b.l);
      const mk = t => {
        const e = document.createElement('div');
        e.className = 'd'; e.style.marginTop = '5px'; e.style.marginBottom = '0';
        e.textContent = t; tip.appendChild(e);
      };
      /* a weekly or monthly candle is not a session, and the tooltip has to
         say which it is or "close" reads as one day's close. */
      if (b.sessions > 1)
        mk(b.sessions + ' sessions, ' + dmy(b.from) + ' → ' + dmy(b.d));
      if (b.n != null)
        mk(b.n + ' legs at the close');
      /* the chain skips a session whose members did not all price, so this
         bar can absorb more than one session. The API marks the bar
         (`skipped`) rather than the browser inferring it: a skipped session
         leaves NO bar, so `span` is the previous bar's date either way and
         cannot reveal the gap. Saying it stops a two-day move being read as a
         one-day one. */
      if ((b.skipped || []).length)
        mk('absorbs ' + b.skipped.map(dmy).join(', ')
           + ' — no price for every leg that session');
      if (BIX && BIX.period && BIX.period !== 'daily')
        mk(BIX.period + ' bar: first open, max high, min low, last close');
      mk('vs ' + dmy(BCX_BASE[side] || '') + ' close');
      tip.classList.add('on');
      const wr = wrap.getBoundingClientRect();
      const pxx = (cx / W) * wr.width;
      tip.style.left = Math.min(Math.max(pxx + 14, 4), wr.width - 172) + 'px';
      tip.style.top = '10px';
    };

    svg.addEventListener('mousedown', ev => {
      ev.preventDefault();              /* no text-selection smear on drag */
      drag = {i0: idxAt(ev)};
      clearRule(); hideTip();
      wrap.classList.add('measuring');
    });
    svg.addEventListener('mousemove', ev => {
      const i = idxAt(ev);
      if (drag){ if (i !== drag.i0) drawRule(drag.i0, i); return; }
      showTip(i);
    });
    const finish = () => {
      if (!drag) return;
      drag = null; wrap.classList.remove('measuring');
    };
    svg.addEventListener('mouseup', finish);
    svg.addEventListener('mouseleave', () => {
      finish(); hideTip();               /* the ruler PERSISTS, the tip does not */
    });
    /* a click that never moved is a clear, the same gesture TradingView uses */
    svg.addEventListener('click', ev => {
      if (rule.style.display !== 'none' && !drag){
        const i = idxAt(ev);
        if (lab.dataset.lastClick === String(i)) clearRule();
      }
      lab.dataset.lastClick = String(idxAt(ev));
    });
  });

  if (!BCX_ESC){
    BCX_ESC = true;
    document.addEventListener('keydown', ev => {
      if (ev.key !== 'Escape') return;
      document.querySelectorAll('.bcx-rule').forEach(g => {
        g.style.display = 'none';
      });
      document.querySelectorAll('.bcx-lab').forEach(l => l.classList.remove('on'));
    });
  }
}

const bixDom = (arrs, zeroInFrame) => {
  const v = [];
  arrs.forEach(bars => (bars || []).forEach(b =>
    [b.o, b.h, b.l, b.c].forEach(x => { if (x != null) v.push(x); })));
  if (!v.length) return {lo: -1, hi: 1};
  let lo = Math.min(...v), hi = Math.max(...v);
  const pad = (hi - lo) * 0.07 || 1;
  lo -= pad; hi += pad;
  /* ZERO IS ALWAYS IN FRAME on the ratio. It is a spread about parity, and a
     window that crops parity out hides whether the book is winning at all. */
  return zeroInFrame ? {lo: Math.min(0, lo), hi: Math.max(0, hi)} : {lo, hi};
};

async function loadIndex(rng){
  BIX_RANGE = rng || BIX_RANGE;
  const host = document.getElementById('bix-host');
  if (!host) return;
  host.innerHTML = '<div class="loading">loading…</div>';
  let ix;
  try {
    ix = await (await fetch('/api/book_index?range='
                            + encodeURIComponent(BIX_RANGE))).json();
  } catch (e) {
    host.innerHTML = '<div class="hint">index unavailable</div>';
    return;
  }
  BIX = ix;
  const tabs = (ix.ranges || Object.keys(BIX_LABEL)).map(r =>
    `<button class="ghost bcx-r${r === BIX_RANGE ? ' on' : ''}" data-r="${r}"
      ${r === BIX_RANGE ? 'aria-pressed="true"' : ''}>${BIX_LABEL[r] || r}</button>`
  ).join('');
  const wire = () => host.querySelectorAll('.bcx-r').forEach(b =>
    b.addEventListener('click', () => loadIndex(b.dataset.r)));

  if (ix.error){
    host.innerHTML = `<div class="bcx-head"><div><div class="bcx-t">Long and
      short indices</div></div><div class="bcx-rng">${tabs}</div></div>
      <div class="callout accent-amber"><div class="callout-head">
      <span class="ico">⚠</span><span class="t">no index for this window</span>
      </div><div class="hint">${esc(ix.error)}</div></div>`;
    wire();
    return;
  }

  /* ONE domain across BOTH indices — per-chart autoscaling would make a -1%
     side and a -10% side look identical, and which side moved further is the
     whole comparison. The ratio gets its own: it is a different quantity on a
     different scale, and forcing it onto the indices' axis over a 19-year
     window flattens it to a straight line. */
  const shared = bixDom([ix.long.bars, ix.short.bars], false);
  BCX_DOM.long = shared; BCX_DOM.short = shared;
  BCX_DOM.ratio = bixDom([ix.ratio.bars], true);
  BCX_BARS.long = ix.long.bars || []; BCX_BARS.short = ix.short.bars || [];
  BCX_BARS.ratio = ix.ratio.bars || [];
  BCX_BASE.long = ix.long.base_date; BCX_BASE.short = ix.short.base_date;
  BCX_BASE.ratio = ix.ratio.base_date;

  const pc = v => (v == null ? '—' : (v >= 0 ? '+' : '') + v.toFixed(2) + '%');
  const nJoin = (ix.joins || []).filter(j => j.date > ix.start).length;

  host.innerHTML =
    `<div class="bcx-head">
       <div>
         <div class="bcx-t">Long and short indices · equal weighted</div>
         <div class="meta-line">1/n a side, rebalanced every session ·
           <b>${esc(ix.period)}</b> candles · ${ix.window_bars} bars over
           ${ix.window_sessions} of ${ix.n_sessions} sessions, rebased to the
           ${esc(dmy(ix.long.base_date))} close ·
           <b>long ${pc(ix.long.last)}</b> vs <b>short ${pc(ix.short.last)}</b> ·
           long / short <b style="color:${
             (ix.ratio.last || 0) >= 0 ? 'var(--up)' : 'var(--down)'}">${
             pc(ix.ratio.last)}</b>
           <span class="u">(${pc(ix.spread_last).replace('%', '')} pp apart)</span>
           · index levels ${ix.long.level_last} / ${ix.short.level_last}
           <span class="u">(100 at ${esc(dmy(ix.start))})</span></div>
       </div>
       <div class="bcx-rng">${tabs}</div>
     </div>
     <div class="bcx-note">↑ <b>direction only — position size is ignored.</b>
       Every leg counts 1/n whatever it is worth, so this is the book's
       DIRECTION, not its shape. Up is a price rise, not a profit: a green
       candle on the short index means those stocks rose, which is a drag.
       <span class="bcx-kbd">Drag to measure</span> close to close; Esc clears.</div>
     ${seriesChart(ix.long, 'long', 'bix-long',
        `LONG index · ${ix.long.n} legs today, equal weighted`)}
     ${seriesChart(ix.short, 'short', 'bix-short',
        `SHORT index · ${ix.short.n} legs today, equal weighted`)}
     ${seriesChart(ix.ratio, 'ratio', 'bix-ratio',
        'LONG / SHORT · are the longs beating the shorts',
        {faintWicks: true, closeLine: true})}
     <div class="bcx-foot">
       <div><b>Membership is frozen at ${esc(dmy(ix.freeze))} and follows the
         book after it.</b> On or before that date the roster is that
         snapshot's, held constant — so everything left of it is a
         <b>back-cast</b>, and survivorship-biased by construction: these are
         the legs the book holds <em>today</em>, run backwards through years in
         which it did not hold them. After that date the roster comes from each
         new snapshot, so the index follows positions on and off.
         ${(ix.changes || []).length
           ? `<b>${ix.changes.length} change${ix.changes.length === 1 ? '' : 's'}
              since:</b> ` + ix.changes.map(c => `${esc(dmy(c.date))}
              ${esc(c.name)} <span class="u">${c.event === 'in' ? 'in' : 'out'},
              ${c.side === 'L' ? 'long' : 'short'}</span>`).join(' · ')
           : `No position has changed since, so the live half of the series is
              ${ix.snapshots} snapshot${ix.snapshots === 1 ? '' : 's'} long and
              has not yet been exercised.`}</div>
       <div><b>Each leg joins on its own listing date, and never contributes a
         return on its first day.</b> ${nJoin} of the legs list after
         ${esc(dmy(ix.start))}, so <b>n grows</b> across the window —
         ${(ix.composition || []).length
            ? `${ix.composition[0].long} long / ${ix.composition[0].short} short
               at the start, ${ix.long.n} / ${ix.short.n} now`
            : ''}. When a leg joins, every other leg's weight falls: this is
         <b>not a constant-composition index</b> and must not be read as one.
         A leg counts from the session AFTER its first close, or a listing-day
         pop at a price nobody in the book paid would enter as performance.</div>
       <div><b>Long / short is a ratio, not the gap between the two charts.</b>
         It divides by where the short index actually is, so it is a true
         percent; the two being ${pc(ix.spread_last).replace('%', '')} pp apart
         is a different quantity and is labelled pp. Over the full history
         those read <b>+17.6%</b> and <b>+431pp</b> — the same distinction the
         ruler makes, at the scale that makes it matter.</div>
       <div><b>Bodies are exact, wicks are bounds.</b> The legs open and close
         together, so the mean of the opens is the index's own; their highs are
         not simultaneous, so the mean of the highs is an upper bound on the
         index's true high. It holds for any weights, so 1/n changes nothing —
         and the ruler will not snap to them. The ratio's wick is a bound built
         from two bounds and is drawn fainter still.</div>
       ${ix.period === 'daily' ? '' : `<div><b>These are ${esc(ix.period)}
         candles, and the aggregation is exact.</b> ${ix.window_sessions}
         sessions roll into ${ix.window_bars} bars — open is the period's first
         open, high the max, low the min, close the last. <b>Every session
         still contributes</b>; nothing is sampled or thinned, which would be a
         silent lie about the path. A daily candle over this window would be
         ${(934 / ix.window_sessions).toFixed(2)}px wide. The wick means what
         it meant daily: the max of upper bounds is still an upper bound.</div>`}
       <div><b>The ruler's % is not the axis gap.</b> The axis is already a
         percentage, so the distance between two points is percentage POINTS.
         The % change divides by the level where you started, not by the rebase
         date — +3% to +8% is 5.00pp but a <b>+4.85%</b> move, and the two
         diverge further the further the chart has travelled. Both are shown,
         both labelled.</div>
       <div><b>History starts ${esc(dmy(ix.start))} on purpose.</b> Before 2007
         the Yahoo history for these names carries unadjusted corporate actions
         and bad prints — Tata Steel −86.8% (2004-04-27), UltraTech −75.6%
         (the 2004 Grasim cement demerger), Hindustan Zinc +5,575% (2006-11-21),
         and five <em>identical</em> +949.6% jumps in Tata Steel between 1996
         and 1999. From 2007 the only one-day move above 35% anywhere in the
         book is VEDL's real 2026-04-30 demerger.</div>
       ${(ix.actions_dropped || []).length ? `<div><b>Confirmed corporate
         actions dropped from the day's mean (${ix.actions_dropped.length}):</b>
         ${ix.actions_dropped.map(a => `${esc(dmy(a.date))} ${esc(a.name)}`)
            .join(' · ')}. The allow-list is hand-verified, so an
         <b>unverified</b> jump is still a real market move and is drawn
         through — the 2008 crash and the 2020 COVID moves stay in.</div>` : ''}
       ${(ix.phantom_sessions || []).length ? `<div><b>Dropped as
         non-sessions (${ix.phantom_sessions.length}):</b>
         ${ix.phantom_sessions.map(x => esc(dmy(x.date))).join(', ')} — every
         member priced with <b>no range and zero volume</b>, i.e. the exchange
         was shut and the feed answered anyway. Left in, each injects a
         guaranteed flat session, and the names with no placeholder would then
         measure the next session over two days while the rest measured one.
         <b>The rows are still in <code>prices</code></b> — this cleans only
         what the index reads.</div>` : ''}
       ${(ix.thin_sessions || []).length ? `<div><b>Below the session quorum
         (${ix.thin_sessions.length}):</b> ${ix.thin_sessions.map(x =>
           `${esc(dmy(x.date))} <span class="u">${x.printed} of ${x.listed}
            legs priced</span>`).join(' · ')} — not enough of the book traded
         for the date to be a session at all. ${esc(dmy(ix.thin_sessions[0].date))}
         is a Saturday special session that one name carries.</div>` : ''}
       ${(ix.skipped_sessions || []).length ? `<div><b>Sessions skipped for a
         missing price (${ix.skipped_sessions.length}):</b>
         ${ix.skipped_sessions.map(x => `${esc(dmy(x.date))}
            <span class="u">${x.side === 'L' ? 'long' : 'short'} — ${
            esc((x.missing || []).join(', '))}</span>`).join(' · ')}. A session
         is all-or-nothing: if one listed member has no close the bar is not
         drawn and the chain runs on to the next session where every member
         prices, so the interval widens but stays common to all of them.
         Averaging over whoever happened to print would move the index on a
         data gap rather than on a price. <b>These are holes in Yahoo's data,
         not fetches that failed.</b></div>` : ''}
       ${(ix.no_history || []).length ? `<div class="warn"><b>In the book but
         priced by nothing (${ix.no_history.length}):</b>
         ${esc(ix.no_history.join(', '))} — mapped to an entity with no symbol
         in <code>yahoo_prices.CANDIDATES</code>, so the index cannot include
         them and <b>would otherwise drop them in silence</b>: a leg with no
         price is skipped as "not yet listed", which holds up no session and
         records no gap. Add the symbol and backfill with
         <code>--load --only &lt;id&gt; --range 2007-01-01</code>.</div>` : ''}
       ${(ix.unmapped || []).length ? `<div class="warn"><b>Unmapped legs:</b>
         ${esc(ix.unmapped.join(', '))} — add them to
         <code>specs/book.yaml ticker_map</code> or they stay out of the
         index.</div>` : ''}
     </div>`;
  wire();
  wireCandles();
}

/* ===================== flows =====================
   Every row is probed against the store on each request rather than restated
   from docs/FLOWS.md, which was verified by hand once on 2026-08-19. A hard-coded
   blocker table would go stale silently the first time a blocker was cleared —
   the failure mode the doc itself warns about. */
/* The nine regime states: colour + one-line gloss. The gloss states the SIGN
   PATTERN, not advice — F1 never sets direction. Gold's sign is what separates
   degross (liquidated for cash) from risk_off (bid, flight to safety). */
/* sg = the sign pattern in plain words, for inline use beside a state name.
   Full prose stays in g; base/lift live in hover only (PM 2026-09-04). */
const RGM = {
  quiet:             {c:'var(--faint)',  ab:'·',  sg:'nothing big moved', g:'nothing big moved across assets'},
  risk_on:           {c:'var(--up)',     ab:'R+', sg:'stocks↑ bonds↓ gold↓', g:'equities bid, bonds and gold sold — the market is paying for risk'},
  reflation:         {c:'var(--up)',     ab:'RF', sg:'stocks↑ bonds↓ gold↑', g:'equities and gold up, bonds down — inflation trade'},
  goldilocks:        {c:'var(--up)',     ab:'G',  sg:'stocks↑ bonds↑ gold↓', g:'stocks up on falling yields'},
  liquidity_rally:   {c:'var(--accent)', ab:'L+', sg:'all three ↑',         g:'everything up at once — liquidity flood'},
  risk_off:          {c:'var(--warn)',   ab:'R-', sg:'stocks↓ bonds↑ gold↑', g:'stocks down, bonds and gold bid — classic flight to safety'},
  degross:           {c:'var(--down)',   ab:'DG', sg:'stocks↓ bonds↑ gold↓', g:'stocks down, bonds bid, gold SOLD — gross coming off both ways'},
  stagflation_scare: {c:'var(--warn)',   ab:'SF', sg:'stocks↓ bonds↓ gold↑', g:'stocks and bonds down together, gold bid'},
  liquidation:       {c:'var(--down)',   ab:'LQ', sg:'all three ↓',          g:'everything sold — margin-call tape'},
};

/* The ROLLING week LEADS, updated every US session (PM 2026-09-08: "update
   daily... show weekly trend but calculate past week on a rolling basis") —
   superseding the 2026-09-03 Friday-week lead, whose layer survives as the
   trend line, the strip and the long-run evidence tables. The daily layer
   still computes and persists — the spell is drawn from it. */
function w1Panel(w, f){
  if (!w) return `<div class="callout accent-amber"><div class="callout-head">
    <span class="ico">⚠</span><span class="t">F1 has no data</span></div>
    run <code>flow_series.py --load</code></div>`;
  if (w.error) return `<div class="callout accent-amber"><div class="callout-head">
    <span class="ico">⚠</span><span class="t">F1 weekly failed</span></div>${esc(w.error)}</div>`;

  /* L = the lead reading (rolling past week); falls back to the completed
     Friday week only if the API predates the rolling lead. */
  const L = w.lead || {state: w.state, loud_state: w.loud_state, grade: w.grade,
    intensity: w.intensity, z_eq: w.z_eq, z_bond: w.z_bond, z_gold: w.z_gold,
    date: w.week_end, run_len: null};
  const m = RGM[L.state] || {c:'var(--soft)', g:''};
  const wm = RGM[w.state] || {c:'var(--soft)', g:''};
  const z = (v, l) => `<b style="color:${v > 0 ? 'var(--up)' : v < 0 ? 'var(--down)' : 'var(--faint)'}">${l} ${v >= 0 ? '+' : ''}${v.toFixed(2)}σ</b>`;
  const stale = w.stale ? `<div class="callout accent-amber" style="margin-bottom:10px">
    <div class="callout-head"><span class="ico">⚠</span><span class="t">STALE — last
    classified US session ${esc(L.date)}, ${w.stale_days} days ago</span></div>
    An old regime and an unchanged one are indistinguishable without this banner.
    Run the refresh before reading anything below.</div>` : '';

  /* The ROLLING week: each session read as its own 5-session weekly window —
     the daily quantification of the weekly read. Consecutive chips share 4 of
     5 sessions, so the strip shows a reading EVOLVING, not fresh samples. */
  const gradeMark = g => g === 'extreme' ? '‼' : g === 'strong' ? '!' : g === 'moderate' ? '·' : '';
  const roll = w.rolling && w.rolling.length ? w.rolling : null;
  const rollCur = roll ? roll[roll.length - 1] : null;
  const rollChips = roll ? roll.map(r => {
    const mm = RGM[r.state] || {c:'var(--soft)', ab:'?'};
    return `<span class="d" title="${esc(r.date)}: ${esc(r.state)} [${esc(r.grade)}, max |z| ${r.intensity.toFixed(2)}] — eq ${r.z_eq >= 0 ? '+' : ''}${r.z_eq} · bond ${r.z_bond >= 0 ? '+' : ''}${r.z_bond} · gold ${r.z_gold >= 0 ? '+' : ''}${r.z_gold}"
      style="color:${mm.c};border-color:${mm.c};${r.grade === 'extreme' ? 'border-width:2px;' : ''}">
      <span>${mm.ab}${gradeMark(r.grade)}</span><span style="color:var(--faint)">${esc(r.date.slice(8))}</span></span>`;
  }).join('') : '';
  const rs = w.rolling_stats || null;
  const rolling = roll ? `<div style="margin:10px 0 0">
      <div class="f1-strip" style="margin-top:6px">${rollChips}</div>
      <p class="note" style="margin-top:4px">Each chip = that day's OWN last 5 US
        sessions on the weekly σ scale, updated daily — no waiting for Friday.
        Adjacent chips share 4 sessions, so read it as one reading evolving.
        ! = strong, ‼ = extreme.${rs && rs.churn_pct != null ? ` Historically the
        rolling read flips on ${rs.churn_pct.toFixed(0)}% of sessions (median run
        ${rs.median_run}, over ${rs.n_days.toLocaleString()} sessions) — the STATE
        moves daily; the grade says how much to care.` : ''}</p></div>` : '';

  /* The Friday-to-Friday TREND line — the completed week the long-run tables
     are built from, kept visible under the rolling lead. */
  const trend = `<p style="margin:8px 0 0;font-size:12.5px;color:var(--soft)">
      Weekly trend — last completed week ${esc(w.week)} (ended ${esc(w.week_end)}):
      <b style="color:${wm.c}">${esc(w.state)}</b>
      ${w.grade ? `[${esc(w.grade)}, max |z| ${w.intensity.toFixed(2)}]` : ''}
      · full Friday-week history in the strip below.</p>`;

  /* The intensity ladder — THIS STATE's own cells (PM, 2026-09-04: "why would
     I need the full up-family if we are just looking at goldilocks" — and the
     data agreed: moderate goldilocks weeks run -0.03% vs the family's +0.27%).
     A cell under 10 weeks shows the pooled family figure instead, explicitly
     labelled as the fallback it is. Hit rate and sample size live in hover. */
  const lad = w.ladder || {};
  const slad = w.state_ladder || {};
  const UPFAM = ['risk_on', 'reflation', 'goldilocks', 'liquidity_rally'];
  const fam = UPFAM.includes(L.loud_state) ? 'up' : 'down';
  const ladCell = g => {
    const cur = g === L.grade;
    const wrap = inner => `<span style="${cur ? 'outline:1px solid var(--rule);border-radius:4px;padding:1px 6px;' : ''}">${g}: ${inner}${cur ? ' ← now' : ''}</span>`;
    const c = slad[g];
    if (c && c.mean != null)
      return wrap(`<b style="color:${c.mean > 0 ? 'var(--up)' : 'var(--down)'}"
        title="closed up ${c.hit.toFixed(0)}% of the time, over ${c.n} ${esc(L.state)} weeks">${c.mean > 0 ? '+' : ''}${c.mean.toFixed(2)}%</b>`);
    const p = (lad[fam] || {})[g];
    if (p && p.mean != null)
      return wrap(`<span style="color:var(--faint)"
        title="only ${c ? c.n : 0} ${esc(L.state)} weeks at this grade in ten years — this is the ALL-${fam === 'up' ? 'equity-up' : 'equity-down'}-states figure (${p.hit.toFixed(0)}%, n=${p.n}), not a ${esc(L.state)} number">${p.mean > 0 ? '+' : ''}${p.mean.toFixed(2)}%*</span>`);
    return wrap(`<span style="color:var(--faint)">no data</span>`);
  };
  const ladder = (slad.moderate || slad.strong || slad.extreme) ? `<p class="note" style="margin-top:8px">
      <b style="color:var(--soft)">After a ${esc(L.state)} week, the next Indian
      week has averaged</b> &nbsp;
      ${ladCell('moderate')} &nbsp;·&nbsp; ${ladCell('strong')} &nbsp;·&nbsp; ${ladCell('extreme')}
      &nbsp;— hover for hit rate and sample. A greyed value with * means too few
      ${esc(L.state)} weeks at that loudness ever happened; it shows the pooled
      ${fam === 'up' ? 'equity-up' : 'equity-down'} figure instead.</p>` : '';

  /* The spell stays daily-windowed — it IS a ~2-week measure and it is the
     coach's operative gate. */
  const spell = f && f.spell_quiet === 1
    ? `<span class="pill ok">quiet spell · ${f.spell_run} session${f.spell_run === 1 ? '' : 's'}</span>
       no persistent equity flow — <b>fundamentals carry; the pillars have the edge</b>`
    : f && f.spell_quiet === 0
    ? `<span class="pill bad">loud flow · ${f.spell_run} session${f.spell_run === 1 ? '' : 's'}</span>
       persistent flow via <b>${esc(f.flow_driver || '?')}</b> (intensity
       ${f.flow_intensity == null ? '—' : f.flow_intensity.toFixed(2)}) —
       <b>flows are running the tape; expect them to override fundamentals</b>`
    : `<span class="pill warn">spell unknown</span>`;

  const rot = w.rot_z != null && Math.abs(w.rot_z) >= 1
    ? ` · rotation <b>${w.rot_z < 0 ? 'out of hardware, into software' : 'out of software, into hardware'}</b> (${w.rot_z >= 0 ? '+' : ''}${w.rot_z.toFixed(2)}σ, completed week)`
    : '';

  const pers = w.persistence ? w.persistence[L.state] : null;
  const persLine = pers != null && pers >= 1.5
    ? `<p style="margin:8px 0 0;color:var(--warn);font-size:12.5px">⚠ ${esc(L.state)}
       weeks cluster: another one follows at <b>${pers.toFixed(1)}×</b> the base rate.
       Stress arrives in runs.</p>` : '';

  /* Top 5 of 9 next-states; the cap must not read as a full distribution
     (PM 2026-09-04 noticed the rows summing to ~80%) — the remainder line
     names what it hides. Lift = pct/base: 1.0x means the completed week
     taught you nothing about that state following. */
  const shown = (w.next || []).slice(0, 5);
  const restPct = 100 - shown.reduce((a, x) => a + x.pct, 0);
  const restN = (w.next || []).length - shown.length;
  const odds = shown.map(x => {
    const mm = RGM[x.state] || {c:'var(--soft)'};
    const lift = x.base ? x.pct / x.base : null;
    return `<div class="row"><span class="lbl" style="color:${mm.c}">${esc(x.state)}</span>
      <span class="track"><span class="base" style="left:${Math.min(x.base * 2.2, 100)}%"></span>
        <span class="bar" style="width:${Math.min(x.pct * 2.2, 100)}%;border-right-color:${mm.c}"></span></span>
      <span class="num">${x.pct.toFixed(1)}% <span style="color:var(--faint)"
        title="normally ${x.base.toFixed(1)}% of all weeks${lift ? ' — after a ' + esc(L.state) + ' week it is ' + lift.toFixed(2) + 'x as likely as usual' : ''}">(${mm.sg})</span></span></div>`;
  }).join('') + (restN > 0 && restPct > 0.05 ? `<div class="row">
      <span class="lbl" style="color:var(--faint)">${restN} other states</span>
      <span class="track"><span class="bar" style="width:${Math.min(restPct * 2.2, 100)}%;background:var(--sunken);border-right-color:var(--faint)"></span></span>
      <span class="num" style="color:var(--faint)">${restPct.toFixed(1)}% combined</span></div>` : '');

  /* India next-week evidence for THIS state, live from flow_series. A cell
     with too few pairs is withheld by the API — render the withholding. */
  const LBL = {nifty: 'Nifty 50', nifty_metal: 'Nifty Metal', nifty_it: 'Nifty IT',
               nifty_auto: 'Nifty Auto'};
  const indiaRow = (sid, blk, state, label) => {
    const s = blk.stats && blk.stats[state];
    const staleIdx = blk.last_date < w.week_end
      ? ` <span style="color:var(--warn)">(series thru ${esc(blk.last_date)})</span>` : '';
    if (!s || s.mean == null) return `<tr><td>${esc(LBL[sid] || sid)}${label}</td>
      <td colspan="3" class="flat">withheld — too few prior ${esc(state)} ${label ? 'flips' : 'weeks'}${s ? ` (n=${s.n})` : ''}</td><td>${staleIdx}</td></tr>`;
    const cls = Math.abs(s.t) >= 2 ? (s.mean > 0 ? 'pos' : 'neg') : '';
    return `<tr><td>${esc(LBL[sid] || sid)}${label}</td>
      <td class="n ${cls}">${s.mean > 0 ? '+' : ''}${s.mean.toFixed(2)}%</td>
      <td class="n">${s.hit.toFixed(0)}% hit</td>
      <td class="n ${Math.abs(s.t) >= 2 ? cls : 'flat'}">t ${s.t > 0 ? '+' : ''}${s.t}</td>
      <td class="n flat">n=${s.n}${staleIdx}</td></tr>`;
  };
  const india = Object.entries(w.india || {}).map(([sid, blk]) =>
    indiaRow(sid, blk, L.state, '')).join('');
  /* Entry-based rolling evidence: sampled the day the rolling read FLIPPED to
     this state (never every day — adjacent readings share 4 of 5 sessions),
     next 5 India sessions. Sits beside the Friday-week table so the two
     samples can disagree in the open. */
  const entryIndia = Object.entries(w.entry_india || {}).map(([sid, blk]) =>
    indiaRow(sid, blk, L.state, ' <span style="color:var(--faint)">· on flip</span>')).join('');

  const strip = (w.strip || []).map(s => {
    const mm = RGM[s.state] || {c:'var(--soft)', ab:'?'};
    return `<span class="d" title="${esc(s.wk)}: ${esc(s.state)}"
      style="color:${mm.c};border-color:${mm.c}"><span>${mm.ab}</span><span
      style="color:var(--faint)">${esc(s.wk.slice(5))}</span></span>`;
  }).join('');

  /* The coverage sector tape rendered here 2026-09-03 .. 2026-09-04 and was
     removed at the PM's instruction ("what use is the sector tape? Remove
     it"). The nine index series keep accruing in flow_series — restoring the
     view is a UI change, not a data recovery. */

  return `${stale}
  <div class="callout" style="border-left-color:${m.c}">
    <div class="callout-head"><span class="t">F1 · Market regime — past week, rolling · updated daily</span>
