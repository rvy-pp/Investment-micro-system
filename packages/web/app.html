/* Dossiers whose sector could not be resolved (no `sector` key, no matching
   nse_symbol in any spec or the entities table). They render under NO sector
   tab, so the only way to know they exist is to say so here. */
function companyUnplaced(list){
  if (!list || !list.length) return '';
  return '<div class="hint" style="margin-top:6px">&#9888; '
    + list.length + ' dossier' + (list.length > 1 ? 's' : '')
    + ' under data/companies/ resolve to no sector and render nowhere: '
    + list.map(c => esc(c.company) + ' (' + esc(c.slug) + ')').join(', ')
    + ' — add a <code>sector</code> key to each dossier.json.</div>';
}

async function loadCompany(){
  const sec = SECTOR;
  const slug = COMPANY_SLUG_BY_SECTOR[sec];
  const qs = '?sector=' + encodeURIComponent(sec)
    + (slug ? '&slug=' + encodeURIComponent(slug) : '');
  const d = await (await fetch('/api/company' + qs)).json();
  const secLabel = (SECTORS.find(s => s.id === sec) || {}).label || sec;
  if (d.error){
    $('#s-company').innerHTML = '<div class="pgt">Company historical analysis'
      + ' <span class="pill">' + esc(secLabel) + '</span></div>'
      + '<div class="callout accent-amber"><div class="callout-head">'
      + '<span class="ico">&#9888;</span><span class="t">No dossier</span></div>'
      + '<div>' + esc(d.error) + '</div>' + companyUnplaced(d.unplaced) + '</div>';
    return;
  }
  COMPANY_SLUG_BY_SECTOR[sec] = d.selected;
  const picker = (d.companies || []).map(c =>
    '<option value="' + esc(c.slug) + '"' + (c.slug===d.selected?' selected':'') + '>'
    + esc(c.company) + (c.nse ? ' (' + esc(c.nse) + ')' : '') + '</option>').join('');

  $('#s-company').innerHTML =
    '<div class="pgt">' + esc(d.company)
    + ' <span class="pill">' + esc((d.tickers||{}).nse || '') + '</span>'
    + ' <span class="pill">' + esc(secLabel) + '</span>'
    + (d.fno === false ? ' <span class="pill warn">not in F&amp;O</span>' : '') + '</div>'
    + '<div class="meta-line"><select id="cpick" style="margin-right:10px">' + picker
    + '</select>as of ' + esc(d.as_of || '—') + ' · ' + (d.qoq_pnl||[]).length
    + ' quarters · ' + (d.documents||[]).length + ' filed documents · '
    + (d.companies||[]).length + ' ' + esc(secLabel) + ' dossier'
    + ((d.companies||[]).length === 1 ? '' : 's') + '</div>'
    + companyUnplaced(d.unplaced)
    + '<div class="callout"><div class="callout-head"><span class="ico">&#128196;</span>'
    + '<span class="t">Built from</span></div><div style="font-size:var(--t-body)">'
    + esc(d.built_from || '') + '</div>'
    + '<div class="hint" style="margin-top:6px">' + esc(d.coverage_note || '') + '</div></div>'
    + companyNarrative(d)
    + companyGuidance(d.guidance_ledger,
        ((d.narrative || {}).earnings_reactions || []).length)
    + companyPnl(d)
    + companyGeography(d)
    + companySeries(d)
    + companyTimelines(d)
    + companyMixAndGaps(d)
    + companyDocs(d);

  const sel = document.getElementById('cpick');
  if (sel) sel.addEventListener('change', () => {
    COMPANY_SLUG_BY_SECTOR[sec] = sel.value;
    delete rendered['company'];
    render('company');
  });
}

/* ---------------------------------------------------------------- Results
   The Results tab (PM 2026-09-22): sector -> company -> quarter, sell-side
   estimates against the reported print, and the calendar of prints to come.
   Everything here is READ from /api/results; the store is fed by
   packages/results/results_io.py from staged, cited JSON (the /results-ingest
   skill writes those). Not SECTOR_SCOPED: it carries its own picker, so a
   sector switch elsewhere must not refetch it. */
const RES_SEL = {sector: null, entity: null};
// The "in line" band. A judgement, so it is a named constant and the page
// prints it in the meta-line rather than implying a beat at +0.3%.
const RS_INLINE_PCT = 1.0, RS_INLINE_PP = 0.2;

function rsNum(v){
  if (v == null) return '—';
  const a = Math.abs(v);
  return cNum(v, a >= 1000 ? 0 : a >= 100 ? 1 : 2);
}
function rsSurprise(s){
  if (!s) return '<td class="n">—</td><td></td>';
  const v = s.kind === 'pp' ? (s.value >= 0 ? '+' : '') + s.value.toFixed(2) + 'pp'
                            : cPct(s.value, 1);
  const inline = s.kind === 'pp' ? Math.abs(s.value) < RS_INLINE_PP
                                 : Math.abs(s.value) < RS_INLINE_PCT;
  let chip;
  if (s.beat == null) chip = '<span class="chip c-flat" title="this metric carries no beat/miss direction (capex)">no verdict</span>';
  else if (inline) chip = '<span class="chip c-flat">in line</span>';
  else chip = s.beat ? '<span class="chip c-up">beat</span>' : '<span class="chip c-down">miss</span>';
  const col = s.beat == null ? 'var(--soft)' : s.beat ? 'var(--up)' : 'var(--down)';
  return '<td class="n" style="color:' + col + '">' + v + '</td><td>' + chip + '</td>';
}
function rsSrc(x){
  const s = x.source || {};
  const where = s.raw_path || x.source_id || '';
  return '<span class="src">' + esc(x.as_of) + (s.origin ? ' · ' + esc(s.origin) : '')
    + (s.title ? ' · ' + esc(s.title) : '') + (where ? ' · ' + esc(where) : '') + '</span>';
}
function rsDrawer(m){
  const rows = (m.estimates || []).map(r => '<li><b>' + esc(r.broker) + '</b> '
    + '<span class="mono">' + rsNum(r.value) + '</span> ' + esc(r.unit || '')
    + (r.post_print ? ' <span class="chip c-warn" title="dated after the print: shown, but excluded from the consensus the print is graded against">post-print</span>' : '')
    + '<div class="rs-q">' + esc(r.quote) + '</div>' + rsSrc(r) + '</li>').join('');
  const act = m.actual ? '<li class="rs-act"><b>Actual</b> <span class="mono">' + rsNum(m.actual.value)
    + '</span> ' + esc(m.actual.unit || '') + '<div class="rs-q">' + esc(m.actual.quote) + '</div>'
    + rsSrc(m.actual) + '</li>' : '';
  const flag = m.actual_flag ? '<div class="hint" style="color:var(--warn)">⚠ ' + esc(m.actual_flag) + '</div>' : '';
  return '<ul class="rs-list">' + act + rows + '</ul>' + flag;
}
function rsMetricRow(m){
  const c = m.consensus;
  const nEst = (m.estimates || []).length;
  const label = '<details class="rs-det"><summary>' + esc(m.label)
    + '<span class="hint">' + (nEst ? nEst + ' est' : 'no estimate') + (m.actual ? ' · print' : '')
    + (m.n_post_print ? ' · ' + m.n_post_print + ' post-print' : '') + '</span></summary>'
    + rsDrawer(m) + '</details>';
  const cons = c
    ? '<td class="n" title="median of each broker\'s latest pre-print estimate">' + rsNum(c.median) + '</td>'
      + '<td class="n">' + c.n + '</td>'
      + '<td class="n hint">' + (c.n > 1 ? rsNum(c.low) + ' – ' + rsNum(c.high) : '') + '</td>'
    : '<td class="n">—</td><td class="n">—</td><td class="n"></td>';
  const act = m.actual
    ? '<td class="n"><b>' + rsNum(m.actual.value) + '</b>' + (m.actual_flag ? ' <span class="chip c-warn">flag</span>' : '') + '</td>'
    : '<td class="n">—</td>';
  return '<tr><td class="k rs-k">' + label + '</td><td class="hint">' + esc(m.unit || '') + '</td>'
    + cons + act + rsSurprise(m.surprise) + '</tr>';
}
function rsPeriod(p){
  const st = {reported:'c-up', scheduled:'c-warn', 'estimates only':'c-flat', 'calendar only':'c-flat'}[p.status] || 'c-flat';
  const cal = p.calendar
    ? ' <span class="pill' + (p.calendar.status === 'confirmed' ? '' : ' warn') + '" title="' + esc(p.calendar.quote) + '">print '
      + esc(p.calendar.event_date) + ' · ' + esc(p.calendar.status) + '</span>' : '';
  const brokers = (p.brokers || []).length ? ' <span class="hint">' + p.brokers.map(esc).join(', ') + '</span>' : '';
  const y = p.yahoo_eps
    ? '<div class="hint" style="margin-top:6px">Yahoo consensus EPS ' + rsNum(p.yahoo_eps.eps) + ' (capture '
      + esc(p.yahoo_eps.as_of) + ') — machine consensus from the daily feed, reference only; it never enters the broker median above.</div>'
    : '';
  const body = p.metrics.length
    ? '<div class="panel"><div class="scroll"><table class="rs-tab"><thead><tr>'
      + '<th>metric</th><th>unit</th><th class="n">consensus</th><th class="n">n</th><th class="n">range</th>'
      + '<th class="n">actual</th><th class="n">surprise</th><th>verdict</th></tr></thead><tbody>'
      + p.metrics.map(rsMetricRow).join('') + '</tbody></table></div>' + y + '</div>'
    : '<div class="panel hint">Only a result date so far — no estimate stored for this period.' + y + '</div>';
  return '<div class="sechead">' + esc(p.period) + ' <span class="chip ' + st + '">' + esc(p.status) + '</span>'
    + cal + brokers + '</div>' + body;
}
async function loadResults(){
  const qs = [];
  if (RES_SEL.sector) qs.push('sector=' + encodeURIComponent(RES_SEL.sector));
  if (RES_SEL.entity) qs.push('entity=' + encodeURIComponent(RES_SEL.entity));
  const d = await (await fetch('/api/results' + (qs.length ? '?' + qs.join('&') : ''))).json();
  if (d.error) throw new Error(d.error);
  RES_SEL.sector = d.sector; RES_SEL.entity = d.selected;
  const chips = d.sectors.map(s => '<button class="bbtn rs-sec" data-s="' + esc(s.id) + '" aria-pressed="'
    + (s.id === d.sector) + '" title="' + s.n_with_data + ' of ' + s.n_names + ' names hold estimates or prints">'
    + esc(s.label) + '<span class="rs-n">' + s.n_with_data + '/' + s.n_names + '</span></button>').join('');
  const pick = d.companies.map(c => '<option value="' + esc(c.id) + '"' + (c.id === d.selected ? ' selected' : '') + '>'
    + esc(c.name) + (c.nse ? ' (' + esc(c.nse) + ')' : '') + (c.unit_of ? ' — unit of ' + esc(c.unit_of) : '')
    + (c.has_data
        ? ' · ' + (c.latest_period || '') + (c.n_estimates ? ' · ' + c.n_estimates + ' est' : '')
          + (c.n_actuals ? ' · ' + c.n_actuals + ' print' : '')
        : ' · nothing stored') + '</option>').join('');
  const co = d.company;
  let body;
  if (!co) body = '<div class="callout accent-amber"><div class="callout-head"><span class="ico">&#9888;</span>'
    + '<span class="t">No names</span></div>This sector has no roster entry yet — a name reaches the picker '
    + 'through its spec, the entities table or a company dossier, never by being typed here.</div>';
  else if (!d.periods.length) body = '<div class="callout"><div class="callout-head"><span class="ico">&#128203;</span>'
    + '<span class="t">Nothing stored for ' + esc(co.name) + '</span></div>'
    + 'No estimate, print or result date has been loaded for this name. Stage a cited JSON under '
    + '<span class="mono">data/results/staging/</span> and run <span class="mono">' + esc(d.loader) + '</span> '
    + '(the <span class="mono">/results-ingest</span> skill does both from a broker note or a digest line).</div>';
  else body = d.periods.map(rsPeriod).join('');
  const nextEv = co && co.next_event ? ' · next print ' + esc(co.next_event.date) + ' (' + esc(co.next_event.period) + ')' : '';
  $('#s-results').innerHTML =
    '<div class="pgt">Results <span class="pill">' + d.totals.n_with_data + ' of ' + d.totals.n_names + ' covered names hold data</span></div>'
    + '<div class="meta-line">Sell-side estimates against the reported print, per company per quarter. '
    + 'Consensus is the <b>median of each broker\'s latest pre-print estimate</b>; an estimate dated after the print is shown but excluded. '
    + 'Beat/miss follows the metric\'s direction (a lower cost/t beats); "in line" is within ' + RS_INLINE_PCT + '% ('
    + RS_INLINE_PP + 'pp on margins). Every number opens to its quote and source. as of ' + esc(d.as_of) + '</div>'
    + '<div class="rs-secs">' + chips + '</div>'
    + '<div class="meta-line" style="margin-top:10px"><select id="rpick" style="margin-right:10px">' + pick + '</select>'
    + (co ? esc(co.name) + (co.scored ? '' : ' <span class="pill">not scored</span>') + nextEv : '') + '</div>'
    + body;
  document.querySelectorAll('.rs-sec').forEach(b => b.addEventListener('click', () => {
    RES_SEL.sector = b.dataset.s; RES_SEL.entity = null; render('results'); }));
  const sel = document.getElementById('rpick');
  if (sel) sel.addEventListener('change', () => { RES_SEL.entity = sel.value; render('results'); });
}

const loaders = {pair:loadPair, scores:loadScores, pos:loadPos,
                sector:loadSector, overview:loadOverview, book:loadBook,
                flows:loadFlows, company:loadCompany, results:loadResults};

/* Which views render SECTOR-SPECIFIC content. The other three are global —
   Positioning is the whole F&O table, Overview and Flows are run-level — so
   their DOM stays valid across a sector switch and must not be refetched. */
const SECTOR_SCOPED = {pair:1, scores:1, sector:1, company:1};

/* view -> the sector whose content is currently IN THAT SECTION'S DOM, or '*'
   for a global view. NOT "has this view loaded": there is one #s-<view> node
   shared by every sector, so a per-view flag reported Steel's bridge as
   already loaded when Non-Ferrous asked for it, and left Steel on screen. */
const rendered = {};

/* Run a view's loader and record what its DOM now holds. Clears the record on
   failure — the old flag was set BEFORE the await, so a view that threw once
   was marked loaded forever and stayed blank until a reload. */
function render(name){
  rendered[name] = SECTOR_SCOPED[name] ? SECTOR : '*';
  loaders[name]().catch(e => { delete rendered[name]; showErr(e.message); });
}
function tab(name){
  document.querySelectorAll('.tab').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.t === name)));
  document.querySelectorAll('section').forEach(s =>
    s.classList.toggle('on', s.id === 's-' + name));
  // The window selector drives the LIVE bridge only. Leaving it visible on the
  // Pair tab would imply it moves the persisted tape, which it cannot.
  // The window selector, FX and the override count all describe the LIVE
  // bridge. Showing them over the persisted tape would imply they move it.
  // Only the three sector sub-views are remembered. Overview and Flows are
  // top-level tabs, so recording them here would send you to a hidden section
  // the next time you picked a live sector.
  if (name === 'pair' || name === 'scores' || name === 'pos'
      || name === 'sector' || name === 'company' || name === 'inventory') LAST_VIEW = name;
  /* DRAWN ON SHOW, not on sector load. A hidden section measures clientWidth
     0 — the share panel met exactly that and rendered a 535px chart beside an
     826px table — so the width is read only once the section is visible. */
  if (name === 'inventory') drawInventory().catch(e => showErr(String(e)));
  const live = (name === 'scores');
  $('#winwrap').hidden = !live;
  $('#fxwrap').hidden = !live;
  // Re-render when this section is showing another sector's content.
  if (rendered[name] !== (SECTOR_SCOPED[name] ? SECTOR : '*')) render(name);
}
document.querySelectorAll('.tab').forEach(b =>
  b.addEventListener('click', () => tab(b.dataset.t)));
$('#win').addEventListener('change', () => loadScores().catch(e => showErr(e.message)));
$('#reload').addEventListener('click', () => {
  // A FULL reload, deliberately (06-09-2026). The old handler re-rendered
  // data against the HTML/CSS the tab was opened with, so front-end changes
  // were invisible until a manual F5 — three rounds of gridline fixes never
  // reached the PM's screen. sessionStorage brings the current view back.
  try { sessionStorage.setItem('ims-view', SECTOR); } catch (e) {}
  location.reload();
});
$('#winwrap').hidden = true;
$('#fxwrap').hidden = true;
try {
  const v = sessionStorage.getItem('ims-view');
  if (v) { SECTOR = v; sessionStorage.removeItem('ims-view'); }
} catch (e) {}
loadSectorNav()
  .then(() => { sector(SECTOR); })
  .catch(e => {
    // Never leave the page on "sectors…". If the nav cannot load, fall back to
    // the view that has always worked rather than showing a dead shell.
    showErr('sector nav: ' + e.message);
    /* Fallback nav when /api/nav fails. It must carry peer_groups now that
       loadScores() reads them, or the Bridge view renders its empty state on a
       sector that actually works. KEEP IN STEP WITH engine.SECTORS — this
       literal had silently fallen two sectors behind (no cement, no mining)
       by 2026-08-30, which would have made an /api/nav outage also look like
       half the coverage vanishing. */
    SECTORS = [{id:'non_ferrous', kind:'sector', label:'Non-Ferrous', live:true,
                peer_groups:['aluminium_primary','zinc']},
               {id:'steel', kind:'sector', label:'Steel', live:true,
                peer_groups:['steel_integrated','steel_converter']},
               {id:'cement', kind:'sector', label:'Cement', live:true,
                peer_groups:['cement']},
               {id:'mining', kind:'sector', label:'Mining', live:true,
                peer_groups:['mining_bulk','mining_copper']}];
    SECTOR = 'non_ferrous';
    $('#snav').innerHTML = '<button class="stab" aria-selected="true">Non-Ferrous</button>';
    $('#vnav').hidden = false;
    tab('pair');
  });
</script>
</body>
