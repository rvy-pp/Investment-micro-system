# The Book tab / daily_review skill — configuration.
#
# ticker_map: the IMS ticker's FIRST TOKEN (before '=contract' / 'IS'/'IN') ->
# entity_id here. Seeded 2026-09-06 from the vault's
# `Portfolio Management/IMS-Spec.md` ticker table (PM-confirmed 2026-08-09) —
# a sourced mapping, not a guess. That spec keys the vault's folder names;
# the values here are THIS system's entity ids. Unrecognized tickers in a
# future snapshot: flag to the PM, do not guess.
#
# carry: desk-stated P&L a pair earned BEFORE its first stored snapshot (the
# chain can only see what was captured). Applied at display, flagged as
# carry, never mixed into the chained figure.
#   carry:
#     "IT 5": {pnl: 1250, since: "2026-07-01", note: "PM figure, pre-capture"}
#
# pnl_basis: contract_itd = the IMS per-ticker YTD PNL column, which resets
# when the ticker resets (roll) — book_io chains it. 'daily' would sum a
# day-P&L column instead; not the live convention.
pnl_basis: contract_itd

# ---------------------------------------------------------------------------
# index: the Book tab's equal-weighted long and short indices.
# PM instruction 2026-09-17, verbatim intent: "Keep VAML out, use 2007
# onwards. Create an equal weighted index for longs, equal for shorts. Once
# VAML starts to exist, add VAML to the long index. Till 16th sep 2026, we
# keep the index same. Post that, as and when the positions change, we change
# the index on a daily basis." It REPLACED two earlier charts (a
# portfolio-weighted back-cast and a snapshot-only live index); do not
# reintroduce either.
#
# These are SPEC values, not constants in code, because every one of them is
# a judgement the PM made and would have to be found again otherwise.
index:
  # Where the back-cast starts. 2007 is not arbitrary: before it the Yahoo
  # history for these names carries unadjusted corporate actions and bad
  # prints — Tata Steel -86.8% (2004-04-27), UltraTech -75.6% (2004-08-24,
  # the Grasim cement demerger), Hindustan Zinc +5,575% (2006-11-21), Ambuja
  # +652% (2004-10-14), and five IDENTICAL +949.6% jumps in Tata Steel
  # 1996-99 that repeat to the decimal and so cannot be market moves. From
  # 2007 the only one-day move above 35% anywhere in the 32 legs is VEDL's
  # real 2026-04-30 demerger, which is in core/corporate_actions.
  start: "2007-01-01"

  # THE FREEZE BOUNDARY. On or before this date the membership is the roster
  # of THIS date's snapshot, held constant — the back-cast. After it,
  # membership follows each new snapshot as positions change.
  #
  # IT IS A CONSTANT AND MUST STAY ONE. Deriving it as "the latest snapshot"
  # would move it forward every morning, and the whole back-cast would
  # silently re-write itself to whatever the book looks like today — which is
  # the survivorship bias this design exists to bound.
  freeze_before: "2026-09-16"

  # A date is a SESSION only if at least this fraction of the legs listed by
  # then actually printed. Measured over 4,867 dates from 2007: 4,863 are at
  # 100%, and the only two below 90% are 2010-02-06 (a SATURDAY special
  # session that just 1 of 20 listed names carries — 5%) and 2026-09-16
  # (75%, a genuine hole in Yahoo's data for 8 names). 0.5 separates them
  # cleanly, and nothing sits near the threshold.
  session_quorum: 0.5

