# ---------------------------------------------------------------------------
# kelly: Kelly sizing over the dictated pairs (PM, 2026-09-25). The RISK is
# measured by packages/book/kelly.py from `prices` (each pair's spread =
# mean long-leg return - mean short-leg return; covariance across pairs,
# shrunk toward its diagonal). The EDGE is the PM's and only the PM's —
# nothing the system computes is used as one (no composite is validated).
#
# Sizes are notional PER SIDE as a fraction of NAV; gross = 2x that.
kelly:
  fraction: 0.5          # half Kelly (PM, 2026-09-25)
  lookback_days: 730     # calendar days of price history for sigma / correlation
  min_sessions: 120      # fewer -> standalone only, kept out of the joint solve
  horizon_weeks: 13      # default horizon for an edge, and for the implied-edge read
  shrink: auto           # Schafer-Strimmer intensity; or pin a number in [0, 1]
  # 13-week variance vs 65 x daily (PM, 2026-10-06: "fix the 13-week variance").
  # The spreads partly mean-revert, so 65 x daily sigma^2 overstates quarterly
  # risk. `measured` = Lo-MacKinlay variance ratio over each pair's long
  # history, pooled across pairs (they differ only by noise today); a number
  # pins it (1.0 = the old sqrt-time assumption).
  horizon_variance: measured
  vr_lookback_days: 7300 # history for the ratio only; sigma's level stays on lookback_days
  vr_min_sessions: 750   # fewer -> the pair takes the pooled ratio, flagged
  # EDGES ARE NOT HERE. Since 2026-10-22 a pair's edge is the case agents'
  # pair juice — long lean minus short lean, from the Analysis tab (PM:
  # "we put the agents view from here"). Typed edges (book_kelly_edges,
  # 2026-09-25..10-22) are history nothing reads. An `edges:` key here is
  # reported, not read.

# ---------------------------------------------------------------------------
# var: Value at Risk, the Book tab's Risk sub-tab (PM, 2026-10-25: "build VaR
# into the Book tab as a tested module, recomputed from each snapshot").
# packages/book/var.py owns the method and the selftest. Today's book held
# constant in DOLLARS (IMS MV% x NAV per leg) through the legs' own daily
# returns. One-day, USD.
#
#   windows        historical VaR lookbacks, in COMMON sessions (every leg printed)
#   99.9%          a year holds 0.25 days beyond it, so a HISTORICAL 99.9% is
#                  the worst day in the window; the page greys such cells
#                  ("thin") rather than presenting them as quantiles
#   ewma_lambda    RiskMetrics decay; 0.94 = ~16-session half-life
#   headline       the number the strip leads with. EWMA because it is the
#                  only method that weights the current regime (and, today,
#                  the most conservative). var.py's docstring has the first
#                  backtest.
#   jump_flag      a one-day leg move beyond this is LISTED (kept, not dropped
#                  — tape.py's allow-list rule; only confirmed actions zero)
#   stress         today's dollars replayed through each episode; a leg not
#                  yet listed then contributes ZERO, and the page says how many
var:
  confidence: [0.95, 0.99, 0.999]   # 99.9% added 2026-10-25 (PM)
  windows: [250, 500]
  ewma_lambda: 0.94
  ewma_sessions: 500
  # Multi-day horizons (PM, 2026-10-25: "VaR for 1 week and 1 month as well"),
  # in SESSIONS. Each is shown three ways: historical overlapping windows over
  # up to horizon_lookback common sessions, EWMA x sqrt(h), and EWMA x
  # sqrt(h x VR) — VR the book's measured variance ratio, the headline,
  # because the spreads mean-revert and sqrt-time overstates.
  horizons:
    - {label: "1 week",  days: 5}
    - {label: "10 days", days: 10}
    - {label: "1 month", days: 21}
  horizon_lookback: 1250
  horizon_headline: ewma_vr
  headline: {method: ewma, confidence: 0.99}
  jump_flag: 0.25
  min_sessions: 60       # fewer common sessions -> no VaR for that snapshot (VAML listed 2026-06-15)
  stress:
    - {label: "GFC 2008-09",           start: "2008-09-01", end: "2009-03-31"}
    - {label: "COVID 2020",            start: "2020-02-15", end: "2020-04-30"}
    - {label: "Election result 2024",  start: "2024-06-03", end: "2024-06-05"}
    - {label: "Small-cap correction 2024-25", start: "2024-12-01", end: "2025-03-31"}

# ---------------------------------------------------------------------------
# case_bands: the range around a case's base (PM, 2026-10-18). Bear and bull
# are NOT hand-drawn. They are the base build moved mechanically on the PM's
# two inputs, so the range means "how wrong can these two numbers plausibly
# be" rather than a story per name — the only way it scales to ~100 names.
# PM: "Go with (a): fixed sector band, ±50bps margin and ±0.5pp growth for
# IT, carried convention."
#
#   margin_bps  every forecast quarter's EBIT margin moves by this, both ways
#   growth_pp   every forecast quarter's QoQ growth moves by this, so the
#               revenue LEVEL compounds (k-th forecast quarter x (1±g)^k)
#   carried     later years (no quarter build, e.g. FY28) scale by the same
#               EPS ratio as the forecast quarters — the street re-bases on the
#               new margin level after a print. Without it a Q3 move barely
#               reaches FY28 (±0.10pp per 10bps against ±0.41pp carried).
#
# Keyed by sector: every IT LARGECAP / IT MIDCAP leg reads `IT`; other groups
# read their own name (STEEL, CEMENT, ...). A sector with no band keeps
# hand-drawn bear/bull in its build.json until the PM sets one.
case_bands:
  IT: {margin_bps: 50, growth_pp: 0.5}
  # An EV/EBITDA sector's band takes per_t_inr (EBITDA/t, Rs, both ways) and
  # growth_pp (QoQ volume growth, compounding). PM, 2026-10-25: "set the
  # cement band at ±Rs50/t EBITDA/t and ±1pp volume growth".
  CEMENT: {per_t_inr: 50, growth_pp: 1.0}

# case_valuation: the multiple a sector's case agents run on (PM, 2026-10-25:
# "cement sector agents ... we will use EV/EBITDA instead of P/E. Process is
# similar, get latest valuations, select mean, draft earnings"). Unlisted
# sectors are P/E. The brief refuses a build whose `valuation` disagrees.
case_valuation:
  CEMENT: ev_ebitda
