# The Book tab / daily_review skill — configuration.
#
# ticker_map: the IMS ticker's FIRST TOKEN (before '=contract' / 'IS'/'IN') ->
# entity_id here. Seeded 2026-09-06 from the vault's
# `Portfolio Management/IMS-Spec.md` ticker table (PM-confirmed 2026-08-09) —
# a sourced mapping, not a guess. That spec keys the vault's folder names;
# the values here are THIS system's entity ids. Unrecognized tickers in a
# future snapshot: flag to the PM, do not guess.
#
# carry: desk-stated P&L a pair earned BEFORE its first stored snapshot (the
# chain can only see what was captured). Applied at display, flagged as
# carry, never mixed into the chained figure.
#   carry:
#     "IT 5": {pnl: 1250, since: "2026-07-01", note: "PM figure, pre-capture"}
#
# pnl_basis: contract_itd = the IMS per-ticker YTD PNL column, which resets
# when the ticker resets (roll) — book_io chains it. 'daily' would sum a
# day-P&L column instead; not the live convention.
pnl_basis: contract_itd

ticker_map:
  # EMS
  AMBER: amber
  SYRMA: syrma_sgs
  DIXON: dixon
  KAYNE: kaynes
  # IT
  TCS: tcs
  INFO: infosys
  WPRO: wipro
  HCLT: hcl_tech
  TECHM: tech_mahindra
  LTM: ltimindtree
  COFOR: coforge
  MPHL: mphasis
  PSYS: persistent
  TELX: tata_elxsi
  LTTS: ltts
  KPITT: kpit
  # Cement
  SRCM: shree
  UTCEM: ultratech
  ACEM: ambuja
  DALBH: dalmia
  DALBHARA: dalmia      # cash line prints the longer code (04-09-2026 export)
  # Steel
  TATA: tata_steel
  JINDA: jindal_steel
  JSTL: jsw_steel
  SAIL: sail
  APAT: apl_apollo      # not in IMS-Spec (predates the position); standard BBG
                        # code for APL Apollo Tubes, sits in the STEEL bucket
  # Mining
  NMDC: nmdc
  COAL: coal_india
  # Zinc / Aluminium
  HZ: hindustan_zinc
  VEDL: vedanta
  HNDL: hindalco
  NACL: nalco
  VAML: vaml

# pairs — THE PM'S OWN PAIR LIST, dictated 06-09-2026, names verbatim.
# This is the display truth: the IMS pair tags ("IT 5") are coarser clusters
# and stay internal. A leg may serve SEVERAL pairs (TCS long backs three
# shorts; DIXON short backs three longs) — the engine apportions a shared
# leg's DOLLARS across its pairs by the gross of the opposite side it hedges
# (TCS's P&L splits ~pro-rata across WPRO/INFO/HCLT shorts); price-%s need
# no apportioning. Tokens are the IMS ticker's first token.
pairs:
  IT LARGECAP:
    - {name: TCS_INFO,      long: [TCS],      short: [INFO]}
    - {name: TECHM_LTM,     long: [TECHM],    short: [LTM]}
    - {name: TCS_WPRO,      long: [TCS],      short: [WPRO]}
    - {name: TCS_HCLT,      long: [TCS],      short: [HCLT]}
  IT MIDCAP:
    - {name: COFORGE_PSYS,  long: [COFOR],    short: [PSYS]}
    - {name: LTTS_KPITTECH, long: [LTTS],     short: [KPITT]}
    - {name: LTTS_TELX,     long: [LTTS],     short: [TELX]}
    - {name: MPHL_PSYS,     long: [MPHL],     short: [PSYS]}
  STEEL:
    - {name: JSTL_TATA,     long: [JSTL],     short: [TATA]}
    - {name: JINDA_SAIL,    long: [JINDA],    short: [SAIL]}
    - {name: JSTL_APAT,     long: [JSTL],     short: [APAT]}
  EMS:
    - {name: KAYNES_DIXON,  long: [KAYNE],    short: [DIXON]}
    - {name: SYRMA_DIXON,   long: [SYRMA],    short: [DIXON]}
    - {name: AMBER_DIXON,   long: [AMBER],    short: [DIXON]}
  CEMENT:
    - {name: UTCEM_SRCM,    long: [UTCEM],    short: [SRCM]}
    - {name: DALBHARA_ACEM, long: [DALBHARA], short: [ACEM]}
  ZINC:
    - {name: VEDL_HZ,       long: [VEDL],     short: [HZ]}
  ALUMINIUM:
    - {name: HNDL_NACL,     long: [HNDL],     short: [NACL]}
    - {name: VAML_NACL,     long: [VAML],     short: [NACL]}
  MINING:
    - {name: COAL_NMDC,     long: [COAL],     short: [NMDC]}

# names: what the dashboard prints for each ticker token. The pair line is
# built from these as Long_Short (PM, 06-09-2026: "Coforge_Persistent").
