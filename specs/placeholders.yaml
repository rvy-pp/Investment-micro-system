# ============================================================================
# Placeholder pillar scores — the desk's explicit stand-ins for what cannot yet
# be measured. Every entry here is a DECISION, not a computation.
# ============================================================================
# THIS FILE EXISTS AGAINST THE GRAIN OF THE SYSTEM AND THAT IS THE POINT.
#
# CLAUDE.md invariant 7 is "withhold rather than guess", and combined.py says
# outright: "A withheld pillar is NOT scored 3.0 — the composite renormalises
# over the pillars that exist, so missing data cannot masquerade as neutral."
# A placeholder is exactly the thing those two rules forbid.
#
# So it is confined here, where it is:
#   - per entity and per pillar, never a global default
#   - git-tracked and diffable, so granting one shows up in a commit
#   - stamped with who granted it, when, and what ends it
#   - reported on EVERY run, and reported louder once overdue
#   - visible in the page, so a placeholder score is never read as a measured one
#
# What it must never become: a way to fill gaps generally. If this file grows a
# third entry, that is a signal the measurement layer is behind, not that the
# convention is working. Nothing reads this file except run_scores.py.
#
# HOW TO REVOKE ONE. Delete the block and re-run
# `python packages/score/run_scores.py`. The pillar returns to withheld and the
# composite renormalises over the rest, as if the placeholder had never existed.
# Nothing else has to be undone — placeholders are recomputed on every run, not
# accumulated.
# ============================================================================

spec_version: 0.1.0

guidance:

  # ========================================================================
  # VEDANTA — REVOKED 2026-08-25. Kept as a record, not as a grant.
  # ========================================================================
  # Granted by the PM 2026-08-24 because guidance_runrate declined: all three of
  # Vedanta's FY27 volume commitments are `ramp-dependent`, so there was no fixed
  # target to measure a run rate against.
  #
  # THE GAP IT FILLED HAS CLOSED, which is the whole lifecycle this file
  # describes. guidance_forward now scores Vedanta 3.86 from a measured basis —
  # a concall ledger of 20 due commitments at a 0.90 delivery rate, the highest
  # in the book, against a 0.75 peer median. That is exactly the "next Vedanta
  # concall" review_trigger the grant was written with, reached by a scorer that
  # can answer the forward question without a fixed target.
  #
  # It was ALSO inert by then, for a second and independent reason: guidance's
  # composite weight went to 0.00 the same day. Verified rather than assumed —
  # Vedanta's composite is 3.976256 with the grant and 3.976256 without.
  #
  # REVOKED RATHER THAN LEFT DORMANT. run_scores prefers a real score over a
  # placeholder, so this block had stopped affecting anything; but a grant that
  # sits in the file still prints on every run and still reads as a live decision
  # to anyone scanning it. Two dead grants and one live one is how this file stops
  # being legible. Nothing had to be unwound — placeholders are recomputed each
  # run, never accumulated.

  # Novelis. Kept in THIS block, not a second `guidance:` — a duplicate
  # top-level key is silent and last-wins, and when this file briefly had two it
  # deleted Vedanta's entry above without a word. One block per pillar.
  # INERT at the composite level since guidance went to weight 0.00 on
  # 2026-08-25 — verified, Novelis' composite is 3.000000 either way. KEPT
  # regardless, and not for the reason JSW's is kept: Novelis is a reporting unit
  # with ALL FOUR pillars on placeholders, so its composite comes from the
  # all-placeholder path rather than the renormaliser, and this entry is what
  # makes the guidance cell say "granted" instead of "withheld" on a name where
  # every cell is granted. Removing it would make one of four look measured.
  novelis:
    score: 3.0
    reason: >
      Novelis guides on EBITDA/t, which guidance_runrate.py does not model — it
      measures volume and per-unit targets against cited commitments.
    granted: 2026-08-25
    granted_by: PM
    review_trigger: next Novelis quarterly
    escalate_after_days: 120

  # ------------------------------------------------------------------------
  # JSW Steel — granted by the PM on 2026-08-25.
  # ------------------------------------------------------------------------
  # WHY IT IS WITHHELD, and it is the most benign reason in this file: JSW has no
  # OPEN commitment. Its one loaded commitment — coking coal cost inflation of
  # $12-15/t — is `status: missed`, resolved against a print of +$17/t. So the
  # scorer is not failing and no data is absent; the company simply has nothing
  # outstanding in the store to be scored on.
  #
  # It is also the only one here that will clear ITSELF. The next time management
  # guides anything numeric, JSW gets a real forward score off a 120-commitment
  # concall ledger — the largest track record of any name in the book, delivery
  # rate 0.73 against a peer median of 0.75. A measured score would land near
  # 2.9, i.e. very close to the 3.0 being granted, which is the strongest argument
  # for granting it: the placeholder is not papering over an unknown, it is
  # standing in for a number we can already estimate and simply have no open
  # commitment to attach to.
  #
  # WHAT THE 3.0 ACTUALLY CHANGES — checked, not assumed:
  #   composite withheld (renormalised over 3 pillars)  2.6006
  #   composite with guidance 3.0                       2.6605
  #   delta                                             +0.0599
  # It moves JSW from 4th to 3rd in the steel group, ahead of sail (2.53) and
  # jindal_steel (2.61) — so this is not cosmetic and the ordering it produces
  # should be read knowing one of the four inputs is a decision.
  #
  # THE HONEST COST, and it is the reason the composite renormalises in the first
  # place: JSW is now the ONLY steel name whose guidance is not measured, while
  # the other three are compared against each other on a real one. tata 3.34 and
  # sail 1.98 are earned; this 3.0 is granted. A reader comparing the column
  # cannot tell without the `placeholder` flag in the detail, which is exactly why
  # that flag exists and why this file is git-tracked.
  # !! INERT AS OF 2026-08-25, LATER THE SAME DAY. The PM zeroed guidance's
  # !! composite weight and redistributed its 0.15 equally, so renormalising over
  # !! three pillars and over four now give the SAME answer. Verified rather than
  # !! reasoned: JSW's composite is 2.636364 with this grant and 2.636364 without.
  # !!
  # !! This grant existed ONLY to stop the composite renormalising. At weight zero
  # !! it changes nothing, and its whole visible effect — moving JSW from 4th to
  # !! 2nd in the steel group — has reversed itself (JSW is now 4th at 2.63).
  # !!
  # !! SO IT IS A REVOCATION CANDIDATE, not something to leave reporting on every
  # !! run as though it mattered. It is kept for now rather than deleted because
  # !! guidance's weight is expected to come back once the concall "New
  # !! commitments" sections are ingested, at which point this becomes live again
  # !! and the reasoning below applies unchanged. Revoke it if that ingestion
  # !! lands and gives JSW a real open commitment — then it is both inert AND
  # !! unnecessary.
  jsw_steel:
    score: 3.0
    reason: >
      No OPEN commitment: JSW's only loaded guidance is status=missed (coking coal
      guided $12-15/t, printed +$17/t). Not a scorer failure and not missing data
      — nothing outstanding to score. Clears itself at the next numeric guide,
      when a 120-commitment concall ledger (0.73 delivery vs 0.75 peer median)
      gives a measured score near 2.9.
    granted: 2026-08-25
    granted_by: PM
    review_trigger: JSW's next numeric guidance, or ingestion of the concall
      "New commitments -> next quarter's scorecard" sections
    escalate_after_days: 120


# ============================================================================
# NOVELIS — neutral across the board. Granted by the PM 2026-08-25.
# ============================================================================
# Novelis has a complete economics spec and cannot be scored from it, because
# `al_scrap_midwest` has no source in the company's disclosure, in any free feed,
# or in the desk's BofA model — the model prices its raw material at LME. Three
# independent places, so this is a settled negative, not a pending fetch.
#
# Rather than leave it absent, it scores a flat 3.0. Consequences, stated so they
# are not discovered later:
#
#   SIZE      exactly 0. conviction() is (economics - 3) x ..., so a neutral
#             economics gives no position, which is the correct reading of "we
#             cannot price this yet" — not a small long, not a small short.
#   composite 3.0, and it is a PLACEHOLDER, rendered amber with a P in the page.
#             It must never be read as "the analysis says neutral".
#
# Novelis is is_tradeable: 0 with peer_group: null, so run_scores' main loop
# skips it. A second pass writes placeholder-only entities; see run_scores.py.
# It is a reporting unit, so it is not ranked against the tradeable names.
#
# WHAT ENDS THIS: the roll-up decision plus a re-spec onto the conversion spread
# (BofA's "Premium over LME": FY26 $2,417/t, FY27E $3,026/t, in
# specs/extracted/hindalco_bofa_model.json). At that point delete this block.
economics:
  novelis:
    score: 3.0
    reason: >
      al_scrap_midwest is unsourceable — absent from company disclosure, from
      every free feed, and from the BofA model, which prices raw material at LME.
      Neutral until the spec is moved onto the conversion spread.
    granted: 2026-08-25
    granted_by: PM
    review_trigger: re-spec onto can_sheet_spread / conversion spread
    escalate_after_days: 120

valuation:
  novelis:
    score: 3.0
    reason: >
      Not applicable — is_tradeable: 0, so there is no price and no EV. Neutral
      by construction rather than by measurement.
    granted: 2026-08-25
    granted_by: PM
    review_trigger: never — a reporting unit has no equity to value
    escalate_after_days: 3650

mood:
  novelis:
