# ============================================================================
# EMS — six entities, four scored, ZERO bridge lines by design
# ============================================================================
# Added 2026-08-30, PM instruction 2026-08-29: "Dixon, amber, kaynes, PGEL.
# Find a method to score them ... along the lines of 1 year fwd P/E
# valuations majorly and maybe some commodity prices. Self-valuation score is
# fine, other economics is difficult, if you can, figure something out."
#
# THE FIRST NON-COMMODITY SECTOR, and the departure is deliberate: these are
# converters. They earn a conversion margin on a largely pass-through cost
# stack, so a commodity margin bridge answers the wrong question — the exact
# APL Apollo finding ("a converter earns the tube/coil SPREAD"), at sector
# scale. P3 valuation is therefore the lead pillar, scored on FORWARD P/E
# (packages/score/valuation_pe.py, dispatched by pillar_3.metrics in
# specs/sectors/ems.yaml), with mood from the digests beside it. Economics
# and guidance withhold, honestly, and the composite renormalises (the
# steel_stainless precedent).
#
# WHY NO INPUT LINES, when copper/aluminium/HRC series sit right there in the
# store: every intensity would be UNSOURCED. The digests give margin
# COMMENTARY, not physical intensities — the best cost citation in 47 digests
# is PGEL's "gross contribution margin 15.9% -> 14.5% as raw materials hit
# 85.5% of revenue — driven by elevated copper, aluminium and resin prices
# plus rupee depreciation, with only partial pass-through" (PhillipCapital,
# digest 10-08-2026), which names the drivers and quantifies NONE of them per
# unit. A bridge built on guessed intensities would score, carry economics'
# 0.50 composite weight, and dominate the ranking with numbers nobody can
# defend — worse than the steel market_pct problem, which at least had one
# cited share. Withhold rather than guess. The citations above are the SEED
# for a future bridge if the desk models RAC input intensities; two of the
# named drivers (resin, copper-clad laminate) also have NO series at all, and
# per invariant 6 must not be proxied onto brent.
#
#   ems_assemblers   dixon, amber, kaynes, pg_electroplast
#                    The four F&O names (vault OI 2026-08-29: lots 50 / 100 /
#                    150 / 950, real OI rows, no not_in_fno marker). One peer
#                    group although their end-markets differ (mobiles/TVs,
#                    RAC components, industrial PCBA, RAC+durables), because
#                    the P3 raw is growth-adjusted relative cheapness and
#                    needs a cross-section; the digests treat them as one
#                    section (#EMS) and price them on the same multiple.
#
# syrma_sgs, avalon: peer_group null — NOT in F&O (vault OI: status
# not_in_fno on both), invariant 7. Prices, consensus captures and mood
# accumulate; no score, no pair leg. The digests cover both (Syrma 17 tagged
# bullets, Avalon 15), so the extraction layer tracks them from day one.

sector: ems
spec_version: 0.1.0
currency: INR

# No reference_entities: nothing here price_links a commodity series. The
# EMS tab still DISPLAYS the cost complex (lme_copper, lme_aluminium,
# hrc_india_inr, usdinr, brent) via engine.SECTORS — "maybe some commodity
# prices" lands as context on the tab, not as unsourced arithmetic in the
# score.
reference_entities: []

entities:
