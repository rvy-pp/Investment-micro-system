# ============================================================================
# Aluminium — entity roster, pillars 1 and 2 (ASP and costs)
# ============================================================================
# Each company is described by what it SELLS (P1 ASP) and what it CONSUMES
# (P2 costs). Direction is arithmetic, not a coefficient.
#
# Only the input lines that move the needle are modelled — alumina, power/coal
# and anode are ~85% of a smelter's cash cost. Bauxite, caustic soda and pitch
# were dropped in v0.4.0: they added parameters, not accuracy, and every extra
# `verify: pending` intensity is a place for the model to be quietly wrong.
#
# `market_pct` is the field that does the work:
#   NALCO smelter alumina  market_pct 0.00  + an alumina_surplus OUTPUT line
#                                           => alumina up is REVENUE
#   VAML  smelter alumina  market_pct 0.25  + no surplus line
#                                           => alumina up is COST
#   HNDL  smelter alumina  market_pct 0.05  + a small surplus line
#                                           => alumina up is near-NEUTRAL, mildly +
#
# ---------------------------------------------------------------------------
# !! `verify: pending` means the number came from sector knowledge, NOT from a
# !! filing. These are the numbers to attack. The schema refuses any line whose
# !! source_note is empty, so provenance cannot be silently dropped.
# ---------------------------------------------------------------------------

# POST-DEMERGER. Record date 1 May 2026; four entities listed June 2026.
# VAML (Vedanta Aluminium Metal Ltd) is separately listed and directly
# tradeable, so aluminium_primary is nalco / hindalco / vaml — and the flagship
# NALCO/VAML alumina pair is now undiluted.
# VEDL is the residual holding ~63.4% of Hindustan Zinc plus Zinc International,
# Copper, Ferro Chrome and Nickel. It moves to the `zinc` peer group. Its holdco
# discount is handled as a valuation metric in P3, NOT as a separate model.

sector: aluminium
spec_version: 0.4.0
currency: INR

# ============================================================================
# PRICE SERIES these economics link to (non-tradeable reference entities)
# ============================================================================
reference_entities:
  - {id: lme_aluminium,          kind: commodity, name: LME Aluminium 3M,        unit: USD/t}
  - {id: alumina_index,          kind: commodity, name: Alumina FOB Australia,   unit: USD/t}
  - {id: bauxite,                kind: commodity, name: Bauxite,                 unit: USD/t}
  - {id: thermal_coal_eauction,  kind: commodity, name: Coal India e-auction,    unit: INR/t}
  - {id: cp_coke,                kind: commodity, name: Calcined Petroleum Coke, unit: USD/t}
  - {id: coal_tar_pitch,         kind: commodity, name: Coal Tar Pitch,          unit: USD/t}
  - {id: caustic_soda,           kind: commodity, name: Caustic Soda,            unit: USD/t}
  - {id: usdinr,                 kind: fx,        name: USDINR,                  unit: INR/USD}
  - {id: al_scrap_midwest,       kind: commodity, name: US Midwest scrap discount, unit: USD/t}
  - {id: can_sheet_spread,       kind: commodity, name: Can sheet conversion spread, unit: USD/t}
  - {id: lme_zinc,               kind: commodity, name: LME Zinc 3M,             unit: USD/t}
  - {id: silver,                 kind: commodity, name: Silver,                  unit: USD/oz}
entities:

  # ============================================================================
  # NALCO — the alumina-surplus name
  # ============================================================================
  - id: nalco
    kind: company
    name: National Aluminium Company
    sector: aluminium
    peer_group: aluminium_primary
    nse_symbol: NATIONALUM
    effective_from: 2026-04-01

    outputs:
      - item: aluminium_ingot
        price_link: lme_aluminium
        volume: 460000
        volume_unit: t
        asp_premium: 120          # domestic premium over LME
        asp_premium_unit: USD/t
        source_note: "Angul smelter nameplate ~460kt"
        verify: pending

      - item: alumina_surplus
        price_link: alumina_index
        volume: 1250000
        volume_unit: t
        asp_premium: 0
        source_note: "Damanjodi refinery ~2,275kt less smelter requirement ~890kt"
        verify: pending           # THE most important number for NALCO. External
                                  # alumina tonnage sets the entire alumina beta.

    inputs:
      - item: alumina
        price_link: alumina_index
        intensity: 1.93
        intensity_unit: t/t
        basis_item: aluminium_ingot
        market_pct: 0.00          # own refinery: internal transfer, not a cash market cost
        source_note: "Standard Hall-Heroult ratio; NALCO fully integrated on alumina"
        verify: pending

      - item: thermal_coal_eauction
        price_link: thermal_coal_eauction
        intensity: 9.90
        intensity_unit: t/t
        basis_item: aluminium_ingot
        market_pct: 1.00          # NO operational captive coal — full e-auction exposure.
                                  # This is why NALCO has the group's highest coal beta.
        source_note: "~14,200 kWh/t at ~0.70 kg coal/kWh; Utkal blocks not yet contributing"
        verify: pending

      - item: cp_coke
        price_link: cp_coke
        intensity: 0.40
        intensity_unit: t/t
        basis_item: aluminium_ingot
        market_pct: 1.00
        source_note: "Anode consumption per tonne metal"
        verify: pending

    notes: >
      Cleanest USDINR beneficiary in the group: USD-linked realisations on both
      products against an almost entirely INR cost base. Also the highest
      operating leverage to a coal cost spike, for the same reason.

  # ============================================================================
  # HINDALCO — integrated India, plus Novelis as a separate reporting unit
  # ============================================================================
  - id: hindalco
    kind: company
    name: Hindalco Industries
    sector: aluminium
    peer_group: aluminium_primary
    nse_symbol: HINDALCO
    effective_from: 2026-04-01

    outputs:
      - item: aluminium_ingot
        price_link: lme_aluminium
        volume: 1300000
        volume_unit: t
        asp_premium: 150
        asp_premium_unit: USD/t
        source_note: "India primary metal capacity"
        verify: pending

      - item: alumina_surplus
        price_link: alumina_index
        volume: 300000
        volume_unit: t
        source_note: "Modest external alumina sales after internal requirement"
        verify: pending           # if Hindalco is a larger net alumina seller than
                                  # this, its alumina beta rises toward NALCO's

    inputs:
      - item: alumina
        price_link: alumina_index
        intensity: 1.93
        intensity_unit: t/t
        basis_item: aluminium_ingot
        market_pct: 0.05          # broadly self-sufficient => alumina spike is
                                  # near cost-neutral, unlike VAML
        source_note: "Integrated bauxite and alumina; minimal third-party purchase"
        verify: pending

      - item: thermal_coal_eauction
        price_link: thermal_coal_eauction
        intensity: 9.60
        intensity_unit: t/t
        basis_item: aluminium_ingot
        market_pct: 0.45          # captive coal blocks damp e-auction exposure —
                                  # roughly half NALCO's coal beta
        source_note: "Captive blocks (Dumri, Chakla etc.) cover a material share"
        verify: pending

      - item: cp_coke
        price_link: cp_coke
        intensity: 0.40
        intensity_unit: t/t
        basis_item: aluminium_ingot
        market_pct: 1.00
        source_note: "Anode consumption per tonne metal"
        verify: pending

    notes: >
      Do NOT treat Hindalco as an LME proxy. Novelis is close to half of
      earnings and is driven by can-sheet conversion spreads and the US scrap
      discount, with LME largely passed through. Modelled separately below.

  - id: novelis
    kind: reporting_unit
    name: Novelis (Hindalco downstream)
    parent_id: hindalco
    is_tradeable: false
    peer_group: null
    effective_from: 2026-04-01

    outputs:
      - item: flat_rolled_products
        price_link: can_sheet_spread
        volume: 3700000
        volume_unit: t
        source_note: "Annual shipments; economics are CONVERSION spread, not LME level"
        verify: pending

    inputs:
      - item: aluminium_scrap
        price_link: al_scrap_midwest
        intensity: 0.62
        intensity_unit: t/t
        basis_item: flat_rolled_products
        market_pct: 1.00
        source_note: "Recycled content share of inputs; scrap DISCOUNT widening is margin-positive"
        verify: pending

      - item: aluminium_primary
        price_link: lme_aluminium
        intensity: 0.40
        intensity_unit: t/t
        basis_item: flat_rolled_products
        market_pct: 1.00
        source_note: "Primary metal top-up; largely passed through to customers"
        verify: pending

    notes: >
      Structurally different from a smelter: a converter. LME moves both its
      revenue and its cost and mostly nets out, which is exactly why lumping it
      into Hindalco's LME beta overstates Hindalco's commodity sensitivity.

  # ============================================================================
  # VAML — post-demerger, a separately listed aluminium pure play
  # ============================================================================
  # Was a reporting_unit under VEDL in spec 0.2.0. The demerger makes it directly
  # tradeable, which is a strict improvement for this peer group: the alumina
  # trade no longer has to be expressed through a holdco at ~42% weight. NALCO
  # vs VAML is now a clean, undiluted alumina pair.
  # ============================================================================
  - id: vaml
    kind: company
    name: Vedanta Aluminium
    sector: aluminium
    peer_group: aluminium_primary
    nse_symbol: NEEDS_CONFIRMATION      # post-demerger listing symbol
    effective_from: 2026-04-01

    outputs:
      - item: aluminium_ingot
        price_link: lme_aluminium
        volume: 2400000
        volume_unit: t
        asp_premium: 130
        asp_premium_unit: USD/t
        source_note: "Jharsuguda ~1,800kt + BALCO ~570kt"
        verify: pending
      # NOTE: no alumina_surplus line. This absence, not a negative coefficient,
      # is what makes VAML lose on an alumina spike.

    inputs:
      - item: alumina
        price_link: alumina_index
        intensity: 1.93
        intensity_unit: t/t
        basis_item: aluminium_ingot
        market_pct: 0.25          # REVISED DOWN from 0.50 on evidence, 2026-08-15.
                                  # Lanjigarh (3.5 mtpa, expanding to 5.0) came across
                                  # WITH the demerged entity. Metal ~2.4 mtpa needs
                                  # ~4.6 mt alumina, so self-sufficiency is ~76%, not
                                  # ~50%. Still a net BUYER, so the sign of the NALCO
                                  # pair is unchanged — but the size roughly halves.
        source_note: >
          Derived: Lanjigarh 3.5 mtpa capacity vs 2.4 mtpa metal x 1.93 t/t = 4.63 mt
          requirement. Source: lightmetalage.com demerger coverage, 2026.
        verify: pending           # CAPACITY, not output. Lanjigarh has historically
                                  # run below nameplate on bauxite availability, so
                                  # true market_pct may be higher. Confirm actual
                                  # alumina production from the Information Memorandum.
        watch: >
          Lanjigarh 3.5 -> 5.0 mtpa would take VAML past self-sufficiency and could
          flip its alumina sign from cost to revenue, which would invert the flagship
          NALCO/VAML pair. This is a guidance-pillar item, not a static assumption.

      - item: thermal_coal_eauction
        price_link: thermal_coal_eauction
        intensity: 9.80
        intensity_unit: t/t
        basis_item: aluminium_ingot
        market_pct: 0.70
        source_note: "Partial captive coal; majority still linkage/e-auction"
        verify: pending

      - item: cp_coke
        price_link: cp_coke
        intensity: 0.40
        intensity_unit: t/t
        basis_item: aluminium_ingot
        market_pct: 1.00
        source_note: "Anode consumption per tonne metal"
        verify: pending

    notes: >
      Highest volume in the group and the most alumina-exposed on the cost side,
      so the natural short leg against NALCO on an alumina squeeze — and now
      directly tradeable, so that trade carries no holdco dilution.
      Post-demerger open items, all flagged for confirmation: the listing symbol;
      whether BALCO came across with Jharsuguda; how much Lanjigarh alumina VAML
      retains, which sets `market_pct` and therefore the entire short thesis; and
      what debt was pushed down in the split.

  # ============================================================================
  # peer_group: zinc — Hindustan Zinc (opco) vs Vedanta Ltd (holdco)
  # ============================================================================
  # Post-demerger VEDL is a holdco whose principal asset is its HZL stake, so
  # the pair you trade is opco vs holdco.
  #
  # The critical consequence: BOTH LEGS CARRY THE SAME ZINC EXPOSURE, so zinc
  # largely cancels in the spread. This is NOT a commodity trade. Running the
  # margin bridge on it produces ~zero and would report "no trade" every day for
  # entirely the wrong reason — which is why `structure` selects the L1 model.
  # The tradeable variable is the HOLDCO DISCOUNT and what moves it.
  # ============================================================================
  - id: hindustan_zinc
    kind: company
    name: Hindustan Zinc
    sector: aluminium            # coverage bucket
    peer_group: zinc             # NOT rankable against the aluminium names
    nse_symbol: HINDZINC
    effective_from: 2026-04-01

    outputs:
      - item: refined_zinc
        price_link: lme_zinc
        volume: 820000
        volume_unit: t
        source_note: "Refined zinc production"
        verify: pending
      - item: silver_byproduct
        price_link: silver
        volume: 22000000
        volume_unit: oz
        source_note: "Silver is a material earnings contributor, not a rounding item"
        verify: pending

    inputs:
      - item: thermal_coal_eauction
        price_link: thermal_coal_eauction
        intensity: 4.20
        intensity_unit: t/t
        basis_item: refined_zinc
        market_pct: 0.60
        source_note: "Smelting and captive power coal"
        verify: pending

    overhangs:
      - holdco_dividend_pull        # VEDL still needs cash up from HZL
      - goi_residual_stake_ofs
    notes: >
      The operating leg of the zinc pair. Kept in the aluminium coverage bucket
      because you cover it, scored in its own peer group — ranking it against
      Hindalco would compare an LME-zinc name to an LME-aluminium name and call
      the difference signal.

  # ============================================================================
  # VEDANTA LTD — post-demerger holdco. structure: holdco, NOT operating.
  # ============================================================================
  - id: vedanta
    kind: company
    structure: holdco             # => NAV / discount model, not the margin bridge
    name: Vedanta Ltd
    sector: aluminium             # coverage bucket
    peer_group: zinc              # paired against HZL
    nse_symbol: VEDL
    effective_from: 2026-04-01

    # Modelled with the SAME four pillars as everything else. The earlier draft
    # gave it a bespoke sum-of-parts NAV model; that was over-engineering. Its
    # zinc and silver exposure is HZL's, scaled by the stake — which is exactly
    # why it "moves with zinc but is stable" relative to HZL.
    stake_in:
      hindustan_zinc: 0.634
    verify: pending               # ~63.4% per demerger coverage; confirm

    outputs:
      - item: refined_zinc
        price_link: lme_zinc
        volume: 520000            # = HZL volume x 63.4% look-through
        volume_unit: t
        source_note: "Look-through of ~63.4% HZL stake"
        verify: pending

      - item: silver_byproduct
        price_link: silver
        volume: 13900000          # = HZL silver x 63.4%
        volume_unit: oz
        source_note: "Look-through of ~63.4% HZL stake"
        verify: pending           # the KEY divergence vs HZL: VEDL gets less
                                  # silver per rupee of market cap, which is why
                                  # HZL outperforms when silver leads

    # Copper / ferro chrome / nickel are NOT bridge lines. They have no clean
    # daily benchmark, they do not move the stock day to day, and carrying them
    # as a permanently-unpriced line was suppressing VEDL's score entirely.
    # They belong in P3 as event-driven catalysts — see event_drivers below.
    event_drivers:
      - id: copper
        layer: P3
        note: Smelter restart, custom TC/RC swings, expansion news
      - id: ferro_chrome
        layer: P3
        note: Contract pricing rounds, ban or duty headlines
      - id: nickel
        layer: P3
        note: Rarely material; include only on a discrete event
    event_driver_rule: >
      These enter as a mood/interest input ONLY when a dated event exists. They
      never contribute a continuous margin delta, so they cannot quietly drift
      the score in the absence of news — which is the same discipline as the
      rest of the system: silence changes nothing.

    overhangs:                    # Layer 2. For this pair they ARE the thesis.
      - holdco_discount_rerate
      - promoter_pledge
      - brand_fee_and_dividend_extraction
      - further_demerger_steps

    notes: >
      VEDL is, in substance, a LOW-BETA HINDUSTAN ZINC. Same zinc and silver
      exposure, damped — and the damping is arithmetic, not an assumption:

        zinc EBITDA share of VEDL = (HZL EBITDA x 63.4%) / VEDL EBITDA
                                  = (16,000 x 0.634) / 12,000 = 84.5%

      so VEDL should move ~0.85x HZL on a zinc or silver print. The engine
      reports this beta on every zinc run so the claim stays checkable.

      >> base_ebitda IS THE BETA. If VEDL's non-zinc EBITDA is larger than
      >> assumed, the beta falls; if smaller, it approaches 1.0 and the pair
      >> stops working. Tune the beta by correcting base_ebitda, never by
      >> inserting a fudge factor. <<

      Two things deliberately NOT in the bridge: the holdco discount (a P3
      valuation metric) and copper / ferro chrome / nickel (P3 event drivers).
