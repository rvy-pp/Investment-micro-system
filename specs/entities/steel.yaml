# ============================================================================
# Steel — entity roster, pillars 1 and 2 (ASP and costs)
# ============================================================================
# Added 2026-08-25. Seven names, the vault's Coverage/Steel roster. Same shape
# as aluminium.yaml: each company is described by what it SELLS and what it
# CONSUMES, and direction falls out of arithmetic rather than a coefficient.
#
# ---------------------------------------------------------------------------
# THE ONE THING THIS SPEC EXISTS TO EXPRESS
# ---------------------------------------------------------------------------
# Iron ore is CAPTIVE for Tata and SAIL and BOUGHT by JSW. Coking coal is
# imported by everyone. So the same iron ore print moves the four mills
# differently while the same coking coal print moves them all the same way —
# which means coking coal sets the sector's level and IRON ORE CAPTIVITY sets
# the dispersion. That is `market_pct` doing exactly the job it does on alumina,
# where NALCO's captive refinery makes an alumina rally revenue and VAML's
# purchases make it cost.
#
# APL Apollo WAS BELIEVED to invert the OUTPUT line — it buys hot-rolled coil and
# sells tubes, so rising HRC "must" be a cost to it and revenue to every mill, the
# cleanest mirror pair in the sector.
#
# !! THAT CLAIM IS REFUTED, 2026-08-26, and it was the headline of this file. Over
# !! three years of weekly returns APL Apollo loads +0.103 on hrc_india_inr while
# !! tata_steel loads +0.076 and jsw_steel +0.109 — SAME SIGN, same size, excess
# !! over the mills +0.011. A short-coil leg reads NEGATIVE. It does not, on any
# !! window tested. It passes coil through on brand pricing power.
# !!
# !! Left visible rather than deleted, because the reasoning was sound and the
# !! conclusion was still wrong: "it buys coil, therefore it is short coil" is
# !! correct about the physical flow and wrong about the equity. A structural
# !! argument about a cost stack is a HYPOTHESIS about an exposure, not evidence
# !! of one — and this spec asserted it as the sector's sharpest trade.
# !!
# !! packages/review/driver_beta.py is the instrument. Run it before believing the
# !! next structural story, including the ore-captivity one above, which has NOT
# !! yet been tested this way.
#
# ---------------------------------------------------------------------------
# !! `verify: pending` MEANS SECTOR KNOWLEDGE, NOT A FILING. Those are the
# !! numbers to attack. In this file the pending values are the INTENSITIES and
# !! most of the CAPTIVE SHARES, and the captive shares are the ones that matter
# !! — they are what separates the four mills from each other. Only two are
# !! cited anywhere in the 48 digests, both for Jindal Steel and JSW, both
# !! FORWARD-looking. See the market_pct note on each line.
# ---------------------------------------------------------------------------

sector: steel
spec_version: 0.2.0        # 0.1.0 -> 0.2.0: SAIL split 50/50 flat/long,
                           # which changed its output STRUCTURE and not just a
                           # number. Bumped because the co-product workaround
                           # (duplicated input lines) is a structural contract
                           # a reader must not consolidate away.
currency: INR

# ============================================================================
# PRICE SERIES these economics link to
# ============================================================================
# THE UNIT STRING IS LOAD-BEARING. `bridge.to_inr()` applies the USDINR leg only
# when the unit starts with "USD"; an unregistered series falls through with NO
# FX leg and is silently understated by ~95x. That cost a 95x error on zinc once
# already (see aluminium.yaml's lme_zinc note), so every series used below is
# registered here with its unit spelled out.
reference_entities:
  # --- outputs, and note these are QUOTED IN RUPEES ---
  - {id: hrc_india_inr,             kind: commodity, name: HRC 2.5mm India,            unit: INR/t}
  - {id: rebar_india_primary_inr,   kind: commodity, name: Primary rebar 12mm India,   unit: INR/t}
  # --- inputs, quoted in dollars, so each carries the FX leg ---
  - {id: iron_ore_china_cfr62,      kind: commodity, name: Iron ore fines 62% CFR China, unit: USD/t}
  - {id: coking_coal_spot_aus,      kind: commodity, name: Hard coking coal spot FOB Australia, unit: USD/t}
  - {id: thermal_coal_seaborne,     kind: commodity, name: Richards Bay thermal coal,  unit: USD/t}
  - {id: usdinr,                    kind: fx,        name: USDINR,                     unit: INR/USD}

# ============================================================================
# THE FX ASYMMETRY, and it runs the OPPOSITE WAY TO ALUMINIUM
# ============================================================================
# aluminium.yaml's fx_handling note says a weaker INR is "a revenue tailwind on
# USD-linked outputs against an INR cost base". Steel is the mirror image:
# revenue is quoted in RUPEES (hrc_india_inr, rebar_india_primary_inr) while the
# two largest cost lines are quoted in DOLLARS. So in this bridge a weaker INR
# is pure cost inflation with no offsetting revenue leg.
#
# THAT IS AN OVERSTATEMENT OF THE REAL EXPOSURE, and it is recorded rather than
# hidden. Indian HRC is priced off import parity, so a weaker rupee does lift the
# rupee HRC print — with a lag, and incompletely. The bridge cannot see that,
# because it reads the INR series directly and only registers the move once the
# print actually moves.
#
# DO NOT "FIX" THIS BY REPOINTING THE OUTPUT AT hrc_india_usd. That would create
# the opposite error — a full, instant FX pass-through — and it would also change
# what the series measures. The honest handling is the one used for coal:
# an explicit pass-through fraction on the input side, which is what
# `basis_pass_through` below is for. Setting it is a PM decision, not a guess.

# ============================================================================
# WHY IRON ORE CARRIES A basis_pass_through AT ALL
# ============================================================================
# Same reason thermal coal does in aluminium.yaml. Indian mills do not buy
# seaborne ore — they buy DOMESTIC ore, largely from NMDC at administered prices,
# and those do not move one-for-one with CFR China. The digests show the two
# diverging inside a single quarter:
#
#   "costlier iron ore (NMDC hikes +18% QoQ)"        Morgan Stanley, 2026-07-08
#   "Iron ore 62% Fe stable ~$93/t"                  Nomura, week to 2026-07-10
#
# An 18% domestic hike against a flat benchmark. Applying a CFR China delta at
# face value would therefore have read roughly nothing in a quarter when domestic
# ore cost rose sharply — a plausible number, no warning, wrong answer. Every ore
# line below carries the fraction explicitly.
#
# 0.50 is a PLACEHOLDER and is flagged `verify: pending` on every line. The
# aluminium coal analogue sits at 0.35 and is itself still provisional.

# ============================================================================
# WHERE THE INTENSITIES AND CAPTIVE SHARES COME FROM — revised 2026-08-25
# ============================================================================
# Both were sector-knowledge guesses in v0.1.0. Both now have sources, and the
# two sources are of completely different kinds, which matters.
#
# INTENSITIES: from the desk's Tata Steel model, data/models/tata_steel_*.xlsx,
# `Input` sheet rows 10-11.
#
#     iron ore     1.70 t/t   (was 1.60)
#     coking coal  0.70 t/t   (unchanged — the guess was exactly right)
#
# Held CONSTANT across FY03..FY29E in the model, which is the point: these are
# process constants for the blast-furnace route, not annual estimates. Applied to
# all four mills, because the route is the same.
#
# The model was checked rather than trusted, and it reconciles TO THE RUPEE
# across four separate years:
#
#     Total RM cost US$/t  =  1.70 x iron_ore  +  0.70 x coking_coal
#     FY25  1.70x102.08 + 0.70x210.22 = 320.69   model 320.69   diff 0.000
#     FY26  1.70x101.85 + 0.70x200.63 = 313.59   model 313.59   diff 0.000
#     FY27E 1.70x101.00 + 0.70x237.50 = 337.95   model 337.95   diff 0.000
#     FY28E 1.70x 96.50 + 0.70x250.00 = 339.05   model 339.05   diff 0.000
#
# !! NOTE WHAT IS ABSENT FROM THAT IDENTITY: there is NO market_pct, NO captive
# !! adjustment, NO basis_pass_through. The model prices raw material at 100%
# !! BENCHMARK for every name and lets a separate `Conversion margin` input
# !! (US$177-187/t) absorb everything company-specific — captive advantage
# !! included. It is a STEEL-SPREAD model, not a cost-attribution model.
# !!
# !! So THE MODEL CANNOT SUPPLY market_pct. It does not have the concept. Do not
# !! read its 100%-market treatment as a claim that captivity does not matter;
# !! read it as the captive advantage being folded into conversion margin. This
# !! bridge makes the opposite choice deliberately, because per-company captive
# !! share is the entire source of dispersion (see the header above).
#
# CAPTIVE SHARES: from public disclosure, not from the model.
#
#     Tata Steel iron ore    "meets its entire iron ore demand from its six
#                            captive mines" — Noamundi, Katamati, Joda East,
#                            Khondbond, Vijaya II, Koida. Tata Steel integrated
#                            report. => 100% CAPTIVE.
#     Tata Steel coking coal ~78% imported, ~12-13 mtpa, mainly Australia; ~22%
#                            from captive West Bokaro and Jharia.
#     SAIL iron ore          own mines in Jharkhand/Odisha; still uncited.
#     JSW / Jindal Steel     forward targets only — JSW "~50% captive iron ore
#                            post-2030", Jindal "targeted ~40% by FY27-end".
#
# ============================================================================
# !! A FULLY CAPTIVE MINE IS NOT ZERO-EXPOSED TO THE ORE PRICE. ROYALTY IS AD
# !! VALOREM, AND THIS IS WHY market_pct ON THE ORE LINES IS 0.20 AND NOT 0.00.
# ============================================================================
# This was the real error in v0.1.0, and it was a conceptual one rather than a
# wrong estimate. Tata and SAIL were set to market_pct 0.05 on the reasoning
# "captive, therefore ~no market exposure", by analogy with NALCO's captive
# alumina at 0.00. THE ANALOGY DOES NOT HOLD, because Indian mineral royalty is
# a PERCENTAGE OF THE BENCHMARK PRICE, not a fixed fee:
#
#     royalty  15% of the IBM Average Sale Price   (MMDR Act, 2nd Schedule)
#     DMF      30% of royalty on a captive lease
#     NMET      2% of royalty
#     ---------------------------------------------------------------
#     total    15% x 1.32 = ~19.8% of ASP, moving one-for-one with ASP
#
# The Supreme Court upheld in July 2026 that royalty, DMF and NMET are themselves
# included in the sale value used to compute ASP — "royalty on royalty" — which
# grosses the figure up slightly rather than reducing it.
#
# So when the benchmark ore price rises 10%, a 100%-captive miner's statutory
# cost rises 10% on ~20% of the ore value. Its effective exposure is ~0.20, not
# ~0.00. NALCO's captive alumina genuinely IS ~0.00 because an internal transfer
# of a processed intermediate carries no ad valorem levy; a MINE does.
#
# market_pct IS THEREFORE NOW DERIVED, not freehand:
#
#     market_pct = captive_share x 0.20  +  (1 - captive_share) x 1.00
#
#     tata_steel     captive 1.00  ->  0.20      (was 0.05)
#     sail           captive 1.00  ->  0.20      (was 0.05)
#     jsw_steel      captive 0.25  ->  0.80      (was 0.75)
#     jindal_steel   captive 0.25  ->  0.80      (was 0.75)
#
# UPDATE `captive_share` AND RE-DERIVE; do not hand-edit market_pct. The 0.20
# coefficient is sourced and stable; the captive shares are the estimates.
#
# CONSEQUENCE FOR THE FLAGSHIP PAIR, and it cuts against the spec's own story:
# the Tata-vs-JSW ore gap NARROWS from 0.70 to 0.60, so the pair carries ~14%
# less ore content than v0.1.0 claimed. Partly offset by the intensity going
# 1.60 -> 1.70 (+6.25%). Net, the pair is modestly weaker and the numbers in
# `specs/sectors/steel.yaml` validation.test_1 were re-run rather than left.

entities:

  # ==========================================================================
  # TATA STEEL — the captive-ore name. India only.
  # ==========================================================================
  # The spec lines are India upstream: India HRC/long volumes, India iron ore,
  # imported coking coal. Europe is NOT modelled and has no lines, exactly as
  # Novelis is excluded from Hindalco's upstream spec. base_financials carries a
  # separate `valuation_ebitda` for P3 because EV is whole-company.
  - id: tata_steel
    kind: company
    name: Tata Steel
    sector: steel
    peer_group: steel_integrated
    nse_symbol: TATASTEEL
    effective_from: 2026-04-01

    outputs:
      - item: hrc
        price_link: hrc_india_inr
        volume: 20680000          # 5.17 mnt Q1FY27 India SALES x 4.
        volume_unit: t
        asp_premium: 0
        source_note: >
          "India crude steel 5.82mnt +11% YoY (-6% QoQ), India sales 5.17mnt
          +9% YoY (-16% QoQ)" (Morgan Stanley, Rahul Gupta, digest 2026-07-08).
          SALES not production — the realised tonne is what carries a price.
        verify: sourced
        # !! THIS VOLUME AND base_ebitda MUST STAY ON THE SAME BASIS. base_ebitda
        # is 5.17mt x Rs18,199/t x 4. Using an FY27 GUIDANCE tonnage here against
        # a Q1-annualised denominator would inflate pct_of_ebitda by the ratio of
        # the two — the same numerator/denominator basis error VEDL's caveat
        # warns about. If one changes, change both.

    inputs:
      - item: iron_ore
        price_link: iron_ore_china_cfr62
        intensity: 1.70
        intensity_unit: t/t
        basis_item: hrc
        market_pct: 0.20          # ~FULLY CAPTIVE. Tata's Noamundi/Joda mines
                                  # cover essentially all of India's requirement,
                                  # which is the single most important structural
                                  # fact about the name and the reason it is the
                                  # long leg of an ore-driven pair.
        basis_pass_through: 0.50
        source_note: >
          Captivity is corroborated only indirectly: "Competition intensifies
          from Tata Steel/JSW captive mines, Lloyds Metals" (Ambit on NMDC), and
          Avendus flags "Captive iron-ore lease expiry CY30 a cost risk" — a
          lease that would not be a risk if it were not supplying the plants.
          No digest states the SHARE.
        verify: pending           # ATTACK THIS FIRST. 0.05 vs 0.00 barely
                                  # matters; 0.05 vs 0.40 changes the sign of
                                  # Tata's ore sensitivity.

      - item: coking_coal
        price_link: coking_coal_spot_aus
        intensity: 0.70
        intensity_unit: t/t
        basis_item: hrc
        market_pct: 0.78          # SOURCED 2026-08-25: Tata imports ~78% of its
                                  # coking coal (~12-13 mtpa, mainly Australia);
                                  # the remaining 22% comes from the captive
                                  # West Bokaro and Jharia mines. Was 0.80 as a
                                  # guess and happened to be close.
        basis_pass_through: 1.00  # 1.00, NOT a fraction, and deliberately unlike
                                  # the ore and thermal lines. Imported coking
                                  # coal IS bought at the seaborne benchmark, so
                                  # there is no domestic administered basis to
                                  # discount. Do not "harmonise" these to one
                                  # number.
        source_note: >
          SOURCED: Tata imports ~78% of its coking coal requirement, ~12-13 mtpa,
          mainly from Australia; the balance comes from the captive West Bokaro
          and Jharia mines.

          AND THE NOMURA CROSS-CHECK RESOLVES, which it appeared not to. Nomura:
          "Every USD10/t increase = USD7-9/t EBITDA impact — JSW Steel and Tata
          Steel most exposed". An earlier version of this note compared that to
          0.70 x 0.78 = 0.55 t/t, i.e. USD5.5/t, and concluded "the intensity,
          the captive share, or both are conservative here."

          THAT COMPARISON WAS WRONG — it put a NET number against a GROSS one.
          0.70 t/t x 1.00 = USD7.0/t per USD10/t, which is EXACTLY Nomura's lower
          bound, so Nomura is quoting the coke-rate effect gross of captive
          supply. The upper bound of 9 implies a ~0.9 t/t coke rate, consistent
          with PCI and coke-oven losses included. There was never an
          inconsistency to fix; the intensity is right and so is the captive
          share. Recorded because the false alarm nearly caused a real number to
          be "corrected" to fit a mismatched comparison.
        verify: pending

  # ==========================================================================
  # JSW STEEL — the ore-BUYING name. The short leg of the flagship ore pair.
  # ==========================================================================
  - id: jsw_steel
    kind: company
    name: JSW Steel
    sector: steel
    peer_group: steel_integrated
    nse_symbol: JSWSTEEL
    effective_from: 2026-04-01

    outputs:
      - item: hrc
        price_link: hrc_india_inr
        volume: 24840000          # DERIVED, not cited: India EBITDA/t Rs15,110
        volume_unit: t            # against ~Rs93.8bn of quarterly EBITDA implies
        asp_premium: 0            # 6.21 mt/qtr, x4 = 24.84 mt.
        source_note: >
          DERIVED the same way VAML's share count is derived — from a cited ratio
          rather than a cited level, because no digest gives JSW's absolute India
          tonnage. Rs93,800 cr-equivalent quarterly EBITDA / Rs15,110 per tonne
          = 6.21 mt, x4. Cross-check: consistent with JSW's ~28 mtpa India
          capacity at high utilisation, and with "JSW +10% YoY" volume growth
          (Morgan Stanley). It assumes India EBITDA ~ consolidated EBITDA, which
          holds only while the overseas plates/pipes operations are near
          breakeven.
        verify: derived

    inputs:
      - item: iron_ore
        price_link: iron_ore_china_cfr62
        intensity: 1.70
        intensity_unit: t/t
        basis_item: hrc
        market_pct: 0.70          # captive_share 0.37 SOURCED (FY25) ->
                                  # 0.37 x 0.20 + 0.63 x 1.00 = 0.704.
                                  # Was 0.80 on a guessed 0.25 captive.
        basis_pass_through: 0.50
        source_note: >
          SOURCED 2026-08-25, and it settles what the digests could not: "Captive
          sourcing accounted for 37% of JSW Steel's iron ore requirements in
          FY 2024-25. The company expects the captive linkage to reach 50%."
          Consistent with the digest's forward target ("~50% captive iron ore
          post-2030") and with the plan to double captive mining capacity to
          ~50 MT by FY31. The earlier 0.25 guess understated captivity.
        verify: sourced            # captive_share sourced; the 0.20 royalty
                                  # coefficient is sourced separately. Still the
                                  # most consequential number in the file —
                                  # tata 0.20 vs jsw 0.70 IS the flagship pair.

      - item: coking_coal
        price_link: coking_coal_spot_aus
        intensity: 0.70
        intensity_unit: t/t
        basis_item: hrc
        market_pct: 1.00          # NO captive coking coal. India has essentially
                                  # no coking-coal resource of steel grade, so
                                  # this is 1.00 for every mill without a
                                  # specific asset — and it is why coking coal
                                  # differentiates nobody.
        basis_pass_through: 1.00
        source_note: >
          "coking coal cost inflation of $12-15/t guided" (Elara) and "+$20/t
          coking coal" in the 2Q preview (Nomura) — both stated as a direct
          seaborne pass-through, with no domestic basis mentioned.
        verify: pending

  # ==========================================================================
  # JINDAL STEEL — long-product mix, partly captive on ore, half captive on coal
  # ==========================================================================
  - id: jindal_steel
    kind: company
    name: Jindal Steel
    sector: steel
    peer_group: steel_integrated
    nse_symbol: JINDALSTEL
    effective_from: 2026-04-01

    outputs:
      - item: hrc
        price_link: hrc_india_inr
        volume: 8800000           # 2.2 MMT Q1FY27 sales x 4.
        volume_unit: t
        asp_premium: 0
        source_note: >
          "Sales +17% yoy at 2.2MMT, VA-steel mix up to 66%" (Avendus Spark,
          Somaiah V). Realisation cited at Rs69k/t against an HRC print of
          Rs58.8k/t, which is the 66% value-added mix — so the ASP LEVEL is
          well above the price_link's level.
        verify: sourced
        # PRICE_LINK CAVEAT: the bridge uses the CHANGE in hrc_india_inr, not its
        # level, so a higher absolute realisation does not by itself break this.
        # What would break it is value-added prices moving by a different
        # PERCENTAGE from commodity HRC, which they do. Consider splitting the
        # line 66/34 against a VA proxy once one exists — there is none in the
        # pack today.

    inputs:
      - item: iron_ore
        price_link: iron_ore_china_cfr62
        intensity: 1.70
        intensity_unit: t/t
        basis_item: hrc
        market_pct: 0.26          # captive_share 0.92 -> 0.92 x 0.20 + 0.08 = 0.264
        basis_pass_through: 0.50
        source_note: >
          SOURCED from CARE Ratings, Jindal Steel Limited press release, 2026-07-07,
          verbatim: "Currently as per FY26, ~92% of iron ore and 0% of coking coal
          requirement was met captively (100% assuming the promoters coking coal
          mining assets)." Captive mining capacity rose to 13.61 MTPA in FY26 from
          4.61 MTPA in FY25.

          !! THIS CORRECTS A MISREADING OF THE DIGEST, NOT A DATA CONFLICT, AND
          !! THE MISREADING INVERTED THE NAME'S STRUCTURE. The digest line was
          !! "captive iron ore targeted ~40% by FY27-end" (IIFL) and it was read
          !! here as a target to RISE to 40%, implying ~25% today, giving
          !! market_pct 0.75 then 0.80 then 0.68. CARE states the opposite
          !! direction: captive is ~92% now and "is expected to DECLINE to ~40 to
          !! 50% after the ramp-up of JSOL operations" — because new capacity at
          !! Angul grows the DENOMINATOR faster than the mines grow. Same 40%
          !! number, opposite sign of change.
          !!
          !! Consequence: Jindal Steel is NOT an ore-buying name. It is nearly as
          !! captive as Tata and SAIL, and market_pct falls 0.68 -> 0.26. The
          !! "widest ore spread in the group" rationale for the tata/jindal pair
          !! in specs/sectors/steel.yaml was built on the inverted reading and has
          !! been rewritten.

          FORWARD, AND DATED: the decline to ~40-50% captive on JSOL ramp-up is a
          real future step in market_pct (0.26 -> ~0.60), and belongs in a new
          `effective_from` row when the ramp date is known rather than an edit in
          place. It is the clearest example in this spec of the dated-parameter
          mechanism CLAUDE.md calls the route to a genuine forecast: a structural
          cost change that is knowable now and dated later.
        verify: sourced

      - item: coking_coal
        price_link: coking_coal_spot_aus
        intensity: 0.70
        intensity_unit: t/t
        basis_item: hrc
        market_pct: 1.00          # The cited "captive coal share ~50%" is
                                  # THERMAL and PCI coal, not coking coal — a
                                  # distinction worth keeping, because reading it
                                  # as coking coal would halve this name's coal
                                  # sensitivity on a misattribution.
        basis_pass_through: 1.00
        source_note: >
          Guided give-back is cited and is a check on the whole line: "expects 2Q
          EBITDA/t to give back ~Rs2,700/t on weaker rebar pricing and higher
          coking coal costs" (digest).
        verify: pending

      - item: thermal_coal
        price_link: thermal_coal_seaborne
        intensity: 0.60
        intensity_unit: t/t
        basis_item: hrc
        market_pct: 0.19          # captive_share 1.00, at the NON-COKING coal
                                  # royalty rate: 14% ad valorem x 1.32 for
                                  # DMF+NMET = ~18.5%. Deliberately NOT the 0.20
                                  # used on the ore lines — iron ore is 15% under
                                  # the MMDR 2nd Schedule, coal is 14%. Keep them
                                  # distinct; they are different schedule entries.
        basis_pass_through: 0.35  # Same fraction aluminium.yaml uses, and for
                                  # the same reason: Indian domestic coal is
                                  # bought at administered/e-auction prices well
                                  # below seaborne and does not track it.
                                  # COMPOSES with market_pct rather than
                                  # duplicating it: 0.35 is seaborne -> domestic
                                  # basis, 0.19 is the royalty share of that
                                  # domestic price. Net 0.066, which is genuinely
                                  # how insulated a self-sufficient miner is.
        source_note: >
          SOURCED from CARE Ratings 2026-07-07: Jindal Steel "has now achieved
          self-sufficiency in its thermal coal requirements for both power
          generation and upcoming DRI operations", with total thermal coal mining
          capacity expanded to 15.37 MTPA in FY26 from 2.83 MTPA in FY25.

          The digest's "Captive coal share ~50%" (IIFL) was the earlier state and
          is now stale — this is the FY25 -> FY26 ramp, not a disagreement.
        verify: sourced

  # ==========================================================================
  # SAIL — captive ore, long-product mix, the thinnest margin in the group
  # ==========================================================================
  - id: sail
    kind: company
    name: Steel Authority of India
    sector: steel
    peer_group: steel_integrated
    nse_symbol: SAIL
    effective_from: 2026-04-01

    # ========================================================================
    # 50/50 FLAT/LONG, set by the PM 2026-08-25. READ THE WARNING BELOW BEFORE
    # TOUCHING THESE SIX LINES — FOUR OF THEM LOOK REDUNDANT AND ARE NOT.
    # ========================================================================
    # The previous version put all 16.64mt on one rebar line, which made SAIL the
    # highest-beta name in the group by construction (+35.6% of EBITDA on the
    # live window, against +50.1% on a +Rs5,000/t rebar shock). SAIL is roughly
    # half flat product, so the tonnage is now split.
    #
    # !! THE OBVIOUS WAY TO DO THIS SPLIT IS WRONG, SILENTLY, AND IN THE
    # !! BULLISH DIRECTION. Splitting the OUTPUT into two 8.32mt lines and
    # !! leaving the two input lines basis'd on `rebar` HALVES THE ENTIRE COST
    # !! SIDE, because `bridge.basis_volume()` returns the volume of the ONE
    # !! output line named in `basis_item` — which is now 8.32mt, not 16.64mt.
    # !! Measured, not feared:
    # !!
    # !!                         all-rebar    naive 50/50 split
    # !!   coking coal +$20/t      -11.38%       -5.69%     <- cost HALVED
    # !!   iron ore +$20/t          -0.77%       -0.38%     <- cost HALVED
    # !!   rebar +Rs5,000/t        +50.12%      +25.06%     <- revenue intact,
    # !!   HRC   +Rs5,000/t         +0.00%      +25.06%        just redistributed
    # !!
    # !! Full revenue sensitivity against half the cost sensitivity. Nothing
    # !! raises, coverage stays 6/6, and the name reads structurally long steel
    # !! prices with no cost base. Textbook silent-arithmetic — see
    # !! docs/SILENT_BUGS.md.
    #
    # WHY THE ENGINE DOES THIS, and why it is not a bug in the engine. Every
    # other multi-output entity's second line is a genuine BY-PRODUCT on top of
    # the primary tonnage — nalco/hindalco `alumina_surplus`, hzl
    # `silver_byproduct` — and a by-product does not consume the smelter's
    # inputs, so basis'ing every input on the primary output is correct there.
    # SAIL is the first entity where two output lines are CO-PRODUCTS: the same
    # tonnes, sold in two forms, sharing one cost base. The YAML shape is
    # identical and the meaning is opposite, and the engine assumes by-product.
    #
    # THE FIX USED HERE IS SPEC-ONLY, because the modularity test in README says
    # a change that needs the bridge engine means the spec format is wrong. Each
    # input is written TWICE, once per basis_item, each carrying its own 8.32mt.
    # Verified to reproduce the all-rebar cost numbers exactly:
    # coking coal -11.38%, iron ore -0.77%, and revenue now 25.06% on each of
    # rebar and HRC instead of 50.12% on rebar alone.
    #
    # DO NOT CONSOLIDATE `*_long` AND `*_flat` BACK INTO ONE LINE EACH. That is
    # the whole bug, and the consolidated version looks tidier.
    #
    # STILL WRONG AFTER THIS FIX, and it is a display metric rather than a score
    # input: `d_ebitda_per_t` divides by `_primary(entity)`, which is the FIRST
    # output line — 8.32mt — while `d_ebitda` covers all 16.64mt. So SAIL's
    # reported /t is ~2x too high. `pct_of_ebitda` (what actually scores) is
    # correct. It matters here more than it would elsewhere because EBITDA/t is
    # the native unit the steel sell-side quotes. Fixing it properly needs the
    # spec to distinguish a co-product from a by-product, which it cannot today
    # — see specs/sectors/steel.yaml `validation.test_4_coproduct_basis`.

    outputs:
      - item: rebar
        price_link: rebar_india_primary_inr
        basis_group: crude_steel  # CO-PRODUCT with hrc below: the same 16.64mt
                                  # of steel, sold in two forms, over one cost
                                  # base. basis_volume() sums the group and the
                                  # per-tonne denominator uses the group total.
        volume: 8320000           # 50% of 16.64mt
        volume_unit: t
        asp_premium: 0
        source_note: >
          "adj EBITDA Rs41.5bn, 9.1% below Emkay est on weak volumes (4.16mt)"
          (Emkay, Akhilesh Kumar) x4 = 16.64mt, split 50/50 flat/long by the PM
          2026-08-25. The long half is what the sell-side flags as the exposure:
          "SAIL flagged as key downside risk on higher rebar mix exposure"
          (Emkay), "higher semi-finished exposure" on realisations.
        verify: sourced            # tonnage sourced; the 50/50 SPLIT is a PM
                                   # input, not a disclosure

      - item: hrc
        price_link: hrc_india_inr
        basis_group: crude_steel  # see the rebar line above
        volume: 8320000           # 50% of 16.64mt
        volume_unit: t
        asp_premium: 0
        source_note: >
          The flat half. No digest gives SAIL's flat/long mix; 50/50 is the PM's
          number, 2026-08-25. Before this, SAIL responded 0.00% to an HRC shock,
          which was the one clearly wrong thing about the all-rebar version.
        verify: pending            # PM input, not cited

        # !! DO NOT REPLACE THESE VOLUMES WITH THE FY27 GUIDANCE TONNAGE. The
        # digests cite "FY27 volume guide 22-22.5mt held" (ICICI), 34% above the
        # 16.64mt these two lines sum to. base_ebitda is 4.16mt x Rs9,974 x 4,
        # so swapping the guide in here while leaving the denominator at
        # Q1-annualised would inflate every pct_of_ebitda by 1.34x with nothing
        # raising. The guide is also probably crude steel PRODUCTION rather than
        # saleable SALES, so it is not even the same quantity. Same basis on
        # both sides, or neither.

    inputs:
      # Two lines, not four. They are basis'd on the `crude_steel` GROUP, so
      # basis_volume() sums both output legs and returns the full 16.64mt. The
      # previous version duplicated each line per output item to work around
      # basis_volume() resolving only a single item — correct on the score but it
      # left d_ebitda_per_t 2x too high and read as redundancy someone would tidy
      # away. See the docstring on bridge.basis_volume().
      - item: iron_ore
        price_link: iron_ore_china_cfr62
        intensity: 1.70
        intensity_unit: t/t
        basis_item: crude_steel
        market_pct: 0.20          # captive_share 1.00 -> royalty-only exposure
        basis_pass_through: 0.50
        source_note: >
          SOURCED 2026-08-25 and CONFIRMED BY THE PM the same day: SAIL is 100%
          captive on iron ore, producing 33.78 MT from its own mines in FY25.
          captive_share 1.00, same as Tata, so both sit at the royalty-only 0.20.

          A CONFLICTING FIGURE EXISTS AND IS NOT A CONFLICT — recorded so nobody
          "corrects" this back. The vault's Coverage/Steel/SAIL Knowledge Card
          says "Captive iron ore ~40% self-sufficiency (targeting 56 MT FY27,
          80 MT long-term)". That ~40% is not the share of REQUIREMENT met
          captively: 33.78 MT of ore against ~19-22 mt of steel at ~1.7 t/t is
          ~33-37 MT of need, i.e. ~100%. The ~40% is against the 80 MT long-term
          MINING AMBITION, which is a capacity-utilisation number, not a
          sourcing-mix number. Two different denominators, same word.
        verify: sourced

      - item: coking_coal
        price_link: coking_coal_spot_aus
        intensity: 0.70
        intensity_unit: t/t
        basis_item: crude_steel
        market_pct: 0.96          # captive_share 0.05 -> 0.05x0.20 + 0.95 = 0.96
        basis_pass_through: 1.00
        source_note: >
          SOURCED 2026-08-25: SAIL imports ~95% of its coking coal requirement,
          producing only 0.59 MT from captive mines in FY25 against a far larger
          need — a gap the CAG has formally censured. So captive_share is ~0.05,
          not the ~0.15 the earlier 0.85 market_pct implied. This makes SAIL the
          most coal-exposed name in the group, which matches it taking the largest
          hit on every coking coal shock.

          Corroborating and dated: "Coking coal costs to fall Rs1,000-1,500/t in
          Q2; Tasra captive coal mine (Dec-26) to drive structural savings"
          (ICICI Securities). Tasra commencing Dec-2026 means captive_share steps
          UP and market_pct steps DOWN then, via a new `effective_from` row rather
          than an edit in place.
        verify: sourced

  # ==========================================================================
  # APL APOLLO — the converter. HRC is a COST here, the mirror of every mill.
  # ==========================================================================
  # Its own peer group, so a long-mill / short-APL-Apollo pair is CROSS-GROUP and
  # gets flagged in the UI the way hindalco/hindustan_zinc is. That flag is the
  # point rather than an obstacle: the two legs sit on opposite sides of one HRC
  # print, which is a real trade and a comparison the schema should force you to
  # look at twice.
  # ==========================================================================
  # APL APOLLO — scored on the FEEDSTOCK SPREAD, not on a margin bridge.
  # ==========================================================================
  # REWORKED 2026-08-26 on PM instruction: "Use the secondary rebar as patra to
  # measure HRC-patra spread. It has impact on volumes... Granted it passes down
  # costs and per ton remains more or less same, but volumes matter. Rework APL
  # Apollo entirely on volumes and score between 1 to 5 rather than using ebitda."
  #
  # WHAT WAS HERE BEFORE AND WHY IT WENT. An output line and an input line both
  # on hrc_india_inr at 1.00 and 1.02, which netted to the ~2% yield loss and
  # produced an economics score that sat in a 0.222 band across 149 dates against
  # tata_steel's 2.680. Measurement said that near-zero was APPROXIMATELY RIGHT
  # about HRC — the equity loads +0.103 on coil against the mills' +0.076 and
  # +0.109 — so the bridge was not wrong, it was answering a question that does
  # not matter for this company.
  #
  # PER-TONNE MARGIN IS THE WRONG QUANTITY FOR A CONVERTER. It passes coil
  # through on brand pricing power and its EBITDA/t is near-constant by
  # construction: "EBITDA/t Rs5,522 flat qoq (+18% yoy) despite West Asia war,
  # energy inflation, dealer destocking". What moves its earnings is VOLUME, and
  # what moves volume is its feedstock cost against its COMPETITORS' feedstock —
  # the small tube makers buying cheap secondary sheet, "patra".
  #
  # The digests name it as the monitorable, verbatim: "key watch: steel price
  # outlook and impact of widening HRC-Patra gap".
  #
  #     spread WIDE    APL's premium coil is dear vs what secondary players pay
  #                    -> it loses share -> volumes fall -> LOW score
  #     spread NARROW  the premium is relatively cheap -> it gains share
  #
  # !! THE SUBSTITUTE LEG IS A PROXY AND IS NOT RENAMED (invariant 6). There is
  # !! no patra series in the pack. `rebar_india_secondary_inr` is secondary
  # !! rebar 12mm — a LONG product — while patra is secondary FLAT sheet. Both are
  # !! secondary-route steel and track the same secondary price level, which is
  # !! the economically relevant thing, but the FORM differs. If a secondary-flat
  # !! assessment ever lands, repoint `substitute` at it and do NOT rename this
  # !! series to patra.
  #
  # WHAT IS VERIFIED. Not the weekly price relationship: change in the spread vs
  # APL Apollo's weekly returns is r +0.010 over 3y and -0.017 since 2016, i.e.
  # nothing. That is the EXPECTED result rather than evidence against — a
  # share-loss mechanism runs through quarterly volume, so weekly repricing is
  # the wrong instrument and a null there settles neither way.
  #
  # CORROBORATED ONCE, at the right timescale and in the right direction: the
  # spread sits at z +1.09 (1y) / +1.90 (3y), i.e. WIDE, and APL Apollo has just
  # printed 745kt against 800-900kt guided, volumes -6% yoy, with management's
  # 15-20% growth guide "expected to be cut to single digits".
  #
  # THE TEST THAT WOULD SETTLE IT is spread vs REPORTED VOLUMES quarter by
  # quarter. `observations` holds one volume actual for this name (Q1FY27, 745kt),
  # so it is not runnable yet — roughly 6-8 quarters away. Until then this is a
  # PM-specified structural model with one corroborating observation, and it
  # should be read as that rather than as a validated relationship.
  - id: apl_apollo
    kind: company
    name: APL Apollo Tubes
    sector: steel
    peer_group: steel_converter
    nse_symbol: APLAPOLLO
    effective_from: 2026-04-01

    # NO outputs / inputs, deliberately. A margin bridge on this name nets to
    # noise, and leaving the lines in place would mean two economics bases
    # competing for one pillar. `economics_spread` replaces them entirely.
    outputs: []
    inputs: []

    economics_spread:
      long: hrc_india_inr                    # what APL Apollo buys
      substitute: rebar_india_secondary_inr  # PROXY for patra — see the note above
      worse_if_wide: true                    # wide = loses share = low score
      lookback_days: 1260                    # calendar days, same as pillar_3
      scored_as: z                           # z against the spread's own history,
                                             # hill curve, z=1.0 reads 4.0 —
                                             # identical to P3 valuation, because
                                             # it is the same question: how
                                             # unusual is this against its own
                                             # past.
      transmits_via: volume
      verify: pm_specified

  # ==========================================================================
  # DROPPED FROM THE SCORED UNIVERSE — PM decision 2026-08-26.
  # ==========================================================================
  # Same lever as shyam_metalics: `peer_group: null`, which the schema defines as
  # "scoring universe; NULL = not scored". No pillar rows, no cell, cannot appear
  # in a pair. Nothing is deleted — 15y of prices, 8 broker actions and its digest
  # tag mapping all stay, so re-enabling is one line.
  #
  # THE DECIDING EVIDENCE IS A MEASUREMENT, not a judgement about the business.
  # packages/review/nickel_jsl.py, weekly log returns:
  #
  #                        3y (156w)   2016+ (555w)
  #     jindal_stainless      +0.021        +0.111
  #     tata_steel            +0.209        +0.283
  #     jsw_steel             +0.299        +0.254
  #
  # JSL loads on nickel LESS than two carbon-steel names that consume none, and on
  # the recent window its loading is r-squared 0.04% — nothing. lme_aluminium is
  # the same story (+0.014). So it does not respond measurably to ANY commodity
  # this store carries, which is the one thing the economics bridge is built to
  # exploit. Its economics was already WITHHELD; the correlation work established
  # that this is structural rather than a missing-series problem.
  #
  # AND ITS OTHER INPUTS ARE THE THINNEST IN THE BOOK, which is what settled it
  # against keeping the name on valuation and mood alone:
  #
  #     entity             broker_actions  concall_ledger  oi_rows
  #     jindal_stainless          8               0            0
  #     shyam_metalics            8               4            0    <- dropped
  #     apl_apollo                8              11           91
  #     tata_steel               28              35           91
  #
  # There is NO `JINDALSTNLS_Concall` directory in the vault — only JINDALSTEL,
  # which is Jindal Steel. So JSL has no delivery ledger, hence no P4 prior, and
  # no OI. It was scoring on valuation and mood only: 0.50 of the intended weight,
  # with the other 0.50 renormalised away.
  #
  # WHAT WOULD BRING IT BACK, and it is a shared fix rather than a JSL-specific
  # one: a STAINLESS PRICE series. That would let nickel sit on both sides of the
  # bridge so the modelled quantity is the conversion spread rather than an input —
  # the same gap that makes apl_apollo's economics uninformative. One series, two
  # names. Until then this is a name the model has nothing to say about.
  #
  # NOT A JUDGEMENT ON THE BUSINESS. Its near-zero loading on the metals complex
  # is a real property and arguably a useful one in a book that is long/short
  # metals — it just makes JSL a poor fit for a system whose edge IS commodity
  # pass-through.
  - id: jindal_stainless
    kind: company
    name: Jindal Stainless
    sector: steel
    peer_group: null
    nse_symbol: JSL
    effective_from: 2026-04-01
    outputs: []
    inputs: []
    # ========================================================================
    # NICKEL WAS CHECKED AGAINST THE VAULT'S OWN FACT BASE AND IT DOES NOT CLOSE
    # THIS. The pack carries lme_nickel — 4,729 rows, current to today — so the
    # SERIES is not the blocker, which is what the earlier reason here implied.
    # The blocker is that a nickel cost line would have the WRONG SIGN.
    #
    # Three findings from Coverage/Steel/Jindal Stainless/Fact Base.md, each of
    # which independently breaks a naive nickel bridge:
    #
    #  1. NICKEL PASSES THROUGH TO THE CUSTOMER. "Largely spot/short-term with
    #     nickel surcharge adjustment mechanism (1-2 month lag). No long-term
    #     fixed-price contracts disclosed." So nickel is not a net cost exposure,
    #     it is a pass-through with a timing lag. Modelled as a cost line, a
    #     nickel rally reads as a margin hit when the surcharge makes it roughly
    #     neutral — and across the lag, an inventory GAIN.
    #
    #  2. THE BRIDGE CANNOT EXPRESS THE LAG. windows_days is [1, 5, 20] and
    #     basis_pass_through is a scalar fraction with no time dimension. A 1-2
    #     month surcharge lag is 30-60 days, outside every window. The whole
    #     economic content here IS the lag, so a lagless model does not
    #     approximate it — it inverts it.
    #
    #  3. JSL IS PARTLY CAPTIVE ON NICKEL. "Indonesia NPI smelter is the key
    #     structural hedge — it converts laterite nickel ore into NPI, feeding the
    #     co-located SMS. This captures the mine-to-melt spread and reduces
    #     exposure to LME nickel volatility." Same market_pct logic as iron ore,
    #     and the captive share is not disclosed anywhere I can find.
    #
    # AND THE INTENSITY IS A MIX, NOT A CONSTANT. Product mix is 200-series 37%,
    # 300-series 46%, 400-series 18%. Nickel content runs ~8-10% on 300-series,
    # low single digits on 200-series, and essentially ZERO on 400-series, which
    # is ferritic. Effective nickel intensity is therefore ~4-5% and moves with a
    # mix the company is deliberately shifting — "400-series share is growing
    # (positive for margins — lower nickel content, higher end-user value)". A
    # fixed intensity would drift wrong in a KNOWN direction, which is worse than
    # being merely imprecise.
    #
    # ========================================================================
    # MEASURED 2026-08-25, and it settles the question more firmly than the Fact
    # Base did — packages/review/nickel_jsl.py. Weekly log returns, 556 weeks
    # from 2016 (JSL's history is cut at the 2015-11-19 restructuring, -60.9%).
    #
    #   contemporaneous r, nickel vs the equity
    #     jindal_stainless   +0.111   (n=555, |t|=2.63)
    #     tata_steel         +0.283   (n=555, |t|=6.95)
    #     jsw_steel          +0.254   (n=555, |t|=6.18)
    #
    # !! JSL IS LESS NICKEL-SENSITIVE THAN TWO CARBON-STEEL NAMES THAT CONSUME NO
    # !! NICKEL AT ALL. The excess attributable to stainless is NEGATIVE: -0.158
    # !! on this window, -0.128 on full history, -0.209 from 2021. Stable in sign
    # !! and rough size across all three.
    #
    # THREE THINGS THAT FOLLOW, and the second corrects the note above rather than
    # supporting it:
    #
    #  1. THE SIGN IS POSITIVE, SO NICKEL IS NOT AN UNHEDGED COST. A real cost
    #     exposure reads negative — nickel up, margin down, equity down. It does
    #     not. That is what the surcharge pass-through and the captive NPI hedge
    #     predict, so the mechanism is supported.
    #
    #  2. THE 1-2 MONTH LAG IS NOT VISIBLE, and the comment above leaned on it.
    #     A lead-lag scan from -12 to +12 weeks shows NO peak where the surcharge
    #     story predicts one: lag +4w reads +0.107 against lag 0's +0.111, and
    #     every other lag sits inside |r| < 0.08, i.e. noise. So "the whole
    #     economic content here IS the lag" is NOT established by prices. It may
    #     still be true of the P&L and simply not reach the equity; it is not
    #     evidence for building a lag term.
    #
    #  3. NICKEL IS NOT EVEN A SPECIFIC EXPOSURE. JSL tracks lme_aluminium at
    #     +0.107 against nickel's +0.111 — indistinguishable. What little
    #     co-movement exists is shared metals beta, not stainless economics.
    #
    # PAST 3 YEARS ONLY (2023-08-26, 156 weeks) — the result STRENGTHENS:
    #
    #     jindal_stainless   +0.021    (r-squared 0.04%, i.e. nothing)
    #     tata_steel         +0.209
    #     jsw_steel          +0.299
    #     excess vs peers    -0.233    (was -0.158 on the 2016+ window)
    #
    # Over the recent window JSL's nickel correlation is INDISTINGUISHABLE FROM
    # ZERO while the carbon-steel names carry +0.21 to +0.30. The aluminium control
    # collapses too: JSL +0.014 vs nickel's +0.021. So on current-regime data JSL
    # has essentially no measurable loading on ANY base metal, and the carbon names
    # have a real one.
    #
    # JSL's strongest reading in the 3y window is +0.132 at lag MINUS 3 weeks —
    # the EQUITY leading nickel, |t| 1.64, not significant. Worth naming because a
    # negative lag is the opposite of a cost-transmission story; nothing there
    # supports a nickel input line even as a timing play.
    #
    # AND A DEMONSTRATION OF WHY LEVELS ARE USELESS HERE, which is why the script
    # prints them only to dismiss them: the LEVEL correlation is +0.234 on the
    # 2016+ window and -0.145 on the 3y window. Same two series, opposite sign,
    # decided entirely by where the window starts.
    #
    # SO THE WITHHOLD IS RIGHT AND THE REASON IS STRONGER THAN FIRST WRITTEN:
    # nickel explains ~1% of JSL's weekly variance and less of it than it explains
    # for Tata or JSW. A nickel line of ANY sign, lagged or not, would add noise to
    # this name's economics rather than signal. That is a measurement, not a
    # reading of a document.
    #
    # WHAT WOULD ACTUALLY UNBLOCK IT, in order of tractability:
    #   (a) a STAINLESS PRICE series, so nickel sits on BOTH sides and the
    #       modelled quantity becomes the spread rather than the input. Nothing in
    #       the pack carries one. This is the same gap that blocks APL Apollo, and
    #       fixing it once would fix both.
    #   (b) a lag term in the bridge — a schema and engine change for one name,
    #       which is not a good reason to build one.
    #   (c) the disclosed captive NPI share plus the mix-weighted nickel
    #       intensity, which would at least make a residual-exposure model honest
    #       rather than sign-inverted.
    #
    # Until then economics stays WITHHELD and JSL scores on valuation and mood,
    # which are real. A deliberate half-measure, not an oversight.
    # ========================================================================
    withhold_reason: >
      Economics withheld: nickel is a 1-2 month LAGGED PASS-THROUGH via the
      surcharge mechanism, partly hedged by captive Indonesian NPI, over a
      nickel-content mix (200/300/400-series at 37/46/18%) the company is
      actively shifting. lme_nickel EXISTS in the pack, so the series is not the
      gap — a cost-only nickel line would carry the wrong sign, and the bridge's
      1/5/20d windows cannot express a 30-60 day lag. MEASURED and stronger than
      that: weekly returns 2016-2026 put JSL's nickel correlation at +0.111
      against tata_steel's +0.283 and jsw_steel's +0.254 — LESS nickel-sensitive
      than two names that consume none — with no lead-lag peak anywhere from -12
      to +12 weeks, and aluminium tracking equally well (+0.107). Nickel explains
      ~1% of variance and none of it specific. Unblocks on a stainless PRICE
      series (nickel on both sides, model the spread), not on more input series.
      See packages/review/nickel_jsl.py.

