  # ==========================================================================
  novelis:
    # 1QFY27 annualised, same convention and same quarter as every other name
    # here. Rs4,875 cr x 4 = Rs19,500 cr.
    #
    # CROSS-CHECKED IN TWO CURRENCIES, because Novelis reports in USD and
    # Hindalco restates it in INR, so the two must agree or one is wrong:
    #     $516m x 4 = $2,064m; at usdinr 95.43 -> Rs19,697 cr
    #     Rs4,875 cr x 4                        -> Rs19,500 cr
    # 1.0% apart, which is FX timing (the company converts at its own average
    # rate, not at a spot date). The company's own INR figure is used, because
    # mixing a USD figure at a spot rate into a rupee denominator would put an
    # FX error inside the beta.
    base_ebitda: 19500
    base_ebitda_source: >
      Hindalco Q1 FY27 press release, quarter ended 30 June 2026, verbatim:
      "Record Novelis quarterly Adjusted EBITDA* at Rs4,875 crore, up 37%".
      Novelis' own release for the same quarter, verbatim: "Adjusted EBITDA of
      $516 million, up 24% YoY" and "Adjusted EBITDA per tonne shipped of $563,
      up 30% YoY". Annualised x4 per the base_quarter convention.
      https://www.hindalco.com/media/press-releases/hindalco-results-q1fy27
      https://investors.novelis.com/news-events/press-releases/detail/1425/novelis-reports-first-quarter-fiscal-year-2027-results
    base_ebitda_caveat: >
      +37% yoy off a disrupted base — FY26 was held down by the Oswego plant
      fires and the hot mill only restarted in early June 2026, inside this very
      quarter. So this annualises a recovering quarter, which cuts the OPPOSITE
      way to NALCO's peak-cycle caveat: it may understate a normalised Novelis
      rather than overstate it. FY26 actual was $1,645m on 3,557 kt = $462/t;
      this quarter ran $563/t. Kotak (Sumangal Nevatia, 2026-07-15) forecasts
      "EBITDA per ton of US$545/577 per ton in FY2027/28E".
    # No shares_outstanding, net_debt or valuation_metric, deliberately. It is
    # is_tradeable: false with peer_group: null, so it can never receive a
    # valuation score and those fields would be decoration that later reads as
    # data. bridge.py only requires base_ebitda.
    primary_output: flat_rolled_products
    source_note: "Reporting unit under hindalco. Its EBITDA is EXCLUDED from
      hindalco's base_ebitda above, which is upstream-only, so there is no
      double count."
    verify: sourced
    roll_up: >
      UNRESOLVED, and deliberately left as a flag rather than guessed. Nothing
      currently adds Novelis' d_ebitda to Hindalco's — consumed_by() walks
      reporting units for the staleness gate, but the bridge scores each entity
      on its own lines. So Hindalco's score is an UPSTREAM SEGMENT score, not an
      equity score. Decide one of:
        (a) roll up  — Hindalco equity delta = upstream + novelis, over the
                       consolidated 38,097 (FY26) / 59,956 (1QFY27 annualised)
        (b) report alongside — keep two segment scores and size off the pair
      Option (a) is what the equity actually trades on; (b) is what the current
      code does. Until this is settled, do not compare Hindalco's economics
      score to NALCO's as though both were whole-company betas.

