  # ==========================================================================
  # STEEL — added 2026-08-25. Seven names, the vault's Coverage/Steel roster.
  # ==========================================================================
  # SAME CONVENTION AS EVERY NAME ABOVE: 1QFY27 print annualised x4, matching
  # `base_quarter` at the top of this file. Every figure carries the digest it
  # was cited from.
  #
  # THE VOLUME x EBITDA/t IDENTITY RECONCILES FOR ALL SEVEN, and that is why
  # these can be trusted rather than merely quoted. Brokers report steel as
  # EBITDA/t against a disclosed tonnage, so the two are independently checkable
  # against the absolute print — a cross-check the aluminium names never had:
  #
  #     sail              4.16 mt x  9,974 = Rs 4,149 cr  vs cited Rs 41.5 bn
  #     jindal_stainless  0.581mt x 22,884 = Rs 1,330 cr  vs cited Rs 13.3 bn
  #     apl_apollo        0.745mt x  5,522 = Rs   411 cr  vs cited Rs  4.11bn
  #     jindal_steel      2.20 mt x 12,000 = Rs 2,640 cr  vs cited Rs 26.7 bn
  #     tata_steel        5.17 mt x 18,199 = Rs 9,409 cr  vs consol Rs 93.7 bn
  #
  # Tata's India-only product reconciling to the CONSOLIDATED print is not an
  # error: Europe swung to a loss this quarter ("Europe back to losses", CLSA
  # digest 2026-07-31), so India ~ consolidated by coincidence of a bad European
  # quarter. It will NOT hold next quarter. Hence the separate valuation_ebitda,
  # for the same reason Hindalco carries one.
  #
  # ==========================================================================
  # !! NET DEBT: THE `Borrowings - Investments` CONVENTION FAILS ON THESE NAMES
  # ==========================================================================
  # Every name above takes net_debt from screener.in as Borrowings less
  # Investments. Applied to steel that convention OVERSTATES net debt on all
  # four names where an independently cited figure exists, and on one it FLIPS
  # THE SIGN. Measured, not asserted:
  #
  #   name              screener Mar-26   cited              gap
  #   tata_steel             85,293      80,100 (Mar-26)    +6.5%
  #   jindal_steel           19,442      15,900 (1QFY27)    +22%
  #   jindal_stainless        5,913       2,950 (1QFY27)    +100%
  #   jsw_steel              89,092      53,900 (Mar-26)    +65%
  #   apl_apollo                449      -1,410 (1QFY27)    SIGN FLIP
  #
  # WHY. screener's "Investments" line is non-current investments only. It does
  # not include cash, bank balances or current investments, and the Indian steel
  # names carry large balances there — JSW's gross borrowings are Rs 99,310 cr
  # against a company-reported net debt of Rs 53,900 cr, so ~Rs 45,000 cr of
  # liquidity sits outside the line the convention subtracts.
  #
  # This is the silent-arithmetic shape (docs/SILENT_BUGS.md): EV = mcap +
  # net_debt, so an overstatement makes a name read DEARER, nothing raises, and
  # coverage_ok stays true.
  #
  # BUT MEASURE THE EFFECT BEFORE CLAIMING IT, because the rupee gap and the
  # MULTIPLE gap are very different sizes — mcap dominates EV for all seven, so
  # a 65% error in net debt is not a 65% error in EV/EBITDA:
  #
  #   name              EV/EBITDA cited   convention    delta
  #   tata_steel              8.47x          8.50x      +0.3%
  #   jindal_steel           12.51x         12.84x      +2.7%
  #   apl_apollo             35.27x         36.40x      +3.2%
  #   jindal_stainless       11.42x         11.98x      +4.9%
  #   jsw_steel               9.84x         10.98x     +11.6%
  #
  # An earlier draft of this note said the uneven bias "corrupts the
  # cross-sectional ranking". That was asserted, then checked, and it is NOT
  # true at these magnitudes: on today's prices the convention changes no
  # name's rank in the group — JSW sits between shyam and jindal_stainless
  # either way. JSW's +11.6% is the only material distortion, and APL Apollo's
  # sign flip is wrong in KIND (a net-cash company recorded as levered) rather
  # than in size. Both are worth fixing; neither is the ranking disaster the
  # rupee table suggests on its own.
  #
  # SO THESE SEVEN USE THE CITED FIGURE WHERE ONE EXISTS, and the screener
  # number is recorded beside it as the disagreement rather than dropped. That
  # follows the precedence rule in this file's header — a company release for a
  # LATER quarter beats a derived figure — and 1QFY27 is both later and the base
  # quarter.
  #
  # THE FIVE NAMES ABOVE ARE NOT RE-DERIVED HERE, deliberately. Changing them is
  # a separate, testable edit: hindalco's screener figure was cross-checked to
  # within 2% against a cited Novelis number, and hzl/nalco are net cash, so the
  # failure may be specific to levered names with big cash piles. Re-checking
  # them against cited figures is worth doing and must not ride along inside a
  # steel commit.
  # ==========================================================================

