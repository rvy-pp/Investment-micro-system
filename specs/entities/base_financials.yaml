    scoring_note: >
      APL APOLLO IS A CONVERTER AND ITS HRC SIGN IS OPPOSITE TO EVERY MILL'S.
      It BUYS hot-rolled coil and sells tubes, so a rising HRC price is a COST,
      exactly as alumina is a cost to VAML and revenue to NALCO. The digests
      state the mechanism directly: "Domestic demand soft as HRC prices rose 3%
      QoQ", and the key watch is "the widening HRC-Patra gap". This is the
      cleanest mirror pair available in the sector and the structural reason to
      carry the name at all — but it is a CROSS PEER-GROUP pair, so the UI must
      flag it the way it flags hindalco/hindustan_zinc.
