# ============================================================================
# Base financials — the denominators
# ============================================================================
# Kept separate from the economics specs on purpose: STRUCTURE (intensities,
# sourcing, mix) changes rarely, FINANCIALS change every quarter. Mixing them
# means re-reviewing the structural assumptions every time an EBITDA print
# lands, which is how specs rot.
#
# base_ebitda is the denominator for pct_of_ebitda — the materiality test that
# decides whether an economics move is a trade at all. It does not need to be
# precise, but it must be the right order of magnitude, because a wrong
# denominator silently rescales every signal for that name.
#
# verify: tracks each denominator individually. As of 2026-08-24 every name is
# `sourced` — hindalco was the last `pending` and is now taken from the Q1 FY27
# segment disclosure. The old blanket line here ("ALL verify: pending — set from
# sector knowledge, not from filings") had been false for some time, which is
# its own small lesson about summary claims in headers.
# ============================================================================

spec_version: 0.1.0
currency: INR
unit: crore
period: FY26

# THE BASE QUARTER — the single definition, and it must stay single.
# ============================================================================
# `base_ebitda` below is this quarter's print, annualised x4. P3 valuation
# re-marks it from THIS quarter's AVERAGE prices to today:
#
#     spot_ebitda(d) = base_ebitda + bridge(prices at d  vs  base-quarter average)
#
# So the EBITDA figure and the price reference window describe the SAME quarter
# and have to move together. They previously did not: base_ebitda lived here
# while the window was a literal "2026-04-01","2026-06-30" in run_scores.py, and
# nothing coupled them. Updating one and not the other marks one quarter's
# earnings against another quarter's prices — arithmetically silent, plausible
# output, wrong answer. Now there is one definition and the literal is gone.
#
# WHEN A NEW QUARTER PRINTS, change both fields here and the base_ebitda values
# together, in one edit. Leaving it stale is SAFE, not broken: the bridge simply
# re-marks over a longer window, which costs a little accuracy and no
# correctness. Splitting them is what breaks.
# ============================================================================
# WHERE THESE NUMBERS ARE ALLOWED TO COME FROM — set by the PM 2026-08-24
# ============================================================================
# Hindalco's and Novelis' base numbers are STATIC. They do not move with the
# tape; they change once a quarter, from the company's own release, and they are
# refreshed by hand. `packages/adapters/concall_check.py` runs on every refresh
# and says whether that quarter has turned — it never writes, because a wrong
# base_ebitda is a wrong beta on every signal the name emits (invariant 5).
#
# PRECEDENCE, highest wins. Same idea as prices_io.PRECEDENCE and for the same
# reason: several things can supply one figure and nothing recorded which won.
#
#     company release for a LATER quarter    beats   the desk model
#     the desk model (data/models/*.xlsx)    beats   sector-knowledge guesses
#
# A superseded figure is replaced with a dated reason in *_source, never silently
# overwritten. If the model disagrees with a printed release, the release wins
# AND the disagreement is worth investigating rather than reconciling away.
#
# The desk Excel model is not wired in yet — deliberately. Writing a parser
# against a layout nobody has looked at produces a plausible wrong number, which
# is the one failure mode this file cannot afford. See data/models/README.md for
# what the model is wanted for: the ASP premium, the alumina surplus volume, the
# intensities and captive shares, and above all a Novelis conversion spread and
# scrap cost — the last being the only route to scoring Novelis at all, since
# neither `can_sheet_spread` nor `al_scrap_midwest` has any public series.
# ============================================================================
base_quarter:
  label: 1QFY27
  start: 2026-04-01
  end: 2026-06-30
  verify: sourced             # cited 1QFY27 prints in the digests
# FALLBACK ONLY. The live rate is loaded from Yahoo (USDINR=X) into `prices`
# and should be read from there; this constant is what the bridge uses when the
# store has no rate for the date.
#
# Corrected 2026-08-15: was 87.0, actual 95.43 — a 9.7% error that scaled EVERY
# USD-linked line, i.e. every alumina, LME and silver impact in the system.
# A hardcoded FX rate is a slow leak: it is never obviously wrong, it just
# quietly understates everything. Treat this number as a bug waiting to happen
# and prefer the series.
usdinr: 95.43
usdinr_as_of: 2026-08-15
verify: sourced               # from USDINR=X, live

# CORRECTED 2026-08-15 from CITED 1QFY27 prints in the digests. The previous
# values were sector-knowledge guesses and were wrong by up to 2.8x. Since
# base_ebitda is the denominator of pct_of_ebitda, a wrong one silently
# rescales every signal for that name — VAML was reading -21% on a 30-day move
# that is really about -7.5%.
#
# Quarterly prints annualised x4. Crude — it ignores seasonality and assumes
# the quarter is representative — but an order of magnitude better than a guess,
# and each carries the quote it came from.

# P3 VALUATION INPUTS
# -------------------
# shares_outstanding is SOURCED from Wind (total_shares, BSE codes). Wind
# carries Indian prices and share counts but NOT fundamentals — pe_ttm, pb_lf,
# mkt_cap_ard and every balance-sheet field come back empty for .BO tickers
# while working normally for a Chinese control. So the multiple is COMPUTED:
#
#     EV/EBITDA = (price x shares_outstanding + net_debt) / base_ebitda
#
# net_debt is the one input with no automated source. Set it on the Inputs tab.
# Left at 0 it means EV is approximated by market cap, which is roughly right
# for a net-cash name and materially wrong for a levered one — so the computed
# multiple is labelled approximate until net_debt is filled in.
#
# CROSS-CHECK, and it is a good one: brokers quote the TRADING multiple in the
# digests. If our computed number disagrees with theirs, one of shares, net
# debt or base_ebitda is wrong. Example already visible — a broker called HZL
# "rich 8.1x EV/EBITDA" while our inputs give ~6.9x. The likely culprit is our
# base_ebitda, which annualises a +109% yoy quarter and so runs too high.

companies:

  nalco:
    base_ebitda: 10840
    shares_outstanding: 1836630000     # Wind total_shares, 532234.BO
    shares_verify: sourced
    net_debt: -473                     # NET CASH. screener.in Mar 2026:
                                       # Borrowings 60 less Investments 533.
                                       # Negative net debt lowers EV below mcap,
                                       # which is correct and was being lost
                                       # while this sat at 0.
    net_debt_verify: sourced
    valuation_metric: ev_ebitda
    primary_output: aluminium_ingot
    source_note: >
      1QFY27 standalone EBITDA Rs27.1bn x4. Quote: "1QFY27 standalone Ebitda
      Rs27.1bn (+81% yoy, +15% qoq) beat on aluminium margins" (Kotak,
      digest 2026-08-05).
    verify: sourced
    caveat: "+81% yoy — a peak-cycle quarter, so annualising overstates a mid-cycle base."

  hindalco:
    # ------------------------------------------------------------------------
    # 32000 -> 29560 on 2026-08-24. This resolves the caveat that used to sit at
    # the bottom of this block ("Either split India out or accept that
    # Hindalco's pct_of_ebitda is not comparable to a pure play's") and the
    # "only unsourced denominator in the group" flag. Both are gone.
    #
    # THE OLD NUMBER WAS THE WRONG QUANTITY, not merely imprecise. It was a
    # guess at CONSOLIDATED EBITDA, while every line in this entity's spec is
    # India Aluminium UPSTREAM: 1.3 Mt India primary metal, India alumina at
    # market_pct 0.05, India coal at 0.45, anode coke. No copper line, no
    # downstream line, no Novelis line. So a consolidated denominator was
    # dividing an upstream-only numerator by a whole-company base.
    #
    # It was also too small for the thing it claimed to be: FY26 consolidated
    # EBITDA actually printed Rs38,097 crore, not 32,000.
    #
    # NOW: Aluminium Upstream, 1QFY27 annualised, matching base_quarter above
    # and matching NALCO's convention exactly so the NALCO-Hindalco pair is a
    # like-for-like comparison. Rs7,390 cr x 4 = Rs29,560 cr.
    #
    # Q1 FY27 segment EBITDA reconciles to the rupee, which is why these three
    # numbers can be trusted as a split rather than as three separate estimates:
    #
    #     Aluminium Upstream      7,390   <- this denominator, x4
    #     Aluminium Downstream      298   } not modelled - no spec lines
    #     Copper                    918   }
    #     Novelis                 4,875   <- novelis block below, x4
    #     other / unallocated     1,508
    #     ------------------------------
    #     consolidated           14,989   = the reported figure
    #
    # FY26 full year reconciles the same way: 18,884 + 978 + 2,809 = 22,671
    # exactly the reported "India business" total, and 22,671 + 15,426 = 38,097
    # exactly the reported consolidated. Two independent periods, both additive.
    #
    # CONSEQUENCE. The denominator falls 7.6% (32,000 -> 29,560), so Hindalco's
    # pct_of_ebitda becomes 1.08x more sensitive to the same rupee move: the
    # -184.5cr bridge reads -0.624% of EBITDA instead of -0.577%. Small, because
    # the old guess happened to be close to the upstream figure by coincidence —
    # it was the wrong QUANTITY, not badly wrong in magnitude. Invariant 5 says
    # base_ebitda IS the beta, so this is the sanctioned way to change it.
    #
    # WHAT THIS DENOMINATOR DOES *NOT* ANSWER. pct_of_ebitda is now "% of the
    # upstream segment", not "% of Hindalco's earnings". Upstream is roughly half
    # of consolidated, so the equity-level sensitivity is the upstream move plus
    # the Novelis move over 38,097 — which needs the roll-up decision recorded in
    # the novelis block. Do not read Hindalco's score as an equity beta until
    # that is settled.
    base_ebitda: 29560
    # CONSOLIDATED, for P3 only. Required because base_ebitda above is a SEGMENT
    # figure while EV is whole-company (all shares, all net debt) — dividing one
    # by the other prices a company that does not exist. Splitting the segment
    # out re-rated Hindalco 11.21x -> 12.29x on no news until this was added.
    # Rs14,989 cr x 4 = Rs59,956 cr. Verbatim: "Consolidated EBITDA for the
    # first quarter stood at Rs14,989 crore, up 73% from the same quarter last
    # year." Only Hindalco needs this; every other name's economics lines cover
    # the whole entity, so they fall back to base_ebitda.
    valuation_ebitda: 59956
    base_ebitda_source: >
      Hindalco Q1 FY27 press release, quarter ended 30 June 2026, verbatim:
      "Record Aluminium quarterly Upstream EBITDA at Rs7,390 crore, up 81%,
      driven by favourable macros and stronger operational performance".
      Annualised x4 per the base_quarter convention above.
      https://www.hindalco.com/media/press-releases/hindalco-results-q1fy27
    base_ebitda_caveat: >
      +81% yoy. A peak-cycle quarter, so annualising overstates a mid-cycle
      base — the same caveat NALCO carries, and deliberately worded the same way
      because both are annualised from the same quarter. FY26 actual upstream was
      Rs18,884 crore, so the annualised figure is 57% above the last full year.
      If a mid-cycle base is wanted, use FY26 and change NALCO's the same day;
      changing one and not the other silently breaks the pair.
    shares_outstanding: 2247230000     # Wind total_shares, 500440.BO
    shares_verify: sourced
    net_debt: 74207                    # screener.in consolidated, Mar 2026:
                                       # Borrowings 99,165 less Investments 24,958.
                                       # Cross-check: the digest cited Novelis
                                       # alone at $7.9bn = ~75,390cr, so the
                                       # consolidated figure landing at 74,207
                                       # implies India standalone is near net
                                       # cash. Two independent sources agreeing
                                       # within 2%.
    net_debt_verify: sourced
    valuation_metric: ev_ebitda
    primary_output: aluminium_ingot
    source_note: "India Aluminium UPSTREAM only, 1QFY27 annualised — matches the
      entity's spec lines. Copper, Downstream and Novelis are excluded by
      construction; Novelis has its own block below."
    verify: sourced

  # ==========================================================================
  # NOVELIS — added 2026-08-24. It had a full economics spec in aluminium.yaml
  # and NO DENOMINATOR ANYWHERE, so it could not be scored at all, and its
  # earnings sat silently inside Hindalco's consolidated base while also being
