      a strong quarter on a +Rs2,950/t realisation gain that management itself
      guided to reverse ("India 2Q realisation -Rs1,500/t", coking coal +$5/t),
      so the India base is above run-rate. Europe was at a LOSS, so the
      consolidated base is BELOW a normalised one. The two do not cancel and
      they sit in different fields.

