# ============================================================================
# steel — two peer groups, five scored names
# ============================================================================
# Added 2026-08-25. Peer-group split set by the PM. It is TWO groups because a
# peer group is a scoring universe and these sets of names do not share a cost
# stack. It was FOUR on 2026-08-25, three after shyam_metalics was dropped that
# evening, and two after jindal_stainless was dropped on 2026-08-26 — both on
# evidence rather than tidiness, both recorded below.
#
#   steel_integrated   tata_steel, jsw_steel, jindal_steel, sail
#                      Blast-furnace mills. HRC or rebar out, iron ore and
#                      coking coal in. The only group where pairs are
#                      like-for-like.
#   steel_converter    apl_apollo
#                      Buys HRC, sells tubes, and is scored on a DIFFERENT
#                      ECONOMICS BASIS from the mills — the HRC vs secondary-steel
#                      spread, transmitting through VOLUME, not a margin bridge.
#                      See economics_spread on the entity. The "opposite sign on
#                      the same series" this line once claimed is REFUTED
#                      (+0.103 against the mills' +0.076 and +0.109).
#
# steel_stainless held jindal_stainless and was REMOVED 2026-08-26 (PM), leaving
# FIVE scored names. The deciding evidence was measured, not asserted: JSL loads
# +0.021 on LME nickel over the past 3 years against tata_steel's +0.209 and
# jsw_steel's +0.299 — LESS than two names that consume no nickel — and +0.014 on
# aluminium. It does not respond to any commodity this store carries, which is
# what the bridge exists to exploit. It also has no concall ledger (no
# JINDALSTNLS_Concall directory exists) and no OI, so it was scoring on valuation
# and mood alone. See packages/review/nickel_jsl.py and the entity note.
#
# steel_secondary held shyam_metalics and was REMOVED 2026-08-25 (PM). Its
# peer_group is now null in specs/entities/steel.yaml so it is not scored at all
# — four segments including aluminium, a sponge-iron cost route, and economics
# already withheld. Data retained; re-enabling is one line.
#
# THE FIVE SCORED NAMES are the four blast-furnace mills plus apl_apollo.
#
# apl_apollo NO LONGER USES A MARGIN BRIDGE. PM instruction 2026-08-26: score it
# on the HRC vs secondary-steel spread, transmitting through VOLUME, 1-5 directly
# rather than through pct_of_ebitda. The bridge answered its question correctly
# and uselessly — output and input both on hrc_india_inr netted to ~0, and the
# equity nets to ~0 on HRC too (+0.103 vs the mills' +0.076/+0.109), so per-tonne
# margin is simply not the quantity that moves this company.
#
# THE MECHANISM: it buys primary coil; the small tube makers it competes with buy
# cheap secondary sheet ("patra"). Wide gap = its feedstock is dear in relative
# terms = it loses share = volumes fall. The digests name exactly this as the
# monitorable: "key watch: steel price outlook and impact of widening HRC-Patra
# gap".
#
# THE SCORE NOW MOVES AND THE TRAJECTORY CORROBORATES: spread z went +0.96 (Mar)
# -> +3.17 (Jun) -> +1.94 (now), scoring 2.03 -> 1.30 -> 1.54. It peaked at 3sd
# wide THROUGH Q1FY27, the quarter APL Apollo printed 745kt against 800-900kt
# guided with its 15-20% growth guide "expected to be cut to single digits".
#
# STILL NOT VALIDATED, and read it as PM-specified rather than measured: weekly
# returns show no relationship (r +0.010 over 3y), which is expected for a
# quarterly volume mechanism rather than evidence against. The settling test is
# spread vs REPORTED VOLUMES, and `observations` holds one volume actual for this
# name so far.
#
# NOTE THE SUBSTITUTE LEG IS A PROXY: rebar_india_secondary_inr is secondary
# REBAR, a long product; patra is secondary FLAT. Same secondary price level,
# different form, not renamed — invariant 6.
#
# WHY IT IS KEPT WHERE jindal_stainless WAS NOT: JSL had no measurable response to
# ANY commodity in the store, no concall ledger and no OI. apl_apollo has 11
# graded concall commitments, 91 OI rows, and an economics reading that is
# approximately correct rather than misleading.

sector: steel
spec_version: 0.2.0
peer_groups: [steel_integrated, steel_converter]

# ----------------------------------------------------------------------------
# P1 ASP + P2 COSTS
# ----------------------------------------------------------------------------
pillars_1_2:
  windows_days: [1, 5, 20]
  materiality:
    min_pct_of_ebitda: 0.015
    on_fail: emit_nothing

  # THE STRUCTURAL CLAIM, and it is testable rather than asserted — see
  # validation.test_1 below, which has been RUN.
  dispersion_note: >
    Coking coal sets the sector's LEVEL; iron ore captivity sets its DISPERSION.
    Nobody in India has captive coking coal of steel grade, so a seaborne coking
    coal move hits all four mills and differentiates them only by EBITDA/t — the
    thin-margin name takes the larger percentage hit. Iron ore is the opposite:
    Tata and SAIL are ~fully captive and JSW and Jindal Steel largely buy, so the
    same ore print separates them by an order of magnitude. Trade ore, not coal.

  margin_note: >
    EBITDA/t IS THE BETA HERE, and it is disclosed every quarter, which steel has
    and aluminium does not. SAIL earns Rs9,974/t against Tata's Rs18,199/t, so the
    same rupee-per-tonne cost move is ~1.8x more material to SAIL. That is
    invariant 5 working as intended: it comes out of base_ebitda and the volumes,
    and must never be adjusted with a coefficient.

# ----------------------------------------------------------------------------
# P3 VALUATION
# ----------------------------------------------------------------------------
pillar_3:
  metrics: [ev_ebitda]
  reference: own_history
  lookback_days: 1260
  note: >
    Computed the same way as every other name: (price x shares + net_debt) /
    base_ebitda. What is DIFFERENT for steel is where net_debt comes from — the
    `Borrowings - Investments` convention used for the non-ferrous names
    overstates it on every steel name where a cited figure exists, and flips the
    sign on APL Apollo. These use the digest-cited 1QFY27 figure instead. The
    measured effect and the reason are in specs/entities/base_financials.yaml;
    SAIL is the one name with no cited cross-check and its multiple should be
    read as a ceiling.

# ----------------------------------------------------------------------------
# P4 GUIDANCE
# ----------------------------------------------------------------------------
pillar_4:
  track_metrics: [volume, ebitda_per_t, coking_coal_cost, capex]
  note: >
    Steel is the best P4 candidate in the book so far, better than HZL. The
    guidance is numeric, dated, per-tonne and resolves every quarter, and the
    digests already carry both sides of it — the commitment and the outcome. Live
    examples from this quarter alone: SAIL "FY27 volume guide 22-22.5mt held",
    Jindal Steel "expects 2Q EBITDA/t to give back ~Rs2,700/t", Jindal Stainless
    "1H guidance Rs18-20k/t" against Rs22,884 realised, APL Apollo "15-20% volume
    growth expected to be cut to single digits", Tata "India 2Q realisation
    -Rs1,500/t".
  caution: >
    A GUIDE AND A PRINT MUST BE THE SAME QUANTITY, AND THIS IS NO LONGER
    HYPOTHETICAL — IT IS LIVE AND IT IS MOVING A SCORE.

    P4 went live for steel on 2026-08-25 and SAIL scored 1.95 on a single gap:
    volume FY27 at -24.4%. That gap is 16.64mt (4.16mt Q1 annualised, SALEABLE
    SALES) against the 22-22.5mt guide, and the guide is almost certainly CRUDE
    STEEL PRODUCTION. 16.64 / 22.0 = 0.756, i.e. the -24.4% is very close to
    being the basis difference itself rather than a shortfall.

    SO DO NOT TRADE SAIL'S P4 UNTIL THE BASIS IS CONFIRMED. It is left live and
    flagged rather than withdrawn, because the commitment is real and dated and
    hiding it would be worse — but the score is not yet evidence of a miss.
    Resolve by finding SAIL's saleable-steel guide, or its production actual, so
    both sides sit on one basis.

    Jindal Steel's -16.2% on the same metric is LESS suspect: its guide
    ("FY27 volume guidance of 10.5-11mt") and its actual ("Sales +17% yoy at
    2.2MMT") are both stated as sales. 8.8mt annualised against 10.5mt is a
    genuine Q1 run-rate shortfall, and management itself is on record that the
    guide "looks tough to achieve given sharp reduction (~20%) in long-product
    prices".

# ----------------------------------------------------------------------------
# GATE
# ----------------------------------------------------------------------------
gate:
  scope: steel
  consumed_by: flows           # NOT by scoring, per the reclassification in
                               # aluminium_primary.yaml. Nothing in
                               # packages/score/ reads this.
  pair_exception: true

# ----------------------------------------------------------------------------
# OUTPUT
# ----------------------------------------------------------------------------
output:
  emit_singles: true
  emit_pairs: true
  pair_candidates:
    # ========================================================================
    # REWRITTEN 2026-08-25, after every captive share was sourced. The v0.1.0
    # rationales were built on the assumption that JSW *and* Jindal Steel bought
    # their ore while Tata and SAIL were captive — a 2-vs-2 split. It is not:
    #
    #   tata_steel      captive 1.00   ore shock -1.78%
    #   sail            captive 1.00   ore shock -3.25%
    #   jindal_steel    captive 0.92   ore shock -3.48%   <- WAS assumed ~0.25
    #   jsw_steel       captive 0.37   ore shock -7.52%
    #
    # JSW IS THE ONLY ORE-EXPOSED NAME IN THE GROUP. Every ore pair is therefore
    # something-vs-JSW, and the intra-captive pairs carry almost no ore content.
    # ========================================================================
    - pair: [tata_steel, jsw_steel]
      rationale: >
        THE FLAGSHIP, and now the only clean ore expression in the group. Captive
        ore against 37%-bought ore, both flat-product mills of similar scale, both
        priced off the same HRC series — so HRC largely cancels and what is left is
        the ore differential plus Tata's Europe exposure. On a +USD20/t ore shock
        the bridge reads Tata -1.78% against JSW -7.52%, a 5.74pp spread scoring
        4.10.

        NOTE THE SPREAD HAS NARROWED TWICE as the inputs got sourced: 7.16pp in
        v0.1.0 on guessed captive shares, 6.81pp once the ad valorem royalty put
        captive miners at 0.20 rather than 0.05, and 5.74pp once JSW turned out to
        be 37% captive rather than the assumed 25%. Each step made the pair
        weaker and better founded. That direction is worth noticing: the guessed
        version flattered the trade.
      residual_exposure: >
        NOT commodity-neutral: the long leg carries Tata Steel Europe, which is
        loss-making and moves on European HRC and CBAM rather than on Indian ore.
        Report it — a 1:1 sizing here leaves a European steel position nobody
        chose, the same warning zinc.yaml makes about silver.

    - pair: [sail, jsw_steel]
      rationale: >
        The second-best ore expression, 4.27pp scoring 3.88. Fully captive ore and
        a 50/50 flat/long book against 37%-captive ore and a flat book.

        BUT CHECK COKING COAL BEFORE PUTTING IT ON, because it works against you:
        SAIL imports ~95% of its coking coal against JSW's 100%, and SAIL earns
        Rs9,974/t against JSW's Rs15,110/t, so on a coal rally SAIL takes -12.86%
        to JSW's -8.85%. Ore and coal pull this pair in opposite directions, and
        coal is the bigger line for both.

    - pair: [jindal_steel, jsw_steel]
      rationale: >
        NEW, and it exists because Jindal Steel turned out to be 92% captive on
        ore. 4.04pp scoring 3.84, i.e. nearly as good an ore expression as
        sail/jsw, and with better-matched legs: both are growth-capex names, both
        largely flat-and-VAP, neither carries a foreign loss-making division.
      caveat: >
        JINDAL'S CAPTIVE SHARE IS SCHEDULED TO FALL. CARE expects it to decline to
        ~40-50% "after the ramp-up of JSOL operations", because new Angul capacity
        grows the denominator faster than the mines grow. When that lands this
        pair loses most of its ore content, so it is a pair with a KNOWN
        expiry rather than a structural one. Date it via `effective_from`.

    - pair: [tata_steel, jindal_steel]
      rationale: >
        DEMOTED, and kept only to record why. v0.1.0 called this "the widest ore
        spread in the group" at 9.02pp, which was an artefact of reading the
        digest's "captive iron ore targeted ~40% by FY27-end" as a rise toward 40%
        rather than a decline from 92%. With Jindal at 0.92 captive the spread is
        1.69pp and the pair score 3.33 — it is now one captive miner against
        another. Do not use it for an ore view.

        What still separates the legs is product mix: Jindal is 66% value-added
        long-weighted, Tata is flat. That is a mix trade, not an ore trade, and
        the spec has no VAP price series to express it with.

    - pair: [tata_steel, apl_apollo]
      cross_peer_group: true
      status: REFUTED
      rationale: >
        WITHDRAWN 2026-08-26 ON MEASUREMENT, and kept only to record that it was
        wrong. This read: "THE HRC MIRROR. A mill against a converter of the same
        coil: rising HRC is revenue to Tata and cost to APL Apollo. Structurally
        the sharpest pair available in the sector, and the only one whose legs sit
        on opposite sides of a single price series."

        The legs do NOT sit on opposite sides. packages/review/driver_beta.py,
        weekly log returns vs hrc_india_inr over 3 years:

            apl_apollo   +0.103    tata_steel   +0.076    jsw_steel  +0.109

        Same sign, same magnitude, and APL Apollo's excess over the two mills is
        +0.011. A short-coil leg would read NEGATIVE. It does not, on either the
        3-year or the since-2016 window.

        THE REASONING THAT PRODUCED IT WAS SOUND AND THE CONCLUSION WAS STILL
        WRONG, which is the part worth keeping. "It buys coil and sells tubes,
        therefore it is short coil" is correct about the physical flow and wrong
        about the equity, because APL Apollo passes coil through on brand pricing
        power — "EBITDA/t Rs5,522 flat qoq despite... dealer destocking", "APL
        preserved margins over volume". A structural argument about a cost stack
        is a hypothesis about an exposure, not evidence of one.
      blocked: no_measurable_hrc_differential
      blocked_note: >
        The block reason CHANGED with the measurement, and the change matters.
        It used to read `conversion_spread_unpriced` — "the bridge reports the
        name as HRC-neutral when the digests plainly say rising coil hurt it",
        i.e. we cannot measure a real exposure. The truth is the other way round:
        the exposure is not there to measure. The bridge netting to -0.73% on a
        +Rs2,000/t HRC shock is roughly what the equity does too.

        SO THIS PAIR IS NOT WAITING ON A DATA FEED. A tube price series would let
        the CONVERSION SPREAD be modelled, which is worth having for APL Apollo's
        own economics — but it would not resurrect this pair, because the pair
        needs the two legs to respond to HRC in opposite directions and they do
        not. Do not re-add it when a tube series arrives.

  require_falsifier: true
  report_residual_beta: true

  conviction_rules:
    high:   pct_of_ebitda >= 0.05 and priced_in == not_priced and no_veto
    medium: pct_of_ebitda >= 0.03
    low:    otherwise

# ----------------------------------------------------------------------------
# VALIDATION
# ----------------------------------------------------------------------------
validation:
  test_1_economics: RUN 2026-08-25, PASSED; re-run same day after the SAIL 50/50 split
  test_1_result: >
    The sanity check aluminium_primary.yaml demands before any prediction
    testing — does the bridge produce the ordering the desk already believes.
    Three shocks, all four mills:

      iron_ore_china_cfr62 +20 USD/t
        jsw_steel     -7.52%                         <- the ONLY ore-exposed name
        jindal_steel  -3.48%   sail       -3.25%   tata_steel -1.78%
        FINAL after every captive share was sourced. All four are material, but
        the shape is 1-vs-3 rather than the 2-vs-2 this spec was built on:
        captive 0.37 (JSW) against 0.92 / 1.00 / 1.00. Jindal Steel moved from
        -9.09% to -3.48% when CARE Ratings put its captive share at ~92% for
        FY26 — see the misreading note on that entity's ore line.
        RE-RUN 2026-08-25 after the ore intensity went 1.60 -> 1.70 (desk model)
        and the captive names' market_pct went 0.05 -> 0.20 (ad valorem royalty).
        Previously read jindal -9.44% / jsw -7.58% / sail -0.77% / tata -0.42%,
        with the captive pair IMMATERIAL and emitting no trade.

        THE BEHAVIOURAL CHANGE IS THE POINT: Tata and SAIL now CROSS the 1.5%
        materiality threshold on an ore move instead of being filtered out. That
        is correct — a fully captive miner still pays 15% royalty plus DMF and
        NMET on the benchmark ASP, so it is ~20% exposed, not ~0%. The captive
        advantage is now ~5x rather than ~18x, and 18x was an artefact of
        treating a mine like an internal transfer of a processed intermediate.

      coking_coal_spot_aus +20 USD/t
        jindal_steel -11.01%
        jsw_steel     -8.85%   tata_steel    -5.73%
        sail         -12.86%   <- now the MOST coal-exposed name
        All four material and all negative — no captivity dispersion, and the
        ordering is set by EBITDA/t and by import share. FINAL numbers after all
        captive shares were sourced 2026-08-25: Tata's coking coal market_pct went
        0.80 (guess) -> 0.78 (~78% imported) and SAIL's 0.85 (guess) -> 0.96
        (~95% imported, only 0.59 MT captive in FY25, CAG-censured). SAIL is
        therefore both the thinnest-margin AND the most import-exposed name, which
        is why it takes the largest hit of the four.

      hrc_india_inr +2000 INR/t
        jindal_steel +16.48%   jsw_steel +13.24%   tata_steel +10.99%
        sail         +10.02%
        RE-RUN 2026-08-25 after SAIL went to a 50/50 flat/long split. It
        previously read +0.00% and the note here said "SAIL correctly does not
        respond — it is priced off rebar, not HRC". That was right for the
        all-rebar version; SAIL now carries 8.32mt of HRC.

      rebar_india_primary_inr +2000 INR/t
        sail         +10.02%
        every other name +0.00%
        Added as a fourth shock BECAUSE the HRC test no longer isolates the mix
        difference. Rebar is now the only series that separates SAIL from the
        group, and its symmetry with the HRC result (+10.02% on both) is the
        check that the 50/50 split is actually 50/50 rather than mis-weighted.

  test_5_basis_from_the_desk_model: >
    FLAGGED, DELIBERATELY NOT APPLIED. The desk's Tata Steel model
    (data/models/tata_steel_*.xlsx, `Input` sheet) gives India standalone
    FY27E as 23.21 mt at Rs16,757/t = Rs38,901 cr. This spec carries 20.68 mt
    (5.17 mt Q1FY27 sales x4) against base_ebitda Rs37,636 cr.

    The EBITDA figures agree to 3.3%, which is a good independent check on the
    denominator. The VOLUMES are 11% apart, because Q1FY27 was a weak-volume,
    strong-margin quarter (sales -16% QoQ, EBITDA/t +Rs2,950 QoQ) and this spec
    annualises it.

    What matters for the bridge is the RATIO, since d_revenue = volume x d_price
    over base_ebitda:

        this spec   20.68 mt / 37,636 cr = 549 t per crore
        desk model  23.21 mt / 38,901 cr = 597 t per crore

    So Tata's price sensitivity here is ~8.7% LOW against the model.

    NOT FIXED, and the reason is the rule rather than laziness: base_quarter is
    1QFY27-annualised for EVERY name in base_financials.yaml, and CLAUDE.md is
    explicit that changing one name's basis and not the others silently breaks
    the pair. Moving Tata to a full-year FY27E basis alone would make the
    flagship Tata/JSW comparison a like-for-unlike one. Switching the whole book
    to a forward full-year basis is a coherent alternative and a better one —
    it stops annualising whichever quarter happened to print — but it is one
    coordinated edit across all thirteen names plus base_quarter, not a Tata
    patch.

  test_2_direction: >
    NOT RUN, and it cannot be run yet. Does the sign of pct_of_ebitda at date D
    predict the sign of the 5- and 20-day RELATIVE move for each pair? Report hit
    rate overall and conditioned on conviction. Needs a score backfill first.

  test_3_captive_shares: >
    THE REAL GATE ON THIS SPEC, and it is a data gap rather than a test.
    `market_pct` on the iron ore lines is what produces the entire result of
    test_1, and only ONE of the four is cited anywhere in the 48 digests —
    Jindal Steel's "captive iron ore targeted ~40% by FY27-end", which is a
    forward target rather than today's share. JSW has a 2030 target. Tata and
    SAIL have nothing but sector knowledge.
    So test_1 currently confirms that the ARITHMETIC works, not that the INPUTS
    are right. Confirm all four captive shares against annual reports before
    sizing anything off this group.

  test_4_coproduct_basis: >
    OPEN, and it is a SPEC-FORMAT gap rather than a bug. Referenced from the
    warning block on `sail` in specs/entities/steel.yaml.

    The bridge has no way to say "these two output lines are the same tonnes sold
    in two forms". `basis_volume()` returns the volume of the ONE output line
    named in `basis_item`, and `_primary()` returns the FIRST output line. Both
    assume a second output is a BY-PRODUCT sitting on top of the primary tonnage
    — which is exactly right for nalco/hindalco `alumina_surplus` and hzl
    `silver_byproduct`, and exactly wrong for SAIL's 50/50 flat/long split, where
    the two lines are CO-PRODUCTS dividing one tonnage and sharing one cost base.
    Identical YAML shape, opposite meaning, and the engine cannot tell.

    Consequence, measured: the naive split halved SAIL's whole cost side (coking
    coal -11.38% -> -5.69%) while leaving revenue intact. Worked around in the
    spec by writing each input line twice, once per basis_item. That restores
    `pct_of_ebitda` exactly and is verified.

    WHAT THE WORKAROUND DOES NOT FIX: `d_ebitda_per_t` still divides by the first
    output's 8.32mt while `d_ebitda` covers all 16.64mt, so SAIL's reported /t is
    2x too high (10,000 where 5,000 is correct). It is a display metric and does
    not affect any score — but EBITDA/t is the native unit the steel sell-side
    quotes, so it is the one number a reader here is most likely to sanity-check
    against a broker note, and it will not match.

    THE REAL FIX, for a decision rather than a guess: an explicit field marking
    output lines that share a cost base — e.g. `basis_group: crude_steel` on both
    of SAIL's outputs — with `basis_volume()` summing the group and the per-tonne
    denominator using the group total. That removes the duplicate input lines and
    closes the class. It IS an engine change, which the README modularity test
    says means the spec format is wrong — and here the spec format IS wrong: the
    co-product/by-product distinction is real modelling information the format
    cannot express. Worth doing before a second co-product name appears; the
    duplicate-line workaround does not scale and reads as redundancy to anyone
    tidying up.

  minimum_bar: >
    Directional hit rate above 55% on high-conviction pairs, monotonic
    improvement from low to high conviction, and L2 must beat L1 alone. Same bar
    as aluminium_primary, deliberately unchanged — and note that group has still
    not cleared it, on sample size rather than on signal.

  known_discontinuities: >
    Three, all of which break a long regression rather than a daily score:
      jsw_steel 1QFY27      BPSL/JFE JV changes the consolidation perimeter for
                            both debt and volumes ("+3% YoY, flat QoQ EX-BPSL").
      jindal_stainless      -60.9% on 2015-11-19 in the price series is the JSL
                            restructuring. A CANDIDATE, not confirmed against a
                            filing, and NOT in tape.CONFIRMED_ACTIONS.
      all four, 2022-05-21  the 15% steel export duty. A REAL market move, not a
                            corporate action — draw through it.
