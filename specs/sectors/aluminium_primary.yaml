# ============================================================================
# Factor spec — peer_group: aluminium_primary
# ============================================================================
# STATUS: PROPOSAL, v0.1.0. This is the "scoring regime" you wanted to discuss
# in detail. Weights are my starting estimates, flagged so you can attack the
# numbers individually.
#
# Two structural choices differ from the old matrix and matter more than any
# weight:
#
#   A. ALPHA vs MODIFIER. Broker mood and positioning are NOT summed into the
#      composite. Summing them is how a system ends up recommending the most
#      crowded name — consensus bullishness reads as alpha when it is actually
#      the reason the move has already happened. Here they only adjust
#      conviction and size, and can veto. Direction comes from fundamentals.
#
#   B. TIME-SERIES normalisation, not cross-sectional z. This peer group has
#      three tradeable names. A z-score over n=3 is arithmetic, not statistics:
#      one name is mechanically ~+1.2 and one ~-1.2 regardless of whether
#      anything happened. So each factor is normalised against ITS OWN history
#      for that name ("how unusual is this level for Hindalco?"), and names are
#      then compared on those normalised moves plus the pair spread.
#      >> This is the item I most want your view on. <<
# ============================================================================

peer_group: aluminium_primary
spec_version: 0.1.0
members: [hindalco, nalco, vedanta]

normalisation:
  method: timeseries_z          # per entity, per factor, against own history
  lookback_days: 252
  min_history_days: 60          # below this, factor emits no score (not a zero)
  winsorise_pct: 2.5            # clip tails so one bad print cannot dominate
  cross_sectional_z: false      # deliberately OFF at n=3 — see note B above

# ----------------------------------------------------------------------------
# ALPHA FACTORS — summed, signed by each entity's exposure, into the composite
# ----------------------------------------------------------------------------
alpha_factors:

  output_price:
    weight: 0.22
    metrics: [lme_aluminium_3m, lme_aluminium_cash, japan_premium, domestic_premium]
    horizon_days: 5
    notes: Shared across the group; contributes little to RELATIVE ranking by design.

  alumina:
    weight: 0.20                # high, because it is the main differentiator here
    metrics: [alumina_fob_australia, alumina_spot_index, lanjigarh_utilisation]
    horizon_days: 5
    notes: >
      The one factor whose SIGN flips across the group (+0.95 NALCO, -0.55 VEDL,
      +0.15 HNDL). This is where relative signal actually comes from, and it is
      exactly what an absolute per-company score cannot express.

  energy_cost:
    weight: 0.14
    metrics: [coal_eauction_premium, thermal_coal_import, power_cost_per_t, cil_supply]
    horizon_days: 10

  other_input_cost:
    weight: 0.07
    metrics: [caustic_soda, cp_coke, coal_tar_pitch, carbon_anode]
    horizon_days: 10

  volume_growth:
    weight: 0.11
    metrics: [monthly_production, capacity_ramp, smelter_utilisation, expansion_milestone]
    horizon_days: 30

  downstream_mix:
    weight: 0.10
    metrics: [novelis_can_spread, novelis_scrap_spread, novelis_shipments,
              value_added_share, vap_realisation]
    horizon_days: 20
    notes: Effectively a Hindalco-only factor (exposure +0.90 vs +0.05 NALCO).

  fx_usdinr:
    weight: 0.06
    metrics: [usdinr_spot]
    horizon_days: 5

  balance_sheet:
    weight: 0.05
    metrics: [net_debt_ebitda, capex_guidance, refinancing, credit_rating]
    horizon_days: 60

  governance_overhang:
    weight: 0.05
    metrics: [promoter_stake_change, demerger_step, dividend_policy, pledge,
              disinvestment_headline, related_party]
    horizon_days: 30
    notes: Small weight but large VEDL exposure (-0.90), so it lands mostly there.

# weights above must sum to 1.0 — asserted by the loader, not trusted here.

# ----------------------------------------------------------------------------
# MODIFIERS — never change direction. Adjust conviction, size, or veto.
# ----------------------------------------------------------------------------
modifiers:

  estimate_revision:
    role: conviction
    metrics: [ebitda_revision_breadth, ebitda_per_t_revision, tp_revision_breadth]
    effect: >
      Confirms or contradicts the fundamental read. Agreement raises conviction
      one notch; contradiction lowers it one notch. Cannot flip direction.

  broker_consensus:
    role: crowding
    metrics: [rating_dispersion, net_rating_change, coverage_count, consensus_tp_gap]
    effect: >
      A crowded long is a SMALLER position, not a stronger signal. When our
      direction matches near-unanimous consensus AND consensus_tp_gap is thin,
      cut size. When we disagree with consensus, keep direction and flag it for
      review — that is a thesis to defend, not to suppress.

  positioning:
    role: timing_veto
    metrics: [oi_percentile, oi_buildup, futures_basis, rollover_pct]
    effect: >
      Extreme OI percentile against our direction (>85th on the opposite side)
      downgrades conviction to `low` and sets a wait flag. It never inverts the
      fundamental call — it says the entry is poor, which is a different claim.

# ----------------------------------------------------------------------------
# GATES — when the answer must be "no trade"
# ----------------------------------------------------------------------------
gates:

  dispersion:
    metric: composite_spread          # best composite minus worst, in normalised units
    min: 0.40
    on_fail: emit_flat
    notes: >
      Directly targets the old failure where 44 names sat inside a 1.0 band and
      every one got a lean. Below this spread the honest output is "nothing to
      do in aluminium today" — recorded as a run, with dispersion_ok = 0.

  staleness:
    max_stale_days: 15
    scope: any_factor_above_weight
    weight_threshold: 0.15
    on_fail: downgrade_conviction
    notes: >
      If a factor carrying >15% weight has no confirmation in 15 days, the
      composite is not trustworthy at full conviction. Says so instead of
      silently decaying toward a mean.

  coverage:
    min_factors_scored: 5
    on_fail: emit_no_score
    notes: A name with fewer than 5 of 9 alpha factors observed gets NO score at all.

# ----------------------------------------------------------------------------
# OUTPUT — what a run must produce. The old system stopped at the score.
# ----------------------------------------------------------------------------
output:
  emit_singles: true
  emit_pairs: true
  pair_candidates:
    - [nalco, vedanta]        # cleanest alumina-sign expression: +0.95 vs -0.55
    - [nalco, hindalco]       # alumina and INR vs Novelis
    - [hindalco, vedanta]     # quality/governance spread, low commodity content
  require_falsifier: true     # schema enforces this too
  conviction_rules:
    high:   composite_spread >= 0.80 and no_gate_failures
    medium: composite_spread >= 0.40
    low:    otherwise

# ----------------------------------------------------------------------------
# VALIDATION — the go/no-go before any of this is trusted or extended
# ----------------------------------------------------------------------------
validation:
  backfill_from: 2026-06-17        # earliest dated broker digest available
  backfill_to:   2026-08-14
  test: >
    Does the pair ranking, computed on data available at date D only, predict
    the sign of the realised 5- and 10-day relative move for each pair? Report
    hit rate, and hit rate conditioned on conviction. If high-conviction calls
    are not better than low-conviction ones, the weights are decoration and
    must be refitted before any second sector or any front-end work.
  minimum_bar: >
    Directional hit rate above 55% on high-conviction pairs, AND monotonic
    improvement from low to high conviction. Below that, do not proceed —
    revise the spec.
