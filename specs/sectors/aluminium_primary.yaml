# ============================================================================
# aluminium_primary — three-layer config
# ============================================================================
# Replaces the factor-weight/z-score spec entirely. There are no factor weights
# and no normalisation method, because there is no longer a factor model:
# Layer 1 is arithmetic on each company's own cost and revenue structure, in
# rupees and basis points.
#
# The layers answer three different questions, in order, and each can stop the
# process:
#   L1  Did the economics actually change, and by how much?      -> DIRECTION + SIZE
#   L2  Is that already in the price?                             -> CONVICTION
#   L3  Can the sector express it at all (tezi / mandi)?          -> PERMISSION
# ============================================================================

peer_group: aluminium_primary
spec_version: 0.2.0
members: [nalco, hindalco, vedanta]     # vedanta via segment_weights
reporting_units: [vaml, novelis]        # carry economics, never scored directly

# ----------------------------------------------------------------------------
# LAYER 1 — the margin bridge
# ----------------------------------------------------------------------------
layer1:
  windows_days: [1, 5, 20]        # run the bridge over each; 1d is noise, 20d is thesis

  formula: |
    For each output line:  d_revenue += volume * d_price(price_link, window)
    For each input line:   d_cost    += basis_volume * intensity * market_pct
                                        * d_price(price_link, window)
    d_ebitda      = d_revenue - d_cost
    pct_of_ebitda = d_ebitda / base_ebitda        <- the materiality test

    market_pct is what makes this per-company rather than per-sector. A captive
    input contributes ZERO to d_cost regardless of how far its market price
    moves, which is the whole reason NALCO and VAML respond oppositely to
    alumina.

  materiality:
    min_pct_of_ebitda: 0.015      # below 1.5% of EBITDA, an economics move is
                                  # not a trade. Directly targets the old failure
                                  # of reporting a lean on every name every day.
    on_fail: emit_nothing

  coverage:
    min_lines_priced_pct: 0.70    # if under 70% of weighted lines have a fresh
                                  # price, the bridge says "cannot tell"
    on_fail: emit_no_bridge       # NOT a zero, and NOT a decay toward neutral

  currency: INR
  fx_handling: |
    Convert USD-linked lines at spot USDINR, and treat USDINR itself as a price
    input rather than a separate factor. A weaker INR then shows up naturally as
    a revenue tailwind on USD-linked outputs against an INR cost base, sized
    correctly per company instead of via a guessed sensitivity.

# ----------------------------------------------------------------------------
# LAYER 2 — is it priced in
# ----------------------------------------------------------------------------
# Never sets direction. Only conviction and size. This is the guard against
# recommending the most crowded name because everyone is bullish on it.
layer2:
  valuation:
    metric: ev_ebitda
    reference: own_history          # vs its OWN percentile, not vs peers
    lookback_days: 1260             # ~5y
    rules:
      - if: pctile > 80 and direction == long
        then: priced_in = priced;  downgrade_conviction
      - if: pctile < 20 and direction == long
        then: priced_in = not_priced; upgrade_conviction
      - if: pctile < 20 and direction == short
        then: priced_in = priced;  downgrade_conviction

  consensus:
    role: crowding
    rules:
      - if: net_rating > 0.7 and consensus_tp_gap_pct < 10 and direction == long
        then: cut_size
        note: unanimous and no upside left to consensus TP — the move has happened
      - if: sign(net_rating) != sign(direction)
        then: flag_for_review
        note: >
          Disagreeing with consensus is a thesis to defend, not to suppress.
          Keep direction, surface it, and let the review layer grade it.

  positioning:
    role: timing_veto
    rules:
      - if: oi_percentile > 85 and oi_buildup opposes direction
        then: conviction = low; wait_flag = true
        note: a poor entry is a different claim from a wrong call — never inverts L1

# ----------------------------------------------------------------------------
# LAYER 3 — sector regime (tezi / mandi)
# ----------------------------------------------------------------------------
# The permission layer. Your own framing: if the sector lacks investor
# interest, positive news does not make stocks run up.
layer3:
  scope: aluminium                # regime is measured on the coverage bucket
  inputs:
    breadth_pct:     {source: pct_of_sector_above_50dma}
    rel_strength:    {source: sector_index_vs_nifty, lookback_days: 60}
    turnover_pctile: {source: sector_turnover_vs_own_history, lookback_days: 252}
    flow_fii:        {source: fii_sector_flow, lookback_days: 20}
    dispersion:      {source: intra_sector_return_dispersion, lookback_days: 20}

  states:
    tezi:
      when: rel_strength > 0 and breadth_pct > 60 and turnover_pctile > 50
      can_express: true
      note: longs work, good news is rewarded
    mandi:
      when: rel_strength < 0 and breadth_pct < 40 and turnover_pctile > 50
      can_express: true
      note: shorts work; a positive L1 on a long may still be ignored
    neutral:
      when: otherwise
      can_express: true
      size_multiplier: 0.6
    dead:
      when: turnover_pctile < 25
      can_express: false
      note: >
        No investor interest. Signals are still COMPUTED AND RECORDED with
        l3_gated = 1, so the review layer can later ask whether the gate cost
        money or saved it. Suppressing them silently would destroy that test.

  pair_exception: |
    A market-neutral pair inside a dead sector is far less regime-dependent
    than an outright, because it needs relative rather than absolute interest.
    Pairs are permitted in `dead` at reduced size; outrights are not.

# ----------------------------------------------------------------------------
# OUTPUT
# ----------------------------------------------------------------------------
output:
  emit_singles: true
  emit_pairs: true
  pair_candidates:
    - pair: [nalco, vedanta]
      rationale: >
        The cleanest alumina expression available. NALCO sells surplus alumina;
        VAML buys ~half its requirement. Same print, opposite sign, and the
        long leg additionally wins on INR. Cost: the short is VEDL, so only
        ~42% of the move is aluminium.
    - pair: [nalco, hindalco]
      rationale: >
        Alumina and INR against Novelis. Works when alumina leads and can
        spreads are soft; fails when Novelis is the driver.
    - pair: [hindalco, vedanta]
      rationale: >
        Governance and balance-sheet quality spread, deliberately low commodity
        content. Mostly a Layer 2 trade, and should be labelled as such.

  require_falsifier: true         # also enforced by a schema CHECK
  conviction_rules:
    high:   pct_of_ebitda >= 0.05 and priced_in == not_priced and no_veto
    medium: pct_of_ebitda >= 0.03
    low:    otherwise

# ----------------------------------------------------------------------------
# VALIDATION — the gate before any second sector or any front-end work
# ----------------------------------------------------------------------------
validation:
  backfill_from: 2026-06-17        # earliest dated broker digest on hand
  backfill_to:   2026-08-14

  test_1_economics: >
    Sanity-check the bridge before testing prediction. On a known alumina move,
    does it produce the ordering you already believe — NALCO positive, VAML
    negative, Hindalco small positive? If not, the intensities or market_pct
    values are wrong, and no amount of validation downstream will fix that.

  test_2_direction: >
    Using only data available at date D, does the sign of pct_of_ebitda predict
    the sign of the realised 5- and 20-day RELATIVE move for each pair? Report
    hit rate overall and conditioned on conviction.

  test_3_layers_earn_their_place: >
    Does each layer add anything? Compare hit rate for L1 alone, L1+L2, and
    L1+L2+L3. A layer that does not improve the hit rate is decoration and
    should be cut rather than kept for narrative completeness.

  minimum_bar: >
    Directional hit rate above 55% on high-conviction pairs, monotonic
    improvement from low to high conviction, and L2 must beat L1 alone.
    Below that, revise the spec — do not proceed to a second sector or to the
    front-end.
