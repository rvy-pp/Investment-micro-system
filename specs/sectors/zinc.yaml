# ============================================================================
# zinc — Hindustan Zinc vs Vedanta Ltd
# ============================================================================
# Rewritten in v0.2.0. The previous version built a sum-of-parts NAV model with
# a catalyst table for VEDL. That was over-engineering: the holdco discount is
# just a valuation metric (P3), and both names are modelled with the same four
# pillars as everything else.
#
# The desk's thumb rule, which this spec exists to express:
#   HZL  moves MORE, on zinc AND silver
#   VEDL is stable, and moves with zinc
#
# VEDL's zinc exposure is HZL's, scaled by its ~63.4% stake and diluted by the
# other businesses it retained. That is why it moves less, and it falls out of
# the ASP arithmetic rather than being asserted.
# ============================================================================

peer_group: zinc
spec_version: 0.2.0
members: [hindustan_zinc, vedanta]

# ----------------------------------------------------------------------------
# P1 ASP + P2 COSTS — same margin bridge as every other peer group
# ----------------------------------------------------------------------------
pillars_1_2:
  windows_days: [1, 5, 20]
  materiality:
    min_pct_of_ebitda: 0.015
    on_fail: emit_nothing

  note: >
    Silver is a real output line for HZL, not a footnote — a zinc-only read is
    wrong whenever silver is moving, and silver is the main reason HZL and VEDL
    diverge. VEDL carries the same zinc and silver lines at ~63.4%, plus copper,
    ferro chrome and nickel.

  residual_beta: >
    Because both legs carry zinc, a long/short pair here is NOT commodity-neutral
    by default — it is long the difference in exposure, which is mostly SILVER
    plus VEDL's non-zinc businesses. The engine must report the implied residual
    zinc and silver beta on every pair signal, so a 1:1 sizing never leaves a
    commodity position nobody chose.

# ----------------------------------------------------------------------------
# P3 VALUATION — where the holdco discount lives
# ----------------------------------------------------------------------------
pillar_3:
  metrics: [ev_ebitda, holdco_discount_pct]
  reference: own_history
  lookback_days: 1260
  note: >
    `holdco_discount_pct` is a column in market_layer alongside EV/EBITDA. It is
    read the same way as any other valuation metric: where does it sit against
    its own history. It gets no special model, no NAV build, no catalyst engine.

# ----------------------------------------------------------------------------
# P4 GUIDANCE — will they hit the quarter
# ----------------------------------------------------------------------------
pillar_4:
  track_metrics: [volume, cost_per_t, silver_volume, capex]
  note: >
    HZL guides explicitly on volumes and cost of production, which makes it a
    good test case for the guidance pillar: commitments are dated, numeric and
    resolve every quarter, so the track record accumulates quickly.

# ----------------------------------------------------------------------------
# GATE — sector regime
# ----------------------------------------------------------------------------
gate:
  scope: aluminium              # coverage bucket
  pair_exception: true          # market-neutral pairs permitted in a dead regime

# ----------------------------------------------------------------------------
# OUTPUT
# ----------------------------------------------------------------------------
output:
  emit_singles: true
  emit_pairs: true
  pair_candidates:
    - pair: [hindustan_zinc, vedanta]
      rationale: >
        Long HZL / short VEDL is, in economic substance, long silver and long
        zinc beta against VEDL's non-zinc businesses and its discount. Put it on
        when silver is the driver; it is a poor expression of a pure zinc view,
        because zinc largely cancels.
  require_falsifier: true
  report_residual_beta: true

# ----------------------------------------------------------------------------
# VALIDATION
# ----------------------------------------------------------------------------
validation:
  test_1_thumb_rule: >
    Before anything else, confirm the arithmetic reproduces the desk's own read:
    regress both names on LME zinc and on silver. HZL should show the higher
    beta to both. If VEDL comes out more sensitive than HZL, the stake or the
    segment mix is wrong and nothing downstream is worth running.

  test_2_direction: >
    Does the sign of pct_of_ebitda at date D predict the sign of the 5- and
    20-day relative move? Report hit rate conditioned on conviction.

  blocked_on: >
    VEDL's HZL stake (~63.4%, to confirm) and the split of the retained
    businesses. Everything else can run on public zinc and silver prices.
